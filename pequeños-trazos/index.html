/* v0.2 · pautas y tipografía escolar de un solo trazo punteado */
.ruled{height:82px;margin:2px 0;flex:1;min-width:0}
.ruled.large{height:98px}.ruled.small{height:66px}
.ruled .r-bottom{display:none;position:absolute;left:0;right:0;height:0;border-top:1px solid #879598}
.ruled.montessori .r-top{display:block;top:7%;border-top:1.6px solid #7a8788}
.ruled.montessori .r-mid{display:block;top:35.66%;border-top:1px dashed #a9b7b8}
.ruled.montessori .r-base{display:block;top:64.33%;border-top:1px dashed #a9b7b8}
.ruled.montessori .r-bottom{display:block;top:93%;border-top:1.6px solid #7a8788}
.ruled.simple .r-bottom,.ruled.double .r-bottom,.ruled.blank .r-bottom,.ruled.gridline .r-bottom{display:none}
.ruled.simple .r-base{top:80%}.ruled.double .r-top{top:23%}.ruled.double .r-base{top:78%}
.trace-svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.sheet-item{padding:5px 9px 7px;margin-bottom:8px;border-radius:8px}
.sheet-item-head{min-height:16px;margin-bottom:2px}
.writing-line{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.writing-line .ruled{flex:1;min-width:0}
.outline-icon{width:64px;height:72px;flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.outline-icon svg{width:62px;height:62px;display:block}
.outline-icon img{display:block;width:62px;height:62px;object-fit:contain;filter:grayscale(1)}
.sheet-emoji{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:43px;flex-shrink:0}
.sheet-emoji svg{width:55px;height:55px}
.sheet-emoji img{width:55px;height:55px;object-fit:contain}
.sample-style{font-size:25px;line-height:1.7;background:#f6f9f9;border:1px dashed #cbdcdc;border-radius:9px;padding:4px 10px;color:#354d50}
.missing-help{font-size:12px;padding:9px 11px;background:#edf9f5;color:#286b61;border-radius:9px;margin-bottom:10px}
.density-guide{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.sheet-item-head .sheet-cue{line-height:1.3}
@media print{.sheet-item{break-inside:avoid;page-break-inside:avoid}.outline-icon svg{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

/* v0.3 · edición granular de cuadernos */
.order-cue{font-weight:400!important;font-size:28px!important;letter-spacing:0;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
.notebook-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:13px 0}
.notebook-editor-wrap{display:grid;grid-template-columns:minmax(320px,490px) minmax(0,1fr);gap:20px;align-items:start}
.nb-stage{background:white;border:1px solid #dce8e8;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.nb-stage.active{border-color:#75c9c5;background:#eff9f6;box-shadow:inset 3px 0 var(--teal)}
.nb-stage .nb-stage-index{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;background:#e0f0ef;border-radius:50%;font-weight:800;color:var(--deep)}
.nb-stage .nb-stage-meta{flex:1;min-width:0}
.nb-stage .nb-stage-meta strong{display:block;font-size:13px}
.nb-stage .nb-stage-meta span{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-stage-actions{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 15px}

  if(!shape)return '';
  return `<span class="outline-icon"><svg viewBox="0 0 128 128" role="img" aria-label="Dibujo para colorear"><g stroke="#1d2424" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" fill="none">${shape}</g></svg></span>`;
}

function applyCase(s,lang=state.lang,mode=state.caseMode,level='words'){if(mode==='upper')return s.toLocaleUpperCase(lang==='en'?'en':lang==='va'?'ca':'es');if(mode==='lower'&&level==='sentences')return String(s).replace(/^\p{L}/u,c=>c.toLocaleUpperCase(lang==='en'?'en':lang==='va'?'ca':'es'));if(mode==='lower')return s.toLocaleLowerCase(lang==='en'?'en':lang==='va'?'ca':'es');return s}
const shuffle=(list)=>{const a=[...list];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[j],a[i]]=[a[i],a[j]]}return a};
// Orden reproducible: vista previa e impresión muestran las mismas letras y emparejamientos.
function stableShuffle(list,key){let x=2166136261;for(const c of String(key)){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}let a=[...list];for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;let j=(x>>>0)%(i+1);[a[j],a[i]]=[a[i],a[j]]}return a}

function sanitizeItem(x){return {text:String(x?.text??'').slice(0,160),emoji:String(x?.emoji||'').slice(0,16),image:typeof x?.image==='string'&&x.image.length<350000?x.image:'',missingExplicit:x?.missingExplicit&&Number.isInteger(x.missingExplicit.start)?{start:x.missingExplicit.start,length:x.missingExplicit.length}:null,category:String(x?.category||'all').slice(0,20),difficulty:String(x?.difficulty||'yellow').slice(0,10)}}
function sourceFor(level,category=state.category,difficulty=state.difficulty){if(level==='patterns')return PATTERNS.map(x=>({text:x}));if(level==='letters'){let alphabet=ALPHABET[state.lang];let selection=difficulty==='green'?alphabet.slice(0,5):difficulty==='yellow'?alphabet.slice(0,16):difficulty==='pink'?alphabet.slice(5,23):alphabet;return selection.map(x=>({text:x}))}if(level==='syllables')return (SYLLABLE_BANK[state.lang][difficulty]||SYLLABLE_BANK[state.lang].green).map(x=>({text:x}));if(level==='words'||level==='free'||level==='sentences'){let bank=level==='sentences'?sentences():words();let filtered=bank.filter(x=>(category==='all'||x.category===category)&&(!difficulty||x.difficulty===difficulty));if(filtered.length===0)filtered=bank.filter(x=>(category==='all'||x.category===category));if(filtered.length===0)filtered=bank;return filtered}return []}
function resolveManual(text,level){
  let original=String(text||''),marked=original.match(/^(.*?)\[([^\]]+)\](.*)$/u);
  const plain=marked?marked[1]+marked[2]+marked[3]:original;
  let bank=level==='sentences'?sentences():words();
  let existing=bank.find(x=>x.text.toLocaleLowerCase()===plain.toLocaleLowerCase());
  let o=existing?sanitizeItem(existing):{text:plain};
  if(marked)o.missingExplicit={start:Array.from(marked[1]).length,length:Array.from(marked[2]).length};
  return o;
}
function genItems(config){
 let n=Math.max(1,Math.min(20,Number(config.quantity)||5));
 if(config.mode==='manual'&&config.manual?.trim())return config.manual.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,60).map(t=>resolveManual(t,config.level));
 if(config.level==='patterns'){let arr=shuffle(PATTERNS);return Array.from({length:n},(_,i)=>({text:arr[i%arr.length]}));}
 let src=config.level==='free'?sourceFor('words',config.category,config.difficulty):sourceFor(config.level,config.category,config.difficulty);
 if(['picture','match'].includes(config.activity))src=src.filter(x=>x.emoji||x.image);
 if(config.activity==='complete'&&config.completeMode==='fragment'&&config.missingFragment?.trim()){
   const m=config.missingFragment.toLocaleLowerCase();src=src.filter(x=>x.text.toLocaleLowerCase().includes(m));
 }
 if(!src.length)return [];
 let out=[],pool=[];
 while(out.length<n){if(!pool.length)pool=shuffle(src);out.push(sanitizeItem(pool.shift()));}
 return out;
}
function perPage(sh){if(sh.activity==='match')return 5;if(sh.activity==='free')return 3;return 20;}
function estimatedItemHeight(sh,it){
 const line=sh.size==='large'?98:sh.size==='small'?66:82;
 const rows=Math.max(1,textChunks(it?.text||'',sh.level,sh.size).length);
 const rep=Math.max(1,Number(sh.repeat)||1);
 if(sh.level==='patterns')return sh.activity==='traceCopy'?150:95;
 if(sh.activity==='free')return 75+3*line;
 if(sh.activity==='match')return 130;
 if(['trace','traceCopy'].includes(sh.activity))return 30+rows*line+(rep-1)*line;
 if(sh.activity==='dictation')return 28+rep*line;
 const head=sh.pictures&&(it?.emoji||it?.image)?59:30;
 return 26+head+rep*line;
}
function paginate(sheet){
 let items=sheet.items||[];if(!items.length)items=[{text:''}];
 let max=perPage(sheet),budget=860,groups=[],curr=[],used=0;
 if(sheet.activity==='match')budget=750;
 for(let it of items){let h=estimatedItemHeight(sheet,it);
  if(curr.length&&(curr.length>=max||used+h>budget)){groups.push(curr);curr=[];used=0;}
  curr.push(it);used+=h;
 }
 if(curr.length)groups.push(curr);
 return groups.map((g,i)=>({...sheet,items:g,part:i+1}));
}

function notebookContents(raw,level,old=[]){let lines=String(raw||'').split('\n').map(t=>t.trim()).filter(Boolean).slice(0,20);return lines.map(t=>{let prev=old.find(it=>String(it.text).toLowerCase()===t.toLowerCase());return prev?sanitizeItem({...prev,text:t}):sanitizeItem(resolveManual(t,level))});}
function resizeNotebookItems(stage,count){
 count=Math.max(1,Math.min(20,Math.round(Number(count)||1)));
 stage.items=stage.items.slice(0,count);
 if(stage.items.length<count){let bank=sourceFor(stage.level,stage.category,stage.difficulty),available=shuffle(bank).filter(it=>!stage.items.some(old=>old.text===it.text));while(stage.items.length<count){let next=available.shift()||bank[(stage.items.length)%Math.max(1,bank.length)]||{text:stage.items.at(-1)?.text||'a'};stage.items.push(sanitizeItem(next));}}
}
function notebookField(name,value){let b=state.notebookDraft;if(!b)return;let section=b.stages[state.activeNotebookStage];if(!section)return;
 if(name==='content'){let arr=notebookContents(value,section.level,section.items);if(!arr.length){toast(nbText('Incluye al menos un elemento.','Inclou almenys un element.','Include at least one item.'));render();return;}section.items=arr;}
 else if(name==='quantity')resizeNotebookItems(section,value);
 else if(name==='pictures')section.pictures=!!value;
 else if(['repeat','traceHints','dotGap'].includes(name))section[name]=Number(value);
 else if(['title','instruction','level','activity','category','guide','font','size','completeMode','missingFragment'].includes(name))section[name]=String(value).slice(0,180);
 else return;
 if(name==='level'&&!ACT_BY_LEVEL[section.level]?.includes(section.activity))section.activity=ACT_BY_LEVEL[section.level]?.[0]||'traceCopy';
 rebuildNotebookPages();
 if(['title','instruction','content','missingFragment'].includes(name)){
  // No sustituir el DOM al perder el foco: el clic posterior (Guardar, Imprimir, otro apartado) se conserva.
  let active=document.querySelectorAll('.nb-stage')[state.activeNotebookStage];
  if(active){let t=active.querySelector('.nb-stage-meta strong'),d=active.querySelector('.nb-stage-meta span');if(t)t.textContent=section.title;if(d)d.textContent=(tr().acts[section.activity]||section.activity)+' · '+section.items.length+' · '+section.items.slice(0,3).map(x=>x.text).join(', ');}
  renderPreview();saveState();return;
 }
 render();
}
function notebookAction(action,index){let b=state.notebookDraft;if(action==='back'){state.page='notebooks';render();return;}if(action==='resume'){if(!b)return;state.page='bookEditor';rebuildNotebookPages();render();return;}if(!b)return;
 let i=Math.max(0,Math.min(b.stages.length-1,Number(state.activeNotebookStage)||0));
 switch(action){
 case 'stage':state.activeNotebookStage=Math.max(0,Math.min(b.stages.length-1,index));break;
 case 'up':if(i>0){[b.stages[i-1],b.stages[i]]=[b.stages[i],b.stages[i-1]];state.activeNotebookStage=i-1;}break;
 case 'down':if(i<b.stages.length-1){[b.stages[i+1],b.stages[i]]=[b.stages[i],b.stages[i+1]];state.activeNotebookStage=i+1;}break;
 case 'duplicate':{let copy=structuredClone(b.stages[i]);copy.uid='n'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);copy.title+=nbText(' (copia)',' (còpia)',' (copy)');b.stages.splice(i+1,0,copy);state.activeNotebookStage=i+1;break;}
 case 'remove':if(b.stages.length>1){b.stages.splice(i,1);state.activeNotebookStage=Math.max(0,Math.min(i,b.stages.length-1));}break;
 case 'add':{let section=newStage({level:'words',activity:'traceCopy',category:'all',difficulty:'yellow',quantity:4},b.stages.length);b.stages.splice(i+1,0,section);state.activeNotebookStage=i+1;break;}
 case 'refresh':{let section=b.stages[i],count=section.items.length;section.items=genItems({...state,...section,mode:'bank',quantity:count}).map(sanitizeItem);break;}
 case 'previewAll':state.notebookPreviewMode='all';break;
 case 'previewSection':state.notebookPreviewMode='section';break;
 case 'print':rebuildNotebookPages();renderPreview();window.print();return;
 case 'save':saveResource();return;
 }
 rebuildNotebookPages();render();
}

function useTemplate(id){const t=TEMPLATES.find(x=>x.id===id);if(!t)return;state.level=t.level;state.activity=t.activity;state.category=t.category||'all';state.difficulty=t.difficulty||'yellow';state.quantity=t.quantity||5;state.mode=t.manual?'manual':'bank';state.manual=t.manual||'';state.title=t[state.lang][0];state.instruction='';state.guide=t.guide||'montessori';state.completeMode=t.activity==='complete'?'vowels':state.completeMode;if(t.pictures!==undefined)state.pictures=t.pictures;state.page='create';generate()}
function saveResource(){if(!state.pages?.length){toast('No hay ninguna ficha generada.');return}let book=state.page==='bookEditor'?state.notebookDraft:null;let title=book?.title||state.pages[0].title||tr().draft,rec={id:state.activeResourceId||'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title,date:dateLabel(),pages:structuredClone(state.pages),...(book?{notebook:structuredClone(book)}:{})};state.saved=state.saved.filter(x=>x.id!==rec.id);state.saved.unshift(rec);state.saved=state.saved.slice(0,35);state.activeResourceId=rec.id;saveState();toast(tr().toastSaved)}
function downloadBlob(filename,content,mime){let blob=new Blob([content],{type:mime});let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){const pack={application:'Pequeños trazos',version:APP_VERSION,exportedAt:new Date().toISOString(),saved:state.saved,custom:state.custom};downloadBlob('pequenos_trazos_copia_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(pack,null,2),'application/json;charset=utf-8')}
function importBackup(file){if(!file||file.size>6*1024*1024){toast('El archivo es demasiado grande.');return}let rdr=new FileReader();rdr.onload=()=>{try{let pack=JSON.parse(rdr.result);if(!Array.isArray(pack.saved)&&!Array.isArray(pack.custom))throw Error('format');if(!confirm(tr().confirmImport))return;let s=Array.isArray(pack.saved)?pack.saved:[];let c=Array.isArray(pack.custom)?pack.custom:[];let vS=s.slice(0,35).filter(x=>Array.isArray(x.pages)&&typeof x.id==='string'&&typeof x.title==='string'&&x.pages.length<=40).map(x=>({...x,pages:x.pages.slice(0,40).map(p=>({...p,items:(p.items||[]).slice(0,20).map(sanitizeItem)}))}));let vC=c.slice(0,250).filter(x=>typeof x.id==='string'&&['words','sentences'].includes(x.level)&&typeof x.text==='string').map(x=>({...x,image:typeof x.image==='string'&&x.image.length<350000?x.image:''}));state.saved=[...vS.filter(x=>!state.saved.find(y=>x.id===y.id)),...state.saved].slice(0,35);state.custom=[...vC.filter(x=>!state.custom.find(y=>x.id===y.id)),...state.custom].slice(0,250);render();toast(tr().toastLoaded)}catch(e){toast('Archivo JSON no reconocido.')}};rdr.readAsText(file)}
function resizeImage(file){return new Promise((resolve,reject)=>{
 if(!file||file.size===0)return resolve('');
 if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>8*1024*1024)return reject(Error('image'));
 let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{
  const w=180,h=180,c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='white';ctx.fillRect(0,0,w,h);
  const scale=Math.min(160/im.width,160/im.height);let iw=im.width*scale,ih=im.height*scale;
  ctx.drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih);
  const src=ctx.getImageData(0,0,w,h),original=new Uint8ClampedArray(src.data),v=new Float32Array(w*h);
  for(let i=0;i<v.length;i++){
   let off=i*4;v[i]=original[off]*.299+original[off+1]*.587+original[off+2]*.114;
  }
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
   let p=y*w+x,gx=-v[p-w-1]+v[p-w+1]-2*v[p-1]+2*v[p+1]-v[p+w-1]+v[p+w+1];
   let gy=-v[p-w-1]-2*v[p-w]-v[p-w+1]+v[p+w-1]+2*v[p+w]+v[p+w+1];
   let dark=(Math.hypot(gx,gy)>150)?0:255;
   let q=p*4;src.data[q]=src.data[q+1]=src.data[q+2]=dark;src.data[q+3]=255;
  }
  ctx.putImageData(src,0,0);resolve(c.toDataURL('image/png'));
 };im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file);
})}
async function addCustom(form){let f=new FormData(form);let text=String(f.get('customText')||'').trim().slice(0,100);if(!text)return;let image='';try{image=await resizeImage(f.get('customImage'))}catch(e){toast('La imagen no se pudo cargar. Usa JPG, PNG o WebP.');return}let level=String(f.get('customType')||'words');let rec={id:'c'+Date.now().toString(36),text,lang:state.lang,es:state.lang==='es'?text:'',va:state.lang==='va'?text:'',en:state.lang==='en'?text:'',emoji:String(f.get('customEmoji')||'').slice(0,12),image,category:String(f.get('customCategory')||'all'),difficulty:String(f.get('customDifficulty')||'yellow'),level};state.custom.unshift(rec);state.libraryTab=level;render();toast(tr().toastCustom)}
function addLibraryItem(id){let item=[...words(),...sentences()].find(x=>x.id===id);if(!item)return;let current=state.manual.trim();state.manual=current?current+'\n'+item.text:item.text;state.mode='manual';state.level=item.level==='sentences'?'sentences':'words';state.activity='traceCopy';state.page='create';generate();toast(tr().toastAdded)}
function openSaved(id){let x=state.saved.find(x=>x.id===id);if(!x)return;if(x.notebook&&Array.isArray(x.notebook.stages)&&x.notebook.stages.length){state.notebookDraft=structuredClone(x.notebook);state.activeNotebookStage=0;state.notebookPreviewMode='section';state.activeResourceId=x.id;state.page='bookEditor';let p=x.pages?.[0]||{};state.lang=['es','va','en'].includes(p.lang)?p.lang:state.lang;state.caseMode=p.caseMode||state.caseMode;rebuildNotebookPages();render();toast(tr().toastLoaded);return;}state.notebookDraft=null;state.pages=structuredClone(x.pages);let p=x.pages[0]||{};for(const k of ['level','activity','category','difficulty','guide','font','size','opacity','traceHints','repeat','pictures','caseMode']){if(p[k]!==undefined)state[k]=p[k]}state.lang=['es','va','en'].includes(p.lang)?p.lang:state.lang;state.title=x.title;state.mode='manual';state.manual=state.pages.flatMap(p=>p.items||[]).map(x=>x.text).join('\n');state.quantity=Math.min(20,Math.max(1,Number(p.quantity)||5));state.page='create';state.activeResourceId=x.id;render();toast(tr().toastLoaded)}
function onChangeField(name,value){
 if(name==='pictures')state.pictures=!!value;
 else if(['quantity','repeat','opacity','traceHints','dotGap'].includes(name))state[name]=name==='quantity'?Math.max(1,Math.min(20,Math.round(Number(value)||1))):Number(value);
 else if(['lang','caseMode','level','activity','category','difficulty','mode','title','instruction','manual','guide','font','size','teacherKey','libraryTab','libraryCategory','selectedNotebook','notebookFilter','search','completeMode','missingFragment'].includes(name))state[name]=value;
 else return;
  if(state.page==='bookEditor'&&state.notebookDraft&&['caseMode','lang'].includes(name)){if(name==='lang')toast(nbText('El texto escrito se conserva; revísalo en el nuevo idioma.','El text escrit es conserva; revisa’l en el nou idioma.','Existing content is kept; review it in the new language.'));rebuildNotebookPages();render();return;}
  if(name==='level'){
  state.activity=ACT_BY_LEVEL[state.level][0];state.mode='bank';state.manual='';state.title='';state.instruction='';state.category='all';state.difficulty='green';
 }
 if(name==='activity'){state.instruction='';}
 if(name==='lang'){state.title='';state.instruction='';}
 if(['libraryCategory','libraryTab','selectedNotebook','notebookFilter','teacherKey'].includes(name)){render();return;}
 if(name==='search'){
  let results=document.getElementById('libraryResults');
  if(results){let items=state.libraryTab==='words'?words():state.libraryTab==='sentences'?sentences():words().filter(x=>x.emoji||x.image);
   let q=state.search.trim().toLowerCase();results.innerHTML=libraryItems(items.filter(x=>(state.libraryCategory==='all'||x.category===state.libraryCategory)&&(!q||x.text.toLowerCase().includes(q))));return;
  }
 }
 if(['title','instruction','manual','missingFragment'].includes(name)){
  if(state.activeResourceId&&state.pages.length>1&&['title','instruction'].includes(name)){
   for(let p of state.pages)p[name]=state[name];renderPreview();saveState();return;
  }
  let p=makeSheet();if(p){state.pages=paginate(p);renderPreview();}saveState();return;
 }
 if(['guide','font','size','dotGap','traceHints','repeat','pictures','caseMode','opacity'].includes(name)){
  for(let p of state.pages)p[name]=state[name];
  if(['repeat','size','pictures','guide'].includes(name))reflowPages();
  if(name==='caseMode'){render();return;}
  if(name==='dotGap'){
   let lab=document.querySelector('#dotGapLabel');if(lab)lab.textContent=tr().opacity+' · '+state.dotGap;
   TRACE_CACHE.clear();
  }
  if(name==='font'){TRACE_CACHE.clear();const sample=document.querySelector('.sample-style');if(sample)sample.style.fontFamily=selectedFont({font:state.font});}
  renderPreview();saveState();return;
 }
 if(state.page==='create'){let p=makeSheet();if(p)state.pages=paginate(p)}
 render();
}
function events(){document.addEventListener('click',async(e)=>{let elem=e.target.closest('button');if(!elem)return;if(elem.hasAttribute('data-page')){state.page=elem.dataset.page;if(state.page==='bookEditor'&&state.notebookDraft)rebuildNotebookPages();render();return}if(elem.dataset.nbAction){notebookAction(elem.dataset.nbAction,Number(elem.dataset.nbIndex));return}if(elem.hasAttribute('data-change')){let name=elem.dataset.change;let v=elem.dataset.value;onChangeField(name,v==='true'?true:v==='false'?false:v);return}if(elem.hasAttribute('data-template')){useTemplate(elem.dataset.template);return}if(elem.hasAttribute('data-addlib')){addLibraryItem(elem.dataset.addlib);return}if(elem.hasAttribute('data-deletecustom')){let it=state.custom.find(x=>x.id===elem.dataset.deletecustom);if(it&&confirm(tr().confirmDelete)){state.custom=state.custom.filter(x=>x.id!==it.id);render()}return}if(elem.hasAttribute('data-opensaved')){openSaved(elem.dataset.opensaved);return}if(elem.hasAttribute('data-deletesaved')){let it=state.saved.find(x=>x.id===elem.dataset.deletesaved);if(it&&confirm(tr().confirmDelete)){state.saved=state.saved.filter(x=>x.id!==it.id);render()}return}
let action=elem.dataset.action;if(!action)return;switch(action){case 'generate':case 'regenerate':generate();break;case 'print':renderPreview();window.print();break;case 'save':saveResource();break;case 'book':buildBook();break;case 'backup':exportBackup();break;case 'import':document.getElementById('importFile').click();break;}});
document.addEventListener('change',(e)=>{let el=e.target;if(el.id==='importFile'){importBackup(el.files?.[0]);el.value='';return}if(el.dataset.nbGlobal==='title'&&state.notebookDraft){state.notebookDraft.title=el.value.trim().slice(0,90)||nbText('Cuaderno sin título','Quadern sense títol','Untitled workbook');rebuildNotebookPages();renderPreview();saveState();return;}if(el.dataset.nbField){notebookField(el.dataset.nbField,el.type==='checkbox'?el.checked:el.value);return;}let name=el.dataset.field;if(name){let val=el.type==='checkbox'?el.checked:el.value;onChangeField(name,val)}});
document.addEventListener('input',(e)=>{let el=e.target;if(el.dataset.editor){onChangeField(el.dataset.editor,el.value)}if(el.dataset.field==='dotGap'){onChangeField('dotGap',el.value)}});
document.addEventListener('submit',(e)=>{if(e.target.id==='customForm'){e.preventDefault();addCustom(e.target)}});
window.addEventListener('resize',fitPreview);}
let inputFile=document.createElement('input');inputFile.type='file';inputFile.id='importFile';inputFile.accept='.json,application/json';inputFile.className='sr-only';document.body.appendChild(inputFile);events();init();
Promise.all(['EscolarBrasil','ColeCarreira','KGThin','KGRound'].map(f=>document.fonts.load(`36px "${f}"`))).then(()=>{TRACE_CACHE.clear();renderPreview();}).catch(()=>{});

</script>
