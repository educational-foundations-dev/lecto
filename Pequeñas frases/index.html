function renderStats(){const u=ui();let entries=MODES.map((m,i)=>{let total=0,first=0,assisted=0,read=0;for(let l=0;l<4;l++){const x=st.stat[`${st.lang}:${m}:${l}`]||{};total+=Number(x.n)||0;first+=Number(x.first)||0;assisted+=Number(x.help)||0;read+=Number(x.read)||0}return {m,label:u.modes[i],total,first,assisted,read}});const n=entries.reduce((a,e)=>a+e.total,0),f=entries.reduce((a,e)=>a+e.first,0),h=entries.reduce((a,e)=>a+e.assisted,0),read=entries.reduce((a,e)=>a+e.read,0);return `<div class="topline"><div><div class="eyebrow">${u.progress}</div><h2>${u.stats}</h2><p class="description">${u.statsInfo}</p></div><div class="help-chip">${st.lang.toUpperCase()}</div></div><div class="stats-grid"><div class="stat-card"><div class="stat-value">${n}</div><div class="stat-label">${u.done}</div></div><div class="stat-card"><div class="stat-value">${n?Math.round(f*100/n)+'%':'—'}</div><div class="stat-label">${u.first}</div></div><div class="stat-card"><div class="stat-value">${h}</div><div class="stat-label">${u.withHelp}</div></div><div class="stat-card"><div class="stat-value">${read}</div><div class="stat-label">${u.practiced}</div></div></div>${n||read?entries.map(e=>`<div class="stat-row"><div><strong>${e.label}</strong><div class="stat-label">${e.m==='read'?e.read+' '+u.practiced:e.total+' '+u.done}</div></div><div>${e.total?`<div class="stat-label" style="text-align:right;margin-bottom:4px">${Math.round(100*e.first/e.total)}%</div><div class="bar"><div style="width:${Math.round(100*e.first/e.total)}%"></div></div>`:'—'}</div></div>`).join(''):`<p class="inline-hint">${u.noStats}</p>`}<div class="row-actions"><button class="btn btn-ghost" onclick="PF.clearStats()">🗑 ${u.rst}</button></div>`}
function render(){const u=ui();document.documentElement.lang=st.lang;document.title=`${u.title} · v0.2`;$('appTitle').textContent=u.title;$('footerTitle').textContent=u.title;$('strap').textContent=u.strap;$('languageLabel').textContent=u.lang;$('caseLabel').textContent=u.type;$('speedLabel').textContent=u.speed;$('navTitle').textContent=u.nav;$('navFoot').textContent=u.foot;$('footerKeyboard').textContent=u.keyboard;
 $('langSelect').value=st.lang;$('caseSelect').value=st.case;$('speedSelect').value=String(st.speed);
 $('navItems').innerHTML=MODES.map((m,i)=>`<button class="nav-button ${st.mode===m?'active':''}" onclick="PF.mode('${m}')"><span class="nav-emoji">${ICONS[i]}</span><span>${esc(u.modes[i])}</span></button>`).join('')+`<button class="nav-button ${st.mode==='stats'?'active':''}" onclick="PF.mode('stats')"><span class="nav-emoji">📊</span><span>${u.progress}</span></button>`;
 if(st.mode==='stats'){$('appMain').innerHTML=renderStats();voiceStatus();return}
 const modeIndex=MODES.indexOf(st.mode);
 $('appMain').innerHTML=`<div class="topline"><div><div class="eyebrow">${u.nav} · ${modeIndex+1}/8</div><h2>${esc(u.modes[modeIndex])}</h2><p class="description">${esc(u.descs[modeIndex])}</p></div><div class="help-chip">${u.count} ${st.session} · ${B[st.mode][st.level].length} ${st.lang==='en'?'available':'disponibles'}</div></div><div class="read-steps">${LEVELS.map((c,i)=>`<button class="read-step ${c} ${st.level===i?'selected':''}" onclick="PF.level(${i})" aria-pressed="${st.level===i}"><span>${u.lv[i]}</span><small>${u.lvsub[i]}</small></button>`).join('')}</div><section class="exercise" aria-live="off">${exerciseHtml()}</section><div class="feedback ${st.status==='success'?'success':st.status==='error'?'error':''}" aria-live="polite">${esc(st.feedback||' ')}</div><div class="toolbar"><div class="toolbar-bottom"><button class="btn" onclick="PF.hint()" ${st.solved?'disabled':''}>💡 ${u.hint}</button><button class="btn btn-primary" onclick="PF.next()">↻ ${u.next}</button></div><label class="toggle-label"><input type="checkbox" ${st.auto?'checked':''} onchange="PF.auto(this.checked)"> ${u.auto}</label></div><p class="small-guide" style="text-align:center;margin-top:15px">${u.keyboard}</p>`;
 voiceStatus();}
function voiceStatus(){const u=ui(),element=$('voiceStatus');if(!('speechSynthesis' in window)){element.className='voice-status warning';element.textContent='⚠ '+u.audioOff;return}let voices=[];try{voices=speechSynthesis.getVoices()}catch(e){}const found=voices.some(v=>(v.lang||'').toLowerCase().startsWith(({es:'es',ca:'ca',en:'en'})[st.lang]));element.className='voice-status '+(found?'ok':'warning');element.textContent=(found?'🔊 '+u.audioOk:'ℹ '+u.audioWarn+(voices.length?' '+u.voiceLanguage:''))}
function stopSpeech(){if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){} }
function say(text,highlight=false){if(!('speechSynthesis' in window))return;stopSpeech();const s=new SpeechSynthesisUtterance(text);const code={es:'es-ES',ca:'ca-ES',en:'en-GB'}[st.lang];s.lang=code;s.rate=st.speed;s.pitch=1;const vv=speechSynthesis.getVoices();const exact=vv.find(v=>(v.lang||'').toLowerCase()===code.toLowerCase());const loose=vv.find(v=>(v.lang||'').toLowerCase().startsWith(code.slice(0,2)));const v=exact||loose;if(v)s.voice=v;if(highlight){s.onboundary=e=>{const buttons=document.querySelectorAll('.speech-word');buttons.forEach(b=>{const start=Number(b.dataset.charStart),end=Number(b.dataset.charEnd);b.classList.toggle('speaking',e.charIndex>=start&&e.charIndex<end)})};s.onend=()=>document.querySelectorAll('.speech-word').forEach(b=>b.classList.remove('speaking'))}try{speechSynthesis.speak(s)}catch(e){}}
function speak(){if(!st.task)return;const r=st.task.row;const spoken=st.mode==='listen'?pick(r.q):st.mode==='read'||st.mode==='build'?pick(r):['picture'].includes(st.mode)?pick(r.p):'s' in r?pick(r.s):st.mode==='differences'?pick(r.a):'';say(spoken,st.mode==='read')}
function sayWord(idx){if(st.mode!=='read')return;const words=pick(st.task.row).match(/\S+/g)||[];const w=words[idx];if(w)say(w.replace(/[.,;:!?¡¿]+$/g,''))}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='confetti-layer';const colors=['#a99aed','#77ccb3','#e9b65e','#e595a9','#8ebce5'];for(let i=0;i<23;i++){const b=document.createElement('i');b.className='confetti-bit';b.style.left=`${Math.random()*100}%`;b.style.background=colors[i%colors.length];b.style.animationDelay=`${Math.random()*.2}s`;b.style.setProperty('--dx',`${Math.floor(Math.random()*160-80)}px`);layer.appendChild(b)}document.body.appendChild(layer);setTimeout(()=>layer.remove(),2500)}
function clearStats(){if(!confirm(ui().confirm))return;st.stat={};save();render()}
window.PF={mode:setMode,level:setLevel,next:()=>newExercise(st.mode==='listen'),answer,hint,speak,sayWord,done:markedRead,pickWord,removeWord:k=>{if(st.solved)return;st.selected.splice(k,1);st.feedback='';render()},undo,resetBuild,check:checkBuild,auto:x=>{st.auto=!!x;save()},clearStats};
$('langSelect').addEventListener('change',e=>{st.lang=e.target.value;save();if(st.mode==='stats')render();else newExercise()});
$('caseSelect').addEventListener('change',e=>{st.case=e.target.value;save();render()});
$('speedSelect').addEventListener('change',e=>{st.speed=Number(e.target.value);save();render()});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(st.mode==='stats')return;if(/^[1-4]$/.test(e.key)&&!e.altKey&&!e.ctrlKey&&!e.metaKey){if(st.mode==='build'){const i=Number(e.key)-1;const arr=st.task.mix.filter(k=>!st.selected.includes(k));if(arr[i]!==undefined)pickWord(arr[i])}else if(st.mode!=='read')answer(Number(e.key)-1)}else if(e.key===' '){e.preventDefault();speak()}else if(e.key==='Enter'&&st.solved){newExercise(st.mode==='listen')}else if(e.key==='Backspace'&&st.mode==='build'){e.preventDefault();undo()}});
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=voiceStatus;}
newExercise();
})();
</script>
</body></html>
