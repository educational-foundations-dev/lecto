V7A('v7_vo_i','init','vocab','science',L('Una capa impermeable','Una capa impermeable','A waterproof coat'),L('El cielo se nubló y Vera se puso una capa impermeable. Aunque caminó bajo la lluvia, la ropa que llevaba debajo permaneció seca.','El cel es va ennuvolar i Vera es posà una capa impermeable. Encara que caminà sota la pluja, la roba de davall es mantingué seca.','Clouds gathered and Vera put on a waterproof coat. Although she walked in the rain, the clothes underneath stayed dry.'),Q(L('¿Qué significa «impermeable»?','Què significa «impermeable»?','What does “waterproof” mean?'),O(['Que no deja pasar agua','Que se rompe con lluvia','Que absorbe mucha agua','Que cambia de color'],['Que no deixa passar aigua','Que es trenca amb pluja','Que absorbix molta aigua','Que canvia de color'],['It keeps water out','It breaks when wet','It absorbs lots of water','It changes colour']),0,L('La pista es que la ropa interior se mantuvo seca.','La pista és que la roba de davall es mantingué seca.','The clue is that the clothing underneath stayed dry.')),V7('cloze',L('Completa la deducción con la palabra adecuada.','Completa la deducció amb la paraula adequada.','Complete the inference with the best word.'),{before:L('La capa impidió que el agua ___ la ropa.','La capa impedí que l’aigua ___ la roba.','The coat prevented water from ___ the clothes.'),options:O(['mojara','secara','cosiera','doblara'],['banyara','assecara','cosira','plegara'],['soaking','drying','sewing','folding']),answer:0},L('Impermeable significa que el agua no atraviesa la capa.','Impermeable significa que l’aigua no travessa la capa.','Waterproof material stops water reaching clothes.')));
V7A('v7_vo_1','eso1','vocab','science',L('La costa vulnerable','La costa vulnerable','The vulnerable coast'),L('Tras el temporal, el paseo cercano a la playa quedó vulnerable: pequeñas olas podían dañar los muros que antes resistían sin dificultad. Los vecinos solicitaron reparar las defensas antes del siguiente invierno.','Després del temporal, el passeig pròxim a la platja quedà vulnerable: ones menudes podien danyar els murs que abans resistien sense dificultat. El veïnat demanà reparar les defenses abans de l’hivern següent.','After the storm, the seaside path was vulnerable: even small waves could damage walls that had previously withstood them easily. Residents asked for the barriers to be repaired before winter.'),Q(L('¿Qué significa «vulnerable» en el texto?','Què significa «vulnerable» en el text?','What does “vulnerable” mean here?'),O(['Expuesto a sufrir daños','Preparado para visitantes','Alejado de las olas','Reforzado recientemente'],['Exposat a patir danys','Preparat per a visitants','Allunyat de les ones','Reforçat recentment'],['Likely to suffer damage','Prepared for visitors','Far from the waves','Recently reinforced']),0,L('La pista indica que ahora incluso las olas pequeñas causan daños.','La pista indica que ara fins i tot les ones menudes causen danys.','Even small waves could now cause damage.')),V7('cloze',L('Elige el término que completa la idea.','Tria el terme que completa la idea.','Choose the word that completes the idea.'),{before:L('El temporal dejó las defensas más ___.','El temporal deixà les defenses més ___.','The storm left the defences more ___.'),options:O(['frágiles','decorativas','modernas','extensas'],['fràgils','decoratives','modernes','extenses'],['fragile','decorative','modern','extensive']),answer:0},L('Vulnerable implica una menor resistencia ante posibles daños.','Vulnerable implica menys resistència davant possibles danys.','Vulnerable suggests a greater risk of damage.')));
V7A('v7_vo_2','eso2','vocab','history',L('Mitigar la crisis','Mitigar la crisi','Mitigating a crisis'),L('La sequía redujo las cosechas y encareció los alimentos. Para mitigar la crisis, el ayuntamiento organizó el reparto de reservas, aunque advirtió de que esa medida no resolvería las causas del problema.','La sequera reduí les collites i encaria els aliments. Per a mitigar la crisi, l’ajuntament organitzà el repartiment de reserves, encara que advertí que la mesura no resoldria les causes del problema.','The drought reduced harvests and raised food prices. To mitigate the crisis, the council organised the distribution of reserves, though it warned that the measure would not solve the underlying causes.'),Q(L('¿Qué significa «mitigar»?','Què significa «mitigar»?','What does “mitigate” mean?'),O(['Reducir la gravedad','Eliminar toda causa','Predecir la duración','Negar las consecuencias'],['Reduir la gravetat','Eliminar tota causa','Predir la duració','Negar les conseqüències'],['Reduce the severity','Remove every cause','Predict the duration','Deny the consequences']),0,L('La medida alivia los efectos sin acabar necesariamente con la crisis.','La mesura alleuja els efectes sense acabar necessàriament amb la crisi.','The measure eases effects without removing their cause.')),V7('cloze',L('Completa sin alterar el sentido.','Completa sense alterar el sentit.','Complete without changing the meaning.'),{before:L('La distribución de reservas podía ___ el daño.','El repartiment de reserves podia ___ el dany.','Distributing reserves could ___ the harm.'),options:O(['atenuar','agravar','originar','ignorar'],['atenuar','agreujar','originar','ignorar'],['lessen','increase','cause','ignore']),answer:0},L('Atenuar es equivalente a mitigar en este contexto.','Atenuar equival a mitigar en este context.','Lessen has the relevant meaning of mitigate.')));
V7A('v7_vo_b','bach','vocab','philosophy',L('Una hipótesis refutable','Una hipòtesi refutable','A refutable hypothesis'),L('Un investigador propuso que todas las piezas de un material resistían la misma presión. Su colega objetó que la hipótesis debía ser refutable: había que especificar qué medición, si aparecía, obligaría a abandonarla. Una afirmación protegida ante cualquier resultado no permitiría contrastar esa predicción.','Un investigador proposà que totes les peces d’un material resistien la mateixa pressió. Un col·lega objectà que la hipòtesi havia de ser refutable: calia especificar quina mesura, si apareixia, obligaria a abandonar-la. Una afirmació protegida davant de qualsevol resultat no permetria contrastar eixa predicció.','A researcher proposed that every piece of a material could withstand the same pressure. A colleague argued that the hypothesis must be refutable: it should specify which possible measurement would force its rejection. A claim protected against every result would not allow that prediction to be tested.'),Q(L('¿Qué sentido tiene «refutable»?','Quin sentit té «refutable»?','What does “refutable” mean?'),O(['Que puede ser contradicha por pruebas','Que debe aceptarse antes de probarse','Que evita realizar mediciones','Que confirma cualquier resultado'],['Que pot ser contradita per proves','Que cal acceptar abans de provar','Que evita fer mesuraments','Que confirma qualsevol resultat'],['It can be contradicted by evidence','It must be accepted before testing','It avoids taking measurements','It confirms any possible outcome']),0,L('Una refutación exige un resultado posible incompatible con la hipótesis.','Una refutació exigix un resultat possible incompatible amb la hipòtesi.','Refutation requires a possible result incompatible with the claim.')),V7('cloze',L('Completa con el concepto adecuado.','Completa amb el concepte adequat.','Choose the appropriate concept.'),{before:L('La prueba podría ___ la hipótesis si hallara una excepción.','La prova podria ___ la hipòtesi si trobava una excepció.','The test could ___ the hypothesis if it found an exception.'),options:O(['refutar','presuponer','blindar','reformular'],['refutar','pressuposar','blindar','reformular'],['refute','presuppose','shield','rephrase']),answer:0},L('Una excepción incompatible con la afirmación universal permite refutarla.','Una excepció incompatible amb una afirmació universal permet refutar-la.','An incompatible exception refutes a universal claim.')));

V7A('v7_in_i','init','infer','daily',L('El banco vacío','El banc buit','The empty bench'),L('Noa llegó al parque con su balón. Vio el banco vacío y un charco delante. Se sentó en la hierba, algo más lejos, y dejó el balón a su lado.','Noa arribà al parc amb la pilota. Va vore el banc buit i un toll davant. S’assegué a l’herba, un poc més lluny, i deixà la pilota al costat.','Noa came to the park with a ball. She saw the empty bench and a puddle in front of it. She sat on the grass farther away and put the ball beside her.'),Q(L('¿Por qué pudo evitar el banco?','Per què pogué evitar el banc?','Why might she have avoided the bench?'),O(['Había agua cerca','Estaba roto del todo','Tenía pintura fresca','Había gente sentada'],['Hi havia aigua prop','Estava tot trencat','Tenia pintura fresca','Hi havia gent asseguda'],['There was water nearby','It was completely broken','It had fresh paint','Someone was sitting there']),0,L('El charco es una pista; no se menciona pintura ni daños.','El toll és una pista; no s’esmenten pintura ni danys.','The puddle is a clue; paint and damage are never mentioned.')),V7('evidence',L('Selecciona en el texto la pista principal.','Selecciona en el text la pista principal.','Select the main clue in the text.'),{fragments:L(['Noa llegó al parque con su balón.','Vio el banco vacío y un charco delante.','Se sentó en la hierba, algo más lejos, y dejó el balón a su lado.'],['Noa arribà al parc amb la pilota.','Va vore el banc buit i un toll davant.','S’assegué a l’herba, un poc més lluny, i deixà la pilota al costat.'],['Noa came to the park with a ball.','She saw the empty bench and a puddle in front of it.','She sat on the grass farther away and put the ball beside her.']),answer:1},L('La presencia del charco es el indicio relevante.','La presència del toll és l’indici rellevant.','The puddle is the key relevant clue.')));
V7A('v7_in_1','eso1','infer','technology',L('La pantalla se apagó','La pantalla es va apagar','The screen went dark'),L('Durante la exposición, la pantalla y las lámparas se apagaron al mismo tiempo. El proyector dejó de emitir su zumbido y la clase esperó en silencio. Dos minutos después, las luces regresaron sin que nadie tocara los aparatos.','Durant l’exposició, la pantalla i els llums s’apagaren al mateix temps. El projector deixà de fer soroll i la classe esperà en silenci. Dos minuts després, la llum tornà sense que ningú tocara els aparells.','During the presentation, the screen and lights went out together. The projector stopped humming and the class waited in silence. Two minutes later the lights came back without anyone touching the devices.'),Q(L('¿Qué explicación parece más probable?','Quina explicació pareix més probable?','Which explanation seems most likely?'),O(['Un corte breve de electricidad','Una avería solo del proyector','Un cambio de presentación','Una orden del profesor'],['Un tall breu d’electricitat','Una avaria només del projector','Un canvi de presentació','Una orde del professor'],['A brief power cut','A faulty projector only','A change of slides','A teacher’s instruction']),0,L('Varios dispositivos se apagan y regresan simultáneamente.','Diversos aparells s’apaguen i tornen simultàniament.','Several devices went off and came back together.')),V7('evidence',L('Marca la pista más determinante.','Marca la pista més determinant.','Select the strongest clue.'),{fragments:L(['Durante la exposición, la pantalla y las lámparas se apagaron al mismo tiempo.','El proyector dejó de emitir su zumbido y la clase esperó en silencio.','Dos minutos después, las luces regresaron sin que nadie tocara los aparatos.'],['Durant l’exposició, la pantalla i els llums s’apagaren al mateix temps.','El projector deixà de fer soroll i la classe esperà en silenci.','Dos minuts després, la llum tornà sense que ningú tocara els aparells.'],['During the presentation, the screen and lights went out together.','The projector stopped humming and the class waited in silence.','Two minutes later the lights came back without anyone touching the devices.']),answer:0},L('La simultaneidad indica un problema común de alimentación.','La simultaneïtat indica un problema comú d’alimentació.','The simultaneous failure suggests a shared power problem.')));
V7A('v7_in_2','eso2','infer','science',L('La noche de observación','La nit d’observació','The observation night'),L('El grupo preparó un telescopio para observar un eclipse. Al anochecer, el cielo estaba despejado, pero durante la hora prevista apareció una capa de nubes. La profesora guardó el material y propuso consultar al día siguiente imágenes obtenidas por otros observatorios.','El grup preparà un telescopi per a observar un eclipsi. En fer-se fosc el cel estava ras, però durant l’hora prevista aparegué una capa de núvols. La professora guardà el material i proposà consultar l’endemà imatges d’altres observatoris.','The group prepared a telescope to watch an eclipse. At dusk the sky was clear, but clouds arrived during the scheduled observation. The teacher packed away the equipment and suggested looking at images from other observatories the next day.'),Q(L('¿Qué conclusión está mejor respaldada?','Quina conclusió està més justificada?','Which conclusion is best supported?'),O(['No pudieron observarlo desde allí','El eclipse dejó de producirse','El telescopio estaba averiado','Otros lugares también tenían nubes'],['No pogueren observar-lo des d’allí','L’eclipsi deixà de produir-se','El telescopi estava avariat','Altres llocs també tenien núvols'],['They could not observe it there','The eclipse did not take place','The telescope had a defect','Other places were also cloudy']),0,L('Las nubes impidieron la observación local, no el eclipse.','Els núvols impediren l’observació local, no l’eclipsi.','Clouds blocked the local observation, not the eclipse itself.')),V7('evidence',L('Selecciona la frase que impide una deducción incorrecta.','Selecciona la frase que impedix una deducció incorrecta.','Select the line supporting the correct inference.'),{fragments:L(['El grupo preparó un telescopio para observar un eclipse.','Al anochecer, el cielo estaba despejado, pero durante la hora prevista apareció una capa de nubes.','La profesora guardó el material y propuso consultar al día siguiente imágenes obtenidas por otros observatorios.'],['El grup preparà un telescopi per a observar un eclipsi.','En fer-se fosc el cel estava ras, però durant l’hora prevista aparegué una capa de núvols.','La professora guardà el material i proposà consultar l’endemà imatges d’altres observatoris.'],['The group prepared a telescope to watch an eclipse.','At dusk the sky was clear, but clouds arrived during the scheduled observation.','The teacher packed away the equipment and suggested looking at images from other observatories the next day.']),answer:1},L('Se especifica que los obstáculos fueron nubes durante la observación.','S’especifica que l’obstacle foren els núvols durant l’observació.','Clouds at observation time were the obstruction.')));
V7A('v7_in_b','bach','infer','philosophy',L('La decisión aplazada','La decisió ajornada','The postponed decision'),L('El comité había anunciado que aprobaría la propuesta si las estimaciones de coste eran fiables. En la reunión, los técnicos presentaron cálculos con amplios márgenes de error y solicitaron más mediciones. Al terminar, la presidencia no sometió el asunto a votación y convocó una sesión posterior.','El comité havia anunciat que aprovaria la proposta si les estimacions de cost eren fiables. En la reunió, els tècnics presentaren càlculs amb marges amplis d’error i demanaren més mesures. En acabar, la presidència no sotmeté l’assumpte a votació i convocà una sessió posterior.','The committee had said it would approve the proposal if the cost estimates were reliable. At the meeting, experts presented calculations with wide error margins and asked for more measurements. The chair did not call a vote and scheduled another session.'),Q(L('¿Qué inferencia es más sólida?','Quina inferència és més sòlida?','Which inference is most justified?'),O(['Persistían dudas sobre las cifras','La propuesta quedó rechazada','Todos apoyaban el proyecto','La financiación se había retirado'],['Persistien dubtes sobre les xifres','La proposta quedà rebutjada','Tothom donava suport al projecte','El finançament havia desaparegut'],['The figures remained uncertain','The proposal was rejected','Everyone supported the plan','Funding had been withdrawn']),0,L('Pedir medidas y aplazar el voto es compatible con falta de certeza.','Demanar mesures i ajornar el vot és compatible amb falta de certesa.','Further measurements and a delayed vote indicate unresolved uncertainty.')),V7('evidence',L('Marca el fragmento que expresa la incertidumbre.','Marca el fragment que expressa la incertesa.','Select the passage expressing uncertainty.'),{fragments:L(['El comité había anunciado que aprobaría la propuesta si las estimaciones de coste eran fiables.','En la reunión, los técnicos presentaron cálculos con amplios márgenes de error y solicitaron más mediciones.','Al terminar, la presidencia no sometió el asunto a votación y convocó una sesión posterior.'],['El comité havia anunciat que aprovaria la proposta si les estimacions de cost eren fiables.','En la reunió, els tècnics presentaren càlculs amb marges amplis d’error i demanaren més mesures.','En acabar, la presidència no sotmeté l’assumpte a votació i convocà una sessió posterior.'],['The committee had said it would approve the proposal if the cost estimates were reliable.','At the meeting, experts presented calculations with wide error margins and asked for more measurements.','The chair did not call a vote and scheduled another session.']),answer:1},L('La amplitud de los errores muestra la falta de precisión suficiente.','L’amplitud dels errors mostra la falta de precisió suficient.','Wide error margins show insufficient precision.')));
// 5. FIGURATIVE LANGUAGE
V7A('v7_fi_i','init','figure','literature',L('El sol sonríe','El sol somriu','The smiling sun'),L('Al abrir la ventana, Leo vio la luz sobre las flores. «El sol nos sonríe esta mañana», dijo su abuela. Leo entendió que era una forma alegre de hablar del día.','En obrir la finestra, Leo va vore la llum sobre les flors. «El sol ens somriu este matí», va dir l’àvia. Leo entengué que era una manera alegre de parlar del dia.','When Leo opened the window, sunlight fell on the flowers. “The sun is smiling at us this morning,” said his grandmother. Leo knew she meant it was a lovely day.'),Q(L('¿Qué expresa la frase de la abuela?','Què expressa la frase de l’àvia?','What does the grandmother mean?'),O(['Que hace un día agradable','Que el sol tiene una boca','Que las flores están tristes','Que empieza una tormenta'],['Que fa un dia agradable','Que el sol té una boca','Que les flors estan tristes','Que comença una tempesta'],['That it is a pleasant day','That the sun has a mouth','That the flowers are sad','That a storm is beginning']),0,L('Se atribuye al sol una acción humana para transmitir alegría.','S’atribuïx al sol una acció humana per a transmetre alegria.','Giving the sun a human action creates a cheerful mood.')),V7('match',L('Relaciona las imágenes con sus sentidos.','Relaciona les imatges amb els sentits.','Match the images to their meanings.'),{left:[L('El sol sonríe','El sol somriu','The sun smiles'),L('El viento susurra','El vent xiuxiueja','The wind whispers'),L('El reloj corre','El rellotge corre','The clock races')],right:[L('El tiempo pasa rápido','El temps passa ràpid','Time passes quickly'),L('Se oye una brisa suave','Se sent una brisa suau','A gentle breeze can be heard'),L('La mañana resulta agradable','El matí resulta agradable','The morning feels pleasant')],answer:[2,1,0]},L('Son personificaciones de sensaciones, sonidos y velocidad.','Són personificacions de sensacions, sons i velocitat.','These personifications convey moods, sounds and pace.')));
V7A('v7_fi_1','eso1','figure','literature',L('Un mar de paraguas','Un mar de paraigües','A sea of umbrellas'),L('Al salir del teatro empezó a llover. La plaza se convirtió en un mar de paraguas de colores, que avanzaba lentamente hacia las calles estrechas. Ningún visitante podía ver el suelo entre tanta gente.','En eixir del teatre començà a ploure. La plaça es convertí en una mar de paraigües de colors que avançava a poc a poc cap als carrers estrets. Cap visitant podia vore el terra entre tanta gent.','When the audience left the theatre, rain began. The square became a sea of colourful umbrellas moving slowly towards narrow streets. No visitor could see the pavement through the crowd.'),Q(L('¿Qué sugiere «un mar de paraguas»?','Què suggerix «una mar de paraigües»?','What does “a sea of umbrellas” suggest?'),O(['Una gran cantidad de paraguas','La llegada del agua salada','Un único paraguas enorme','Un dibujo sobre el océano'],['Una gran quantitat de paraigües','L’arribada sobtada d’aigua salada','Un únic paraigua enorme','Un dibuix sobre l’oceà'],['A very large number of umbrellas','Salt water reaching the square','One enormous umbrella','A picture of the ocean']),0,L('La metáfora expresa abundancia mediante la imagen del mar.','La metàfora expressa abundància amb la imatge de la mar.','The sea metaphor conveys a crowd of umbrellas.')),V7('match',L('Relaciona cada expresión con su efecto.','Relaciona cada expressió amb l’efecte.','Match each expression to its effect.'),{left:[L('Mar de paraguas','Mar de paraigües','Sea of umbrellas'),L('Silencio sepulcral','Silenci sepulcral','Deathly silence'),L('Luz de oro','Llum d’or','Golden light')],right:[L('Brillo cálido','Brillantor càlida','Warm brightness'),L('Ausencia intensa de ruido','Absència intensa de soroll','An intense lack of noise'),L('Gran cantidad','Gran quantitat','A very large number')],answer:[2,1,0]},L('Las imágenes aportan cantidad, intensidad o cualidad sensorial.','Les imatges aporten quantitat, intensitat o qualitat sensorial.','The imagery conveys quantity, intensity or sensory quality.')));
V7A('v7_fi_2','eso2','figure','literature',L('La biblioteca silenciosa','La biblioteca silenciosa','The quiet library'),L('Un grupo entró charlando a voces en la sala de lectura. La bibliotecaria levantó la vista y dijo: «Qué silencio tan admirable». Nadie respondió; unos segundos después todos bajaron el tono.','Un grup entrà parlant a crits en la sala de lectura. La bibliotecària alçà la vista i digué: «Quin silenci tan admirable». Ningú respongué; uns segons després tots baixaren el to.','A group entered the reading room talking loudly. The librarian looked up and said, “What wonderfully quiet readers.” Nobody answered, and moments later everyone lowered their voices.'),Q(L('¿Qué recurso utiliza la bibliotecaria?','Quin recurs utilitza la bibliotecària?','Which device does the librarian use?'),O(['Ironía para señalar el ruido','Hipérbole para alabar voces','Símil entre libros y alumnos','Anáfora con varias repeticiones'],['Ironia per a assenyalar el soroll','Hipèrbole per a lloar les veus','Símil entre llibres i alumnes','Anàfora amb diverses repeticions'],['Irony to point out the noise','Exaggeration to praise voices','Simile comparing books and pupils','Repetition at sentence beginnings']),0,L('Alaba el silencio precisamente cuando se está incumpliendo.','Lloa el silenci precisament quan s’està incomplint.','She praises quietness when the students are loud.')),V7('match',L('Relaciona intención y expresión.','Relaciona intenció i expressió.','Match each intention and expression.'),{left:[L('Criticar el ruido con ironía','Criticar el soroll amb ironia','Criticise noise through irony'),L('Exagerar la espera','Exagerar l’espera','Exaggerate the wait'),L('Comparar la rapidez','Comparar la rapidesa','Compare someone’s speed')],right:[L('Esperé una eternidad','Vaig esperar una eternitat','I waited an eternity'),L('Corrió como una flecha','Corregué com una fletxa','She ran like an arrow'),L('¡Qué silencio tan admirable!','Quin silenci tan admirable!','What wonderfully quiet readers!')],answer:[2,0,1]},L('Ironía, hipérbole y símil producen efectos distintos.','Ironia, hipèrbole i símil produïxen efectes diferents.','Irony, hyperbole and simile have different effects.')));
V7A('v7_fi_b','bach','figure','literature',L('La memoria como archivo','La memòria com a arxiu','Memory as an archive'),L('La ensayista escribió que «la memoria no es un archivo cerrado, sino una habitación cuyas ventanas se abren desde el presente». Con ello cuestionaba la idea de que recordar consiste simplemente en recuperar copias intactas del pasado. Cada nueva experiencia ilumina ciertos detalles y deja otros en sombra.','L’assagista escrigué que «la memòria no és un arxiu tancat, sinó una habitació les finestres de la qual s’obrin des del present». Així qüestionava que recordar consistisca simplement a recuperar còpies intactes del passat. Cada experiència nova il·lumina uns detalls i en deixa altres a l’ombra.','The essayist wrote that “memory is not a closed archive but a room whose windows open from the present”. She challenged the view that remembering simply means retrieving intact copies of the past. Each new experience illuminates some details and leaves others in shadow.'),Q(L('¿Qué aporta la metáfora de las ventanas?','Què aporta la metàfora de les finestres?','What does the window metaphor imply?'),O(['El presente condiciona lo recordado','Los recuerdos están en edificios','La memoria no cambia con el tiempo','Todo recuerdo es completamente falso'],['El present condiciona el record','Els records estan en edificis','La memòria no canvia amb el temps','Tot record és completament fals'],['The present shapes what is recalled','Memories are stored in buildings','Memory never changes over time','Every memory is entirely false']),0,L('Las ventanas simbolizan la perspectiva actual sobre el pasado.','Les finestres simbolitzen la perspectiva actual sobre el passat.','Windows symbolise the present perspective on the past.')),V7('match',L('Relaciona las imágenes con su función.','Relaciona les imatges amb la funció.','Match the images and their function.'),{left:[L('Archivo cerrado','Arxiu tancat','Closed archive'),L('Ventanas abiertas','Finestres obertes','Open windows'),L('Detalles en sombra','Detalls a l’ombra','Details in shadow')],right:[L('Aspectos poco presentes','Aspectes poc presents','Less salient aspects'),L('Recuerdo fijo e inmutable','Record fix i immutable','Fixed, unchanging record'),L('Interpretación desde hoy','Interpretació des de hui','Interpretation from today')],answer:[1,2,0]},L('Cada imagen contrapone memoria fija y recuerdo reinterpretado.','Cada imatge contraposa memòria fixa i record reinterpretat.','The imagery contrasts fixed records with renewed interpretation.')));

V7A('v7_lo_i','init','logic','daily',L('El partido del viernes','El partit de divendres','Friday’s game'),L('El equipo jugará en el patio si no llueve. Esta mañana el cielo está despejado, pero el partido es por la tarde. La entrenadora esperará a conocer el tiempo antes de decidir.','L’equip jugarà al pati si no plou. Este matí el cel està ras, però el partit és de vesprada. L’entrenadora esperarà a saber quin temps fa abans de decidir.','The team will play outside if it does not rain. The sky is clear this morning, but the game is in the afternoon. The coach will wait for the weather before deciding.'),Q(L('¿Qué condición se necesita para jugar fuera?','Quina condició es necessita per a jugar fora?','What condition is needed to play outside?'),O(['Que no llueva','Que haya viento','Que llegue la noche','Que nieve en el patio'],['Que no ploga','Que faça vent','Que arribe la nit','Que neve al pati'],['No rain','Strong winds','Night-time','Snowfall']),0,L('El texto condiciona el partido a que no llueva.','El text condiciona el partit al fet que no ploga.','The match is conditional on the absence of rain.')),V7('order',L('Ordena el razonamiento previsto.','Ordena el raonament previst.','Put the plan in order.'),{items:[L('Decidir dónde jugar','Decidir on jugar','Decide where to play'),L('Comprobar si llueve','Comprovar si plou','Check whether it rains'),L('Esperar a la tarde','Esperar a la vesprada','Wait until afternoon')],answer:[2,1,0]},L('Hay que conocer el tiempo de la tarde antes de decidir.','Cal conéixer el temps de vesprada abans de decidir.','The afternoon weather must be known before deciding.')));
V7A('v7_lo_1','eso1','logic','science',L('La planta y la ventana','La planta i la finestra','The plant and the window'),L('Aunque las dos plantas recibieron la misma cantidad de agua, la que estaba junto a la ventana creció más. Una posible explicación es que recibió más luz, pero para comprobarlo habría que medir la iluminación.','Encara que les dos plantes van rebre la mateixa quantitat d’aigua, la que estava al costat de la finestra creixia més. Una possible explicació és que rebé més llum, però per a comprovar-ho caldria mesurar la il·luminació.','Although both plants received the same amount of water, the one near the window grew more. It might have received more light, but light levels would need to be measured to test this explanation.'),Q(L('¿Qué expresa «aunque» al principio?','Què expressa «encara que» al principi?','What does “although” express?'),O(['Un contraste con lo observado','Una orden de regar más','Una conclusión definitiva','Una repetición de la idea'],['Un contrast amb allò observat','Una instrucció de regar molt més','Una conclusió definitiva','Una repetició de la idea'],['A contrast with the finding','An instruction to water more','A final conclusion','A repetition of the idea']),0,L('Se contraponen riegos iguales y crecimientos diferentes.','Es contraposen regs iguals i creixements diferents.','Equal watering contrasts with different growth.')),V7('cloze',L('Elige el conector coherente.','Tria el connector coherent.','Choose a suitable connector.'),{before:L('Las plantas recibieron igual agua; ___, no crecieron igual.','Les plantes reberen igual aigua; ___, no creixeren igual.','The plants received equal water; ___, they grew differently.'),options:O(['sin embargo','por tanto','por ejemplo','además'],['no obstant això','per tant','per exemple','a més'],['however','therefore','for example','moreover']),answer:0},L('Se necesita un marcador de contraste, no de consecuencia.','Cal un marcador de contrast, no de conseqüència.','A contrast marker is needed, not a conclusion marker.')));
V7A('v7_lo_2','eso2','logic','science',L('Más bicicletas, menos ruido','Més bicicletes, menys soroll','More bikes, less noise'),L('Tras ampliar el carril bici, el ruido medio de la avenida bajó. Ese mes también disminuyó el tráfico por unas obras en otra calle. El concejal atribuyó toda la reducción del ruido al carril nuevo, pero el informe técnico mencionó ambos cambios.','Després d’ampliar el carril bici, el soroll mitjà de l’avinguda baixà. Aquell mes també disminuí el trànsit per unes obres en un altre carrer. El regidor atribuïa tota la reducció del soroll al carril nou, però l’informe tècnic esmentava els dos canvis.','After the cycle lane was expanded, average road noise fell. That month, traffic also decreased because of construction on another street. A councillor attributed the entire reduction to the new lane, but the technical report mentioned both changes.'),Q(L('¿Qué problema tiene la conclusión del concejal?','Quin problema té la conclusió del regidor?','What is the weakness in the councillor’s claim?'),O(['Desatiende un cambio simultáneo','Confunde ruido con temperatura','Niega que hubiera menos tráfico','Afirma que el carril no existe'],['Ignora un canvi simultani','Confon soroll amb temperatura','Nega que hi haguera menys trànsit','Afirma que el carril no existix'],['It ignores another concurrent change','It confuses noise with temperature','It denies that traffic decreased','It claims the lane does not exist']),0,L('Las obras también alteraron el tráfico: la causalidad no queda aislada.','Les obres també alteraren el trànsit: la causalitat no està aïllada.','Construction also changed traffic, so causality was not isolated.')),V7('classify',L('Diferencia observación e interpretación.','Diferencia observació i interpretació.','Separate observation from interpretation.'),{categories:[L('Observación','Observació','Observation'),L('Interpretación','Interpretació','Interpretation')],items:[L('El ruido medio bajó','El soroll mitjà baixà','Average noise decreased'),L('Solo el carril causó la bajada','Només el carril causà la baixada','Only the lane caused the decrease'),L('Hubo menos tráfico aquel mes','Hi hagué menys trànsit eixe mes','There was less traffic that month')],answer:[0,1,0]},L('Los datos describen cambios; la causa única es una interpretación.','Les dades descriuen canvis; la causa única és una interpretació.','The data report changes; the single cause is an interpretation.')));
V7A('v7_lo_b','bach','logic','philosophy',L('Condición necesaria o suficiente','Condició necessària o suficient','Necessary or sufficient?'),L('La universidad exige una nota mínima para optar a una beca. Sin embargo, cumplirla no asegura la concesión: también se valoran los ingresos familiares y el expediente. Una estudiante que supera el umbral satisface un requisito, pero aún puede no recibir la ayuda.','La universitat exigix una nota mínima per a optar a una beca. No obstant això, complir-la no assegura la concessió: també es valoren els ingressos familiars i l’expedient. Una estudiant que supera el llindar complix un requisit, però encara podria no rebre l’ajuda.','The university requires a minimum grade to apply for a scholarship. Meeting it does not guarantee an award: family income and academic record are also considered. A student above the threshold meets one condition but might still receive no grant.'),Q(L('¿Cómo funciona la nota mínima?','Com funciona la nota mínima?','How does the minimum grade function?'),O(['Es necesaria, pero insuficiente','Garantiza la concesión de la beca','Es irrelevante para la solicitud','Sustituye los otros criterios'],['És necessària, però insuficient','Garantix la concessió de la beca','És irrellevant per a la sol·licitud','Substituïx els altres criteris'],['Necessary but not sufficient','It guarantees the scholarship','Irrelevant to the application','It replaces the other criteria']),0,L('Es obligatoria, pero los demás criterios también importan.','És obligatòria, però els altres criteris també compten.','It is required, yet other factors still matter.')),V7('classify',L('Clasifica los razonamientos propuestos.','Classifica els raonaments proposats.','Classify each statement.'),{categories:[L('Compatible con el texto','Compatible amb el text','Supported'),L('No se sigue del texto','No es deduïx del text','Not supported')],items:[L('Una nota alta puede no bastar','Una nota alta pot no bastar','A high grade might not be enough'),L('Aprobar garantiza la beca','Aprovar garantix la beca','Passing guarantees a scholarship'),L('Hay más de un criterio','Hi ha més d’un criteri','More than one criterion matters')],answer:[0,1,0]},L('Un requisito necesario no basta por sí solo para obtener la beca.','Un requisit necessari no basta per si sol per a obtindre la beca.','A necessary requirement alone is insufficient for an award.')));
// 7. CRITICAL THINKING
V7A('v7_cr_i','init','critical','daily',L('El anuncio de la botella','L’anunci de la botella','The bottle advertisement'),L('Un cartel dice: «Esta botella es la mejor del mundo». Debajo aparece la fotografía de una botella azul. El cartel no explica cómo se ha comparado con otras botellas.','Un cartell diu: «Esta botella és la millor del món». Davall apareix la fotografia d’una botella blava. El cartell no explica com l’han comparada amb altres botelles.','A poster says, “This is the best bottle in the world.” Below it is a picture of a blue bottle. The poster never explains how it was compared with other bottles.'),Q(L('¿Qué afirmación es una opinión publicitaria?','Quina afirmació és una opinió publicitària?','Which claim is an advertising opinion?'),O(['Es la mejor del mundo','La botella es azul','El cartel tiene una foto','El anuncio muestra una botella'],['És la millor del món','La botella és blava','El cartell té una foto','L’anunci mostra una botella'],['It is the best in the world','The bottle has a blue surface','The poster has a photo','The ad shows a bottle']),0,L('«La mejor» expresa una valoración sin criterios demostrados.','«La millor» expressa una valoració sense criteris demostrats.','“Best” is a judgement without evidence here.')),V7('classify',L('Distingue una descripción de una valoración.','Distingix una descripció d’una valoració.','Distinguish descriptions from judgements.'),{categories:[L('Hecho observable','Fet observable','Observable fact'),L('Opinión','Opinió','Opinion')],items:[L('La botella es azul','La botella és blava','The bottle has a blue surface'),L('Es perfecta','És perfecta','It is perfect'),L('Hay una fotografía','Hi ha una fotografia','There is a photograph')],answer:[0,1,0]},L('El color y la foto pueden observarse; «perfecta» es una valoración.','El color i la foto es poden observar; «perfecta» és una valoració.','Colour and photo can be observed; “perfect” is a judgement.')));
V7A('v7_cr_1','eso1','critical','technology',L('Cinco opiniones elegidas','Cinc opinions triades','Five selected reviews'),L('Una tienda publica cinco opiniones positivas sobre unos auriculares. El encargado reconoce que recibió cien comentarios, pero solo compartió los que tenían la puntuación más alta. Los lectores no saben qué dijeron los otros clientes.','Una botiga publica cinc opinions positives sobre uns auriculars. L’encarregat reconeix que rebé cent comentaris, però només compartí els de puntuació més alta. Els lectors no saben què digueren els altres clients.','A shop publishes five positive reviews of some headphones. The manager admits receiving a hundred comments but sharing only the highest-rated ones. Readers do not know what the other customers said.'),Q(L('¿Qué limita la fiabilidad de esa selección?','Què limita la fiabilitat de la selecció?','What makes the selection unreliable?'),O(['Se eligieron solo las mejores','Hay varios modelos de auriculares','Los textos están en una página web','Se han leído cinco comentarios'],['S’han triat només les millors','Hi ha diversos models d’auriculars','Els textos estan en una pàgina web','S’han llegit cinc comentaris'],['Only the highest ratings were chosen','There are different headphone models','The comments are on a website','Five reviews were read']),0,L('No se trata de una muestra representativa de las cien valoraciones.','No és una mostra representativa de les cent valoracions.','The five reviews do not represent all one hundred.')),V7('classify',L('Separa los datos de las deducciones no probadas.','Separa les dades de les deduccions no provades.','Separate observations from unsupported claims.'),{categories:[L('Dato indicado','Dada indicada','Stated fact'),L('Sin pruebas suficientes','Sense proves suficients','Unsupported')],items:[L('Se recibieron cien reseñas','Es reberen cent ressenyes','One hundred reviews arrived'),L('Todos los clientes están satisfechos','Tots els clients estan satisfets','All customers are satisfied'),L('Se publicaron cinco reseñas','Es publicaren cinc ressenyes','Five reviews were posted')],answer:[0,1,0]},L('El texto no informa del contenido de las noventa y cinco opiniones excluidas.','El text no informa del contingut de les noranta-cinc opinions excloses.','The other ninety-five reviews are unknown.')));
V7A('v7_cr_2','eso2','critical','science',L('Resultados de un suplemento','Resultats d’un suplement','Results of a supplement'),L('Un laboratorio estudió a doce deportistas que recibieron una bebida antes de entrenar. Ocho afirmaron sentirse con más energía. No hubo grupo de comparación ni se midió el rendimiento. Una publicidad concluyó que la bebida aumenta la fuerza muscular de cualquier persona.','Un laboratori estudià dotze esportistes que prengueren una beguda abans d’entrenar. Huit afirmaren sentir més energia. No hi hagué grup de comparació ni es mesurà el rendiment. Una publicitat conclogué que la beguda augmenta la força muscular de qualsevol persona.','A laboratory studied twelve athletes who drank a beverage before training. Eight said they felt more energetic. There was no comparison group, and performance was not measured. An advertisement concluded that the drink increases muscle strength in everyone.'),Q(L('¿Qué objeción es más sólida?','Quina objecció és més sòlida?','Which is the strongest objection?'),O(['No se midió fuerza muscular','Los atletas bebieron líquido','Participaron doce personas','La prueba ocurrió antes de entrenar'],['No es mesurà la força muscular','Els esportistes begueren líquid','Hi participaren dotze persones','La prova fou abans d’entrenar'],['Muscle strength was not measured','Athletes consumed a liquid','There were twelve participants','The drink was taken before training']),0,L('La conclusión afirma un efecto que el estudio no midió.','La conclusió afirma un efecte que l’estudi no mesurà.','The claim concerns an outcome the study never tested.')),V7('evidence',L('Selecciona la frase que limita la conclusión.','Selecciona la frase que limita la conclusió.','Select the sentence that limits the claim.'),{fragments:L(['Un laboratorio estudió a doce deportistas que recibieron una bebida antes de entrenar.','Ocho afirmaron sentirse con más energía.','No hubo grupo de comparación ni se midió el rendimiento.','Una publicidad concluyó que la bebida aumenta la fuerza muscular de cualquier persona.'],['Un laboratori estudià dotze esportistes que prengueren una beguda abans d’entrenar.','Huit afirmaren sentir més energia.','No hi hagué grup de comparació ni es mesurà el rendiment.','Una publicitat conclogué que la beguda augmenta la força muscular de qualsevol persona.'],['A laboratory studied twelve athletes who drank a beverage before training.','Eight said they felt more energetic.','There was no comparison group, and performance was not measured.','An advertisement concluded that the drink increases muscle strength in everyone.']),answer:2},L('No se midió rendimiento, por lo que no cabe concluir mejoras de fuerza.','No es mesurà rendiment, així que no podem concloure millores de força.','Performance was not measured, so the strength claim is ungrounded.')));
V7A('v7_cr_b','bach','critical','science',L('El estudio que no se publicó','L’estudi que no es publicà','The unpublished study'),L('Cinco equipos evaluaron la misma intervención. Dos encontraron resultados favorables y publicaron sus artículos; tres no observaron diferencias concluyentes y sus trabajos quedaron inéditos. Una revisión que incluyó únicamente los artículos publicados presentó la intervención como claramente eficaz.','Cinc equips avaluaren la mateixa intervenció. Dos trobaren resultats favorables i publicaren els articles; tres no observaren diferències concloents i els seus treballs quedaren inèdits. Una revisió que només inclogué els articles publicats presentà la intervenció com a clarament eficaç.','Five teams evaluated the same intervention. Two found favourable results and published articles; three found no conclusive differences and left their studies unpublished. A review that included only published articles described the intervention as clearly effective.'),Q(L('¿Qué sesgo amenaza la revisión?','Quin biaix amenaça la revisió?','Which bias threatens the review?'),O(['Sesgo de publicación','Error de redondeo','Falacia de composición','Problema de traducción'],['Biaix de publicació','Error d’arredoniment','Fal·làcia de composició','Problema de traducció'],['Publication bias','Rounding error','Fallacy of composition','Translation difficulty']),0,L('Excluir los estudios no publicados exagera posibles efectos favorables.','Excloure estudis inèdits pot exagerar efectes favorables.','Excluding unpublished findings may inflate apparent benefits.')),V7('classify',L('Clasifica cada afirmación sobre la revisión.','Classifica cada afirmació sobre la revisió.','Classify claims about the review.'),{categories:[L('Justificada','Justificada','Justified'),L('No justificada','No justificada','Not justified')],items:[L('La muestra publicada es selectiva','La mostra publicada és selectiva','Published evidence is selective'),L('Los cinco estudios prueban eficacia', V7A('v7_li_i','init','listen','daily',L('La mochila olvidada','La motxilla oblidada','The forgotten backpack'),L('Al llegar a la escuela, Sara dejó la mochila en el banco del patio. Sonó el timbre y entró en clase. Cuando abrió el cuaderno, descubrió que no lo tenía. Pidió permiso, volvió al patio y encontró la mochila donde la había dejado.','En arribar a l’escola, Sara deixà la motxilla al banc del pati. Sonà el timbre i entrà a classe. Quan volia obrir la llibreta, descobrí que no la tenia. Demanà permís, tornà al pati i trobà la motxilla on l’havia deixada.','When Sara arrived at school, she put her backpack on a bench in the playground. The bell rang and she went to class. When she wanted her notebook, she realised she had left it behind. She asked permission, went back outside and found the backpack on the bench.'),Q(L('¿Dónde estaba la mochila?','On estava la motxilla?','Where was the backpack?'),O(['En el banco del patio','En el aula de música','En el autobús escolar','En la biblioteca'],['Al banc del pati','A l’aula de música','A l’autobús escolar','A la biblioteca'],['On a playground bench','Inside the school music room','On the school bus','In the library']),0,L('Sara vuelve a recogerla al mismo banco.','Sara torna a arreplegar-la al mateix banc.','Sara retrieves it from the same bench.')),V7('order',L('Ordena los hechos que has escuchado.','Ordena els fets que has escoltat.','Order what you heard.'),{items:[L('Regresa al patio','Torna al pati','Returns to the playground'),L('Deja la mochila','Deixa la motxilla','Leaves her backpack'),L('Entra en clase','Entra a classe','Goes into class')],answer:[1,2,0]},L('Primero la deja, luego entra y finalmente regresa.','Primer la deixa, després entra i finalment torna.','She leaves it, goes inside, then returns.')));
V7A('v7_li_1','eso1','listen','science',L('La feria científica','La fira científica','The science fair'),L('El instituto preparaba una feria de ciencias para el jueves. Los grupos habían construido pequeños experimentos y ensayado sus explicaciones. El miércoles, la organización anunció que el gimnasio no podría usarse por una reparación urgente. La feria se trasladó al viernes y se celebraría en la biblioteca y dos aulas. El alumnado recibió un nuevo plano con la distribución de los puestos.','L’institut preparava una fira de ciències per a dijous. Els grups havien construït experiments menuts i assajat les explicacions. Dimecres, l’organització anuncià que el gimnàs no es podia utilitzar per una reparació urgent. La fira es traslladà a divendres i se celebraria a la biblioteca i a dos aules. L’alumnat rebé un plànol nou amb la distribució dels llocs.','The school was preparing a science fair for Thursday. Teams had built small experiments and practised explanations. On Wednesday the organisers announced that the gym was unavailable because of urgent repairs. The fair moved to Friday and would be held in the library and two classrooms. Students received a new map showing the stands.'),Q(L('¿Por qué se cambió el día?','Per què es canvià el dia?','Why was the date changed?'),O(['Por las obras en el gimnasio','Por falta de experimentos','Por vacaciones escolares','Por ausencia de visitantes'],['Per les obres al gimnàs','Per falta d’experiments','Per vacances escolars','Per absència de visitants'],['Because the gym needed repairs','Because experiments were missing','Because it was a school holiday','Because visitors were absent']),0,L('La reparación urgente impidió utilizar el espacio previsto.','La reparació urgent impedí usar l’espai previst.','Urgent repairs made the planned venue unavailable.')),V7('order',L('Ordena los cambios comunicados.','Ordena els canvis comunicats.','Order the changes announced.'),{items:[L('Se envía un plano nuevo','S’envia un plànol nou','A new map is sent'),L('El gimnasio queda inutilizable','El gimnàs no es pot utilitzar','The gym becomes unavailable'),L('La feria pasa al viernes','La fira passa a divendres','The fair moves to Friday')],answer:[1,2,0]},L('El problema en el gimnasio motivó el cambio y la nueva distribución.','El problema al gimnàs motivà el canvi i la distribució nova.','The venue problem caused rescheduling and redistribution.')));
V7A('v7_li_2','eso2','listen','society',L('Una propuesta de autobuses','Una proposta d’autobusos','A bus proposal'),L('En el consejo municipal una representante propuso ampliar el servicio de autobús en horas punta. Explicó que algunos trayectos se realizan con vehículos llenos, pero aclaró que todavía no había datos sobre el resto del día. Otro participante pidió estudiar la ocupación por franjas horarias antes de comprar nuevos autobuses. Al finalizar, acordaron realizar las mediciones durante un mes y revisar después el presupuesto.','En el consell municipal una representant proposà ampliar el servici d’autobús en hores punta. Explicà que alguns trajectes es fan amb vehicles plens, però aclarí que encara no tenien dades de la resta del dia. Un altre participant demanà estudiar l’ocupació per franges horàries abans de comprar autobusos nous. En acabar, acordaren mesurar-la durant un mes i revisar després el pressupost.','At a council meeting, a representative proposed increasing bus services at peak times. She explained that some journeys were crowded but acknowledged there were no figures for the rest of the day. Another member asked for occupancy data by time slot before new buses were purchased. They agreed to collect data for a month and review the budget afterwards.'),Q(L('¿Qué decisión tomaron finalmente?','Quina decisió prengueren finalment?','What did they finally agree?'),O(['Medir la ocupación antes de decidir','Comprar autobuses al día siguiente','Eliminar las rutas menos utilizadas','Aumentar la tarifa de los billetes'],['Mesurar l’ocupació abans de decidir','Comprar autobusos l’endemà','Eliminar les rutes menys usades','Augmentar el preu dels bitllets'],['Measure occupancy before deciding','Buy new buses on the following day','Cut the least used routes','Raise ticket prices']),0,L('Se acordó reunir datos y después estudiar el presupuesto.','S’acordà reunir dades i després estudiar el pressupost.','They agreed to gather data before reviewing the budget.')),V7('classify',L('Distingue lo conocido de lo pendiente.','Distingix allò conegut d’allò pendent.','Separate known facts from open questions.'),{categories:[L('Se conoce','Es coneix','Known'),L('Falta comprobarlo','Cal comprovar-ho','Not yet known')],items:[L('Hay trayectos con autobuses llenos','Hi ha trajectes amb autobusos plens','Some journeys are crowded'),L('Ocupación del resto del día','Ocupació de la resta del dia','Occupancy for the rest of the day'),L('Costo definitivo de ampliar rutas','Cost definitiu d’ampliar rutes','Final cost of extra services')],answer:[0,1,1]},L('La reunión reconoce explícitamente carencias de datos y presupuesto.','La reunió reconeix explícitament mancances de dades i pressupost.','The meeting identifies missing data and budget details.')));
V7A('v7_li_b','bach','listen','philosophy',L('La incertidumbre científica','La incertesa científica','Scientific uncertainty'),L('En una conferencia, una investigadora sostuvo que reconocer incertidumbre no equivale a ignorancia absoluta. Una estimación puede apoyarse en observaciones rigurosas y, aun así, tener un margen de error. Presentar un resultado como una cifra exacta sin explicar sus límites podría generar una confianza injustificada. También advirtió del error opuesto: interpretar cualquier margen de incertidumbre como si todos los escenarios fueran igualmente probables. Concluyó que comunicar bien la ciencia exige mostrar los datos, sus limitaciones y el grado de confianza que se les atribuye.','En una conferència, una investigadora sostingué que reconéixer la incertesa no equival a ignorància absoluta. Una estimació pot basar-se en observacions rigoroses i, tot i això, tindre un marge d’error. Presentar un resultat com una xifra exacta sense explicar-ne els límits pot generar una confiança injustificada. També advertí de l’error oposat: interpretar qualsevol incertesa com si tots els escenaris foren igualment probables. Conclogué que comunicar bé la ciència exigix mostrar les dades, les limitacions i el grau de confiança atribuït.','During a lecture, a researcher argued that acknowledging uncertainty does not mean complete ignorance. An estimate may rest on rigorous observations and still have a margin of error. Presenting a number as perfectly exact without explaining its limits can create false confidence. She also warned against the opposite error: assuming uncertainty makes every scenario equally likely. She concluded that good science communication should report evidence, limitations and the degree of confidence justified by the findings.'),Q(L('¿Qué postura defiende la conferenciante?','Quina postura defén la conferenciant?','What view does the speaker defend?'),O(['Explicar límites sin negar evidencias','Evitar dar cifras en cualquier estudio','Tratar todas las hipótesis por igual','Eliminar toda duda antes de comunicar'],['Explicar límits sense negar evidències','Evitar donar xifres en qualsevol estudi','Tractar totes les hipòtesis igual','Eliminar tot dubte abans de comunicar'],['Report limits without dismissing evidence','Avoid all figures in scientific studies','Treat every hypothesis as equally likely','Remove all doubt before communicating']),0,L('Propone calibrar las conclusiones según los datos y su incertidumbre.','Proposa calibrar les conclusions segons les dades i la incertesa.','The speaker calls for claims calibrated to evidence and uncertainty.')),V7('classify',L('Valora cada interpretación del discurso.','Valora cada interpretació del discurs.','Evaluate each interpretation of the speech.'),{categories:[L('Coherente con el discurso','Coherent amb el discurs','Consistent with the talk'),L('Contradice el discurso','Contradiu el discurs','Contradicts the talk')],items:[L('Un margen puede coexistir con datos sólidos','Un marge pot coexistir amb dades sòlides','Uncertainty can coexist with strong evidence'),L('Toda estimación es inútil','Tota estimació és inútil','Every estimate is useless'),L('No todas las hipótesis son igual de probables','No totes les hipòtesis són igual de probables','Not all scenarios are equally likely')],answer:[0,1,0]},L('La incertidumbre no anula la evidencia ni iguala todas las posibilidades.','La incertesa no anul·la l’evidència ni iguala totes les possibilitats.','Uncertainty neither nullifies evidence nor makes all outcomes equally likely.')));

CC('c8_i_read','init','read','science',L('El huerto y la lluvia','L’hort i la pluja','The garden and the rain'),L(
'En el huerto del colegio hay dos bancales. El lunes, Sara regó los dos. El martes llovió durante la mañana y el maestro pidió al grupo que no regara. «La tierra ya está húmeda», explicó. El miércoles salió el sol y los alumnos observaron que algunas hojas seguían mojadas. Antes de coger la regadera, Sara tocó la tierra. Estaba húmeda y decidió esperar. Al final de la semana, el maestro felicitó al grupo por comprobar qué necesitaban las plantas en lugar de seguir siempre la misma rutina.',
'A l’hort del col·legi hi ha dos bancals. Dilluns, Sara va regar els dos. Dimarts va ploure durant el matí i el mestre va demanar al grup que no regara. «La terra ja està humida», va explicar. Dimecres va eixir el sol i l’alumnat va observar que algunes fulles encara estaven banyades. Abans d’agafar la regadora, Sara va tocar la terra. Estava humida i va decidir esperar. Al final de la setmana, el mestre va felicitar el grup per comprovar què necessitaven les plantes en lloc de seguir sempre la mateixa rutina.',
'The school garden has two planting beds. On Monday, Sara watered both. It rained on Tuesday morning, and the teacher told the class not to water them. “The soil is already damp,” he explained. On Wednesday the sun came out, but some leaves were still wet. Before picking up the watering can, Sara touched the soil. It was damp, so she decided to wait. At the end of the week, the teacher praised the class for checking what the plants needed instead of following the same routine every time.'),[
CQ('essential',L('¿Qué idea resume mejor el texto?','Quina idea resumix millor el text?','Which idea best sums up the passage?'),O(['Hay que observar antes de regar.','Conviene regar cada mañana.','Las hojas deben estar secas.','Es mejor plantar los lunes.'],['Cal observar abans de regar.','Convé regar cada matí.','Les fulles han d’estar seques.','És millor plantar els dilluns.'],['Check the soil before watering.','Water the plants each morning.','Make sure every leaf is completely dry.','Plant the seeds on Mondays.']),0,L('La clase comprueba la humedad antes de decidir si necesita regar.','La classe comprova la humitat abans de decidir si cal regar.','The class checks soil moisture before deciding whether to water.')),
CQ('infer',L('¿Por qué Sara decidió esperar el miércoles?','Per què Sara va decidir esperar dimecres?','Why did Sara decide to wait on Wednesday?'),O(['Porque había perdido la regadera.','Porque la tierra seguía húmeda.','Porque se había terminado el agua.','Porque el huerto estaba cerrado.'],['Perquè havia perdut la regadora.','Perquè la terra continuava humida.','Perquè s’havia acabat l’aigua.','Perquè l’hort estava tancat.'],['Because her watering can had gone missing.','Because the soil was still damp.','Because the water had run out.','Because the garden was locked.']),1,L('Tocó la tierra y comprobó que aún conservaba humedad.','Va tocar la terra i comprovà que encara tenia humitat.','She touched the soil and found that it still contained moisture.')),
CQ('vocab',L('¿Qué significa «rutina» en este texto?','Què significa «rutina» en este text?','What does “routine” mean here?'),O(['Una herramienta para plantar.','Una sustancia de la tierra.','Una costumbre que se repite.','Una planta recién nacida.'],['Una ferramenta per a plantar.','Una substància de la terra.','Un costum que es repetix.','Una planta acabada de nàixer.'],['A tool used for planting new seeds.','A material found in soil.','A habit repeated regularly.','A newly sprouted seedling.']),2,L('Se contrapone la costumbre de regar siempre con decidir según las necesidades.','Es contraposa el costum de regar sempre amb decidir segons les necessitats.','It contrasts doing the same thing repeatedly with checking what is needed.')),
CQ('logic',L('¿Qué hecho explicó que el martes no regaran?','Quin fet explica que dimarts no regaren?','What explains why they did not water on Tuesday?'),O(['El sol secó las hojas del huerto.','El maestro compró una nueva planta.','La clase cambió de horario ese día.','La lluvia ya había humedecido la tierra.'],['El sol va assecar les fulles de l’hort.','El mestre va comprar una planta nova.','La classe canvià d’horari aquell dia.','La pluja ja havia humitejat la terra.'],['The sun had dried the garden leaves.','The teacher bought a new plant.','The class timetable changed during the week.','The rain had already dampened the soil.']),3,L('La lluvia fue la causa que dio el maestro para no regar.','La pluja va ser la causa que va donar el mestre per a no regar.','Rain had already supplied water, according to the teacher.')),
CQ('critical',L('¿Qué sería mejor comprobar antes de regar el jueves?','Què seria millor comprovar abans de regar dijous?','What would be best to check before watering on Thursday?'),O(['Si la tierra sigue necesitando agua.','Si el maestro conoce todas las plantas.','Si el miércoles hubo más alumnos.','Si las regaderas tienen el mismo color.'],['Si la terra continua necessitant aigua.','Si el mestre coneix totes les plantes.','Si dimecres hi havia més alumnes.','Si les regadores tenen el mateix color.'],['Whether the soil still needs water.','Whether the teacher knows every plant.','Whether more pupils came on Wednesday.','Whether the watering cans match.']),0,L('El mensaje principal es observar la necesidad real antes de actuar.','El missatge principal és observar la necessitat real abans d’actuar.','The passage recommends checking the actual need before acting.'))
]);

CC('c8_i_audio','init','audio','daily',L('La visita a la biblioteca','La visita a la biblioteca','A visit to the library'),L(
'El jueves, el grupo de Nora visitó la biblioteca del barrio. La bibliotecaria explicó que los libros se prestan durante dos semanas. Nora eligió uno sobre animales, pero no encontró su carné. Su amigo Leo le recordó que lo había guardado dentro de la mochila azul. Nora lo buscó y lo encontró. Antes de marcharse, la bibliotecaria pidió que devolvieran los libros en la fecha indicada. En clase, Nora contó que había aprendido a fijarse en las normas y a comprobar dónde guarda sus cosas.',
'Dijous, el grup de Nora va visitar la biblioteca del barri. La bibliotecària va explicar que els llibres es presten durant dues setmanes. Nora en va triar un sobre animals, però no trobava el carnet. El seu amic Leo li va recordar que l’havia guardat dins de la motxilla blava. Nora el va buscar i el va trobar. Abans d’anar-se’n, la bibliotecària els va demanar que tornaren els llibres en la data indicada. A classe, Nora va contar que havia aprés a fixar-se en les normes i a comprovar on guarda les coses.',
'On Thursday, Nora’s class visited their neighbourhood library. The librarian explained that books could be borrowed for two weeks. Nora chose a book about animals, but she could not find her library card. Her friend Leo reminded her that she had put it inside her blue backpack. Nora searched and found it. Before the class left, the librarian asked everyone to return their books on time. Back at school, Nora said she had learned to pay attention to rules and to check where she kept her belongings.'),[
CQ('essential',L('¿Dónde fue el grupo el jueves?','On va anar el grup dijous?','Where did the class go on Thursday?'),O(['Al museo de ciencias.','A la biblioteca del barrio.','Al jardín de la escuela.','A la tienda de animales.'],['Al museu de ciències.','A la biblioteca del barri.','Al jardí de l’escola.','A la botiga d’animals.'],['To the science museum.','To the local library.','To the school garden.','To the pet shop.']),1,L('La visita tuvo lugar en la biblioteca del barrio.','La visita va tindre lloc a la biblioteca del barri.','The class visited the neighbourhood library.')),
CQ('infer',L('¿Qué ayudó a Nora a encontrar el carné?','Què va ajudar Nora a trobar el carnet?','What helped Nora find her library card?'),O(['Recordar el título del libro.','Volver al aula de su colegio.','La pista de su amigo Leo.','Preguntar por otro animal.'],['Recordar el títol del llibre.','Tornar a l’aula del col·legi.','La pista del seu amic Leo.','Preguntar per un altre animal.'],['Remembering the book title.','Returning to her classroom.','A clue from her friend Leo.','Asking about another animal.']),2,L('Leo le recordó dónde había guardado el carné.','Leo li va recordar on havia guardat el carnet.','Leo reminded Nora where she had put the card.')),
CQ('logic',L('¿Qué condición había para devolver el libro correctamente?','Quina condició hi havia per a tornar el llibre correctament?','What was required for returning the book properly?'),O(['Cambiarlo por otro distinto.','Leerlo delante de la clase.','Escribir un resumen completo.','Entregarlo dentro del plazo.'],['Canviar-lo per un altre distint.','Llegir-lo davant de la classe.','Escriure’n un resum complet.','Tornar-lo dins del termini.'],['Swap it for a different book.','Read it aloud to the class.','Write a complete book summary.','Return it before the due date.']),3,L('La bibliotecaria insistió en cumplir la fecha prevista.','La bibliotecària insistí a complir la data indicada.','The librarian asked pupils to meet the return date.')),
CQ('vocab',L('¿Qué significa «préstamo» en este contexto?','Què significa «préstec» en este context?','What does “borrow” mean in this situation?'),O(['Llevarse algo y devolverlo después.','Comprar algo para conservarlo siempre.','Regalar algo sin pedirlo de vuelta.','Romper algo antes de utilizarlo.'],['Emportar-se una cosa i tornar-la després.','Comprar una cosa per a guardar-la sempre.','Regalar una cosa sense recuperar-la.','Trencar una cosa abans d’utilitzar-la.'],['Take something and return it later.','Buy something to keep forever.','Give something away permanently.','Damage something before using it.']),0,L('Los libros pueden utilizarse temporalmente y deben devolverse.','Els llibres es poden utilitzar temporalment i cal tornar-los.','Borrowing means temporarily using an item and returning it.')),
CQ('critical',L('¿Cuál de estas afirmaciones NO queda demostrada?','Quina d’estes afirmacions NO queda demostrada?','Which statement is NOT supported by the recording?'),O(['Nora escogió un libro de animales.','Leo trabajaba en la biblioteca.','Los libros tenían plazo de devolución.','La visita ocurrió un jueves.'],['Nora va triar un llibre d’animals.','Leo treballava a la biblioteca.','Els llibres tenien termini de devolució.','La visita va ocórrer dijous.'],['Nora chose a book about animals.','Leo worked at the local library.','Borrowed books had a due date.','The visit took place on Thursday.']),1,L('Leo era amigo de Nora; no se indica que trabajara allí.','Leo era amic de Nora; no s’indica que treballara allí.','Leo was Nora’s friend, and no job at the library is mentioned.'))
