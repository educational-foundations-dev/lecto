E('e1_river','eso1','essential','science',
 L('La vida de un río','La vida d’un riu','The life of a river'),
 L('Un río no transporta solo agua. En su recorrido arrastra sedimentos, alimenta humedales y proporciona refugio a numerosas especies. Cuando se construye una presa, el agua queda retenida y puede utilizarse para regar o generar electricidad. Sin embargo, la presa también modifica el paso de los sedimentos y dificulta el desplazamiento de algunos peces. Por eso, antes de construirla, se estudian sus beneficios y sus posibles efectos sobre el ecosistema.',
 'Un riu no transporta només aigua. Al llarg del recorregut arrossega sediments, alimenta aiguamolls i proporciona refugi a nombroses espècies. Quan es construïx una presa, l’aigua queda retinguda i es pot utilitzar per a regar o generar electricitat. No obstant això, la presa també modifica el pas dels sediments i dificulta el desplaçament d’alguns peixos. Per això, abans de construir-la, s’estudien els beneficis i els possibles efectes sobre l’ecosistema.',
 'A river carries more than water. Along its course it moves sediment, feeds wetlands and provides shelter for many species. Building a dam stores water that can be used for irrigation or electricity. However, a dam also changes the movement of sediment and makes it harder for some fish to travel. That is why planners examine both the benefits of a dam and its possible effects on the ecosystem before building it.'),
 Q(L('¿Cuál es la idea central?','Quina és la idea central?','What is the central idea?'),
 O(['Todos los ríos producen electricidad','Las presas tienen beneficios y efectos ambientales','Los peces viven solo en humedales','El agua no transporta materiales'],['Tots els rius produïxen electricitat','Les preses tenen beneficis i efectes ambientals','Els peixos viuen només als aiguamolls','L’aigua no transporta materials'],['Every river produces electricity','Dams have benefits and environmental effects','Fish live only in wetlands','Water cannot carry materials']),1,
 L('El texto presenta dos caras de la construcción de presas.','El text presenta dos cares de la construcció de preses.','The passage presents both advantages and impacts of dams.')),
 Q(L('¿Qué función tiene la expresión «Sin embargo»?','Quina funció té l’expressió «No obstant això»?','What does “However” signal?'),
 O(['Añadir un ejemplo similar','Indicar el orden temporal','Introducir un contraste','Resumir el texto'],['Afegir un exemple semblant','Indicar l’orde temporal','Introduir un contrast','Resumir el text'],['Adding a similar example','Showing time order','Introducing a contrast','Summarising the text']),2,

E('e1_trade','eso1','essential','history',
 L('Los mercados medievales','Els mercats medievals','Medieval markets'),
 L('En muchas villas medievales, el día de mercado reunía a campesinos, artesanos y comerciantes. Allí se intercambiaban alimentos, tejidos y herramientas. Los caminos que comunicaban las poblaciones facilitaban el transporte, pero viajar podía ser lento y peligroso. Algunas autoridades cobraban impuestos a quienes entraban con mercancías. A pesar de estas dificultades, los mercados ayudaron a que las ciudades crecieran y a que personas de distintos lugares compartieran noticias e ideas.',
 'En moltes viles medievals, el dia de mercat reunia llauradors, artesans i comerciants. Allí s’intercanviaven aliments, teixits i ferramentes. Els camins que comunicaven les poblacions facilitaven el transport, però viatjar podia ser lent i perillós. Algunes autoritats cobraven impostos a qui entrava amb mercaderies. Malgrat estes dificultats, els mercats van ajudar a fer créixer les ciutats i a compartir notícies i idees entre persones de diferents llocs.',
 'In many medieval towns, market day brought together farmers, craftspeople and merchants. People exchanged food, cloth and tools. Roads made transport between towns possible, but journeys could be slow and dangerous. Some authorities charged taxes on goods brought into a town. Despite these difficulties, markets helped towns grow and allowed people from different places to share news and ideas.'),
 Q(L('¿Qué resumen recoge mejor el contenido?','Quin resum arreplega millor el contingut?','Which summary best captures the passage?'),
 O(['Los mercados solo servían para vender alimentos','Los viajes medievales estaban prohibidos','Los impuestos acabaron con el comercio','Los mercados favorecían el intercambio económico y cultural'],['Els mercats només servien per a vendre aliments','Els viatges medievals estaven prohibits','Els impostos van acabar amb el comerç','Els mercats afavorien l’intercanvi econòmic i cultural'],['Markets only sold food','Medieval travel was forbidden','Taxes ended all trade','Markets encouraged economic and cultural exchange']),3,
 L('Además de comerciar, las personas intercambiaban noticias e ideas.','A més de comerciar, les persones intercanviaven notícies i idees.','People exchanged news and ideas as well as goods.')),
 Q(L('¿Qué dificultad para el comercio se menciona?','Quina dificultat per al comerç s’esmenta?','Which difficulty for trade is mentioned?'),
 O(['Los impuestos a las mercancías','La ausencia de artesanos','La prohibición de los mercados','La falta de productos agrícolas'],['Els impostos a les mercaderies','L’absència d’artesans','La prohibició dels mercats','La falta de productes agrícoles'],['Taxes on goods','A lack of craftspeople','A ban on markets','A shortage of farm products']),0,
 L('El texto menciona explícitamente impuestos sobre las mercancías.','El text esmenta explícitament impostos sobre les mercaderies.','The text explicitly mentions taxes on goods.'))),
E('e1_thermo','eso1','infer','science',
 L('El termómetro del aula','El termòmetre de l’aula','The classroom thermometer'),
 L('Al comenzar la práctica, el termómetro marcaba 19 °C. Sofía lo dejó junto a una ventana por la que entraba el sol. Quince minutos después, marcaba 27 °C. En otra mesa, lejos de la ventana, el termómetro de Lucas seguía marcando 19 °C. El profesor pidió que comparasen las mediciones antes de afirmar que toda el aula se había calentado.',
 'En començar la pràctica, el termòmetre marcava 19 °C. Sofia el va deixar al costat d’una finestra per on entrava el sol. Quinze minuts després, marcava 27 °C. En una altra taula, lluny de la finestra, el termòmetre de Lluc continuava marcant 19 °C. El professor va demanar que compararen les mesures abans d’afirmar que tota l’aula s’havia calfat.',
 'At the start of the experiment, the thermometer read 19°C. Sofia placed it beside a sunny window. Fifteen minutes later, it read 27°C. At another table, away from the window, Lucas’s thermometer still read 19°C. Their teacher asked them to compare the measurements before claiming that the whole classroom had warmed up.'),
 Q(L('¿Cuál es la explicación más razonable?','Quina és l’explicació més raonable?','Which explanation is most reasonable?'),
 O(['El sol pudo calentar la zona del primer termómetro','Los dos termómetros indican la misma temperatura','Toda el aula alcanzó exactamente 27 °C','Lucas midió la temperatura exterior'],['El sol podia haver calfat la zona del primer termòmetre','Els dos termòmetres indiquen la mateixa temperatura','Tota l’aula va arribar exactament a 27 °C','Lluc va mesurar la temperatura exterior'],['Sunlight may have warmed the area around the first thermometer','Both thermometers showed the same temperature','The whole room reached exactly 27°C','Lucas measured the outdoor temperature']),0,
 L('Solo el termómetro cercano al sol registra un aumento; la diferencia importa.','Només el termòmetre pròxim al sol registra un augment; la diferència importa.','Only the thermometer in sunlight shows an increase; its location matters.')),
 Q(L('¿Qué afirmación NO está justificada?','Quina afirmació NO està justificada?','Which statement is NOT justified?'),
 O(['Había dos termómetros','Transcurrieron quince minutos','La temperatura era igual en todos los puntos del aula','Uno estaba cerca de una ventana'],['Hi havia dos termòmetres','Van transcórrer quinze minuts','La temperatura era igual en tots els punts de l’aula','Un estava prop d’una finestra'],['There were two thermometers','Fifteen minutes passed','The temperature was the same everywhere in the room','One was near a window']),2,
 L('Las lecturas distintas impiden sostener que la temperatura fuese igual en todas partes.','Les lectures diferents impedixen afirmar que la temperatura fora igual per tot arreu.','Different readings do not support an equal temperature everywhere.'))),
E('e1_story','eso1','infer','literature',
 L('La carta sin abrir','La carta sense obrir','The unopened letter'),
 L('Cada tarde, Irene revisaba el buzón de casa. Cuando por fin llegó una carta con el sello de la escuela de música, la dejó sobre la mesa sin abrirla. Dio dos vueltas por la habitación y llamó a su hermano para que se sentara a su lado. Solo entonces rompió el sobre. Había dedicado meses a preparar una audición.',
 'Cada vesprada, Irene revisava la bústia de casa. Quan per fi va arribar una carta amb el segell de l’escola de música, la va deixar sobre la taula sense obrir-la. Va pegar dos voltes per l’habitació i va cridar el seu germà perquè s’asseguera al seu costat. Només aleshores va obrir el sobre. Havia dedicat mesos a preparar una audició.',
 'Every afternoon, Irene checked the letterbox. When a letter finally arrived bearing the music school’s stamp, she left it unopened on the table. She paced around the room twice and called her brother to sit beside her. Only then did she open the envelope. She had spent months preparing for an audition.'),
 Q(L('¿Qué emoción es razonable atribuirle antes de abrir la carta?','Quina emoció és raonable atribuir-li abans d’obrir la carta?','What was Irene likely feeling before opening the letter?'),
 O(['Aburrimiento por una tarea rutinaria','Nerviosismo ante una respuesta importante','Enfado por haber perdido la carta','Alegría por conocer ya el resultado'],['Avorriment per una tasca rutinària','Nervis davant d’una resposta important','Enuig per haver perdut la carta','Alegria per saber ja el resultat'],['Boredom with a routine task','Nervousness about an important answer','Anger because the letter was lost','Joy because she already knew the result']),1,
 L('La espera, las vueltas y la compañía de su hermano sugieren nervios.','L’espera, les voltes i la companyia del germà suggerixen nervis.','The waiting, pacing and request for company suggest nervousness.')),
 Q(L('¿Qué dato NO conocemos?','Quina dada NO coneixem?','Which detail do we NOT know?'),
 O(['Que la carta procedía de una escuela de música','Que había preparado una audición','Que abrió la carta con su hermano','Que había sido admitida'],['Que la carta venia d’una escola de música','Que havia preparat una audició','Que va obrir la carta amb el germà','Que havia sigut admesa'],['The letter came from a music school','She had prepared for an audition','She opened it with her brother','She was accepted']),3,
 L('El relato termina antes de revelar el contenido de la carta.','El relat acaba abans de revelar el contingut de la carta.','The story ends without telling us what the letter says.'))),
E('e2_city','eso2','essential','science',
 L('El calor de las ciudades','La calor de les ciutats','Heat in cities'),
 L('Durante las noches de verano, algunas ciudades mantienen temperaturas superiores a las de sus alrededores rurales. El asfalto, el hormigón y los edificios almacenan calor durante el día y lo liberan lentamente. La escasez de vegetación limita, además, el enfriamiento asociado a la evaporación del agua. Este fenómeno recibe el nombre de «isla de calor urbana». Para reducir su intensidad, distintas ciudades están plantando árboles, creando zonas de sombra e introduciendo materiales que reflejan mejor la radiación solar. Ninguna medida aislada resuelve por completo el problema: su eficacia depende del clima, la distribución urbana y el mantenimiento de los espacios.',
 'Durant les nits d’estiu, algunes ciutats mantenen temperatures superiors a les de les zones rurals dels voltants. L’asfalt, el formigó i els edificis emmagatzemen calor durant el dia i l’alliberen lentament. A més, l’escassetat de vegetació limita el refredament associat a l’evaporació de l’aigua. Este fenomen rep el nom d’«illa de calor urbana». Per a reduir-ne la intensitat, diverses ciutats estan plantant arbres, creant zones d’ombra i introduint materials que reflectixen millor la radiació solar. Cap mesura aïllada resol del tot el problema: l’eficàcia depén del clima, la distribució urbana i el manteniment dels espais.',
 'On summer nights, some cities stay warmer than the surrounding countryside. Asphalt, concrete and buildings store heat during the day and release it slowly. A shortage of vegetation also reduces cooling caused by water evaporation. This phenomenon is called the “urban heat island”. To reduce its intensity, some cities are planting trees, creating shaded areas and using materials that reflect more sunlight. No single measure completely solves the problem: its success depends on climate, city layout and ongoing maintenance.'),
 Q(L('¿Qué estructura presenta el texto?','Quina estructura presenta el text?','How is the passage organised?'),
 O(['Biografía de un investigador','Problema, explicación y posibles soluciones','Instrucciones de montaje','Enumeración de ciudades sin relación'],['Biografia d’un investigador','Problema, explicació i possibles solucions','Instruccions de muntatge','Enumeració de ciutats sense relació'],['A researcher’s biography','Problem, explanation and possible solutions','Assembly instructions','A disconnected list of cities']),1,
 L('Primero describe un fenómeno, después sus causas y finalmente posibles medidas.','Primer descriu un fenomen, després les causes i finalment possibles mesures.','It introduces a phenomenon, explains its causes and suggests responses.')),
 Q(L('¿Qué idea matiza la última frase?','Quina idea matisa l’última frase?','What does the final sentence qualify?'),
 O(['El calor solo existe en verano','Las zonas rurales no necesitan árboles','Todas las soluciones funcionan igual en cualquier ciudad','Las medidas requieren adaptarse al contexto'],['La calor només existix a l’estiu','Les zones rurals no necessiten arbres','Totes les solucions funcionen igual en qualsevol ciutat','Les mesures s’han d’adaptar al context'],['Heat exists only in summer','Rural areas do not need trees','All solutions work equally in every city','Measures must be adapted to local conditions']),3,
 L('La eficacia depende de varias condiciones; ninguna medida es universal.','L’eficàcia depén de diverses condicions; cap mesura és universal.','Effectiveness depends on several conditions; no measure works everywhere.'))),
E('e2_factory','eso2','essential','history',
 L('Cambios en la fábrica','Canvis a la fàbrica','Changes in the factory'),
 L('La mecanización de la industria incrementó la cantidad de productos fabricados en menos tiempo. Muchos empresarios pudieron reducir determinados costes y ampliar sus mercados. Sin embargo, las primeras fábricas solían imponer jornadas largas y condiciones peligrosas. Con el tiempo, las organizaciones obreras reclamaron límites horarios, medidas de seguridad y protección frente a accidentes. Las transformaciones industriales, por tanto, no pueden describirse únicamente como avances técnicos: también modificaron la vida cotidiana, la organización de las ciudades y las relaciones entre trabajadores y propietarios. Sus consecuencias fueron distintas para cada grupo social y variaron según el país y el periodo histórico.',
 'La mecanització de la indústria va incrementar la quantitat de productes fabricats en menys temps. Molts empresaris van poder reduir determinats costos i ampliar els mercats. No obstant això, les primeres fàbriques solien imposar jornades llargues i condicions perilloses. Amb el temps, les organitzacions obreres van reclamar límits horaris, mesures de seguretat i protecció davant dels accidents. Les transformacions industrials, per tant, no es poden descriure únicament com a avanços tècnics: també van modificar la vida quotidiana, l’organització de les ciutats i les relacions entre treballadors i propietaris. Les conseqüències van ser diferents per a cada grup social i van variar segons el país i el període històric.',
 'Mechanisation increased the number of goods factories could produce in less time. Many business owners reduced certain costs and expanded their markets. However, early factories often demanded long working hours and exposed workers to dangerous conditions. Over time, workers’ organisations called for limits on working hours, safety measures and protection against accidents. Industrial change, therefore, cannot be described as technological progress alone: it also altered daily life, cities and relationships between workers and owners. Its consequences varied across social groups, countries and historical periods.'),
 Q(L('¿Qué afirmación sintetiza mejor el texto?','Quina afirmació sintetitza millor el text?','Which statement best summarises the passage?'),
 O(['La industrialización produjo cambios tecnológicos y sociales','La mecanización eliminó los accidentes','Los trabajadores siempre se beneficiaron por igual','La industria apenas modificó las ciudades'],['La industrialització va produir canvis tecnològics i socials','La mecanització va eliminar els accidents','Els treballadors sempre se’n van beneficiar igual','La indústria a penes va modificar les ciutats'],['Industrialisation brought technological and social change','Mechanisation ended workplace accidents','Workers always benefited equally','Industry barely affected cities']),0,
 L('El texto relaciona la productividad con consecuencias laborales y sociales.','El text relaciona la productivitat amb conseqüències laborals i socials.','The passage links productivity to working conditions and social effects.')),
 Q(L('¿Qué función cumplen las reivindicaciones obreras en el texto?','Quina funció complixen les reivindicacions obreres en el text?','What role do workers’ demands play in the passage?'),
 O(['Describir el invento de una máquina','Explicar cómo se calculaban los salarios','Mostrar una respuesta a las condiciones laborales','Sustituir los datos sobre producción'],['Descriure la invenció d’una màquina','Explicar com es calculaven els salaris','Mostrar una resposta a les condicions laborals','Substituir les dades sobre producció'],['Describing a machine invention','Explaining how wages were calculated','Showing a response to working conditions','Replacing the information about production']),2,
 L('Las demandas se presentan como reacción a jornadas y riesgos de las fábricas.','Les reivindicacions es presenten com a reacció a les jornades i els riscos de les fàbriques.','The demands are presented as a response to hours and risks in factories.'))),
E('e2_bikes','eso2','infer','math',
 L('¿Funcionó el carril bici?','Ha funcionat el carril bici?','Did the cycle lane work?'),
 L('Tras construir un carril bici, un ayuntamiento anunció que el número de bicicletas contadas en una avenida había aumentado un 40 % respecto al año anterior. La noticia fue presentada como prueba de que la nueva infraestructura había reducido el uso del coche. Sin embargo, el informe no recogía cuántos vehículos circulaban por esa avenida antes y después de las obras, ni si los ciclistas habían cambiado de ruta desde calles próximas. Durante el mismo periodo, además, se celebró una campaña municipal para promover la bicicleta. El aumento de ciclistas es un dato relevante, pero la explicación de sus causas requiere información adicional.',
 'Després de construir un carril bici, un ajuntament va anunciar que el nombre de bicicletes comptades en una avinguda havia augmentat un 40 % respecte a l’any anterior. La notícia es va presentar com a prova que la nova infraestructura havia reduït l’ús del cotxe. No obstant això, l’informe no recollia quants vehicles circulaven per l’avinguda abans i després de les obres, ni si els ciclistes havien canviat de ruta des de carrers pròxims. Durant el mateix període, a més, es va fer una campanya municipal per a promoure la bicicleta. L’augment de ciclistes és una dada rellevant, però explicar-ne les causes exigix informació addicional.',
 'After building a cycle lane, a city council announced that bicycle counts on one avenue had increased by 40% compared with the previous year. The announcement was presented as proof that the new infrastructure had reduced car use. However, the report did not show how many cars used the avenue before and after construction, or whether cyclists had simply moved from nearby streets. During the same period, the city also ran a cycling campaign. The increase in bicycles is relevant, but more evidence is needed to explain its causes.'),
 Q(L('¿Qué conclusión está mejor justificada?','Quina conclusió està millor justificada?','Which conclusion is best supported?'),
 O(['El tráfico de coches cayó un 40 %','La campaña municipal no influyó','Se contaron más bicicletas, pero no se demuestra la causa','Todos los nuevos ciclistas dejaron de usar el coche'],['El trànsit de cotxes va baixar un 40 %','La campanya municipal no hi va influir','Es van comptar més bicicletes, però no se’n demostra la causa','Tots els nous ciclistes van deixar d’usar el cotxe'],['Car traffic fell by 40%','The campaign had no effect','More bicycles were counted, but the cause is not established','Every new cyclist stopped driving']),2,

E('e2_review','eso2','infer','science',
 L('Un descubrimiento en revisión','Un descobriment en revisió','A discovery under review'),
 L('Un equipo anunció que había desarrollado un material capaz de almacenar más energía que los utilizados habitualmente. Sus primeros resultados fueron prometedores, pero procedían de pruebas realizadas con pocas muestras. Otro laboratorio intentó reproducir el procedimiento y obtuvo resultados más modestos. En lugar de retirar inmediatamente el anuncio o dar por inválida la investigación, ambos equipos intercambiaron sus métodos y compararon las condiciones de ensayo. Descubrieron que la temperatura de trabajo variaba entre las pruebas. Acordaron repetir los experimentos con un protocolo común antes de publicar una conclusión definitiva.',
 'Un equip va anunciar que havia desenvolupat un material capaç d’emmagatzemar més energia que els utilitzats habitualment. Els primers resultats eren prometedors, però provenien de proves fetes amb poques mostres. Un altre laboratori va intentar reproduir el procediment i va obtindre resultats més modestos. En lloc de retirar immediatament l’anunci o donar per invàlida la investigació, els dos equips van intercanviar els mètodes i van comparar les condicions d’assaig. Van descobrir que la temperatura de treball variava entre les proves. Van acordar repetir els experiments amb un protocol comú abans de publicar una conclusió definitiva.',
 'A team announced that it had developed a material able to store more energy than those commonly used. Its initial results looked promising, but came from tests on only a few samples. Another laboratory tried to repeat the method and obtained more modest results. Rather than immediately withdrawing the claim or dismissing the research, the teams exchanged methods and compared their testing conditions. They discovered that the working temperature differed between experiments. They agreed to repeat the tests using the same protocol before publishing a final conclusion.'),
 Q(L('¿Qué se puede inferir sobre la diferencia entre los resultados?','Què es pot inferir sobre la diferència entre els resultats?','What can be inferred about the different results?'),
 O(['Uno de los laboratorios mintió','La temperatura podría haber influido en las mediciones','El nuevo material no almacena energía','Las pruebas no necesitan repetirse'],['Un dels laboratoris va mentir','La temperatura podria haver influït en les mesures','El nou material no emmagatzema energia','No cal repetir les proves'],['One laboratory lied','Temperature may have affected the measurements','The new material stores no energy','The tests need not be repeated']),1,
 L('La diferencia de temperatura es una posible explicación, todavía por comprobar.','La diferència de temperatura és una explicació possible, encara per comprovar.','The temperature difference is a possible explanation that still needs testing.')),
 Q(L('¿Por qué acordaron un protocolo común?','Per què van acordar un protocol comú?','Why did they agree on a common protocol?'),
 O(['Para eliminar la necesidad de medir','Para obtener siempre el resultado más alto','Para sustituir las muestras por opiniones','Para comparar resultados en condiciones equivalentes'],['Per a eliminar la necessitat de mesurar','Per a obtindre sempre el resultat més alt','Per a substituir les mostres per opinions','Per a comparar resultats en condicions equivalents'],['To avoid having to measure','To guarantee the highest result','To replace samples with opinions','To compare results under equivalent conditions']),3,

E('bach_model','bach','essential','philosophy',
 L('Modelos para comprender','Models per a comprendre','Models for understanding'),
 L('Un modelo científico es una representación deliberadamente simplificada de un sistema. Su utilidad no depende de reproducir todos los rasgos de la realidad, sino de seleccionar aquellos que permiten explicar ciertos fenómenos o formular predicciones comprobables. Un mapa del metro, por ejemplo, altera distancias y direcciones para mostrar con claridad las conexiones entre estaciones. Sería inadecuado para medir la longitud exacta de una calle, pero excelente para planificar un trayecto. De forma semejante, un modelo científico puede ser muy eficaz en un contexto y poco fiable en otro. Evaluarlo exige conocer sus supuestos, las evidencias que lo respaldan y las condiciones bajo las que deja de describir adecuadamente el sistema.',
 'Un model científic és una representació deliberadament simplificada d’un sistema. La seua utilitat no depén de reproduir tots els trets de la realitat, sinó de seleccionar els que permeten explicar certs fenòmens o formular prediccions comprovables. Un mapa del metro, per exemple, altera distàncies i direccions per a mostrar amb claredat les connexions entre estacions. Seria inadequat per a mesurar la longitud exacta d’un carrer, però excel·lent per a planificar un trajecte. De manera semblant, un model científic pot ser molt eficaç en un context i poc fiable en un altre. Avaluar-lo exigix conéixer-ne els supòsits, les evidències que el sostenen i les condicions en què deixa de descriure adequadament el sistema.',
 'A scientific model is a deliberately simplified representation of a system. Its usefulness does not depend on reproducing every feature of reality, but on selecting the features that make particular phenomena understandable or predictions testable. An underground railway map, for example, distorts distance and direction to show connections between stations clearly. It is unsuitable for measuring the exact length of a street but excellent for planning a journey. Similarly, a scientific model may work well in one context and poorly in another. Evaluating it requires understanding its assumptions, the evidence supporting it and the conditions under which it stops describing the system adequately.'),
 Q(L('¿Qué tesis sostiene el autor?','Quina tesi sosté l’autor?','What thesis does the author defend?'),
 O(['Un modelo solo es válido si reproduce todos los detalles','Los modelos sustituyen la observación','La utilidad de un modelo depende de su propósito y límites','Los modelos científicos deben parecerse a los mapas'],['Un model només és vàlid si reproduïx tots els detalls','Els models substituïxen l’observació','La utilitat d’un model depén del propòsit i dels límits','Els models científics han d’assemblar-se als mapes'],['A model is valid only if it reproduces every detail','Models replace observation','A model’s value depends on its purpose and limits','Scientific models must resemble maps']),2,
 L('El texto defiende la simplificación útil dentro de ciertos límites de aplicación.','El text defensa la simplificació útil dins de certs límits d’aplicació.','The passage supports useful simplification within defined limits.')),
 Q(L('¿Qué función tiene el ejemplo del plano del metro?','Quina funció té l’exemple del plànol del metro?','What is the purpose of the underground map example?'),
 O(['Ilustrar que una simplificación puede ser útil para una tarea','Defender que los mapas sustituyan a los experimentos','Mostrar que todas las distancias son arbitrarias','Probar que los modelos no necesitan evidencias'],['Il·lustrar que una simplificació pot ser útil per a una tasca','Defendre que els mapes substituïsquen els experiments','Mostrar que totes les distàncies són arbitràries','Provar que els models no necessiten evidències'],['To show how simplification can be useful for one task','To argue that maps replace experiments','To show that every distance is arbitrary','To prove that models need no evidence']),0,
 L('Sirve como analogía: pierde precisión espacial para ganar claridad funcional.','Servix com a analogia: perd precisió espacial per a guanyar claredat funcional.','It is an analogy: spatial accuracy is sacrificed for a practical purpose.'))),
E('bach_art','bach','essential','art',
 L('La restauración y la mirada','La restauració i la mirada','Restoration and interpretation'),
 L('Restaurar una obra de arte no equivale a devolverla sin más a un supuesto estado original. Los materiales envejecen de forma desigual, algunas partes se han perdido y las intervenciones anteriores pueden formar parte de la historia del objeto. Por ello, una restauración responsable documenta las decisiones, diferencia lo conservado de lo añadido y procura que las modificaciones puedan revisarse en el futuro. Existe, además, una tensión entre mejorar la legibilidad de la obra y respetar las huellas del tiempo. El objetivo no es borrar toda señal de deterioro, sino mantener un equilibrio razonado entre conservación, interpretación y transmisión del patrimonio a generaciones posteriores.',
 'Restaurar una obra d’art no equival simplement a tornar-la a un suposat estat original. Els materials envellixen de manera desigual, algunes parts s’han perdut i les intervencions anteriors poden formar part de la història de l’objecte. Per això, una restauració responsable documenta les decisions, diferencia allò que s’ha conservat d’allò que s’ha afegit i procura que les modificacions es puguen revisar en el futur. Hi ha, a més, una tensió entre millorar la llegibilitat de l’obra i respectar les petjades del temps. L’objectiu no és esborrar qualsevol senyal de deteriorament, sinó mantindre un equilibri raonat entre conservació, interpretació i transmissió del patrimoni a les generacions posteriors.',
 'Restoring a work of art is not simply a matter of returning it to an imagined original condition. Materials age differently, some parts have disappeared and earlier interventions may themselves be part of the object’s history. Responsible restoration therefore documents decisions, distinguishes surviving elements from additions and seeks to keep future revision possible. There is also tension between making the work easier to read and respecting the marks of time. The aim is not to remove every sign of deterioration, but to balance conservation, interpretation and the transmission of heritage to later generations.'),
 Q(L('¿Qué planteamiento resume mejor la postura del texto?','Quin plantejament resumix millor la postura del text?','Which statement best represents the passage?'),
 O(['Toda intervención anterior debe desaparecer','La restauración exige decisiones documentadas y equilibradas','El aspecto nuevo es siempre más auténtico','Toda restauración debe evitar añadir información'],['Tota intervenció anterior ha de desaparéixer','La restauració exigix decisions documentades i equilibrades','L’aspecte nou és sempre més autèntic','Tota restauració ha d’evitar afegir informació'],['Every previous intervention must be removed','Restoration requires documented, balanced decisions','A newer appearance is always more authentic','Restoration must never add information']),1,
 L('El autor presenta la restauración como una toma de decisiones responsable.','L’autor presenta la restauració com una presa de decisions responsable.','The author presents restoration as a process of responsible judgment.')),
 Q(L('¿Qué tensión identifica el autor?','Quina tensió identifica l’autor?','What tension does the author identify?'),
 O(['El precio y el transporte de la obra','La exposición y la venta','La autoría y el tamaño','La legibilidad y las huellas del tiempo'],['El preu i el transport de l’obra','L’exposició i la venda','L’autoria i la grandària','La llegibilitat i les petjades del temps'],['Price and transport','Exhibition and sale','Authorship and size','Readability and traces of time']),3,
 L('El texto expone explícitamente ese equilibrio entre hacerla legible y respetar su historia.','El text exposa explícitament l’equilibri entre fer-la llegible i respectar-ne la història.','It explicitly discusses the balance between clarity and historic traces.'))),
E('bach_wages','bach','infer','economy',
 L('Salarios y poder de compra','Salaris i poder de compra','Wages and purchasing power'),
 L('Una empresa anunció que había aumentado los salarios nominales de toda su plantilla un 4 % durante el último año. El comunicado afirmaba que, gracias a la medida, el conjunto de los trabajadores podía comprar ahora más bienes y servicios. Sin embargo, durante el mismo periodo los precios de la cesta de consumo utilizada como referencia habían subido un 6 %. Además, la evolución del gasto variaba entre hogares: unos destinaban más recursos a vivienda y otros a transporte o alimentación. La mejora nominal era un dato comprobable, pero la afirmación sobre el poder adquisitivo exigía distinguir entre cantidades monetarias y bienes que esas cantidades permiten adquirir.',
 'Una empresa va anunciar que havia augmentat els salaris nominals de tota la plantilla un 4 % durant l’últim any. El comunicat afirmava que, gràcies a la mesura, el conjunt dels treballadors podia comprar ara més béns i servicis. No obstant això, durant el mateix període els preus de la cistella de consum utilitzada com a referència havien pujat un 6 %. A més, l’evolució de la despesa variava entre llars: unes destinaven més recursos a vivenda i altres a transport o alimentació. La millora nominal era una dada comprovable, però l’afirmació sobre el poder adquisitiu exigia distingir entre quantitats monetàries i béns que eixes quantitats permeten adquirir.',
 'A company announced that nominal wages for all employees had risen by 4% over the previous year. Its statement claimed that employees could now buy more goods and services as a result. Over the same period, however, prices in the reference consumer basket had risen by 6%. Spending patterns also differed between households: some spent more on housing, others on transport or food. The nominal increase was verifiable, but the claim about purchasing power required distinguishing amounts of money from what that money can actually buy.'),
 Q(L('¿Qué conclusión está mejor fundamentada respecto a la cesta de referencia?','Quina conclusió està millor fonamentada respecte a la cistella de referència?','Which conclusion is best supported for the reference basket?'),

 L('El impacto sobre cada familia depende de los bienes y servicios que consuma.','L’impacte sobre cada família depén dels béns i servicis que consumix.','The effect depends on the goods and services each household buys.'))),
E('bach_correlation','bach','infer','science',
 L('El hábito y la nota','L’hàbit i la nota','The habit and the grade'),
 L('En una encuesta a estudiantes de Bachillerato se observó que quienes declaraban leer por placer varias veces a la semana obtenían, de media, calificaciones más altas que quienes leían con menor frecuencia. Un titular concluyó que leer novelas era la causa directa del rendimiento académico. Sin embargo, el estudio era observacional: no había asignado al azar hábitos lectores ni controlado todas las diferencias previas entre los grupos. El tiempo disponible, el entorno familiar y la motivación podían estar asociados tanto con la lectura como con las notas. Los investigadores sugirieron ampliar la muestra y realizar estudios complementarios antes de establecer una relación causal.',
 'En una enquesta a estudiants de Batxillerat es va observar que els qui declaraven llegir per plaer diverses vegades a la setmana obtenien, de mitjana, qualificacions més altes que els qui llegien menys sovint. Un titular va concloure que llegir novel·les era la causa directa del rendiment acadèmic. No obstant això, l’estudi era observacional: no havia assignat a l’atzar hàbits lectors ni havia controlat totes les diferències prèvies entre els grups. El temps disponible, l’entorn familiar i la motivació podien estar relacionats tant amb la lectura com amb les notes. Els investigadors van suggerir ampliar la mostra i fer estudis complementaris abans d’establir una relació causal.',
 'A survey of upper-secondary students found that those who reported reading for pleasure several times a week earned higher average grades than those who read less often. A headline concluded that reading novels directly caused better academic performance. However, the study was observational: reading habits had not been randomly assigned, nor had all previous differences between the groups been controlled. Free time, family background and motivation could be associated with both reading and grades. The researchers recommended a larger sample and further studies before establishing causation.'),
 Q(L('¿Qué problema presenta la conclusión del titular?','Quin problema presenta la conclusió del titular?','What is the problem with the headline’s conclusion?'),
 O(['Usa una muestra de estudiantes','Confunde una asociación observada con una causa demostrada','Reconoce que existen variables adicionales','Distingue entre medias de dos grupos'],['Utilitza una mostra d’estudiants','Confón una associació observada amb una causa demostrada','Reconeix que hi ha variables addicionals','Distinguix entre mitjanes de dos grups'],['It uses a sample of students','It mistakes an observed association for proven causation','It recognises other possible variables','It compares the averages of two groups']),1,
 L('El diseño observacional no permite atribuir por sí solo el resultado a la lectura.','El disseny observacional no permet atribuir per si sol el resultat a la lectura.','An observational design alone cannot establish that reading caused the difference.')),
 Q(L('¿Cuál de estas afirmaciones es compatible con el estudio sin exagerarlo?','Quina d’estes afirmacions és compatible amb l’estudi sense exagerar-lo?','Which statement is compatible with the study without overstating it?'),
 O(['Todos los buenos estudiantes leen novelas','Los libros son la única causa de las buenas notas','La motivación no influye nunca','La lectura frecuente se asoció con notas más altas en la muestra'],['Tots els bons estudiants lligen novel·les','Els llibres són l’única causa de les bones notes','La motivació no influïx mai','La lectura freqüent es va associar amb notes més altes en la mostra'],['Every high-achieving student reads novels','Books are the sole cause of high grades','Motivation never matters','Frequent reading was associated with higher grades in the sample']),3,
 L('Es la observación descrita; no transforma la asociación en causalidad.','És l’observació descrita; no convertix l’associació en causalitat.','This reports the observed association without claiming causation.')))
];

E('t_b_essay','bach','types','philosophy',
 L('La eficiencia como criterio','L’eficiència com a criteri','Efficiency as a criterion'),
 L('Un procedimiento puede ser eficiente y, sin embargo, resultar injusto. Reducir el tiempo de atención de un servicio público quizá permita tramitar más solicitudes, pero también puede impedir que algunas personas expliquen situaciones complejas. Por tanto, medir la calidad de una institución únicamente por la rapidez de sus procesos supone confundir un medio con un fin: el rendimiento administrativo no agota su responsabilidad social.',
 'Un procediment pot ser eficient i, tanmateix, resultar injust. Reduir el temps d’atenció d’un servici públic potser permeta tramitar més sol·licituds, però també pot impedir que algunes persones expliquen situacions complexes. Per tant, mesurar la qualitat d’una institució únicament per la rapidesa dels processos suposa confondre un mitjà amb un fi: el rendiment administratiu no esgota la seua responsabilitat social.',
 'A procedure may be efficient yet unfair. Reducing the time spent on each public-service request may allow more applications to be processed, but it may also prevent some people from explaining complex situations. Therefore, measuring an institution solely by the speed of its procedures confuses means with ends: administrative performance does not exhaust its social responsibility.'),
 Q(L('¿Qué organización discursiva predomina?','Quina organització discursiva predomina?','Which discourse structure predominates?'),

 L('Plantea la insuficiencia de un criterio, la ilustra y extrae una conclusión normativa.','Planteja la insuficiència d’un criteri, la il·lustra i n’extrau una conclusió normativa.','It questions the adequacy of a criterion, illustrates the problem and draws a normative conclusion.')),

 'Per a avaluar l’efecte de les zones verdes sobre la temperatura urbana, un equip va comparar mesures arreplegades en carrers amb diferent cobertura vegetal durant diverses setmanes. Els valors registrats en zones arbrades van ser, de mitjana, inferiors. Els investigadors advertixen, no obstant això, que l’orientació dels carrers i els materials del paviment també influïxen en els resultats; per això, les observacions no permeten atribuir tota la diferència exclusivament als arbres.',
 'To examine how green spaces affect urban temperatures, a team compared measurements taken over several weeks on streets with different amounts of vegetation. Temperatures in tree-lined areas were lower on average. However, the researchers note that street orientation and pavement materials also affect the results; therefore, the observations cannot attribute the entire difference to trees alone.'),

 L('Una decisión contingente','Una decisió contingent','A contingent decision'),

 'La decisió de tancar una plaça al trànsit no va ser inevitable: va dependre d’un acord polític i de determinades circumstàncies econòmiques. En un altre context podria haver-se adoptat una solució diferent. Per això, descriure-la com a contingent no significa que fora arbitrària, sinó que no estava predeterminada.',
 'The decision to close a square to traffic was not inevitable: it depended on a political agreement and particular economic circumstances. In a different context, another solution might have been adopted. Calling the decision contingent therefore does not mean it was arbitrary; rather, it was not predetermined.'),

 L('El texto distingue expresamente depender de circunstancias de actuar sin razones.','El text distingix expressament dependre de circumstàncies d’actuar sense raons.','The passage explicitly distinguishes dependence on circumstances from acting without reasons.'))),
E('v_b_epistemic','bach','vocab','science',
 L('Una cautela epistemológica','Una cautela epistemològica','An epistemic caution'),
 L('Una imagen obtenida por un telescopio puede parecer una representación directa del universo. Sin embargo, sus colores pueden depender de filtros y procedimientos de procesamiento de datos. Recordar esas mediaciones constituye una cautela epistemológica: invita a examinar cómo se produce el conocimiento antes de aceptar una imagen como reflejo inmediato de la realidad.',
 'Una imatge obtinguda per un telescopi pot semblar una representació directa de l’univers. Tanmateix, els colors poden dependre de filtres i procediments de tractament de dades. Recordar eixes mediacions constituïx una cautela epistemològica: convida a examinar com es produïx el coneixement abans d’acceptar una imatge com un reflex immediat de la realitat.',
 'An image taken by a telescope can appear to be a direct representation of the universe. Yet its colours may depend on filters and data-processing techniques. Recognising these steps is an epistemic caution: it invites us to examine how knowledge is produced before treating an image as an immediate reflection of reality.'),
 Q(L('¿A qué se refiere «epistemológica» en este contexto?','A què es referix «epistemològica» en este context?','What does “epistemic” refer to here?'),
 O(['A la estética de los colores','A cómo se obtiene y justifica el conocimiento','A la velocidad del telescopio','A la antigüedad de las imágenes'],['A l’estètica dels colors','A com s’obté i es justifica el coneixement','A la velocitat del telescopi','A l’antiguitat de les imatges'],['The aesthetic quality of colours','How knowledge is obtained and justified','The speed of the telescope','The age of the pictures']),1,
 L('La frase posterior a los dos puntos explica que se trata de examinar el proceso de conocer.','La frase posterior als dos punts explica que es tracta d’examinar el procés de conéixer.','The explanation after the colon points to how knowledge is produced.')),
 Q(L('¿Qué interpretación se ajusta mejor al pasaje?','Quina interpretació s’ajusta millor al fragment?','Which interpretation best fits the passage?'),
 O(['Las imágenes científicas son necesariamente falsas','Los telescopios nunca permiten conocer nada','Los colores son siempre irrelevantes','La interpretación científica requiere considerar cómo se obtuvieron los datos'],['Les imatges científiques són necessàriament falses','Els telescopis no permeten conéixer mai res','Els colors sempre són irrellevants','La interpretació científica requerix considerar com s’han obtingut les dades'],['Scientific images are always false','Telescopes never provide knowledge','Colours are always irrelevant','Scientific interpretation should consider how the data were obtained']),3,
 L('El texto no niega el valor de las imágenes: pide interpretar sus condiciones de producción.','El text no nega el valor de les imatges: demana interpretar-ne les condicions de producció.','The passage does not reject images; it calls for understanding how they were produced.')))

E('a_i_plant','init','listen','science',
 L('Las plantas del pasillo','Les plantes del corredor','The corridor plants'),
 L('En el pasillo del instituto hay tres plantas. El lunes, Nadia vio que una tenía las hojas caídas y la tierra seca. Su compañero quería añadir abono, pero ella propuso comprobar primero si necesitaba agua. Regaron la planta y la colocaron cerca de una ventana luminosa, sin sol directo. Dos días después, las hojas tenían mejor aspecto. Nadia escribió lo sucedido en su cuaderno, pero señaló que todavía no sabían cuál de los dos cambios había ayudado más.',
 'Al corredor de l’institut hi ha tres plantes. Dilluns, Nadia va vore que una tenia les fulles caigudes i la terra seca. El seu company volia afegir adob, però ella va proposar comprovar primer si necessitava aigua. Van regar la planta i la van posar prop d’una finestra lluminosa, sense sol directe. Dos dies després, les fulles tenien millor aspecte. Nadia va escriure el que havia passat en la llibreta, però va indicar que encara no sabien quin dels dos canvis havia ajudat més.',
 'There are three plants in the school corridor. On Monday, Nadia noticed that one had drooping leaves and dry soil. Her classmate wanted to add fertiliser, but she suggested checking whether it needed water first. They watered the plant and moved it near a bright window, away from direct sunlight. Two days later, the leaves looked healthier. Nadia wrote down what had happened, but noted that they still did not know which of the two changes had helped most.'),

E('a_i_bus','init','listen','daily',
 L('Un cambio en el autobús','Un canvi a l’autobús','A change on the bus'),
 L('Cada miércoles, Leo toma el autobús de las ocho para ir a la biblioteca municipal. Hoy encontró una nota en la parada: por unas obras, el autobús no pasaría por la plaza y utilizaría una calle paralela. El horario seguía siendo el mismo. Leo caminó hasta la parada provisional y llegó con tiempo. Una señora que esperaba en la plaza no había leído el aviso. Leo se lo explicó y ambos pudieron subir al autobús. Al llegar, la biblioteca todavía estaba cerrada y esperaron unos minutos.',
 'Cada dimecres, Leo agafa l’autobús de les huit per a anar a la biblioteca municipal. Hui va trobar una nota a la parada: per unes obres, l’autobús no passaria per la plaça i utilitzaria un carrer paral·lel. L’horari continuava sent el mateix. Leo va caminar fins a la parada provisional i va arribar amb temps. Una senyora que esperava a la plaça no havia llegit l’avís. Leo li ho va explicar i tots dos van poder pujar a l’autobús. En arribar, la biblioteca encara estava tancada i van esperar uns minuts.',

 Q(L('¿Por qué cambió la parada?','Per què va canviar la parada?','Why did the bus stop change?'),O(['Por unas obras','Por una fiesta local','Por un retraso','Por la lluvia'],['Per unes obres','Per una festa local','Per un retard','Per la pluja'],['Because of roadworks','Because of a local festival','Because of a delay','Because of rain']),0,L('El aviso atribuye el cambio de recorrido a unas obras.','L’avís atribuïx el canvi de recorregut a unes obres.','The notice links the new route to roadworks.')),

E('a_e1_heat','eso1','listen','science',
 L('Dos vasos de agua','Dos gots d’aigua','Two glasses of water'),
 L('Durante una actividad de ciencias, la profesora preparó dos vasos iguales con la misma cantidad de agua templada. Colocó uno sobre una mesa junto a la ventana y el otro dentro de una caja de cartón, lejos de la luz. Antes de empezar, el grupo midió la temperatura de ambos vasos y anotó el resultado. Quince minutos después repitieron la medición: el vaso de la ventana había perdido más temperatura. Algunos estudiantes concluyeron que el cartón siempre conserva mejor el calor. La profesora les recordó que habían comparado dos lugares diferentes y que, por tanto, también podían haber influido las corrientes de aire y la cercanía al cristal. Propuso repetir la prueba cambiando una sola condición cada vez. El grupo comprendió que observar una diferencia no basta para saber exactamente cuál es su causa.',
 'Durant una activitat de ciències, la professora va preparar dos gots iguals amb la mateixa quantitat d’aigua tèbia. En va posar un damunt d’una taula al costat de la finestra i l’altre dins d’una caixa de cartó, lluny de la llum. Abans de començar, el grup va mesurar la temperatura dels dos gots i va anotar el resultat. Quinze minuts després van repetir la mesura: el got de la finestra havia perdut més temperatura. Alguns estudiants van concloure que el cartó sempre conserva millor la calor. La professora els va recordar que havien comparat dos llocs diferents i que, per tant, també podien haver influït els corrents d’aire i la proximitat al vidre. Va proposar repetir la prova canviant una única condició cada vegada. El grup va comprendre que observar una diferència no és suficient per a saber-ne exactament la causa.',
 'During a science lesson, the teacher prepared two identical glasses containing the same amount of warm water. She placed one on a table beside the window and the other inside a cardboard box, away from the light. Before starting, the class measured the temperature of both glasses and recorded the results. Fifteen minutes later, they measured again: the glass by the window had cooled more. Some students concluded that cardboard always keeps heat in better. The teacher reminded them that they had compared two different places, so draughts and the proximity of the glass window might also have influenced the results. She suggested repeating the investigation while changing just one condition at a time. The group understood that noticing a difference does not automatically reveal its exact cause.'),
 Q(L('¿Qué se mantuvo igual al comenzar?','Què es va mantindre igual al començament?','What was kept the same at the start?'),O(['El lugar de los vasos','La cantidad de agua y los vasos','La exposición al viento','La distancia a la ventana'],['El lloc dels gots','La quantitat d’aigua i els gots','L’exposició al vent','La distància a la finestra'],['Where the glasses were placed','The amount of water and the glasses','Exposure to wind','Distance from the window']),1,L('Los vasos eran iguales y contenían la misma cantidad de agua.','Els gots eren iguals i contenien la mateixa quantitat d’aigua.','The glasses were identical and held equal quantities of water.')),
 Q(L('¿Por qué la conclusión sobre el cartón era precipitada?','Per què la conclusió sobre el cartó era precipitada?','Why was the conclusion about cardboard premature?'),O(['Porque el agua no se enfría','Porque se midieron demasiadas veces','Porque variaron varias condiciones','Porque el cartón produce calor'],['Perquè l’aigua no es refreda','Perquè van mesurar massa vegades','Perquè van variar diverses condicions','Perquè el cartó produïx calor'],['Because water cannot cool','Because they measured too often','Because several conditions differed','Because cardboard produces heat']),2,L('La posición junto a la ventana también podía afectar al resultado.','La posició al costat de la finestra també podia afectar el resultat.','The different positions near and away from a window could affect cooling.')),
 Q(L('¿Qué mejora propuso la profesora?','Quina millora va proposar la professora?','What improvement did the teacher propose?'),O(['Cambiar una condición cada vez','Usar vasos de tamaños distintos','No medir temperaturas','Hacer la prueba una sola vez'],['Canviar una condició cada vegada','Usar gots de grandàries diferents','No mesurar temperatures','Fer la prova una única vegada'],['Change one condition at a time','Use differently sized glasses','Avoid measuring temperature','Run the test only once']),0,L('Controlar las condiciones ayuda a identificar qué causa un efecto.','Controlar les condicions ajuda a identificar què causa un efecte.','Controlling conditions helps establish what causes an effect.'))),
E('a_e1_museum','eso1','listen','history',
 L('La carta del museo','La carta del museu','The museum letter'),
 L('Un museo local recibió una carta escrita hace más de cien años por una joven que vivía en el pueblo. En ella contaba que el tren había facilitado los viajes a la ciudad, aunque los billetes seguían siendo caros para muchas familias. También decía que algunas tiendas vendían ahora productos antes difíciles de conseguir. El museo preparó una exposición y quiso titularla «El tren mejoró la vida de todos». Sin embargo, durante la revisión, una investigadora advirtió que la carta describía la experiencia de una sola persona, no la de todo el vecindario. El equipo modificó el título por «Cambios y desigualdades con la llegada del tren». Añadió además documentos sobre salarios y precios de la época. De este modo, los visitantes podrían comparar testimonios y comprender que una innovación puede producir beneficios distintos según las circunstancias de cada grupo.',
 'Un museu local va rebre una carta escrita feia més de cent anys per una jove que vivia al poble. Contava que el tren havia facilitat els viatges a la ciutat, encara que els bitllets continuaven sent cars per a moltes famílies. També deia que algunes botigues venien ara productes que abans eren difícils d’aconseguir. El museu va preparar una exposició i va voler titular-la «El tren va millorar la vida de tots». Però, durant la revisió, una investigadora va advertir que la carta descrivia l’experiència d’una sola persona, no la de tot el veïnat. L’equip va canviar el títol per «Canvis i desigualtats amb l’arribada del tren». També va afegir documents sobre salaris i preus de l’època. Així, els visitants podrien comparar testimonis i entendre que una innovació pot aportar beneficis diferents segons les circumstàncies de cada grup.',
 'A local museum received a letter written over a hundred years ago by a young woman who lived in the town. She wrote that the railway had made travelling to the city easier, although tickets remained expensive for many families. She also said that shops were selling goods that had previously been hard to find. The museum planned an exhibition and considered calling it “The railway improved life for everyone”. During the review, however, a researcher pointed out that the letter described just one person’s experience, not that of the entire community. The team changed the title to “Change and inequality after the arrival of the railway”. They also added documents showing wages and prices at the time. Visitors could then compare sources and understand that the benefits of innovation may vary between different groups.'),
 Q(L('¿Qué ventaja del tren menciona la carta?','Quin avantatge del tren esmenta la carta?','Which railway benefit does the letter mention?'),O(['Los viajes a la ciudad eran más fáciles','Todos viajaban gratis','Desaparecieron las tiendas','Dejaron de existir otras rutas'],['Els viatges a la ciutat eren més fàcils','Tothom viatjava debades','Van desaparéixer les botigues','Van deixar d’existir altres rutes'],['Travel to the city became easier','Everyone travelled for free','Shops disappeared','Other routes stopped existing']),0,L('La autora menciona expresamente que facilitó los viajes.','L’autora diu expressament que va facilitar els viatges.','The author explicitly says that travel became easier.')),
 Q(L('¿Por qué cambiaron el primer título?','Per què van canviar el primer títol?','Why did they change the original title?'),O(['Porque la carta era falsa','Porque generalizaba a partir de un solo testimonio','Porque el tren no llegó','Porque faltaba una fecha'],['Perquè la carta era falsa','Perquè generalitzava a partir d’un sol testimoni','Perquè el tren no va arribar','Perquè faltava una data'],['Because the letter was fake','Because it generalised from one account','Because the railway never arrived','Because a date was missing']),1,L('La experiencia de una persona no permite asegurar que todos se beneficiaron.','L’experiència d’una persona no permet assegurar que tots es van beneficiar.','A single account cannot justify a claim about everyone.')),
 Q(L('¿Para qué añadieron salarios y precios?','Per a què van afegir salaris i preus?','Why did they add wage and price records?'),O(['Para decorar la sala','Para sustituir la carta','Para contrastar la información','Para anunciar billetes'],['Per a decorar la sala','Per a substituir la carta','Per a contrastar la informació','Per a anunciar bitllets'],['To decorate the room','To replace the letter','To compare different evidence','To advertise tickets']),2,L('Los documentos ofrecen contexto para interpretar el testimonio.','Els documents aporten context per a interpretar el testimoni.','The records provide evidence to put the personal account into context.'))),
E('a_e2_data','eso2','listen','math',
 L('Una estadística engañosa','Una estadística enganyosa','A misleading statistic'),
 L('En una reunión del consejo escolar se presentó una encuesta sobre el uso de la bicicleta. Según el informe, el ochenta por ciento del alumnado encuestado quería más aparcabicicletas. La cifra parecía demostrar que el cambio era una prioridad para casi todo el centro. Sin embargo, una alumna preguntó cómo se había recogido la información. El responsable explicó que el formulario se había difundido exclusivamente en un grupo de mensajería utilizado por quienes participaban en las rutas ciclistas del instituto. Solo respondieron cincuenta personas, aunque en el centro estudiaban varios cientos. Nadie había impedido que contestaran otros estudiantes, pero muchos ni siquiera conocían el cuestionario. La alumna señaló que la muestra no representaba necesariamente a toda la comunidad escolar. El equipo decidió repetir la consulta por clases, ofreciendo el mismo acceso a todos los grupos y publicando por separado el número de respuestas. Aunque el nuevo porcentaje resultara inferior, eso no demostraría que los aparcabicicletas fueran innecesarios; solo permitiría conocer mejor cuántas personas los consideraban prioritarios. El consejo también propuso observar cuántas bicicletas se aparcaban actualmente y si existían problemas de seguridad. Así, la decisión combinaría opiniones y datos sobre necesidades reales.',
 'En una reunió del consell escolar es va presentar una enquesta sobre l’ús de la bicicleta. Segons l’informe, el huitanta per cent de l’alumnat enquestat volia més aparcabicicletes. La xifra semblava demostrar que el canvi era una prioritat per a quasi tot el centre. Tanmateix, una alumna va preguntar com s’havia arreplegat la informació. El responsable va explicar que el formulari s’havia difós exclusivament en un grup de missatgeria utilitzat pels qui participaven en les rutes ciclistes de l’institut. Només van respondre cinquanta persones, encara que al centre estudiaven uns quants centenars. Ningú no havia impedit que contestaren altres estudiants, però molts ni tan sols coneixien el qüestionari. L’alumna va assenyalar que la mostra no representava necessàriament tota la comunitat escolar. L’equip va decidir repetir la consulta per classes, oferint el mateix accés a tots els grups i publicant per separat el nombre de respostes. Encara que el nou percentatge fora inferior, això no demostraria que els aparcabicicletes foren innecessaris; només permetria conéixer millor quantes persones els consideraven prioritaris. El consell també va proposar observar quantes bicicletes s’aparcaven en aquell moment i si hi havia problemes de seguretat. Així, la decisió combinaria opinions i dades sobre necessitats reals.',
 'At a school council meeting, students presented a survey about cycling. According to the report, eighty per cent of respondents wanted more bicycle racks. That figure seemed to show that the change was a priority for almost the entire school. However, one student asked how the information had been collected. The organiser explained that the form had been shared only in a messaging group used by students who joined the school cycling routes. Just fifty people responded, although several hundred students attended the school. Nobody had actively prevented others from replying, but many had never heard about the survey. The student pointed out that the sample did not necessarily represent the whole school community. The team decided to repeat the survey in each class, giving all groups equal access and publishing the response totals. Even if the new percentage was lower, that would not prove bicycle racks were unnecessary; it would simply provide a better estimate of how many students considered them a priority. The council also suggested counting bicycles currently parked at school and checking for safety problems. In this way, decisions could combine people’s opinions with evidence of actual needs.'),
 Q(L('¿Qué problema principal tenía la primera encuesta?','Quin problema principal tenia la primera enquesta?','What was the main problem with the first survey?'),O(['La pregunta era demasiado larga','Se difundió entre un grupo especialmente interesado','No incluía porcentajes','Nadie sabía contar respuestas'],['La pregunta era massa llarga','Es va difondre entre un grup especialment interessat','No incloïa percentatges','Ningú sabia comptar les respostes'],['The question was too long','It was circulated among an interested group','It contained no percentages','Nobody could count the responses']),1,L('Se difundió solo en el grupo de rutas ciclistas; la muestra podía estar sesgada.','Es va difondre només en el grup de rutes ciclistes; la mostra podia estar esbiaixada.','Sharing the survey with a cycling group could bias the sample.')),
