 O(['Los gustos de toda la clase','El menú previsto para el viernes','La comida favorita del colegio','El plato mejor valorado del año'],['Els gustos de tota la classe','El menú previst per a divendres','El menjar favorit de l’escola','El plat més valorat de l’any'],['Everyone’s favourite school lunch','The meal planned for Friday','The school’s most popular food','The highest-rated dish of the year']),1,
 L('El cartel informa de lo programado, pero no mide las preferencias de nadie.','El cartell informa del que està previst, però no mesura preferències.','The notice states the planned meal but does not measure preferences.'))),
E('c_i_photo','init','critical','society',
 L('La foto de la plaza','La foto de la plaça','The photo of the square'),
 L('Alguien compartió una foto de la plaza llena de papeles y escribió: «Siempre está sucia». Marta preguntó cuándo se había tomado. La persona respondió que era una imagen del día anterior, justo después de una fiesta. Nadie había visitado todavía la plaza esa mañana.',
 'Algú va compartir una foto de la plaça plena de papers i va escriure: «Sempre està bruta». Marta va preguntar quan s’havia fet. La persona va respondre que era una imatge del dia anterior, just després d’una festa. Ningú no havia visitat encara la plaça aquell matí.',
 'Someone shared a photo of the square covered in litter and wrote, “It is always dirty.” Marta asked when it had been taken. The person replied that it was a picture from the previous day, just after a festival. Nobody had visited the square that morning yet.'),
 Q(L('¿Qué demuestra realmente la fotografía?','Què demostra realment la fotografia?','What does the photograph actually show?'),
 O(['Que ayer había papeles en la plaza','Que hoy sigue toda la plaza sucia','Que nadie limpia nunca la plaza','Que todas las fiestas dejan basura'],['Que ahir hi havia papers a la plaça','Que hui tota la plaça continua bruta','Que ningú no neteja mai la plaça','Que totes les festes deixen brutícia'],['There was litter in the square yesterday','The square is still dirty today','The square is never cleaned','Every festival leaves litter behind']),0,
 L('Una imagen de ayer documenta aquel momento, no la situación permanente.','Una imatge d’ahir documenta aquell moment, no una situació permanent.','A photo from yesterday documents that moment, not an ongoing condition.')),
 Q(L('¿Qué convendría hacer antes de hablar del estado actual?','Què convindria fer abans de parlar de l’estat actual?','What would help before describing today’s conditions?'),
 O(['Preguntar cuántos compartieron la foto','Contar las fiestas del último año','Buscar comentarios sobre la plaza','Comprobar cómo está la plaza hoy'],['Preguntar quants han compartit la foto','Comptar les festes de l’últim any','Buscar comentaris sobre la plaça','Comprovar com està la plaça hui'],['Ask how many shared the photograph','Count last year’s festivals','Look for comments about the square','Check the square’s condition today']),3,
 L('Para afirmar algo sobre el presente se necesita información actual.','Per a afirmar alguna cosa sobre el present cal informació actual.','A claim about today needs current evidence.'))),
E('c_i_survey','init','critical','math',
 L('La encuesta de los libros','L’enquesta dels llibres','The book survey'),
 L('En una clase de treinta alumnos, doce respondieron a una encuesta sobre su lectura favorita. Nueve de esos doce eligieron cómics y tres eligieron cuentos. El titular del tablón decía: «Toda la clase prefiere los cómics». La profesora pidió revisar si ese titular describía bien los datos.',
 'En una classe de trenta alumnes, dotze van respondre una enquesta sobre la lectura favorita. Nou d’eixos dotze van triar còmics i tres van triar contes. El titular del tauler deia: «Tota la classe preferix els còmics». La professora va demanar revisar si el titular descrivia bé les dades.',
 'In a class of thirty students, twelve answered a survey about their favourite reading. Nine of those twelve chose comics, and three chose stories. A noticeboard headline said, “The whole class prefers comics.” The teacher asked the class whether the headline represented the figures fairly.'),
 Q(L('¿Qué afirmación coincide con los datos recogidos?','Quina afirmació coincidix amb les dades arreplegades?','Which statement matches the collected data?'),
 O(['Nueve de los treinta eligieron cuentos','Doce alumnos prefirieron los cómics','Nueve de los encuestados eligieron cómics','Todos los alumnos contestaron la encuesta'],['Nou dels trenta van triar contes','Dotze alumnes van preferir els còmics','Nou dels enquestats van triar còmics','Tots els alumnes van contestar l’enquesta'],['Nine of the thirty chose stories','Twelve students preferred comics','Nine survey respondents chose comics','Every student answered the survey']),2,
 L('Respondieron doce alumnos y nueve de ellos escogieron cómics.','Van respondre dotze alumnes i nou van triar còmics.','Twelve students responded and nine of them chose comics.')),
 Q(L('¿Por qué resulta exagerado el titular del tablón?','Per què resulta exagerat el titular del tauler?','Why does the noticeboard headline overstate the result?'),
 O(['Solo se conoce la opinión de doce','Se han contado mal los nueve votos','Se ha preguntado por demasiados libros','Solo había tres opciones de lectura'],['Sols es coneix l’opinió de dotze','S’han comptat mal els nou vots','S’ha preguntat per massa llibres','Només hi havia tres opcions de lectura'],['Only twelve students’ choices are known','The nine votes were counted wrongly','Too many books were included','There were only three reading choices']),0,
 L('Los dieciocho alumnos que no respondieron podrían tener otras preferencias.','Els díhuit alumnes que no van respondre podrien tindre altres preferències.','The eighteen non-respondents may have different preferences.'))),
E('c_1_ad','eso1','critical','technology',
 L('Una recomendación patrocinada','Una recomanació patrocinada','A sponsored recommendation'),
 L('Un creador publica un vídeo sobre unos auriculares y afirma que suenan mejor que todos los modelos anteriores. Al principio aparece una etiqueta pequeña: «Colaboración pagada». El vídeo muestra la comodidad del producto, pero no presenta pruebas comparativas de sonido ni indica qué otros auriculares ha evaluado.',
 'Un creador publica un vídeo sobre uns auriculars i afirma que sonen millor que tots els models anteriors. Al principi apareix una etiqueta menuda: «Col·laboració pagada». El vídeo mostra la comoditat del producte, però no presenta proves comparatives de so ni indica quins altres auriculars ha avaluat.',
 'A creator posts a video about headphones and claims they sound better than every earlier model. A small label at the start reads “Paid partnership”. The video demonstrates their comfort but provides no comparative sound tests and does not say which other headphones were evaluated.'),
 Q(L('¿Qué información invita a examinar la recomendación con cautela?','Quina informació convida a examinar la recomanació amb cautela?','Which detail calls for caution about the recommendation?'),
 O(['El vídeo explica cómo se colocan','La marca ha pagado la colaboración','Los auriculares se pueden llevar','Se menciona la comodidad del producto'],['El vídeo explica com es col·loquen','La marca ha pagat la col·laboració','Els auriculars es poden portar','Es menciona la comoditat del producte'],['The video explains how to wear them','The brand paid for the partnership','The headphones can be worn','The creator mentions their comfort']),1,
 L('El patrocinio es relevante para valorar posibles intereses, aunque no demuestra que la opinión sea falsa.','El patrocini és rellevant per a valorar possibles interessos, però no demostra que l’opinió siga falsa.','Sponsorship is relevant to potential interests, though it does not itself make the claim false.')),
 Q(L('¿Qué faltaría para sostener la afirmación sobre el sonido?','Què faltaria per a sostindre l’afirmació sobre el so?','What is missing to support the claim about sound?'),
 O(['Una etiqueta con el nombre del canal','Un vídeo que muestre su embalaje','Más comentarios sobre su diseño','Pruebas comparables con otros modelos'],['Una etiqueta amb el nom del canal','Un vídeo que mostre l’embalatge','Més comentaris sobre el disseny','Proves comparables amb altres models'],['A label showing the channel name','A video showing the packaging','More comments about the design','Comparable tests against other models']),3,
 L('La superioridad del sonido exige medidas o pruebas de comparación, no una demostración de comodidad.','La superioritat del so exigix mesures o proves comparatives, no una demostració de comoditat.','Sound superiority needs comparative evidence, not a comfort demonstration.'))),
E('c_1_library','eso1','critical','society',
 L('La biblioteca y el silencio','La biblioteca i el silenci','The library and noise'),
 L('En septiembre, la biblioteca instaló paneles para reducir el ruido. Ese mes también amplió el horario de vigilancia. En octubre, las quejas por conversaciones fuertes pasaron de veinte a doce. El responsable escribió que los paneles habían causado toda la mejora. Una alumna señaló que habían cambiado dos cosas a la vez.',
 'Al setembre, la biblioteca va instal·lar panells per a reduir el soroll. Eixe mes també va ampliar l’horari de vigilància. A l’octubre, les queixes per converses fortes van passar de vint a dotze. El responsable va escriure que els panells havien causat tota la millora. Una alumna va assenyalar que havien canviat dos coses alhora.',
 'In September, the library installed panels to reduce noise. That month it also extended staff supervision hours. In October, complaints about loud conversations fell from twenty to twelve. The manager wrote that the panels had caused the entire improvement. A student pointed out that two things had changed at once.'),
 Q(L('¿Qué conclusión está apoyada por las cifras?','Quina conclusió està avalada per les xifres?','Which conclusion is supported by the figures?'),
 O(['Las quejas bajaron de veinte a doce','Los paneles evitaron todas las quejas','La vigilancia dejó de ser necesaria','La biblioteca duplicó sus visitantes'],['Les queixes van baixar de vint a dotze','Els panells van evitar totes les queixes','La vigilància va deixar de ser necessària','La biblioteca va duplicar els visitants'],['Complaints fell from twenty to twelve','The panels prevented every complaint','Staff supervision became unnecessary','Library visits doubled that month']),0,
 L('Se observa un descenso de ocho quejas; el texto no atribuye su causa de forma exclusiva.','S’observa un descens de huit queixes; el text no n’atribuïx la causa de manera exclusiva.','Eight fewer complaints were recorded; their sole cause was not established.')),
 Q(L('¿Qué limita la explicación del responsable?','Què limita l’explicació del responsable?','What weakens the manager’s explanation?'),
 O(['Las quejas se contaron en octubre','Los paneles ocupan espacio físico','La vigilancia también fue modificada','Las conversaciones seguían siendo posibles'],['Les queixes es van comptar a l’octubre','Els panells ocupen espai físic','La vigilància també es va modificar','Les converses continuaven sent possibles'],['Complaints were counted in October','The panels occupy physical space','Supervision hours were also changed','Conversations were still physically possible']),2,
 L('No se puede atribuir toda la reducción a un cambio si otro cambio ocurrió simultáneamente.','No es pot atribuir tota la reducció a un canvi si n’hi hagué un altre alhora.','The effect of the panels cannot be isolated when supervision changed too.'))),
E('c_1_message','eso1','critical','technology',
 L('El aviso que circula','L’avís que circula','The message going around'),
 L('Circula por un grupo una captura que dice: «Mañana se suspenden las clases». No aparece la fecha del supuesto comunicado ni la entidad que lo firma. Un compañero afirma que debe ser verdadero porque lo han reenviado muchas personas. La web del centro todavía no ha publicado ninguna comunicación al respecto.',
 'Circula per un grup una captura que diu: «Demà se suspenen les classes». No apareix la data del suposat comunicat ni l’entitat que el firma. Un company afirma que deu ser veritat perquè l’han reenviat moltes persones. El web del centre encara no ha publicat cap comunicació sobre això.',
 'A screenshot circulates in a group chat saying, “Classes are cancelled tomorrow.” It has neither a date nor the name of the issuing organisation. A classmate says it must be true because many people have forwarded it. The school website has not published any announcement about the matter.'),
 Q(L('¿Qué actuación sería más adecuada antes de difundirlo?','Quina actuació seria més adequada abans de difondre’l?','What should students do before forwarding it?'),
 O(['Preguntar cuántos contactos lo creen','Revisar una comunicación oficial actual','Cambiar el mensaje por otro más claro','Esperar a que tenga más reenvíos'],['Preguntar quants contactes s’ho creuen','Revisar una comunicació oficial actual','Canviar el missatge per un altre més clar','Esperar que tinga més reenviaments'],['Ask how many contacts believe it','Check a current official announcement','Rewrite the message more clearly','Wait until more people forward it']),1,
 L('Una fuente oficial y actual permite comprobar la información mejor que una captura sin autoría ni fecha.','Una font oficial i actual permet comprovar la informació millor que una captura sense autoria ni data.','A current official source is more reliable than an unattributed, undated screenshot.')),
 Q(L('¿Por qué no demuestra nada decisivo el número de reenvíos?','Per què el nombre de reenviaments no demostra res decisiu?','Why does the forwarding count prove little?'),
 O(['Porque todos conocen al autor original','Porque la captura se ve con poca nitidez','Porque solo se lee en algunos teléfonos','Porque la difusión no verifica el contenido'],['Perquè tots coneixen l’autor original','Perquè la captura es veu poc nítida','Perquè sols es llig en alguns telèfons','Perquè la difusió no verifica el contingut'],['Because everyone knows the original author','Because the screenshot may look blurry','Because some phones cannot show it','Because popularity does not verify accuracy']),3,
 L('Repetir una afirmación no la convierte en un hecho comprobado.','Repetir una afirmació no la convertix en un fet comprovat.','Repetition does not turn an unverified claim into a verified fact.'))),
E('c_2_graph','eso2','critical','science',
 L('El gráfico recortado','El gràfic retallat','The cropped graph'),
 L('Una publicación muestra el consumo eléctrico de una ciudad: 98 unidades en 2022 y 101 en 2023. El gráfico tiene el eje vertical recortado y comienza en 97, por lo que la segunda barra parece varias veces más alta que la primera. El titular afirma: «El consumo se ha multiplicado». La diferencia real es de tres unidades respecto de una base de 98.',
 'Una publicació mostra el consum elèctric d’una ciutat: 98 unitats el 2022 i 101 el 2023. El gràfic té l’eix vertical retallat i comença en 97, de manera que la segona barra pareix diverses vegades més alta que la primera. El titular afirma: «El consum s’ha multiplicat». La diferència real és de tres unitats sobre una base de 98.',
 'A post shows a city’s electricity use: 98 units in 2022 and 101 in 2023. The bar chart’s vertical axis starts at 97, making the second bar appear several times taller than the first. The headline reads, “Consumption has multiplied.” The actual difference is three units relative to a starting value of 98.'),
 Q(L('¿Qué problema presenta la representación visual?','Quin problema presenta la representació visual?','What is misleading about the graphic?'),
 O(['Muestra dos años seguidos en el tiempo','Utiliza valores expresados en unidades','Amplifica visualmente un cambio pequeño','Compara consumos de una sola ciudad'],['Mostra dos anys seguits en el temps','Utilitza valors expressats en unitats','Amplifica visualment un canvi menut','Compara consums d’una sola ciutat'],['It shows two consecutive calendar years','It uses figures expressed in units','It visually exaggerates a small change','It compares consumption in one city']),2,
 L('El recorte del eje vertical exagera la proporción aparente entre las barras.','El retall de l’eix vertical exagera la proporció aparent entre les barres.','The truncated vertical axis exaggerates the apparent contrast.')),
 Q(L('¿Cuál sería una descripción cuantitativa adecuada?','Quina seria una descripció quantitativa adequada?','Which quantitative description would be accurate?'),
 O(['Subió tres unidades, alrededor de un 3 %','Se duplicó al pasar de 98 a 101','Aumentó un 101 % en solo un año','Cayó ligeramente respecto al año previo'],['Va pujar tres unitats, prop d’un 3 %','Es va duplicar en passar de 98 a 101','Va augmentar un 101 % en un any','Va baixar lleugerament respecte a l’any anterior'],['It rose three units, roughly 3%','It doubled from 98 to 101','It rose by 101% in one year','It fell slightly from the year before']),0,
 L('La variación relativa es 3/98, aproximadamente el 3,06 %, no una multiplicación por dos.','La variació relativa és 3/98, aproximadament un 3,06 %, no una duplicació.','The relative increase is 3/98, approximately 3.06%, not a doubling.'))),
E('c_2_choice','eso2','critical','society',
 L('Dos opciones que no agotan el debate','Dos opcions que no esgoten el debat','Two options are not the whole debate'),
 L('En una reunión del instituto, alguien sostuvo: «O prohibimos totalmente los móviles o renunciamos a enseñar un uso responsable». Otros participantes propusieron que se guardaran durante ciertas clases y se usaran en proyectos supervisados. La primera intervención insistió en que solo existían dos caminos, aunque las propuestas posteriores combinaban normas y aprendizaje.',
 'En una reunió de l’institut, algú va sostindre: «O prohibim totalment els mòbils o renunciem a ensenyar-ne un ús responsable». Altres participants van proposar que es guardaren durant algunes classes i s’usaren en projectes supervisats. La primera intervenció insistí que sols hi havia dos camins, encara que les propostes posteriors combinaven normes i aprenentatge.',
 'At a school meeting, someone argued, “Either we ban phones completely or we give up teaching responsible use.” Other participants suggested keeping phones away during some lessons but using them in supervised projects. The original speaker insisted there were only two paths, even though the later suggestions combined rules with learning.'),
 Q(L('¿Qué debilidad lógica tiene el argumento inicial?','Quina feblesa lògica té l’argument inicial?','What is the weakness in the initial argument?'),
 O(['Ofrece demasiado contexto sobre las clases','Presenta dos salidas como si fueran únicas','Describe el uso supervisado de móviles','Reconoce diferencias entre asignaturas'],['Oferix massa context sobre les classes','Presenta dos eixides com si foren úniques','Descriu l’ús supervisat de mòbils','Reconeix diferències entre assignatures'],['It gives too much classroom context','It treats two options as exhaustive','It describes supervised phone use','It recognises differences between subjects']),1,
 L('Es un falso dilema: el propio texto presenta alternativas intermedias.','És un fals dilema: el mateix text presenta alternatives intermèdies.','It is a false dilemma: the text itself provides intermediate alternatives.')),
 Q(L('¿Qué postura contradice que solo existan dos caminos?','Quina postura contradiu que sols hi haja dos camins?','Which position challenges the claim of only two options?'),
 O(['Dejar los móviles siempre disponibles','Eliminar cualquier actividad digital','Mantener la prohibición sin excepciones','Combinar límites con usos supervisados'],['Deixar els mòbils sempre disponibles','Eliminar qualsevol activitat digital','Mantindre la prohibició sense excepcions','Combinar límits amb usos supervisats'],['Make phones available at all times','Remove every digital classroom activity','Keep a ban without exceptions','Combine restrictions with supervised uses']),3,
 L('La combinación de restricciones y aprendizaje demuestra que existen más posibilidades.','La combinació de restriccions i aprenentatge demostra que hi ha més possibilitats.','Combining restrictions with learning shows that other approaches exist.'))),
E('c_2_seeds','eso2','critical','science',
 L('Semillas y conclusiones','Llavors i conclusions','Seeds and conclusions'),
 L('Un grupo sembró doce semillas de la misma especie: seis recibieron una solución nutritiva y seis solo agua. Tras una semana, cuatro plantas del primer grupo habían germinado, frente a tres del segundo. La clase concluyó que el producto garantiza más germinación en cualquier cultivo. No se repitió el ensayo y no se midieron posibles diferencias de temperatura, luz o humedad entre las macetas.',
 'Un grup va sembrar dotze llavors de la mateixa espècie: sis van rebre una solució nutritiva i sis sols aigua. Després d’una setmana, quatre plantes del primer grup havien germinat, davant de tres del segon. La classe va concloure que el producte garantix més germinació en qualsevol cultiu. No es va repetir l’assaig ni es van mesurar possibles diferències de temperatura, llum o humitat entre els tests.',
 'A class planted twelve seeds of one species: six received a nutrient solution and six received only water. After one week, four seeds in the first group had germinated, compared with three in the second. The class concluded that the product guarantees more germination in any crop. The trial was not repeated, and possible differences in light, humidity or temperature were not recorded.'),
 Q(L('¿Qué conclusión se ajusta mejor al experimento descrito?','Quina conclusió s’ajusta millor a l’experiment descrit?','Which conclusion best fits the experiment?'),
 O(['La solución funciona en cualquier especie','El agua impide germinar a las semillas','Hubo una germinación más en ese grupo','Las condiciones fueron idénticas en ambos'],['La solució funciona en qualsevol espècie','L’aigua impedix germinar les llavors','Hi hagué una germinació més en eixe grup','Les condicions van ser idèntiques en els dos'],['The solution works for every species','Water prevents seeds from germinating','One more seed germinated in that group','Conditions were identical for both groups']),2,
 L('El resultado observado fue cuatro frente a tres; no demuestra una garantía general.','El resultat observat fou quatre davant de tres; no demostra cap garantia general.','The observed result was four versus three; it does not establish a universal guarantee.')),
 Q(L('¿Qué mejora aportaría más solidez a la conclusión?','Quina millora donaria més solidesa a la conclusió?','Which improvement would strengthen the conclusion?'),
 O(['Repetir con más semillas y controlar condiciones','Hacer el cartel del ensayo más llamativo','Reunir solo los casos de mayor crecimiento','Cambiar los nombres asignados a los grupos'],['Repetir amb més llavors i controlar condicions','Fer més atractiu el cartell de l’assaig','Reunir només els casos de més creixement','Canviar els noms assignats als grups'],['Repeat with more seeds and controlled conditions','Make the experiment poster more attractive','Keep only the fastest-growing examples','Rename the two experimental groups']),0,
 L('Más repeticiones y control de variables ayudan a distinguir un efecto real de variaciones casuales.','Més repeticions i control de variables ajuden a distingir un efecte real de variacions casuals.','Replication and variable control help distinguish an effect from chance variation.'))),
E('c_b_volunteer','bach','critical','society',
 L('Una encuesta de transporte','Una enquesta de transport','A transport survey'),
 L('El ayuntamiento publicó una consulta digital sobre una nueva línea de autobús. Participaron voluntariamente 800 personas; el 72 % apoyó el proyecto. El anuncio oficial afirmó: «Siete de cada diez habitantes están a favor». No se informó de cuántos residentes conocieron la encuesta ni de si las respuestas representaban las edades, los barrios y las necesidades de movilidad de toda la población. La cifra describía a quienes contestaron, pero su extrapolación requería examinar el método de selección.',
 'L’ajuntament va publicar una consulta digital sobre una nova línia d’autobús. Hi participaren voluntàriament 800 persones; el 72 % va donar suport al projecte. L’anunci oficial afirmà: «Set de cada deu habitants hi estan a favor». No es va informar de quants residents coneixien l’enquesta ni de si les respostes representaven les edats, els barris i les necessitats de mobilitat de tota la població. La xifra descrivia qui havia contestat, però extrapolar-la exigia examinar el mètode de selecció.',
 'The council published an online consultation about a new bus route. Eight hundred people responded voluntarily, and 72% supported the project. The official announcement stated, “Seven out of ten residents support it.” No information was given about how many residents knew of the consultation or whether respondents represented the ages, neighbourhoods and travel needs of the wider population. The figure described respondents, but generalising it required examining how participants were selected.'),
 Q(L('¿Qué error potencial contiene el anuncio municipal?','Quin error potencial conté l’anunci municipal?','What is the potential flaw in the council’s announcement?'),
 O(['Equipara respuestas voluntarias con toda la población','Cuenta las respuestas favorables mediante porcentajes','Distingue entre barrios en lugar de habitantes','Describe una medida que aún no se ha aplicado'],['Equipara respostes voluntàries amb tota la població','Compta les respostes favorables amb percentatges','Distinguix entre barris en lloc d’habitants','Descriu una mesura que encara no s’ha aplicat'],['It treats volunteers as representative of all residents','It reports favourable responses as percentages','It distinguishes neighbourhoods rather than residents','It describes a policy not yet implemented']),0,
 L('Las personas que participan por iniciativa propia pueden no representar a toda la ciudadanía.','Les persones que participen per iniciativa pròpia poden no representar tota la ciutadania.','Self-selected respondents may not represent the population as a whole.')),
 Q(L('¿Cuál es una formulación fiel a la evidencia disponible?','Quina formulació és fidel a l’evidència disponible?','Which wording accurately reflects the available evidence?'),
 O(['El apoyo ciudadano supera el 70 % con certeza','El 72 % de participantes respaldó la propuesta','La mayoría de barrios aprobó el proyecto','El respaldo es idéntico en todas las edades'],['El suport ciutadà supera el 70 % amb certesa','El 72 % dels participants avalà la proposta','La majoria de barris va aprovar el projecte','El suport és idèntic en totes les edats'],['Over 70% of all citizens definitely approve','72% of respondents supported the proposal','A majority of neighbourhoods approved the route','Support was identical across every age group']),1,
 L('El 72 % se calculó sobre quienes respondieron, no sobre una muestra demostrada como representativa.','El 72 % es calculà sobre qui va respondre, no sobre una mostra demostrada com a representativa.','The 72% figure applies to respondents, not necessarily to all residents.'))),
E('c_b_sources','bach','critical','history',
 L('Dos fuentes sobre una protesta','Dos fonts sobre una protesta','Two sources on a protest'),
 L('Para investigar una protesta de 1912, una alumna encontró una orden oficial que prohibía reunirse en la plaza después de las ocho y una carta privada escrita por un testigo que narraba una concentración hasta las nueve. La alumna sostuvo que una de las fuentes debía ser falsa porque se contradecían. Su profesor le recordó que una norma expresa lo permitido, mientras que un testimonio relata lo que su autor afirma que ocurrió. Además, ambas fuentes tienen propósitos, destinatarios y limitaciones distintos.',
 'Per a investigar una protesta de 1912, una alumna trobà una ordre oficial que prohibia reunir-se a la plaça després de les huit i una carta privada escrita per un testimoni que narrava una concentració fins a les nou. L’alumna sostingué que una de les fonts havia de ser falsa perquè es contradeien. El professor li recordà que una norma expressa allò permés, mentre que un testimoni relata el que l’autor afirma que va passar. A més, les dos fonts tenen propòsits, destinataris i limitacions distints.',
 'While researching a protest in 1912, a student found an official order forbidding gatherings in the square after eight o’clock, and a private letter from a witness describing a gathering that lasted until nine. She argued that one source must be false because they contradicted each other. Her teacher noted that an order states what is permitted, while testimony reports what its author says happened. The sources also have different purposes, audiences and limitations.'),
 Q(L('¿Cuál es la interpretación metodológicamente más sólida?','Quina és la interpretació metodològicament més sòlida?','Which interpretation is methodologically strongest?'),
 O(['Una fuente oficial refleja siempre lo sucedido','Una carta personal carece de valor histórico','La orden prueba que todos obedecieron la norma','La prohibición y un incumplimiento pueden coexistir'],['Una font oficial reflectix sempre allò ocorregut','Una carta personal no té valor històric','L’ordre prova que tots obeïren la norma','La prohibició i un incompliment poden coexistir'],['An official source always reports what happened','A private letter has no historical value','The order proves that everyone obeyed it','A prohibition can coexist with a breach']),3,
 L('Una disposición normativa no garantiza que se cumpliera; ambos documentos podrían ser compatibles.','Una disposició normativa no garantix que es complira; els dos documents podrien ser compatibles.','A legal restriction does not prove compliance; the accounts may be compatible.')),
 Q(L('¿Qué comprobación ayudaría a valorar mejor el testimonio?','Quina comprovació ajudaria a valorar millor el testimoni?','What would help assess the testimony more reliably?'),
 O(['Examinar su autoría y contrastarlo con otras fuentes','Suponer que el testigo recordaba todos los detalles','Descartar la carta por no ser un documento oficial','Preferir automáticamente el texto de mayor extensión'],['Examinar-ne l’autoria i contrastar-lo amb altres fonts','Suposar que el testimoni recordava tots els detalls','Descartar la carta per no ser un document oficial','Preferir automàticament el text de més extensió'],['Establish authorship and compare independent records','Assume the witness recalled every event precisely','Reject the letter because it is unofficial','Automatically prefer whichever document is longer']),0,
 L('La autoría, cercanía a los hechos y contraste independiente ayudan a evaluar fuentes históricas.','L’autoria, la proximitat als fets i el contrast independent ajuden a avaluar fonts històriques.','Authorship, proximity to events and independent corroboration help evaluate historical sources.'))),
E('c_b_trial','bach','critical','science',
 L('Un resultado prometedor','Un resultat prometedor','A promising result'),
 L('Un equipo evaluó un método de estudio con cuarenta voluntarios asignados al azar a dos grupos. El grupo experimental obtuvo una media superior en una prueba realizada dos semanas después. El informe reconocía que la muestra pertenecía a un único centro y que no se habían medido los resultados a largo plazo. Un portavoz anunció que la eficacia estaba probada para todos los estudiantes y de manera permanente. Una investigadora pidió conservar el hallazgo, pero limitar el alcance de la conclusión.',
 'Un equip avaluà un mètode d’estudi amb quaranta voluntaris assignats a l’atzar a dos grups. El grup experimental obtingué una mitjana superior en una prova feta dos setmanes després. L’informe reconeixia que la mostra provenia d’un únic centre i que no s’havien mesurat resultats a llarg termini. Un portaveu anuncià que l’eficàcia estava provada per a tot l’alumnat i de manera permanent. Una investigadora demanà conservar la troballa, però limitar l’abast de la conclusió.',
 'A team tested a study method using forty volunteers randomly assigned to two groups. The experimental group achieved a higher average score on a test two weeks later. The report acknowledged that all participants attended one school and that no long-term outcomes had been measured. A spokesperson announced that the method’s effectiveness had been proved for every student and permanently. A researcher urged the team to retain the finding but narrow the claim.'),
 Q(L('¿Qué límite del estudio afecta a la generalización?','Quin límit de l’estudi afecta la generalització?','Which limitation affects how widely results apply?'),
 O(['La existencia de un grupo experimental separado','La realización de una prueba dos semanas después','La procedencia de un solo centro educativo','La asignación aleatoria de los participantes'],['L’existència d’un grup experimental separat','La realització d’una prova dos setmanes després','La procedència d’un únic centre educatiu','L’assignació aleatòria dels participants'],['Having a separate experimental study group','Testing participants two weeks after teaching','Recruiting all participants from one school','Randomly assigning volunteers to two groups']),2,
 L('La procedencia de un solo centro limita la extrapolación a poblaciones educativas distintas.','La procedència d’un únic centre limita extrapolar a poblacions educatives distintes.','Recruitment from one school limits generalisation to other populations.')),
 Q(L('¿Qué formulación respeta los resultados y su alcance?','Quina formulació respecta els resultats i el seu abast?','Which wording respects both the result and its scope?'),
 O(['El grupo experimental alcanzó una media superior en esa prueba','El método funcionará igual en estudiantes de cualquier edad','La ventaja se mantendría aunque cambiara el centro','La diferencia se conservará durante varios años'],['El grup experimental obtingué una mitjana superior en eixa prova','El mètode funcionarà igual amb alumnat de qualsevol edat','L’avantatge es mantindria encara que canviara el centre','La diferència es conservarà durant diversos anys'],['The experimental group had a higher mean test score','The method will work equally well at every age','The result would hold across different schools','The measured difference will last for years']),0,
 L('La mejora observada corresponde a una muestra y un plazo concretos; no prueba duración ni universalidad.','La millora observada correspon a una mostra i un termini concrets; no prova duració ni universalitat.','The measured difference concerns a specific sample and timeframe, not permanent effects.')))
);

// Componentes SVG/CSS autónomos, accesibles y sin dependencias externas.
function visualMarkup(item) {
 const d=VISUAL_DATA[item.id]; if (!d) return '';
 let inner='';
 const vTitle=h(l(d.title));
 if(d.type==='bar'||d.type==='groupbar'||d.type==='line'){
  const W=700,H=297,left=62,right=24,top=34,bottom=63,pw=W-left-right,ph=H-top-bottom;
  const series =d.type==='bar'?[{name:d.unit,values:d.items.map(x=>x.v)}]:d.series;
  const labels=d.type==='bar'?d.items.map(x=>x.name):d.x;
  const vals=series.flatMap(s=>s.values);
  const low=Number.isFinite(d.yMin)?d.yMin:0;
  const high=Number.isFinite(d.yMax)?d.yMax:Math.max(4,Math.ceil(Math.max(...vals)*1.10/4)*4);
  const Y=v=>top+ph-(v-low)/(high-low)*ph;
  const n=labels.length;
  const colors=['#099c83','#3678c5','#b87328'];
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${vTitle}"><title>${vTitle}</title>`;
  for(let k=0;k<=4;k++){
    const val=low+(high-low)*k/4,y=Y(val);
    const shown=Number.isInteger(val)?val:Number(val.toFixed(1));
    svg+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#dce7ec" stroke-dasharray="3 5"/><text x="${left-12}" y="${y+4}" font-size="12" text-anchor="end" fill="#506276">${shown}</text>`;
  }
  if(d.type==='line'){
    series.forEach((s,j)=>{
      const ps=s.values.map((v,i)=>[left+pw*(i/(n-1)),Y(v)]);
      svg+=`<polyline points="${ps.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${colors[j]}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      ps.forEach((p,i)=>{const repeated=series.some((other,k)=>k<j&&other.values[i]===s.values[i]);svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" stroke="#fff" stroke-width="2" fill="${colors[j]}"/>${repeated?'':`<text x="${p[0]}" y="${p[1]-13}" text-anchor="middle" font-size="12" font-weight="700" fill="${colors[j]}">${s.values[i]}</text>`}`;});
    });
    labels.forEach((x,i)=>svg+=`<text x="${left+pw*i/(n-1)}" y="${H-bottom+25}" font-size="12" text-anchor="middle" fill="#506276">${h(l(x))}</text>`);
  } else {
    const groups=series.length;const step=pw/n;const groupWidth=Math.min(step*.8,100);
    series.forEach((s,j)=>s.values.forEach((v,i)=>{
      const bw=groupWidth/groups-3,xx=left+step*(i+.5)-groupWidth/2+j*(groupWidth/groups)+2,yy=Y(v);
      svg+=`<rect x="${xx}" y="${yy}" width="${bw}" height="${Math.max(0,top+ph-yy)}" rx="4" fill="${colors[j]}"/><text x="${xx+bw/2}" y="${yy-7}" text-anchor="middle" font-size="12" font-weight="700" fill="${colors[j]}">${v}</text>`;
    }));
    labels.forEach((x,i)=>svg+=`<text x="${left+step*(i+.5)}" y="${H-bottom+25}" text-anchor="middle" font-size="12" fill="#506276">${h(l(x))}</text>`);
  }
  svg+='</svg>';
  inner=`<div class="mm-chart-viewport"><div class="mm-chart">${svg}</div></div>`;
  if(series.length>1)inner+=`<div class="mm-legend">${series.map((s,j)=>`<span><i style="background:${colors[j]}"></i>${h(l(s.name))}</span>`).join('')}</div>`;
  inner+=`<p class="mm-note">${h(l(d.unit))}${d.type==='line'&&d.yMin?` · ${h(tr('axisStart'))}: ${d.yMin}`:''}</p>`;
  // Alternativa textual accesible con todas las cifras exactas.
  inner+=`<details class="mm-data-details"><summary>${h(tr('viewDataTable'))}</summary><div class="mm-table-scroll"><table class="mm-table"><thead><tr><th scope="col">${h(tr('chartCategory'))}</th>${series.map(s=>`<th scope="col">${h(l(s.name))}</th>`).join('')}</tr></thead><tbody>${labels.map((name,i)=>`<tr><th scope="row">${h(l(name))}</th>${series.map(s=>`<td>${s.values[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
 } else if(d.type==='table'){
  inner=`<div class="mm-table-scroll"><table class="mm-table"><thead><tr>${d.columns.map((x,i)=>`<th scope="col">${h(l(x))}</th>`).join('')}</tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map((v,i)=>i?`<td>${h(l(v))}</td>`:`<th scope="row">${h(l(v))}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 }else if(d.type==='timeline'){
  inner=`<ol class="mm-timeline">${d.items.map(e=>`<li><span class="mm-time">${h(l(e.moment))}</span><div><strong>${h(l(e.title))}</strong><p>${h(l(e.detail))}</p></div></li>`).join('')}</ol>`;
 }else if(d.type==='infographic'){
  inner=`<div class="mm-segments" aria-label="${vTitle}">${d.items.map((e,i)=>`<div style="width:${e.value}%;background:${['#0b9985','#367dc4','#dd9a43','#7d83b9'][i]}" title="${h(l(e.label))}: ${e.value}%"></div>`).join('')}</div><div class="mm-infogrid">${d.items.map((e,i)=>`<div class="mm-infocard"><span class="mm-info-icon" aria-hidden="true">${e.icon}</span><div><strong>${h(l(e.label))}</strong><small>${e.value}${h(l(d.unit))}</small></div></div>`).join('')}</div>`;
 }
 return `<figure class="mm-visual"><figcaption><span>📊 ${h(tr('visualEvidence'))}</span><strong>${vTitle}</strong></figcaption>${inner}<p class="mm-disclaimer">${h(tr('simulatedData'))}</p></figure>`;
}

between people"]},"answer":2,"reason":{"es":"Se transmiten datos prácticos sin narrar una historia.","va":"Es transmeten dades pràctiques sense contar una història.","en":"It gives practical information rather than telling a story."}}]},{"id":"v09_trail","level":"eso1","skill":"essential","area":"science","title":{"es":"Un sendero recuperado","va":"Una senda recuperada","en":"A restored walking trail"},"passage":{"es":"Un grupo de vecinos propuso recuperar el antiguo sendero del río. Primero retiraron residuos; después señalaron los tramos peligrosos y colocaron carteles para explicar la vegetación. La asociación insiste en que no basta con limpiar una vez: cada trimestre revisarán el estado del camino. El proyecto busca que más personas puedan pasear sin perjudicar el entorno natural.","va":"Un grup de veïns va proposar recuperar l’antiga senda del riu. Primer van retirar residus; després van senyalitzar els trams perillosos i van col·locar cartells per a explicar la vegetació. L’associació insistix que no n’hi ha prou de netejar una vegada: cada trimestre revisaran l’estat del camí. El projecte busca que més persones puguen passejar sense perjudicar l’entorn natural.","en":"A group of neighbours proposed restoring the old riverside path. They first removed litter, then marked dangerous sections and put up signs explaining local plants. The group says one clean-up is not enough: they will check the path every three months. The project aims to make walking safer without damaging the natural environment."},"questions":[{"stem":{"es":"¿Qué idea reúne mejor todas las acciones?","va":"Quina idea reunix millor totes les accions?","en":"Which idea best unites all the actions?"},"choices":{"es":["Preparar una carrera junto al río","Recuperar y cuidar el sendero","Construir un puente para coches","Organizar una exposición de plantas"],"va":["Preparar una carrera vora el riu","Recuperar i cuidar la senda","Construir un pont per a cotxes","Organitzar una exposició de plantes"],"en":["Preparing a riverside race","Restoring and maintaining the path","Building a bridge for cars","Organising a plant exhibition"]},"answer":1,"reason":{"es":"La limpieza, las señales y el seguimiento forman parte de la recuperación.","va":"La neteja, els senyals i el seguiment formen part de la recuperació.","en":"Cleaning, signs and future checks all support the restoration."}},{"stem":{"es":"¿Por qué planifican revisiones periódicas?","va":"Per què planifiquen revisions periòdiques?","en":"Why are regular checks planned?"},"choices":{"es":["Para evitar cualquier paseo","Para vender entradas nuevas","Para sustituir los árboles","Para mantener la mejora lograda"],"va":["Per a evitar qualsevol passeig","Per a vendre entrades noves","Per a substituir tots els arbres","Per a mantindre la millora aconseguida"],"en":["To prevent every walk","To sell new tickets","To replace all the trees","To maintain the improvements"]},"answer":3,"reason":{"es":"Reconocen que una actuación aislada no garantiza el cuidado futuro.","va":"Reconeixen que una actuació aïllada no garantix la cura futura.","en":"One clean-up alone cannot maintain the path indefinitely."}}]},{"id":"v09_strata","level":"eso2","skill":"vocab","area":"science","title":{"es":"Las capas cuentan historias","va":"Les capes conten històries","en":"Layers tell stories"},"passage":{"es":"En una excavación, el equipo encontró fragmentos de cerámica en distintos estratos de tierra. La superposición de las capas aportaba indicios sobre el orden de los depósitos, aunque una alteración posterior podía cambiar la posición de algunos objetos. Por eso los investigadores registraron el lugar exacto de cada hallazgo antes de extraerlo y evitaron convertir una pista aislada en una conclusión definitiva.","va":"En una excavació, l’equip va trobar fragments de ceràmica en diferents estrats de terra. La superposició de les capes aportava indicis sobre l’orde dels depòsits, encara que una alteració posterior podia canviar la posició d’alguns objectes. Per això els investigadors van registrar el lloc exacte de cada troballa abans d’extraure-la i van evitar convertir una pista aïllada en una conclusió definitiva.","en":"During an excavation, researchers found pieces of pottery in different soil strata. The overlapping layers provided clues about the sequence of deposits, although later disturbance could have moved some objects. The team therefore recorded the exact position of each discovery before removing it and avoided turning a single clue into a final conclusion."},"questions":[{"stem":{"es":"¿Qué significa «estratos» en este contexto?","va":"Què significa «estrats» en este context?","en":"What does “strata” mean here?"},"choices":{"es":["Capas diferenciadas de terreno","Tipos distintos de cerámica","Instrumentos usados al excavar","Fechas escritas en una pieza"],"va":["Capes diferenciades de terreny","Tipus diferents de ceràmica","Instruments usats en excavar","Dates escrites en una peça"],"en":["Distinct layers of ground","Different types of pottery","Tools used for excavation","Dates written on pottery"]},"answer":0,"reason":{"es":"La expresión «capas de tierra» aclara directamente el sentido de estratos.","va":"L’expressió «capes de terra» aclarix directament el sentit d’estrats.","en":"The phrase about soil layers clarifies the meaning of strata."}},{"stem":{"es":"¿Cómo se entiende «indicios» en el texto?","va":"Com s’entén «indicis» en el text?","en":"What does “clues” mean in the passage?"},"choices":{"es":["Pruebas que no admiten revisión","Reglas obligatorias de excavación","Señales que orientan una hipótesis","Objetos de valor económico"],"va":["Proves que no admeten revisió","Regles obligatòries d’excavació","Senyals que orienten una hipòtesi","Objectes de valor econòmic"],"en":["Proof that cannot be revised","Mandatory excavation rules","Signs that support a hypothesis","Objects of monetary value"]},"answer":2,"reason":{"es":"Un indicio aporta información, pero requiere interpretación y contraste.","va":"Un indici aporta informació, però requerix interpretació i contrast.","en":"A clue guides an interpretation but does not settle it alone."}}]},{"id":"v09_archive","level":"bach","skill":"infer","area":"history","title":{"es":"Una página arrancada","va":"Una pàgina arrancada","en":"A missing page"},"passage":{"es":"Una investigadora examinó el libro de actas de una institución del siglo XIX. Durante varios años, las anotaciones seguían un formato uniforme, con fecha y firma. Sin embargo, en el volumen de 1874 faltaba una hoja justo antes de una decisión controvertida. La encuadernación presentaba señales de reparación, pero no permitía determinar cuándo se produjo la pérdida. Otro archivo conservaba una carta que aludía a una reunión sin describir su resultado. La investigadora distinguió tres posibilidades: deterioro accidental, retirada deliberada o error antiguo de encuadernación. Consideró que ninguna podía aceptarse sin nuevos documentos.","va":"Una investigadora va examinar el llibre d’actes d’una institució del segle XIX. Durant anys, les anotacions seguien un format uniforme, amb data i firma. Però en el volum de 1874 faltava un full just abans d’una decisió controvertida. L’enquadernació mostrava senyals de reparació, però no permetia saber quan s’havia produït la pèrdua. Un altre arxiu conservava una carta que al·ludia a una reunió sense descriure’n el resultat. La investigadora distingia tres possibilitats: deteriorament accidental, retirada deliberada o un error antic d’enquadernació. Considerava que cap podia acceptar-se sense documents nous.","en":"A historian studied the minutes of a nineteenth-century institution. For years, entries followed a standard format with a date and signature. Yet a page was missing from the 1874 volume, just before a controversial decision. Repairs to the binding offered no reliable date for the loss. Another archive held a letter mentioning a meeting without stating its outcome. The historian considered three explanations: accidental damage, deliberate removal, or an early binding error. She concluded that no explanation could be established without more evidence."},"questions":[{"stem":{"es":"¿Qué conclusión está suficientemente respaldada?","va":"Quina conclusió està prou fonamentada?","en":"Which conclusion is sufficiently supported?"},"choices":{"es":["La hoja fue retirada para ocultar pruebas","La reunión se canceló por un desacuerdo","La encuadernación demuestra un sabotaje","La causa de la ausencia sigue abierta"],"va":["El full es retirà per a ocultar proves","La reunió es cancel·là per desacord","L’enquadernació demostra un sabotatge","La causa de l’absència continua oberta"],"en":["The page was removed to hide evidence","The meeting was cancelled after a dispute","The binding proves deliberate sabotage","The cause of the loss remains uncertain"]},"answer":3,"reason":{"es":"Los indicios no permiten elegir de manera concluyente una de las causas.","va":"Els indicis no permeten triar de manera concloent una de les causes.","en":"The available clues do not distinguish conclusively between causes."}},{"stem":{"es":"¿Por qué es relevante la carta conservada?","va":"Per què és rellevant la carta conservada?","en":"Why is the surviving letter relevant?"},"choices":{"es":["Sitúa otra mención de la reunión","Revela el resultado de la votación","Confirma la retirada voluntaria","Fecha la reparación del volumen"],"va":["Situa una altra menció de la reunió","Revela el resultat de la votació","Confirma la retirada voluntària","Data la reparació del volum"],"en":["It mentions the same meeting again","It reveals the result of the vote","It confirms deliberate removal","It dates the repair to the volume"]},"answer":0,"reason":{"es":"Aporta una referencia independiente, aunque sin resolver qué se decidió.","va":"Aporta una referència independent, encara que sense resoldre què es va decidir.","en":"It independently mentions the meeting but does not reveal its outcome."}}]},{"id":"v09_clock","level":"eso1","skill":"figure","area":"literature","title":{"es":"El reloj impaciente","va":"El rellotge impacient","en":"The impatient clock"},"passage":{"es":"El reloj del pasillo perseguía los últimos minutos de clase. Cada golpe de sus agujas parecía empujar las mochilas hacia la puerta. Lucía miró el cuaderno: todavía le faltaba terminar una frase. Por primera vez, deseó que aquel reloj dejara de tener tanta prisa.","va":"El rellotge del corredor perseguia els últims minuts de classe. Cada colp de les agulles semblava espentar les motxilles cap a la porta. Llúcia va mirar la llibreta: encara li faltava acabar una frase. Per primera vegada, va desitjar que aquell rellotge deixara de tindre tanta pressa.","en":"The corridor clock chased the final minutes of the lesson. Each movement of its hands seemed to push the schoolbags towards the door. Lucy looked at her notebook: she still had a sentence to finish. For once, she wished the clock would stop being in such a hurry."},"questions":[{"stem":{"es":"¿Qué recurso domina en la descripción del reloj?","va":"Quin recurs domina en la descripció del rellotge?","en":"Which device shapes the clock description?"},"choices":{"es":["Una enumeración de cifras","Una personificación del objeto","Una explicación cronológica","Una comparación de sonidos"],"va":["Una enumeració de xifres","Una personificació de l’objecte","Una explicació cronològica","Una comparació de sons"],"en":["A list of clock numbers","Personification of the object","A chronological explanation","A comparison of sounds"]},"answer":1,"reason":{"es":"El reloj aparece como si pudiera perseguir o tener prisa.","va":"El rellotge apareix com si poguera perseguir o tindre pressa.","en":"The clock is described as if it could chase or hurry."}},{"stem":{"es":"¿Qué efecto consigue ese recurso?","va":"Quin efecte aconseguix eixe recurs?","en":"What effect does the device create?"},"choices":{"es":["Detener realmente el paso del tiempo","Explicar cómo funciona el mecanismo","Transmitir urgencia y presión temporal","Describir con exactitud la hora"],"va":["Detindre realment el pas del temps","Explicar com funciona el mecanisme","Transmetre urgència i pressió temporal","Descriure amb exactitud l’hora"],"en":["Actually stopping the passage of time","Explaining the mechanical parts","Conveying urgency and time pressure","Giving the clock time precisely"]},"answer":2,"reason":{"es":"El lenguaje expresivo comunica la sensación de prisa de la protagonista.","va":"El llenguatge expressiu comunica la sensació de pressa de la protagonista.","en":"The imagery conveys the character’s sense of urgency."}}]},{"id":"v09_circuit","level":"eso2","skill":"logic","area":"technology","title":{"es":"El sensor de la ventana","va":"El sensor de la finestra","en":"The window sensor"},"passage":{"es":"El sistema de un invernadero activa la ventilación si la temperatura supera 29 °C y la ventana automática está desbloqueada. Si cualquiera de esas condiciones falla, el motor permanece apagado. Una tarde, la pantalla registró 31 °C, pero la ventana no se abrió. El técnico comprobó el registro eléctrico antes de concluir que hubiera una avería, porque la lectura de temperatura no informa por sí sola del estado del bloqueo.","va":"El sistema d’un hivernacle activa la ventilació si la temperatura supera 29 °C i la finestra automàtica està desbloquejada. Si falla qualsevol d’eixes condicions, el motor continua apagat. Una vesprada, la pantalla registrà 31 °C, però la finestra no es va obrir. El tècnic comprovà el registre elèctric abans de concloure que hi haguera una avaria, perquè la temperatura no informa per si sola de l’estat del bloqueig.","en":"A greenhouse system activates ventilation if the temperature exceeds 29°C and the automatic window is unlocked. If either condition fails, the motor stays off. One afternoon, the display showed 31°C but the window remained closed. The technician checked the electrical log before claiming a fault, because a temperature reading alone does not show whether the lock is engaged."},"questions":[{"stem":{"es":"¿Cuál es una explicación compatible con lo descrito?","va":"Quina explicació és compatible amb el que es descriu?","en":"Which explanation is compatible with the account?"},"choices":{"es":["La temperatura tuvo que ser inferior a 29 °C","El sistema no utiliza sensores térmicos","El desbloqueo pudo no estar activado","La ventana necesariamente estaba rota"],"va":["La temperatura havia de ser inferior a 29 °C","El sistema no utilitza sensors tèrmics","El desbloqueig podia no estar activat","La finestra necessàriament estava trencada"],"en":["The temperature must have been below 29°C","The system uses no temperature sensors","The unlock condition may not have been met","The window must have been broken"]},"answer":2,"reason":{"es":"Con 31 °C todavía falta conocer el estado del bloqueo.","va":"Amb 31 °C encara falta saber l’estat del bloqueig.","en":"At 31°C the unlock condition still needs checking."}},{"stem":{"es":"¿Qué relación lógica exige el funcionamiento?","va":"Quina relació lògica exigix el funcionament?","en":"Which logical relationship governs the system?"},"choices":{"es":["Se deben cumplir las dos condiciones","Basta con que se cumpla una condición","Las dos condiciones deben fallar a la vez","Una condición anula siempre a la otra"],"va":["S’han de complir les dues condicions","N’hi ha prou que es complisca una condició","Les dues condicions han de fallar alhora","Una condició anul·la sempre l’altra"],"en":["Both conditions must be satisfied","Either condition alone is sufficient","Both conditions must fail together","One condition always cancels the other"]},"answer":0,"reason":{"es":"El conector «y» expresa una condición conjunta, no alternativa.","va":"El connector «i» expressa una condició conjunta, no alternativa.","en":"The word “and” requires both conditions at once."}}]},{"id":"v09_sleep","level":"bach","skill":"critical","area":"science","title":{"es":"Dormir y rendir más","va":"Dormir i rendir més","en":"Sleep and achievement"},"passage":{"es":"Una encuesta voluntaria entre 180 estudiantes encontró que quienes declaraban dormir al menos ocho horas obtenían notas medias superiores. Un artículo divulgativo tituló que añadir una hora de sueño garantizaba mejores calificaciones. La encuesta, sin embargo, no midió el descanso con instrumentos ni asignó horas de sueño de forma experimental. Las rutinas familiares, la carga de trabajo y las condiciones de salud podían relacionarse tanto con las horas declaradas como con las notas. El estudio ofrecía una asociación interesante, pero no permitía establecer cuánto mejoraría cada estudiante por modificar su horario.","va":"Una enquesta voluntària entre 180 estudiants trobà que els qui declaraven dormir almenys huit hores obtenien notes mitjanes superiors. Un article divulgatiu titulà que afegir una hora de son garantia millors qualificacions. L’enquesta, però, no mesurà el descans amb instruments ni assignà hores de son experimentalment. Les rutines familiars, la càrrega de treball i les condicions de salut podien relacionar-se tant amb les hores declarades com amb les notes. L’estudi oferia una associació interessant, però no permetia establir quant milloraria cada estudiant si modificava l’horari.","en":"A voluntary survey of 180 students found that those reporting at least eight hours of sleep had higher average grades. A popular article claimed that an extra hour of sleep guaranteed better results. The survey, however, neither measured sleep objectively nor assigned sleeping hours experimentally. Family routines, workload and health could be linked to both reported sleep and grades. The study suggested an interesting association but could not establish how much any student would improve by changing their bedtime."},"questions":[{"stem":{"es":"¿Cuál es el principal exceso del titular?","va":"Quin és el principal excés del titular?","en":"What is the headline’s main overstatement?"},"choices":{"es":["No informa sobre el tamaño de la muestra","Da una garantía causal sin demostrarla","Expone que hay diferencias de medias","Sugiere ampliar el estudio en el futuro"],"va":["No informa sobre la grandària de la mostra","Dona una garantia causal sense provar-la","Exposa que hi ha diferències de mitjanes","Suggerix ampliar l’estudi en el futur"],"en":["It omits the sample size entirely","It claims an unproven causal guarantee","It reports a difference in averages","It calls for a follow-up study"]},"answer":1,"reason":{"es":"Una asociación observacional no garantiza el efecto de una intervención.","va":"Una associació observacional no garantix l’efecte d’una intervenció.","en":"An observational association cannot guarantee an intervention effect."}},{"stem":{"es":"¿Qué mejoraría la evaluación de la hipótesis?","va":"Què milloraria l’avaluació de la hipòtesi?","en":"What would improve testing the hypothesis?"},"choices":{"es":["Preguntar únicamente a quienes aprueban","Publicar solo las medias más elevadas","Eliminar del estudio las variables externas","Medir el sueño y controlar otros factores"],"va":["Preguntar únicament als qui aproven","Publicar sols les mitjanes més elevades","Eliminar de l’estudi les variables externes","Mesurar el son i controlar altres factors"],"en":["Surveying only high-scoring students","Publishing only the highest averages","Ignoring all alternative explanations","Measuring sleep and other variables"]},"answer":3,"reason":{"es":"La medición objetiva y el control de variables reducirían incertidumbres.","va":"La mesura objectiva i el control de variables reduirien incerteses.","en":"Objective measurement and control of factors would reduce uncertainty."}}]},{"id":"v09_water","level":"init","skill":"multimodal","area":"science","title":{"es":"Agua para las plantas","va":"Aigua per a les plantes","en":"Water for the plants"},"passage":{"es":"Durante tres días, una clase midió la cantidad de agua utilizada para regar un pequeño huerto. La tabla contiene los litros usados cada día.","va":"Durant tres dies, una classe va mesurar la quantitat d’aigua utilitzada per a regar un hort menut. La taula conté els litres utilitzats cada dia.","en":"Over three days, a class measured how much water it used to water a small garden. The table shows litres used each day."},"questions":[{"stem":{"es":"¿Qué día se usó más agua?","va":"Quin dia es va gastar més aigua?","en":"On which day was the most water used?"},"choices":{"es":["Lunes","Martes","Miércoles","Todos por igual"],"va":["Dilluns","Dimarts","Dimecres","Tots per igual"],"en":["Monday","Tuesday","Wednesday","All days were equal"]},"answer":2,"reason":{"es":"El miércoles se registran 6 litros, el valor más alto.","va":"Dimecres es registren 6 litres, el valor més alt.","en":"Wednesday has 6 litres, the largest value."}},{"stem":{"es":"¿Cuántos litros se gastaron entre lunes y martes?","va":"Quants litres es van gastar entre dilluns i dimarts?","en":"How many litres were used on Monday and Tuesday?"},"choices":{"es":["5 litros","7 litros","6 litros","8 litros"],"va":["5 litres","7 litres","6 litres","8 litres"],"en":["5 litres","7 litres","6 litres","8 litres"]},"answer":1,"reason":{"es":"Se suman los 3 litros del lunes y los 4 litros del martes.","va":"Se sumen els 3 litres de dilluns i els 4 litres de dimarts.","en":"Add 3 litres on Monday and 4 on Tuesday."}}]},{"id":"v09_audio_market","level":"init","skill":"listen","area":"daily","title":{"es":"La cesta olvidada","va":"La cistella oblidada","en":"The forgotten basket"},"passage":{"es":"Al llegar al mercado, Sara se dio cuenta de que había olvidado la cesta. Su abuelo le prestó una bolsa de tela. Compraron tres manzanas y pan, pero dejaron las naranjas para otro día porque ya tenían en casa. Después volvieron caminando.","va":"Quan va arribar al mercat, Sara es va adonar que s’havia oblidat la cistella. El iaio li va deixar una bossa de tela. Van comprar tres pomes i pa, però van deixar les taronges per a un altre dia perquè ja en tenien a casa. Després van tornar caminant.","en":"When Sara reached the market, she realised she had forgotten her basket. Her grandfather lent her a cloth bag. They bought three apples and some bread, but left the oranges because they already had some at home. Then they walked back."},"questions":[{"stem":{"es":"¿Qué había olvidado Sara?","va":"Què s’havia oblidat Sara?","en":"What had Sara forgotten?"},"choices":{"es":["La lista de la compra","La cesta para comprar","El dinero del mercado","La bolsa de su abuelo"],"va":["La llista de la compra","La cistella per a comprar","Els diners del mercat","La bossa del iaio"],"en":["Her shopping list","Her shopping basket","Her market money","Her grandfather’s bag"]},"answer":1,"reason":{"es":"Sara descubrió que no llevaba la cesta al llegar al mercado.","va":"Sara va descobrir que no portava la cistella en arribar al mercat.","en":"She noticed the missing basket when she reached the market."}},{"stem":{"es":"¿Por qué no compraron naranjas?","va":"Per què no van comprar taronges?","en":"Why did they not buy oranges?"},"choices":{"es":["Porque ya tenían en casa","Porque el mercado cerraba","Porque no quedaban manzanas","Porque no llevaban bolsas"],"va":["Perquè ja en tenien a casa","Perquè el mercat tancava","Perquè no quedaven pomes","Perquè no portaven bosses"],"en":["They already had some at home","The market was closing","No apples remained for sale","They did not have any bags"]},"answer":0,"reason":{"es":"El texto dice que aún tenían naranjas en casa.","va":"El text diu que encara tenien taronges a casa.","en":"They left the oranges because they already had some."}}]},{"id":"v09_audio_plants","level":"eso1","skill":"listen","area":"science","title":{"es":"Sombras en el huerto","va":"Ombres a l’hort","en":"Shadows in the garden"},"passage":{"es":"Dos clases cultivaron la misma variedad de lechuga en macetas iguales. Las colocaron en zonas con distinta cantidad de luz y utilizaron la misma cantidad de agua. Durante tres semanas anotaron la altura de cada planta. Las que recibían más luz crecieron, de media, más deprisa. La profesora les recordó que el resultado se refería a ese ensayo y que aún debían comprobar la temperatura y la calidad de la tierra antes de sacar conclusiones generales.","va":"Dues classes van cultivar la mateixa varietat d’encisam en tests iguals. Els van posar en zones amb diferent quantitat de llum i van utilitzar la mateixa quantitat d’aigua. Durant tres setmanes van anotar l’altura de cada planta. Les que rebien més llum van créixer, de mitjana, més de pressa. La professora els va recordar que el resultat es referia a eixe assaig i que encara havien de comprovar la temperatura i la qualitat de la terra abans de traure conclusions generals.","en":"Two classes grew the same variety of lettuce in identical pots. They placed them in areas with different levels of light and used the same amount of water. For three weeks they recorded each plant’s height. On average, the plants receiving more light grew faster. Their teacher reminded them that this result applied to their trial and that temperature and soil quality still needed checking before making general claims."},"questions":[{"stem":{"es":"¿Qué condición intentaron mantener constante?","va":"Quina condició van intentar mantindre constant?","en":"Which condition did they try to keep constant?"},"choices":{"es":["La cantidad de agua usada","La cantidad de luz recibida","La temperatura del entorno","La altura de las plantas"],"va":["La quantitat d’aigua utilitzada","La quantitat de llum rebuda","La temperatura de l’entorn","L’altura de les plantes"],"en":["The amount of water used","The amount of light received","The surrounding temperature","The height of the plants"]},"answer":0,"reason":{"es":"Ambas clases utilizaron la misma cantidad de agua.","va":"Les dues classes van utilitzar la mateixa quantitat d’aigua.","en":"Both groups used the same amount of water."}},{"stem":{"es":"¿Por qué pide la profesora cautela?","va":"Per què demana prudència la professora?","en":"Why does the teacher urge caution?"},"choices":{"es":["Porque las alturas no se pueden medir","Porque todas las plantas deben crecer igual","Porque pueden intervenir otros factores","Porque la luz no se puede modificar"],"va":["Perquè les altures no es poden mesurar","Perquè totes les plantes han de créixer igual","Perquè poden intervindre altres factors","Perquè la llum no es pot modificar"],"en":["Plant height cannot be measured","All plants must grow equally","Other factors may affect the results","Light levels cannot be altered"]},"answer":2,"reason":{"es":"Temperatura y suelo podrían influir en el crecimiento observado.","va":"Temperatura i terra podrien influir en el creixement observat.","en":"Temperature and soil may also influence growth."}}]},{"id":"v09_audio_ticket","level":"eso2","skill":"listen","area":"society","title":{"es":"Entradas para el festival","va":"Entrades per al festival","en":"Tickets for the festival"},"passage":{"es":"El ayuntamiento anunció un festival de música en la plaza. La entrada sería gratuita, pero se establecería un aforo para garantizar la seguridad. En la primera edición, muchas personas acudieron a última hora y encontraron la plaza completa. Este año las plazas se reservarán previamente mediante un formulario. Una asociación vecinal apoya la medida porque reduce las aglomeraciones, mientras que otra advierte que las reservas digitales pueden dificultar la asistencia de quienes no tienen acceso habitual a internet. El ayuntamiento estudia habilitar un punto presencial para solucionar esa dificultad. El formulario no garantiza todavía una plaza a quien llegue sin reserva. Tampoco permite comprar más entradas, porque no se venden: únicamente se asignan turnos de acceso hasta alcanzar el límite. Las dos asociaciones coinciden en que la seguridad es necesaria, pero discrepan sobre cómo repartir las oportunidades de asistencia. La decisión final se anunciará tras consultar a los servicios municipales y comprobar si la atención presencial puede organizarse con personal suficiente.","va":"L’ajuntament va anunciar un festival de música a la plaça. L’entrada seria gratuïta, però es fixaria un aforament per a garantir la seguretat. En la primera edició, molta gent va acudir a última hora i va trobar la plaça plena. Enguany les places es reservaran abans per mitjà d’un formulari. Una associació veïnal dona suport a la mesura perquè reduïx les aglomeracions, mentre que una altra advertix que les reserves digitals poden dificultar l’assistència de qui no té accés habitual a internet. L’ajuntament estudia habilitar un punt presencial per a solucionar eixa dificultat. El formulari encara no garantix una plaça a qui arribe sense reserva. Tampoc permet comprar més entrades, perquè no es venen: únicament s’assignen torns d’accés fins a arribar al límit. Les dues associacions coincidixen que la seguretat és necessària, però discrepen sobre com repartir les oportunitats d’assistència. La decisió final s’anunciarà després de consultar els servicis municipals i comprovar si l’atenció presencial pot organitzar-se amb prou personal.","en":"The town council announced a music festival in the main square. Admission would be free, but capacity would be limited for safety. At the first festival many people arrived late and found the square full. This year, places must be reserved online. One residents’ group supports the decision because it reduces crowding, while another warns that digital booking could exclude people without regular internet access. The council is considering an in-person booking desk to address that concern. The form does not guarantee a place for anyone who arrives without a reservation. Nor can visitors buy extra tickets, because none are sold: the system only allocates entry up to the capacity limit. Both residents’ groups accept the need for safety, but disagree on how to ensure fair access. A final decision will follow consultation with municipal services and a check on whether an in-person desk can be staffed."},"questions":[{"stem":{"es":"¿Qué problema pretende resolver la reserva previa?","va":"Quin problema pretén resoldre la reserva prèvia?","en":"Which problem is advance booking meant to address?"},"choices":{"es":["El aumento del precio de la entrada","La escasez de grupos musicales","La dificultad de acudir en autobús","La afluencia superior al aforo seguro"],"va":["L’augment del preu de l’entrada","L’escassetat de grups musicals","La dificultat d’arribar en autobús","L’afluència superior a l’aforament segur"],"en":["A rise in ticket prices","A shortage of performing groups","The lack of public transport","Crowds exceeding safe capacity"]},"answer":3,"reason":{"es":"La medida pretende organizar el aforo y evitar aglomeraciones.","va":"La mesura pretén organitzar l’aforament i evitar aglomeracions.","en":"Reservations aim to control capacity and prevent crowding."}},{"stem":{"es":"¿Por qué se plantea una opción presencial?","va":"Per què es planteja una opció presencial?","en":"Why is an in-person option being considered?"},"choices":{"es":["Para atender a quienes no usan internet","Para eliminar todas las reservas digitales","Para aumentar la duración del festival","Para sustituir las normas de seguridad"],"va":["Per a atendre qui no utilitza internet","Per a eliminar totes les reserves digitals","Per a allargar la durada del festival","Per a substituir les normes de seguretat"],"en":["To help people without internet access","To cancel all online booking options","To make the festival last longer","To remove the safety rules"]},"answer":0,"reason":{"es":"El punto presencial permitiría reservar sin depender del acceso digital.","va":"El punt presencial permetria reservar sense dependre de l’accés digital.","en":"A physical booking desk could reduce digital exclusion."}}]},{"id":"v09_audio_media","level":"bach","skill":"listen","area":"society","title":{"es":"Qué nos dice una encuesta","va":"Què ens diu una enquesta","en":"What a survey can tell us"},"passage":{"es":"Una plataforma publicó que el noventa por ciento de sus usuarios consideraba útil su servicio. El dato procedía de un cuestionario que aparecía únicamente después de completar una compra. Respondieron doscientas personas, y no se informó del número total de usuarios que recibió la invitación. Algunos medios reprodujeron el porcentaje como si representara a todos los clientes. Una analista señaló que el resultado describe a quienes decidieron contestar, pero no permite descartar un sesgo de selección. Además, preguntar por la utilidad inmediatamente después de la compra podría producir respuestas distintas de las obtenidas semanas más tarde. La analista propuso publicar la tasa de respuesta, definir con claridad la población estudiada y realizar una nueva medición. Su objeción no era que el dato resultara necesariamente falso, sino que la interpretación pública excedía las garantías del procedimiento. Para mostrar la diferencia entre ambas afirmaciones, la analista puso un ejemplo: si diez mil clientes recibieron la invitación, doscientas respuestas suponen una participación muy reducida, pero si únicamente se invitó a doscientas veinte personas, la interpretación sería diferente. La plataforma no publicó ese denominador. También observó que la pregunta «¿Le resultó útil?» puede interpretarse de varias maneras: como satisfacción inmediata, como ahorro de tiempo o como utilidad posterior. Sin conocer el significado que cada participante atribuyó al término, las respuestas no son totalmente comparables. Por otra parte, una evaluación rigurosa no consiste en rechazar cualquier encuesta imperfecta. Consiste en delimitar con precisión qué conclusiones permite sostener y cuáles todavía necesitan nuevas pruebas. Finalmente, recordó que un porcentaje aparentemente exacto puede transmitir una seguridad injustificada cuando se oculta cómo se obtuvo la información.","va":"Una plataforma va publicar que el noranta per cent dels seus usuaris considerava útil el servici. La dada provenia d’un qüestionari que apareixia únicament després de completar una compra. Van respondre dues-centes persones i no es va informar del total d’usuaris que havia rebut la invitació. Alguns mitjans van repetir el percentatge com si representara tots els clients. Una analista va assenyalar que el resultat descrivia els qui havien decidit contestar, però no permetia descartar un biaix de selecció. A més, preguntar per la utilitat just després de la compra podia produir respostes distintes de les obtingudes setmanes més tard. L’analista va proposar publicar la taxa de resposta, definir clarament la població estudiada i fer una altra mesura. No afirmava que la dada fora necessàriament falsa, sinó que la interpretació pública excedia les garanties del procediment. Per a mostrar la diferència entre les dues afirmacions, l’analista va posar un exemple: si deu mil clients reberen la invitació, dues-centes respostes indicarien una participació molt reduïda, però si només s’haguera convidat dues-centes vint persones, la interpretació seria diferent. La plataforma no havia publicat eixe denominador. També va observar que la pregunta «Li ha resultat útil?» es pot interpretar de diverses maneres: com a satisfacció immediata, com a estalvi de temps o com a utilitat posterior. Sense conéixer el significat que cada participant atribuïx al terme, les respostes no són del tot comparables. D’altra banda, una avaluació rigorosa no consistix a rebutjar qualsevol enquesta imperfecta. Consistix a delimitar amb precisió quines conclusions permet sostindre i quines necessiten noves proves. Finalment, va recordar que un percentatge aparentment exacte pot transmetre una seguretat injustificada quan s’oculta com s’ha obtingut la informació.","en":"A platform announced that ninety percent of its users found its service useful. The figure came from a questionnaire shown only after a purchase. Two hundred people replied, but the total number invited was not reported. Several news outlets repeated the percentage as though it represented all customers. An analyst pointed out that it described respondents, not necessarily everyone who used the platform. Asking people immediately after purchase could also produce different answers from a survey conducted weeks later. She proposed publishing the response rate, defining the population more clearly and collecting new measurements. Her objection was not that the reported percentage was necessarily false, but that the public interpretation claimed more than the survey design could support. To clarify the distinction, the analyst offered an example. If ten thousand customers had received the invitation, two hundred replies would represent very limited participation. If only two hundred and twenty people were invited, the interpretation would be quite different. The platform had not reported that denominator. The question, “Did you find it useful?”, could also mean different things: immediate satisfaction, time saved or value experienced weeks later. Unless researchers know what participants meant, their responses are not fully comparable. Careful evaluation does not require rejecting every imperfect survey. It requires stating precisely which conclusions the evidence can support and which require further investigation. The analyst finally warned that an apparently exact percentage may create unwarranted confidence when the way the information was collected remains hidden."},"questions":[{"stem":{"es":"¿Qué limita especialmente la generalización?","va":"Què limita especialment la generalització?","en":"What particularly limits generalisation?"},"choices":{"es":["La encuesta tiene un porcentaje redondo","El servicio se adquiere por internet","La participación es selectiva y desconocida","La plataforma vende productos reales"],"va":["L’enquesta té un percentatge redó","El servici es contracta per internet","La participació és selectiva i desconeguda","La plataforma ven productes reals"],"en":["The percentage is a rounded number","The service is accessed online","Participation is selective and unclear","The platform sells real products"]},"answer":2,"reason":{"es":"La selección de encuestados y la tasa de respuesta no garantizan representatividad.","va":"La selecció dels enquestats i la taxa de resposta no garantixen representativitat.","en":"The response process and unknown response rate weaken representativeness."}},{"stem":{"es":"¿Qué sostiene realmente la analista?","va":"Què sosté realment l’analista?","en":"What is the analyst actually arguing?"},"choices":{"es":["La cifra puede ser cierta y estar sobregeneralizada","La cifra es falsa en todas las circunstancias","La encuesta demuestra la utilidad para todos","La encuesta no permite contar respuestas"],"va":["La xifra pot ser certa i estar massa generalitzada","La xifra és falsa en totes les circumstàncies","L’enquesta prova la utilitat per a tots","L’enquesta no permet comptar respostes"],"en":["A valid figure may still be overgeneralised","The figure must be false in every case","The survey proves usefulness for everyone","The survey cannot count individual replies"]},"answer":0,"reason":{"es":"Distingue el resultado entre participantes de una afirmación sobre toda la población.","va":"Distinguix el resultat entre participants d’una afirmació sobre tota la població.","en":"She distinguishes a result about respondents from a claim about all customers."}}]}]);
