const LESSONS=[
 {skill:'essential',title:L('Tema, idea principal y detalle','Tema, idea principal i detall','Topic, main idea and detail'),lead:L('Comprender no consiste en recordar todas las palabras: hay que reconocer de qué trata el conjunto.','Comprendre no consistix a recordar totes les paraules: cal reconéixer de què tracta el conjunt.','Understanding is more than remembering every word: you must identify the overall point.'),body:L('El <strong>tema</strong> responde a «¿de qué habla?». La <strong>idea principal</strong> expresa qué se dice de ese tema. Los detalles concretan, ejemplifican o apoyan esa idea. No confundas un dato llamativo con lo más importante.','El <strong>tema</strong> respon «de què parla?». La <strong>idea principal</strong> expressa què es diu sobre eixe tema. Els detalls concreten, exemplifiquen o sostenen la idea. No confundisques una dada cridanera amb el més important.','The <strong>topic</strong> answers “What is it about?”. The <strong>main idea</strong> says what the passage communicates about that topic. Details illustrate or support that idea. Do not mistake a striking detail for the main point.'),steps:O(['Lee el texto completo antes de responder.','Pregúntate qué tienen en común sus frases.','Elige una idea que abarque el conjunto, sin añadir datos.'],['Llig el text complet abans de respondre.','Pregunta’t què tenen en comú les frases.','Tria una idea que abrace el conjunt, sense afegir dades.'],['Read the whole passage first.','Ask what the sentences have in common.','Choose an idea that covers the whole text without adding facts.']),ex:L('Los árboles dan sombra, refrescan las calles y ofrecen refugio a aves.','Els arbres fan ombra, refresquen els carrers i oferixen refugi als ocells.','Trees give shade, cool streets and provide shelter for birds.'),quiz:Q(L('¿Cuál es la idea principal del ejemplo?','Quina és la idea principal de l’exemple?','What is the main idea of the example?'),O(['Las aves vuelan','Los árboles aportan varios beneficios','Las calles son largas','Los refugios necesitan sombra'],['Els ocells volen','Els arbres aporten diversos beneficis','Els carrers són llargs','Els refugis necessiten ombra'],['Birds can fly','Trees provide several benefits','Streets are long','Shelters need shade']),1,L('La opción reúne todas las ventajas mencionadas.','L’opció reunix tots els avantatges esmentats.','The choice covers all three benefits.'))},
 {skill:'essential',title:L('Resumir sin inventar','Resumir sense inventar','Summarising without inventing'),lead:L('Un buen resumen conserva lo imprescindible y descarta repeticiones o ejemplos secundarios.','Un bon resum conserva allò imprescindible i descarta repeticions o exemples secundaris.','A good summary keeps what matters while leaving out repeated or secondary details.'),body:L('Un resumen fiel <strong>respeta el significado</strong>, es más breve que el original y no introduce opiniones nuevas. El mejor título y el mejor resumen no son necesariamente los más vistosos, sino los que reflejan el conjunto.','Un resum fidel <strong>respecta el significat</strong>, és més breu que l’original i no introduïx opinions noves. El millor títol i el millor resum no són necessàriament els més vistosos, sinó els que reflectixen el conjunt.','A faithful summary <strong>preserves meaning</strong>, is shorter than the original and adds no new opinions. The best title or summary is not necessarily the most dramatic; it must represent the whole.'),steps:O(['Localiza la idea principal de cada parte.','Descarta ejemplos repetidos y detalles prescindibles.','Comprueba que el resumen no contradiga el texto.'],['Localitza la idea principal de cada part.','Descarta exemples repetits i detalls prescindibles.','Comprova que el resum no contradiga el text.'],['Find each section’s main idea.','Remove repeated examples and minor details.','Check that the summary does not contradict the source.']),ex:L('El autobús eléctrico no emite gases por el tubo de escape, aunque fabricar y cargar su batería también tiene impacto ambiental.','L’autobús elèctric no emet gasos pel tub d’escapament, encara que fabricar i carregar la bateria també té impacte ambiental.','An electric bus produces no exhaust emissions, although making and charging its battery also affects the environment.'),quiz:Q(L('¿Qué resumen es más fiel?','Quin resum és més fidel?','Which summary is most faithful?'),O(['Los autobuses eléctricos no tienen impacto alguno','Las baterías contaminan siempre más','Los autobuses eléctricos evitan emisiones de escape, pero mantienen otros impactos','Los autobuses eléctricos nunca necesitan energía'],['Els autobusos elèctrics no tenen cap impacte','Les bateries contaminen sempre més','Els autobusos elèctrics eviten emissions d’escapament, però mantenen altres impactes','Els autobusos elèctrics mai necessiten energia'],['Electric buses have no environmental impact','Batteries are always worse','Electric buses avoid exhaust emissions but have other impacts','Electric buses never need energy']),2,L('Conserva el beneficio y el matiz ambiental sin exagerar ninguno.','Conserva el benefici i el matís ambiental sense exagerar-ne cap.','It preserves both the benefit and the limitation without exaggeration.'))},
 {skill:'infer',title:L('Pistas y deducciones','Pistes i deduccions','Clues and deductions'),lead:L('Inferir es extraer una conclusión razonable a partir de información que el texto proporciona.','Inferir és extraure una conclusió raonable a partir de la informació que dona el text.','Inference means drawing a reasonable conclusion from information given in the passage.'),body:L('El texto no siempre expresa todo directamente. Los hechos descritos pueden funcionar como <strong>pistas</strong>, pero deben respaldar la conclusión. Una inferencia no es una ocurrencia: necesita evidencias.','El text no sempre ho expressa tot directament. Els fets descrits poden funcionar com a <strong>pistes</strong>, però han de justificar la conclusió. Una inferència no és una ocurrència: necessita evidències.','A passage does not always state everything directly. Details act as <strong>clues</strong>, but they must actually support your conclusion. An inference is not a random guess.'),steps:O(['Identifica qué hechos se dicen claramente.','Relaciona esos hechos con la pregunta.','Escoge la conclusión mejor apoyada.'],['Identifica quins fets es diuen clarament.','Relaciona eixos fets amb la pregunta.','Tria la conclusió millor justificada.'],['Identify the stated facts.','Connect those facts to the question.','Choose the most strongly supported conclusion.']),ex:L('La calle estaba llena de charcos y Lucía cerró su paraguas al llegar al portal.','El carrer estava ple de tolls i Llúcia va tancar el paraigua en arribar al portal.','The street was full of puddles and Lucy closed her umbrella at the doorway.'),quiz:Q(L('¿Qué conclusión tiene más apoyo?','Quina conclusió té més suport?','Which conclusion is best supported?'),O(['La calle estaba cortada','Probablemente había llovido','Lucía había ido al cine','La temperatura era de 10 °C'],['El carrer estava tallat','Probablement havia plogut','Llúcia havia anat al cine','La temperatura era de 10 °C'],['The street was closed','It had probably rained','Lucy had been to the cinema','The temperature was 10°C']),1,L('Los charcos y el paraguas son indicios de lluvia.','Els tolls i el paraigua són indicis de pluja.','Puddles and the umbrella are clues that point to rain.'))},
 {skill:'infer',title:L('Lo posible no es lo seguro','El que és possible no és segur','Possible does not mean certain'),lead:L('Una conclusión puede parecer lógica y, aun así, no estar demostrada por el texto.','Una conclusió pot semblar lògica i, així i tot, no estar demostrada pel text.','A claim can sound logical and still lack support from the passage.'),body:L('Aprende a distinguir entre <strong>lo que se afirma</strong>, <strong>lo que se puede inferir</strong> y <strong>lo que no sabemos</strong>. Especialmente en ciencias, historia y noticias, «puede ser» no equivale a «está demostrado».','Aprén a distingir entre <strong>allò que s’afirma</strong>, <strong>allò que es pot inferir</strong> i <strong>allò que no sabem</strong>. Especialment en ciències, història i notícies, «pot ser» no equival a «està demostrat».','Distinguish between <strong>what is stated</strong>, <strong>what can be inferred</strong> and <strong>what remains unknown</strong>. In science and news, “might be” does not mean “has been proved”.'),steps:O(['Lee cada opción como una afirmación precisa.','Señala qué frase del texto la respalda.','Si faltan datos, no la des por segura.'],['Llig cada opció com una afirmació precisa.','Assenyala quina frase del text la justifica.','Si falten dades, no la dones per segura.'],['Read each option as a precise claim.','Identify the sentence that supports it.','If evidence is missing, do not treat it as certain.']),ex:L('Al finalizar el partido, Ana sonreía; sin embargo, no conocemos el marcador.','En acabar el partit, Anna somreia; no obstant això, no coneixem el marcador.','At the end of the match, Anna was smiling; however, we do not know the score.'),quiz:Q(L('¿Qué afirmación NO podemos asegurar?','Quina afirmació NO podem assegurar?','Which claim can we NOT be certain of?'),O(['Ana sonreía','Hubo un partido','Ana ganó el partido','El marcador no aparece'],['Anna somreia','Hi va haver un partit','Anna va guanyar el partit','El marcador no apareix'],['Anna was smiling','There was a match','Anna won the match','No score is given']),2,L('Sonreír no demuestra que haya ganado.','Somriure no demostra que haja guanyat.','Smiling is not proof that she won.'))}
];
// v0.2 · Cuatro lecciones nuevas con minirretos en tres idiomas.
LESSONS.push(
 {skill:'types',title:L('¿Qué hace cada texto?','Què fa cada text?','What does each text do?'),
 lead:L('Reconoce la finalidad comunicativa antes de clasificar un fragmento.','Reconeix la finalitat comunicativa abans de classificar un fragment.','Identify a text’s purpose before classifying it.'),
 body:L('Los textos <strong>narrativos</strong> cuentan acontecimientos; los <strong>descriptivos</strong> representan características; los <strong>expositivos</strong> explican; los <strong>instructivos</strong> indican cómo actuar; y los <strong>argumentativos</strong> sostienen una postura con razones. Una misma obra puede combinar varios tipos.','Els textos <strong>narratius</strong> conten esdeveniments; els <strong>descriptius</strong> representen característiques; els <strong>expositius</strong> expliquen; els <strong>instructius</strong> indiquen com actuar; i els <strong>argumentatius</strong> defensen una postura amb raons. Una mateixa obra pot combinar diversos tipus.','<strong>Narrative</strong> texts recount events; <strong>descriptive</strong> texts depict features; <strong>expository</strong> texts explain; <strong>instructional</strong> texts tell us what to do; and <strong>argumentative</strong> texts defend positions with reasons. A single text may combine several modes.'),
 steps:O(['Pregunta cuál es la función principal del fragmento.','Busca acciones, rasgos, explicaciones, instrucciones o argumentos.','No te quedes con una palabra aislada: valora el conjunto.'],['Pregunta quina és la funció principal del fragment.','Busca accions, trets, explicacions, instruccions o arguments.','No et quedes amb una paraula aïllada: valora el conjunt.'],['Ask what the passage mainly aims to do.','Look for events, features, explanations, instructions or arguments.','Judge the whole passage rather than a single word.']),
 ex:L('Limpia el pincel, sumérgelo en agua y sécalo con un paño.','Neteja el pinzell, submergix-lo en aigua i eixuga’l amb un drap.','Wash the brush, dip it in water and dry it with a cloth.'),
 quiz:Q(L('¿Cuál es la finalidad predominante?','Quina és la finalitat predominant?','What is the main purpose?'),
 O(['Narrar una historia','Describir un paisaje','Dar instrucciones','Defender una tesis'],['Narrar una història','Descriure un paisatge','Donar instruccions','Defensar una tesi'],['Tell a story','Describe a landscape','Give instructions','Defend an argument']),2,
 L('Las formas verbales indican acciones que debe realizar el lector.','Les formes verbals indiquen accions que ha de fer el lector.','The verbs tell the reader which actions to perform.'))},
 {skill:'types',title:L('Tipos y géneros no son lo mismo','Tipus i gèneres no són el mateix','Text types are not genres'),
 lead:L('Distingue cómo se organiza un discurso del género en que se presenta.','Distingix com s’organitza un discurs del gènere en què es presenta.','Separate how a text is written from the genre in which it appears.'),
 body:L('La <strong>tipología textual</strong> describe el modo de organizar el contenido: narrar, describir, explicar, argumentar o instruir. El <strong>género discursivo</strong> responde a una práctica comunicativa concreta: noticia, reseña, informe, ensayo, receta, entrevista o cuento. Una noticia suele informar, pero puede contener narración y descripción.','La <strong>tipologia textual</strong> descriu el mode d’organitzar el contingut: narrar, descriure, explicar, argumentar o instruir. El <strong>gènere discursiu</strong> correspon a una pràctica comunicativa concreta: notícia, ressenya, informe, assaig, recepta, entrevista o conte. Una notícia sol informar, però pot contindre narració i descripció.','<strong>Text type</strong> concerns the organisation of ideas: narrating, describing, explaining, arguing or instructing. <strong>Genre</strong> is a communicative form such as a news report, review, research report, essay, recipe, interview or short story. A news report can contain narrative and descriptive passages.'),
 steps:O(['Determina para qué se publica el texto.','Identifica su formato o género.','Reconoce la tipología dominante, aunque haya fragmentos mezclados.'],['Determina per a què es publica el text.','Identifica’n el format o gènere.','Reconeix la tipologia dominant, encara que hi haja fragments mesclats.'],['Determine why the text was published.','Identify its form or genre.','Find the dominant text mode, even if several are mixed.']),
 ex:L('Una noticia sobre el cierre de una carretera explica las causas, cuenta qué ocurrió ayer y recoge declaraciones.','Una notícia sobre el tall d’una carretera explica les causes, conta què va passar ahir i arreplega declaracions.','A news report about a road closure explains the causes, recounts yesterday’s events and includes comments.'),
 quiz:Q(L('¿Cuál es la afirmación más correcta?','Quina és l’afirmació més correcta?','Which statement is most accurate?'),
 O(['La noticia es un género que puede combinar tipologías','Una noticia nunca narra acontecimientos','Toda narración es una noticia','Los géneros y las tipologías son idénticos'],['La notícia és un gènere que pot combinar tipologies','Una notícia mai narra esdeveniments','Tota narració és una notícia','Els gèneres i les tipologies són idèntics'],['A news report is a genre that can combine text types','News reports never narrate events','Every narrative is a news report','Genres and text types are identical']),0,
 L('Género y tipología son categorías distintas que pueden cruzarse.','Gènere i tipologia són categories diferents que poden combinar-se.','Genre and text type describe different, overlapping aspects.'))},
 {skill:'vocab',title:L('Deduce palabras desconocidas','Dedueix paraules desconegudes','Infer unfamiliar words'),
 lead:L('El contexto suele ofrecer pistas para entender una palabra nueva.','El context sol donar pistes per a entendre una paraula nova.','Context often provides clues to the meaning of an unfamiliar word.'),
 body:L('Una <strong>pista contextual</strong> puede ser una definición cercana, un ejemplo, un sinónimo, un contraste o una consecuencia. No basta con elegir una palabra parecida: el significado debe encajar en la frase. Cuando el contexto no es suficiente, es mejor reconocer la duda que inventar un significado.','Una <strong>pista contextual</strong> pot ser una definició pròxima, un exemple, un sinònim, un contrast o una conseqüència. No n’hi ha prou de triar una paraula pareguda: el significat ha d’encaixar en la frase. Quan el context no és suficient, és millor reconéixer el dubte que inventar un significat.','A <strong>context clue</strong> may be a nearby definition, example, synonym, contrast or consequence. A similar-looking word is not enough: its meaning must fit the sentence. When evidence is insufficient, acknowledge uncertainty rather than inventing a meaning.'),
 steps:O(['Lee la oración completa y las frases próximas.','Localiza contrastes, definiciones o consecuencias.','Prueba el posible significado en el mismo lugar del texto.'],['Llig l’oració completa i les frases pròximes.','Localitza contrastos, definicions o conseqüències.','Prova el possible significat en el mateix lloc del text.'],['Read the whole sentence and surrounding sentences.','Look for contrasts, definitions and consequences.','Test the proposed meaning in the original sentence.']),
 ex:L('La carretera era sinuosa: tenía tantas curvas que el autobús avanzaba despacio.','La carretera era sinuosa: tenia tantes revoltes que l’autobús avançava a poc a poc.','The road was winding: it had so many bends that the bus moved slowly.'),
 quiz:Q(L('¿Qué significa «sinuosa»?','Què significa «sinuosa»?','What does “winding” mean?'),
 O(['Completamente recta','Con muchas curvas','Muy iluminada','Abandonada'],['Completament recta','Amb moltes revoltes','Molt il·luminada','Abandonada'],['Completely straight','Full of bends','Well lit','Abandoned']),1,
 L('La explicación tras los dos puntos permite deducir el sentido.','L’explicació després dels dos punts permet deduir el sentit.','The phrase after the colon provides a definition by example.'))},
 {skill:'vocab',title:L('Vocabulario especializado y precisión','Vocabulari especialitzat i precisió','Specialised vocabulary and precision'),
 lead:L('Una palabra adquiere un sentido preciso según el ámbito en que aparece.','Una paraula adquirix un sentit precís segons l’àmbit en què apareix.','Words gain specific meanings in different subjects.'),
 body:L('En ciencia, historia o filosofía, algunos términos tienen significados <strong>especializados</strong>. Por ejemplo, «trabajo» puede referirse a una ocupación o a una magnitud física relacionada con la transferencia de energía. Al inferir un tecnicismo conviene comprobar el tema y las explicaciones del fragmento, sin forzar una acepción cotidiana.','En ciència, història o filosofia, alguns termes tenen significats <strong>especialitzats</strong>. Per exemple, «treball» pot referir-se a una ocupació o a una magnitud física relacionada amb la transferència d’energia. En inferir un tecnicisme convé comprovar el tema i les explicacions del fragment, sense forçar-ne un sentit quotidià.','In science, history and philosophy, words may have <strong>specialised meanings</strong>. For instance, “work” can mean employment or, in physics, a quantity related to energy transfer. To infer a technical term, examine the subject and the passage’s explanation rather than forcing its everyday meaning.'),
 steps:O(['Identifica la disciplina y el tema.','Observa si el texto define o ejemplifica el término.','Descarta acepciones habituales que no encajan.'],['Identifica la disciplina i el tema.','Observa si el text definix o exemplifica el terme.','Descarta sentits habituals que no encaixen.'],['Identify the subject area and topic.','Check for a definition or example nearby.','Reject everyday meanings that do not fit.']),
 ex:L('El trabajo mecánico realizado depende de la fuerza y del desplazamiento en la dirección de esa fuerza.','El treball mecànic realitzat depén de la força i del desplaçament en la direcció d’eixa força.','The mechanical work done depends on the force and the displacement in that force’s direction.'),
 quiz:Q(L('¿En qué sentido se usa «trabajo»?','En quin sentit s’usa «treball»?','In what sense is “work” used?'),
 O(['Como esfuerzo escolar','Como empleo remunerado','Como tiempo de una actividad','Como magnitud física vinculada a una fuerza y un desplazamiento'],['Com a esforç escolar','Com a ocupació remunerada','Com a temps d’una activitat','Com a magnitud física vinculada a una força i un desplaçament'],['School homework','Paid employment','Time spent on a task','A physical quantity linked to force and displacement']),3,
 L('El contexto físico precisa el significado técnico del término.','El context físic precisa el significat tècnic del terme.','The physics context determines the technical meaning.'))}
);

LESSONS.push({skill:'listen',title:L('Escuchar para comprender','Escoltar per a comprendre','Listening for understanding'),
lead:L('Escuchar requiere identificar las ideas esenciales sin depender de un texto escrito.','Escoltar exigix identificar les idees essencials sense dependre d’un text escrit.','Listening requires identifying key ideas without relying on a written passage.'),
body:L('La comprensión oral exige <strong>mantener la atención</strong>, relacionar lo que se escucha e inferir información. Antes de escuchar, fíjate en el título y el ámbito; durante la reproducción, identifica la idea principal, los hechos y las relaciones. <strong>Una inferencia debe estar respaldada</strong> por lo oído, no por una suposición.','La comprensió oral exigix <strong>mantindre l’atenció</strong>, relacionar el que s’escolta i inferir informació. Abans d’escoltar, fixa’t en el títol i l’àmbit; durant la reproducció, identifica la idea principal, els fets i les relacions. <strong>Una inferència ha d’estar justificada</strong> pel que has sentit, no per una suposició.','Listening comprehension requires <strong>attention</strong>, connections between ideas and inference. Before listening, use the title and subject for context. As you listen, identify the main idea, facts and relationships. <strong>Inferences need evidence</strong> from what you heard, not guesses.'),
steps:O(['Consulta el título y el área antes de escuchar.','Escucha el texto completo sin buscar una transcripción.','Responde diferenciando lo escuchado de lo supuesto.'],['Consulta el títol i l’àrea abans d’escoltar.','Escolta el text complet sense buscar una transcripció.','Respon distingint el que has sentit del que has suposat.'],['Check the title and subject before listening.','Listen to the whole recording without a transcript.','Distinguish what you heard from what you assumed.']),
ex:L('Ejemplo: si un científico dice que dos variables cambiaron a la vez, no puedes atribuir con certeza el resultado a solo una.','Exemple: si un científic diu que dos variables van canviar alhora, no pots atribuir amb certesa el resultat només a una.','Example: if a scientist says two variables changed together, you cannot confidently attribute the result to just one.'),
quiz:Q(L('¿Qué debes evitar al responder después de escuchar?','Què has d’evitar en respondre després d’escoltar?','What should you avoid when answering after listening?'),O(['Relacionar las pistas','Identificar el tema','Añadir datos que no se han dicho','Reconocer causas y consecuencias'],['Relacionar les pistes','Identificar el tema','Afegir dades que no s’han dit','Reconéixer causes i conseqüències'],['Connecting clues','Identifying the topic','Adding details that were not mentioned','Recognising cause and effect']),2,L('Una buena inferencia parte de lo que se ha escuchado.','Una bona inferència partix del que s’ha escoltat.','A good inference is grounded in what you heard.'))});
// v0.4 · Cuatro lecciones con retos: recursos expresivos y relaciones argumentativas.
LESSONS.push(
 {skill:'figure',title:L('Lenguaje literal y figurado','Llenguatge literal i figurat','Literal and figurative language'),
 lead:L('Las expresiones pueden sugerir más de lo que dicen literalmente.','Les expressions poden suggerir més del que diuen literalment.','An expression can suggest more than its literal meaning.'),
 body:L('En el lenguaje <strong>literal</strong>, las palabras mantienen su sentido habitual. En el <strong>figurado</strong>, una imagen sugiere una idea: «La mochila pesa una tonelada» exagera un peso; «Su voz era un refugio» asocia una voz con la seguridad. Para comprender el recurso, pregunta qué relación une los dos términos y qué efecto produce en el contexto.','En el llenguatge <strong>literal</strong>, les paraules mantenen el sentit habitual. En el <strong>figurat</strong>, una imatge suggerix una idea: «La motxilla pesa una tona» exagera un pes; «La seua veu era un refugi» associa una veu amb la seguretat. Per a comprendre el recurs, pregunta quina relació unix els dos termes i quin efecte produïx en el context.','In <strong>literal</strong> language, words retain their usual meanings. In <strong>figurative</strong> language, an image suggests something else: “The bag weighs a ton” exaggerates weight; “Her voice was a shelter” links a voice to feelings of safety. Ask which shared quality connects the images and what effect the expression creates.'),
 steps:O(['Lee la expresión dentro de su situación.','Comprueba si las palabras se pueden entender al pie de la letra.','Explica la idea o emoción que transmite la imagen.'],['Llig l’expressió dins de la situació.','Comprova si les paraules es poden entendre literalment.','Explica la idea o emoció que transmet la imatge.'],['Read the expression in context.','Check whether its literal meaning makes sense.','Explain the idea or feeling conveyed by the image.']),
 ex:L('Tras la discusión, Elena le dijo a su amiga: «Tus palabras fueron un abrazo».','Després de la discussió, Elena va dir a l’amiga: «Les teues paraules van ser una abraçada».','After the argument, Elena told her friend, “Your words were a hug.”'),
 quiz:Q(L('¿Qué sugiere la expresión del ejemplo?','Què suggerix l’expressió de l’exemple?','What does the example suggest?'),O(['Que las palabras eran objetos físicos','Que su amiga le transmitió consuelo','Que Elena dejó de escuchar','Que se comunicaron sin hablar'],['Que les paraules eren objectes físics','Que l’amiga li va transmetre consol','Que Elena va deixar d’escoltar','Que es van comunicar sense parlar'],['Words were physical objects','Her friend’s words brought comfort','Elena stopped listening','They communicated without speaking']),1,L('«Abrazo» funciona como metáfora de apoyo y consuelo emocional.','«Abraçada» funciona com a metàfora de suport i consol emocional.','“Hug” is a metaphor for emotional support and reassurance.'))},
 {skill:'figure',title:L('Recursos literarios y su efecto','Recursos literaris i el seu efecte','Literary devices and their effects'),
 lead:L('Reconocer un recurso sirve para interpretar por qué se utiliza.','Reconéixer un recurs servix per a interpretar per què s’utilitza.','Identifying a device matters because of what it achieves.'),
 body:L('La <strong>metáfora</strong> identifica dos realidades por una semejanza; el <strong>símil</strong> las compara explícitamente; la <strong>personificación</strong> atribuye rasgos humanos a seres no humanos; la <strong>hipérbole</strong> exagera; la <strong>anáfora</strong> repite un inicio; la <strong>ironía</strong> comunica un sentido distinto u opuesto al literal, reconocible por el contexto. No basta con memorizar nombres: interpreta el significado y el efecto en quien lee.','La <strong>metàfora</strong> identifica dos realitats per una semblança; el <strong>símil</strong> les compara explícitament; la <strong>personificació</strong> atribuïx trets humans a éssers no humans; la <strong>hipèrbole</strong> exagera; l’<strong>anàfora</strong> repetix un inici; la <strong>ironia</strong> comunica un sentit diferent o oposat al literal, recognoscible pel context. No basta memoritzar noms: interpreta el significat i l’efecte en qui llig.','A <strong>metaphor</strong> identifies one thing with another; a <strong>simile</strong> compares them explicitly; <strong>personification</strong> gives human traits to non-human things; <strong>hyperbole</strong> exaggerates; <strong>anaphora</strong> repeats an opening; <strong>irony</strong> conveys a meaning different from the literal one. Naming the device is not enough: explain what it achieves.'),
 steps:O(['Localiza una formulación expresiva.','Identifica cómo funciona, sin aislarla del contexto.','Relaciona el recurso con la emoción, la idea o la intención.'],['Localitza una formulació expressiva.','Identifica com funciona, sense aïllar-la del context.','Relaciona el recurs amb l’emoció, la idea o la intenció.'],['Identify an expressive phrase.','Recognise how the device works in context.','Relate it to the emotion, idea or intention conveyed.']),
 ex:L('«¡Qué silencio tan agradable!», dijo cuando las obras empezaron a las siete.','«Quin silenci més agradable!», va dir quan les obres van començar a les set.','“What a wonderfully peaceful morning!” she said as drilling began at seven.'),
 quiz:Q(L('¿Qué recurso permite entender la frase?','Quin recurs permet entendre la frase?','Which device explains the remark?'),O(['Una descripción literal','Una enumeración','La ironía','Una definición científica'],['Una descripció literal','Una enumeració','La ironia','Una definició científica'],['Literal description','Enumeration','Irony','Scientific definition']),2,L('Se expresa aparente satisfacción ante una situación ruidosa y desagradable.','S’expressa una satisfacció aparent davant d’una situació sorollosa i desagradable.','Apparent praise clashes with the noisy, unpleasant situation.'))},
 {skill:'logic',title:L('Causas, consecuencias y condiciones','Causes, conseqüències i condicions','Causes, results and conditions'),
 lead:L('Comprender un texto exige reconocer qué relación une sus ideas.','Comprendre un text exigix reconéixer quina relació unix les idees.','Understanding a text means recognising how its ideas relate.'),
 body:L('«<strong>Porque</strong>» suele introducir una causa; «<strong>por tanto</strong>» anuncia una conclusión; «<strong>sin embargo</strong>» introduce un contraste; «<strong>si</strong>» expresa una condición. Pero las palabras no bastan: comprueba qué afirmación depende de cuál. Una condición puede ser suficiente sin ser la única causa posible.','«<strong>Perquè</strong>» sol introduir una causa; «<strong>per tant</strong>» anuncia una conclusió; «<strong>tanmateix</strong>» introduïx un contrast; «<strong>si</strong>» expressa una condició. Però les paraules no basten: comprova quina afirmació depén de quina altra. Una condició pot ser suficient sense ser l’única causa possible.','“<strong>Because</strong>” often introduces a reason; “<strong>therefore</strong>” marks a conclusion; “<strong>however</strong>” introduces contrast; “<strong>if</strong>” sets a condition. Connectors help, but you must also check the logic. A sufficient condition need not be the only possible cause.'),
 steps:O(['Identifica dos ideas relacionadas.','Reconoce si se explican, se oponen o dependen una de otra.','Comprueba que no conviertes una posibilidad en certeza.'],['Identifica dos idees relacionades.','Reconeix si s’expliquen, s’oposen o depenen l’una de l’altra.','Comprova que no convertixes una possibilitat en certesa.'],['Identify the two linked ideas.','Decide whether the link expresses cause, contrast or condition.','Avoid treating a possibility as a certainty.']),
 ex:L('Si se corta la luz, la pantalla se apaga. La pantalla está apagada.','Si es talla la llum, la pantalla s’apaga. La pantalla està apagada.','If the power fails, the screen turns off. The screen is off.'),
 quiz:Q(L('¿Qué podemos deducir con certeza?','Què podem deduir amb certesa?','What can we conclude with certainty?'),O(['Se ha cortado la luz','La pantalla nunca funciona','La pantalla podría estar apagada por otras causas','Hay una avería irreversible'],['S’ha tallat la llum','La pantalla no funciona mai','La pantalla podria estar apagada per altres causes','Hi ha una avaria irreversible'],['The power has failed','The screen never works','The screen may be off for another reason','There is permanent damage']),2,L('Una pantalla puede estar apagada por más motivos: no se puede afirmar una única causa.','Una pantalla pot estar apagada per més motius: no es pot afirmar una única causa.','The screen could be off for other reasons; one trigger does not establish the cause.'))},
 {skill:'logic',title:L('Tesis, argumentos y límites de la evidencia','Tesi, arguments i límits de l’evidència','Claims, arguments and evidence limits'),
 lead:L('Una conclusión sólida necesita razones que realmente la respalden.','Una conclusió sòlida necessita raons que realment la justifiquen.','A strong claim needs evidence that actually supports it.'),
 body:L('La <strong>tesis</strong> es una posición que se defiende; los <strong>argumentos</strong> ofrecen razones o evidencias. Pregunta si los datos justifican esa conclusión o si se produce un salto injustificado. Que dos hechos ocurran juntos no demuestra que uno cause el otro. Reconocer un límite no equivale a negar todo el argumento: permite expresarlo con precisión.','La <strong>tesi</strong> és una posició que es defensa; els <strong>arguments</strong> oferixen raons o evidències. Pregunta si les dades justifiquen la conclusió o si es produïx un salt injustificat. Que dos fets ocórreguen alhora no demostra que l’un cause l’altre. Reconéixer un límit no equival a negar tot l’argument: permet expressar-lo amb precisió.','A <strong>claim</strong> is a position being defended; <strong>arguments</strong> give reasons or evidence. Ask whether the evidence warrants the conclusion. Two events occurring together does not establish that one caused the other. Recognising a limitation does not invalidate everything: it enables a more precise claim.'),
 steps:O(['Subraya la afirmación principal.','Localiza las razones o los datos que se aportan.','Comprueba si se han descartado otras explicaciones.'],['Subratlla l’afirmació principal.','Localitza les raons o les dades aportades.','Comprova si s’han descartat altres explicacions.'],['Identify the main claim.','Locate the supporting reasons and data.','Check whether alternative explanations have been ruled out.']),
 ex:L('En un grupo de veinte personas, quienes tomaron apuntes obtuvieron mejores notas; no se comprobó si antes tenían distinto nivel.','En un grup de vint persones, qui prenia apunts va obtindre millors notes; no es va comprovar si abans tenien nivells diferents.','In a group of twenty, note-takers achieved higher marks; their previous attainment was not checked.'),
 quiz:Q(L('¿Cuál es la conclusión más fiel?','Quina conclusió és més fidel?','Which conclusion is most faithful?'),O(['Tomar apuntes causa siempre una mejora','Quienes tomaron apuntes obtuvieron mejores notas en este grupo','Nadie aprende sin apuntes','El nivel previo fue idéntico'],['Prendre apunts sempre causa una millora','Qui prenia apunts va obtindre millors notes en este grup','Ningú aprén sense apunts','El nivell previ era idèntic'],['Taking notes always causes improvement','Note-takers scored higher in this group','Nobody can learn without notes','Previous attainment was identical']),1,L('Los resultados describen una asociación, no demuestran causalidad ni permiten generalizar a todos.','Els resultats descriuen una associació, no demostren causalitat ni permeten generalitzar a tots.','The observation shows an association, not proven causation or a universal result.'))}
);

const LESSON_EDITORIAL_FIXES = {"0":{"es":"Los árboles ofrecen ventajas","va":"Els arbres oferixen avantatges","en":"Trees bring benefits"},"1":{"es":"Sin emisiones de escape, pero con otros impactos","va":"Sense emissions d’escapament, però amb altres impactes","en":"No exhaust emissions, but other impacts"},"5":{"es":"Una noticia puede combinar tipologías","va":"Una notícia pot combinar tipologies","en":"A news report may mix text types"},"7":{"es":"Magnitud física ligada a fuerza y desplazamiento","va":"Magnitud física lligada a força i desplaçament","en":"A quantity derived from force and displacement"},"11":{"es":"Podría haber otra causa","va":"Podria haver-hi una altra causa","en":"There could be another cause"},"8":{"es":"Añadir datos que no se han dicho","va":"Afegir dades que no s’han dit","en":"Adding details not heard"},"12":{"es":"En este grupo, tomar apuntes se asoció a mejores notas","va":"En este grup, els apunts s’associen a millors notes","en":"Notes were linked to higher grades in this group"}};
for(const [k,translation] of Object.entries(LESSON_EDITORIAL_FIXES)){
 const quiz=LESSONS[Number(k)].quiz;
 for(const lang of ['es','va','en']) quiz.choices[lang][quiz.answer]=translation[lang];
}

const LESSON_OTHER_FIXES={"7":{"0":["Como tareas escolares que requieren esfuerzo","Com a tasques escolars que requerixen esforç","An assignment requiring effort at school"],"1":["Como una actividad profesional remunerada","Com a activitat professional remunerada","As a paid professional occupation"],"2":["Como el tiempo dedicado a una actividad","Com al temps dedicat a una activitat","The time spent on a particular activity"]},"11":{"0":["Se ha interrumpido el suministro eléctrico","S’ha interromput el subministrament elèctric","There has been a power cut"],"1":["La pantalla ha dejado de funcionar","La pantalla ha deixat de funcionar","The screen has stopped working"],"3":["Se ha producido una avería permanente","S’ha produït una avaria permanent","A permanent fault has occurred"]},"12":{"0":["Tomar apuntes explica por sí solo la mejora","Prendre apunts explica per si sol la millora","Taking notes caused the better results"],"2":["Sin apuntes no es posible aprender en clase","Sense apunts no és possible aprendre a classe","Learning without notes is impossible"],"3":["Todos tenían exactamente el mismo nivel previo","Tots tenien exactament el mateix nivell previ","Everyone had the same starting attainment"]}};
for(const [k,items] of Object.entries(LESSON_OTHER_FIXES)){
  const quiz=LESSONS[Number(k)].quiz;
  for(const [index,translation] of Object.entries(items)){
    quiz.choices.es[Number(index)]=translation[0]; quiz.choices.va[Number(index)]=translation[1]; quiz.choices.en[Number(index)]=translation[2];
  }
}

// v0.5 · Lecciones de lectura crítica.
LESSONS.push(
 {skill:'critical',title:L('Hechos, opiniones e interpretaciones','Fets, opinions i interpretacions','Facts, opinions and interpretations'),
 lead:L('Reconoce qué se ha observado y qué valoración añade quien escribe.','Reconeix què s’ha observat i quina valoració afig qui escriu.','Separate what was observed from someone’s judgement.'),
 body:L('Un <strong>hecho comprobable</strong> puede verificarse con datos o evidencias. Una <strong>opinión</strong> expresa una valoración. Una <strong>interpretación</strong> propone una explicación de los hechos, que puede ser razonable sin estar demostrada. Cuidado con palabras como «siempre», «nadie» o «el mejor»: pueden ir más allá de la información disponible.',
 'Un <strong>fet comprovable</strong> es pot verificar amb dades o evidències. Una <strong>opinió</strong> expressa una valoració. Una <strong>interpretació</strong> proposa una explicació dels fets, que pot ser raonable sense estar demostrada. Para atenció a paraules com «sempre», «ningú» o «el millor»: poden anar més enllà de les dades.',
 'A <strong>verifiable fact</strong> can be checked against evidence. An <strong>opinion</strong> expresses a value judgement. An <strong>interpretation</strong> suggests an explanation that may be plausible without being proved. Words like “always”, “nobody”, or “the best” may go beyond the evidence.'),
 steps:O(['Localiza la afirmación que se hace.','Distingue la observación de la valoración.','Comprueba si los datos permiten afirmarla.'],['Localitza l’afirmació que es fa.','Distinguix l’observació de la valoració.','Comprova si les dades permeten afirmar-la.'],['Find the exact claim being made.','Separate observation from personal judgement.','Check what the evidence actually supports.']),
 ex:L('Se vendieron 40 entradas. «Fue el mejor concierto del año», escribió una asistente.','Es van vendre 40 entrades. «Fou el millor concert de l’any», escrigué una assistent.','Forty tickets were sold. “It was the best concert of the year,” wrote an attendee.'),
 quiz:Q(L('¿Qué afirmación se puede verificar con un registro?','Quina afirmació es pot verificar amb un registre?','Which statement could be checked against records?'),
 O(['El concierto fue especialmente emocionante','La entrada resultó demasiado cara','Se vendieron cuarenta entradas','Fue el espectáculo musical más logrado'],['El concert fou especialment emocionant','L’entrada resultà massa cara','Es vengueren quaranta entrades','Fou l’espectacle musical més reeixit'],['The concert was especially moving','The ticket was far too expensive','Forty tickets were sold','It was the finest musical performance']),2,
 L('La cantidad vendida se contrasta con un registro; las otras expresan valoraciones.','La quantitat venuda es contrasta amb un registre; les altres són valoracions.','Ticket sales can be checked in records; the others are value judgements.'))},
 {skill:'critical',title:L('Fuentes, intereses y pruebas','Fonts, interessos i proves','Sources, interests and evidence'),
 lead:L('No basta con que una afirmación aparezca publicada o se repita.','No basta que una afirmació estiga publicada o es repetisca.','A repeated or published claim is not automatically true.'),
 body:L('Para valorar una información, pregunta <strong>quién la emite</strong>, <strong>cuándo</strong>, con qué <strong>propósito</strong> y sobre qué <strong>pruebas</strong> se apoya. Una fuente interesada no es necesariamente falsa; conviene contrastarla. Una foto sin contexto, un porcentaje sin muestra o un gráfico con ejes recortados pueden inducir a conclusiones exageradas.',
 'Per a valorar una informació, pregunta <strong>qui l’emet</strong>, <strong>quan</strong>, amb quina <strong>finalitat</strong> i quines <strong>proves</strong> aporta. Una font amb interessos no és necessàriament falsa; convé contrastar-la. Una foto sense context, un percentatge sense mostra o un gràfic amb eixos retallats poden induir a conclusions exagerades.',
 'To assess information, ask <strong>who</strong> published it, <strong>when</strong>, <strong>why</strong> and with what <strong>evidence</strong>. An interested source is not necessarily wrong but merits checking. A photo without context, a percentage without its sample or a chart with a truncated axis can mislead.'),
 steps:O(['Identifica autoría, fecha e intención.','Busca la evidencia concreta que se aporta.','Contrasta con una fuente independiente pertinente.'],['Identifica autoria, data i intenció.','Busca l’evidència concreta que s’aporta.','Contrasta amb una font independent pertinent.'],['Identify the author, date and purpose.','Look for the evidence actually presented.','Cross-check with a relevant independent source.']),
 ex:L('Un anuncio afirma que una bebida «mejora la memoria» y cita diez testimonios positivos, pero ningún estudio comparativo.','Un anunci afirma que una beguda «millora la memòria» i cita deu testimonis positius, però cap estudi comparatiu.','An advert says a drink “improves memory” and gives ten positive testimonials but no comparative study.'),
 quiz:Q(L('¿Qué dato permitiría evaluar mejor la eficacia alegada?','Quina dada permetria avaluar millor l’eficàcia al·legada?','What would best test the claimed effectiveness?'),
 O(['El número de veces que se compartió','El diseño visual de la campaña','La popularidad de quienes aparecen','Los resultados de pruebas comparativas'],['El nombre de vegades que s’ha compartit','El disseny visual de la campanya','La popularitat de qui hi apareix','Els resultats de proves comparatives'],['The number of times it was shared','The appearance of the advertisement','The popularity of its testimonials','The results of comparative testing']),3,
 L('Para evaluar una mejora se necesitan comparaciones controladas, no solo testimonios favorables.','Per a avaluar una millora calen comparacions controlades, no sols testimonis favorables.','A claimed improvement needs suitable comparisons, not just favourable anecdotes.'))},
 {skill:'critical',title:L('Falacias, sesgos y conclusiones','Fal·làcies, biaixos i conclusions','Fallacies, biases and conclusions'),
 lead:L('Aprende a detectar razonamientos persuasivos que exceden sus pruebas.','Aprén a detectar raonaments persuasius que van més enllà de les proves.','Spot persuasive claims that stretch their evidence.'),
 body:L('Un <strong>falso dilema</strong> presenta dos opciones como únicas cuando hay otras. Una <strong>generalización precipitada</strong> extrapola a partir de pocos casos. Confundir <strong>correlación con causalidad</strong> supone que una relación demuestra por sí sola una causa. Un <strong>sesgo</strong> puede afectar a la selección de datos o fuentes. La lectura crítica busca argumentos sólidos, no etiquetas para descalificar a quien piensa distinto.',
 'Un <strong>fals dilema</strong> presenta dos opcions com a úniques quan n’hi ha més. Una <strong>generalització precipitada</strong> extrapola a partir de pocs casos. Confondre <strong>correlació amb causalitat</strong> suposa que una relació demostra per si sola una causa. Un <strong>biaix</strong> pot afectar la selecció de dades o fonts. La lectura crítica busca arguments sòlids, no etiquetes per a desqualificar ningú.',
 'A <strong>false dilemma</strong> presents only two choices when others exist. <strong>Hasty generalisation</strong> extends a small observation too far. Confusing <strong>correlation with causation</strong> assumes that an association proves a cause. <strong>Bias</strong> may distort which evidence gets collected or reported. Critical reading tests arguments rather than attacking people.'),
 steps:O(['Identifica la tesis defendida.','Revisa las pruebas y posibles alternativas.','Formula una conclusión proporcionada a los datos.'],['Identifica la tesi defensada.','Revisa les proves i possibles alternatives.','Formula una conclusió proporcionada a les dades.'],['Identify the claim being defended.','Check evidence and alternative explanations.','Make a conclusion proportional to the data.']),
 ex:L('«O se prohíben todos los videojuegos o nadie aprenderá a gestionar su tiempo».','«O es prohibixen tots els videojocs o ningú aprendrà a gestionar el temps».','“Either all video games are banned or nobody will learn to manage their time.”'),
 quiz:Q(L('¿Qué objeción cuestiona mejor ese razonamiento?','Quina objecció qüestiona millor eixe raonament?','Which objection best challenges that reasoning?'),
 O(['Existen otras opciones de educación y límites','Los videojuegos son siempre educativos','El tiempo de juego nunca se puede controlar','Todas las prohibiciones dan buenos resultados'],['Existixen altres opcions d’educació i límits','Els videojocs són sempre educatius','El temps de joc mai es pot controlar','Totes les prohibicions donen bons resultats'],['Other rules and limits are possible','Video games are always educational','Gaming time can never be controlled','Every ban produces positive results']),0,
 L('La afirmación reduce las posibilidades a dos, aunque existen respuestas intermedias.','L’afirmació reduïx les possibilitats a dos, encara que hi ha alternatives intermèdies.','The claim presents only two options when intermediate approaches exist.'))}
);

const ORDER={types:0,essential:1,vocab:2,infer:3,figure:4,logic:5,critical:6,listen:7};LESSONS.sort((a,b)=>ORDER[a.skill]-ORDER[b.skill]);
// Tres lecciones nuevas de comprensión multimodal con minirretos.
LESSONS.push(
 {skill:'multimodal',title:L('Leer un gráfico con precisión','Llegir un gràfic amb precisió','Reading a chart accurately'),
 lead:L('Un gráfico comunica relaciones, pero sus ejes, unidades y escalas condicionan la lectura.','Un gràfic comunica relacions, però els eixos, les unitats i les escales condicionen la lectura.','Charts communicate relationships, but their axes, units and scales affect interpretation.'),
 body:L('Antes de extraer conclusiones comprueba <strong>qué representa cada eje</strong>, en qué unidades se mide y cuál es la escala. No confundas una tendencia observada con todos los valores posibles. En los gráficos de barras, el cero es una referencia relevante; en los de líneas, observa siempre dónde comienza el eje vertical.','Abans d’extraure conclusions comprova <strong>què representa cada eix</strong>, en quines unitats es mesura i quina escala s’utilitza. No confundisques una tendència observada amb tots els valors possibles. En els gràfics de barres, el zero és una referència rellevant; en els de línies, observa on comença l’eix vertical.','Before drawing conclusions, check <strong>what each axis represents</strong>, the units and the scale. Do not confuse an observed trend with values that were never measured. Zero matters particularly for bar charts; on line graphs, always check the vertical axis starting point.'),
 steps:O(['Lee el título, los ejes y las unidades.','Localiza las categorías o momentos comparados.','Extrae solo conclusiones compatibles con los datos.'],['Llig el títol, els eixos i les unitats.','Localitza les categories o moments comparats.','Extrau només conclusions compatibles amb les dades.'],['Read the title, axes and units.','Locate the categories or dates being compared.','Draw only conclusions consistent with the figures.']),
 ex:L('Mediciones: lunes 6; martes 9; miércoles 7. La cifra más alta corresponde al martes, pero el gráfico no explica por qué.','Mesures: dilluns 6; dimarts 9; dimecres 7. La xifra més alta és la de dimarts, però el gràfic no explica per què.','Readings: Monday 6, Tuesday 9, Wednesday 7. Tuesday is highest, but the figures do not explain why.'),
 quiz:Q(L('¿Qué puede concluirse con esos datos?','Què es pot concloure amb eixes dades?','What can be concluded from those figures?'),O(['El martes tuvo la medición más alta.','El lunes fue el día con más cambios.','El miércoles duplicó el valor del lunes.','La causa del máximo fue el tiempo.'],['Dimarts tingué la mesura més alta.','Dilluns fou el dia amb més canvis.','Dimecres duplicà el valor de dilluns.','La causa del màxim fou el temps.'],['Tuesday had the highest recorded value.','Monday had the greatest variation.','Wednesday doubled Monday’s value.','The weather caused the maximum.']),0,L('9 es mayor que 6 y 7; no se aporta ninguna explicación causal.','9 és més gran que 6 i 7; no s’aporta cap explicació causal.','Nine is greater than six and seven, but no cause is given.'))},
 {skill:'multimodal',title:L('Comparar cantidades y proporciones','Comparar quantitats i proporcions','Comparing counts and proportions'),
 lead:L('Una cifra absoluta puede sugerir una conclusión diferente de un porcentaje.','Una xifra absoluta pot suggerir una conclusió diferent d’un percentatge.','An absolute count can suggest a different conclusion from a percentage.'),
 body:L('Una <strong>cantidad absoluta</strong> cuenta casos; una <strong>proporción</strong> compara una parte con el total correspondiente. Cuando los grupos tienen tamaños distintos, es necesario comprobar el denominador. Así evitamos confundir «más casos» con «mayor frecuencia relativa».','Una <strong>quantitat absoluta</strong> compta casos; una <strong>proporció</strong> compara una part amb el total corresponent. Quan els grups tenen grandàries diferents, cal comprovar el denominador. Així evitem confondre «més casos» amb «major freqüència relativa».','An <strong>absolute count</strong> is a number of cases; a <strong>proportion</strong> compares a subset with its group total. If groups differ in size, check the denominator. “More cases” does not necessarily mean “a higher rate”.'),
 steps:O(['Comprueba el total de cada grupo.','Divide la parte entre ese total.','Compara porcentajes o fracciones equivalentes.'],['Comprova el total de cada grup.','Dividix la part entre el total.','Compara percentatges o fraccions equivalents.'],['Check the total size of each group.','Divide the relevant count by that total.','Compare the resulting rates or fractions.']),
 ex:L('Grupo A: 6 de 10; grupo B: 8 de 20. B tiene más casos, pero A tiene mayor proporción.','Grup A: 6 de 10; grup B: 8 de 20. B té més casos, però A té major proporció.','Group A: 6 out of 10; group B: 8 out of 20. B has more cases, but A has a higher rate.'),
 quiz:Q(L('¿En qué grupo es mayor la proporción?','En quin grup és major la proporció?','Which group has the higher rate?'),O(['En el grupo B (40 %).','En el grupo A (60 %).','Es la misma en ambos.','No se puede calcular.'],['En el grup B (40 %).','En el grup A (60 %).','És la mateixa en els dos.','No es pot calcular.'],['Group B (40%).','Group A (60%).','The rate is equal.','It cannot be calculated.']),1,L('6/10 = 60 %, mientras que 8/20 = 40 %.','6/10 = 60 %, mentre que 8/20 = 40 %.','Six in ten is 60%, while eight in twenty is 40%.'))},
 {skill:'multimodal',title:L('Contrastar texto y evidencia','Contrastar text i evidència','Checking claims against evidence'),
 lead:L('Una infografía atractiva o una cronología no garantiza que una afirmación sea cierta.','Una infografia atractiva o una cronologia no garantix que una afirmació siga certa.','An attractive infographic or a timeline does not make every claim true.'),
 body:L('El <strong>texto</strong> puede proponer interpretaciones, mientras que las <strong>tablas y visualizaciones</strong> muestran datos concretos. Comprueba si las cifras respaldan la afirmación, si faltan comparaciones o si se está confundiendo «ocurrió después» con «fue causado por». Las muestras tampoco siempre representan a toda la población.','El <strong>text</strong> pot proposar interpretacions, mentre que les <strong>taules i visualitzacions</strong> mostren dades concretes. Comprova si les xifres justifiquen l’afirmació, si falten comparacions o si es confon «va ocórrer després» amb «va ser causat per». Les mostres tampoc representen sempre tota la població.','<strong>Text</strong> may offer interpretations, whereas <strong>tables and visualisations</strong> show specific evidence. Check whether figures support a claim, whether comparisons are missing and whether “happened after” is being mistaken for “was caused by”. Samples do not always represent entire populations.'),
 steps:O(['Separa el dato de la interpretación.','Busca posibles explicaciones alternativas.','Valora qué conclusión es defendible y cuál no.'],['Separa la dada de la interpretació.','Busca possibles explicacions alternatives.','Valora quina conclusió es pot justificar i quina no.'],['Separate the observation from the interpretation.','Consider alternative explanations.','Decide which conclusions the evidence supports.']),
 ex:L('En un año disminuyen las ausencias y se instaló una nueva biblioteca. Los dos hechos coinciden, pero no sabemos si están relacionados.','En un any disminuïxen les absències i s’instal·la una nova biblioteca. Els dos fets coincidixen, però no sabem si estan relacionats.','In one year absences fall and a new library opens. Both events occurred, but we do not know whether they are linked.'),
 quiz:Q(L('¿Qué conclusión respeta mejor la evidencia?','Quina conclusió respecta millor l’evidència?','Which conclusion best respects the evidence?'),O(['La biblioteca redujo por sí sola las ausencias.','Abrir una biblioteca siempre reduce ausencias.','Las ausencias bajaron, pero desconocemos la causa.','Las ausencias bajaron antes de abrir la biblioteca.'],['La biblioteca reduí per si sola les absències.','Obrir una biblioteca sempre reduïx absències.','Les absències baixaren, però desconeixem la causa.','Les absències baixaren abans d’obrir la biblioteca.'],['The library alone caused the decrease.','Opening libraries always reduces absences.','Absences fell, but the cause is unknown.','Absences fell before the library opened.']),2,L('La coincidencia temporal no demuestra por sí sola una relación causal.','La coincidència temporal no demostra per si sola una relació causal.','A change over the same period does not prove a causal link.'))}
);

V7A('v7_ty_i','init','types','daily',L('La nota del huerto','La nota de l’hort','The garden notice'),L('Para cuidar el huerto escolar, llena la regadera hasta la mitad. Riega la tierra sin mojar las hojas. Después, deja la regadera junto al grifo.','Per a cuidar l’hort escolar, ompli la regadora fins a la mitat. Rega la terra sense banyar les fulles. Després, deixa la regadora al costat de l’aixeta.','To care for the school garden, fill the watering can halfway. Water the soil without wetting the leaves. Then put the watering can next to the tap.'),Q(L('¿Qué pretende la nota?','Què pretén la nota?','What is the aim of the notice?'),O(['Enseñar unos pasos','Contar una aventura','Opinar sobre plantas','Retratar un paisaje'],['Ensenyar uns passos','Contar una aventura','Opinar sobre plantes','Retratar un paisatge'],['Give practical steps','Tell an adventure','Share an opinion','Describe scenery']),0,L('Los verbos indican acciones que deben seguirse en orden.','Els verbs indiquen accions que cal seguir en orde.','The verbs give actions to follow in sequence.')),V7('order',L('Ordena las instrucciones del texto.','Ordena les instruccions del text.','Put the instructions in the correct order.'),{items:[L('Dejar la regadera','Deixar la regadora','Put the can away'),L('Llenarla hasta la mitad','Omplir-la fins a la mitat','Fill it halfway'),L('Regar la tierra','Regar la terra','Water the soil')],answer:[1,2,0]},L('Primero se llena, luego se riega y al final se guarda.','Primer s’ompli, després es rega i al final es guarda.','First fill, then water, then put away.')));
V7A('v7_ty_1','eso1','types','history',L('Una visita al archivo','Una visita a l’arxiu','A visit to the archive'),L('El archivo municipal conserva mapas, cartas y fotografías antiguas. Algunos documentos requieren guantes especiales. Los visitantes pueden solicitar una copia digital, pero no llevarse los originales.','L’arxiu municipal conserva mapes, cartes i fotografies antigues. Alguns documents requerixen guants especials. Els visitants poden demanar una còpia digital, però no endur-se els originals.','The town archive keeps old maps, letters and photographs. Some documents require special gloves. Visitors can request a digital copy but cannot take away originals.'),Q(L('¿Qué tipo de texto predomina?','Quin tipus de text predomina?','Which text type dominates?'),O(['Explicación informativa','Diálogo entre amigos','Relato de ficción','Poema de amor'],['Explicació informativa','Diàleg entre dos visitants','Relat de ficció','Poema d’amor'],['Informative explanation','Conversation between friends','Fictional narrative','Love poem']),0,L('Presenta características y normas de un servicio real.','Presenta característiques i normes d’un servici real.','It explains the features and rules of a real service.')),V7('classify',L('Clasifica cada fragmento según su función.','Classifica cada fragment segons la funció.','Classify the purpose of each excerpt.'),{categories:[L('Descripción','Descripció','Description'),L('Norma','Norma','Rule')],items:[L('Conserva mapas y cartas','Conserva mapes i cartes','Keeps maps and letters'),L('No llevarse los originales','No endur-se els originals','Do not take originals'),L('Puede solicitarse copia digital','Es pot demanar còpia digital','A digital copy may be requested')],answer:[0,1,1]},L('La primera informa de lo que hay; las otras establecen permisos o límites.','La primera informa del que hi ha; les altres establixen permisos o límits.','The first describes a collection; the others express permissions or limits.')));
V7A('v7_ty_2','eso2','types','technology',L('¿Móviles en el aula?','Mòbils a l’aula?','Phones in class?'),L('Prohibir todos los móviles parece una solución sencilla. Sin embargo, algunas actividades permiten usarlos como sensores, cámaras o lectores. Una norma razonable debería distinguir entre su empleo pedagógico y las distracciones durante la clase.','Prohibir tots els mòbils pareix una solució senzilla. No obstant això, algunes activitats permeten usar-los com a sensors, càmeres o lectors. Una norma raonable hauria de distingir-ne l’ús pedagògic de les distraccions en classe.','Banning every phone may seem simple. Yet some lessons use them as sensors, cameras or reading devices. A reasonable policy should distinguish educational use from distractions in class.'),Q(L('¿Qué rasgo revela su carácter argumentativo?','Quin tret mostra el caràcter argumentatiu?','What shows that the text is argumentative?'),O(['Defiende una propuesta','Enumera piezas técnicas','Reproduce una conversación','Sitúa hechos en el pasado'],['Defén una proposta','Enumera peces tècniques','Reproduïx una conversa','Situa fets en el passat'],['It defends a proposal','It lists technical parts','It records a conversation','It recounts past events']),0,L('El autor propone distinguir usos y presenta razones para ello.','L’autor proposa distingir usos i aporta raons.','It recommends a distinction and gives supporting reasons.')),V7('evidence',L('Marca sobre el texto la frase que expresa la propuesta.','Marca sobre el text la frase que expressa la proposta.','Select in the text the sentence that states the proposal.'),{fragments:L(['Prohibir todos los móviles parece una solución sencilla.','Sin embargo, algunas actividades permiten usarlos como sensores, cámaras o lectores.','Una norma razonable debería distinguir entre su empleo pedagógico y las distracciones durante la clase.'],['Prohibir tots els mòbils pareix una solució senzilla.','No obstant això, algunes activitats permeten usar-los com a sensors, càmeres o lectors.','Una norma raonable hauria de distingir-ne l’ús pedagògic de les distraccions en classe.'],['Banning every phone may seem simple.','Yet some lessons use them as sensors, cameras or reading devices.','A reasonable policy should distinguish educational use from distractions in class.']),answer:2},L('La propuesta se formula en la última frase.','La proposta es formula en l’última frase.','The proposal is in the final sentence.')));
V7A('v7_ty_b','bach','types','philosophy',L('La precisión del lenguaje público','La precisió del llenguatge públic','Precision in public language'),L('Cuando una institución declara que una medida es «necesaria», suele ocultar qué alternativas ha considerado. La necesidad no es una propiedad evidente: depende de los fines y de las restricciones elegidas. Explicitar esas premisas permitiría debatir la decisión sin confundir preferencias políticas con imposibilidades técnicas.','Quan una institució declara que una mesura és «necessària», sovint oculta quines alternatives ha considerat. La necessitat no és una propietat evident: depén dels fins i de les restriccions triades. Explicitar eixes premisses permetria debatre la decisió sense confondre preferències polítiques amb impossibilitats tècniques.','When an institution calls a measure “necessary”, it often conceals which alternatives it considered. Necessity is not self-evident: it depends on selected goals and constraints. Making these premises explicit would allow debate without confusing political preferences with technical impossibilities.'),Q(L('¿Qué finalidad predomina?','Quina finalitat predomina?','Which purpose dominates?'),O(['Cuestionar un uso del término','Narrar una decisión anterior','Describir una institución','Explicar una fórmula técnica'],['Qüestionar l’ús d’un terme','Narrar una decisió anterior','Descriure una institució','Explicar una fórmula tècnica'],['Challenge the use of a term','Recount an earlier decision','Describe an institution','Explain a technical formula']),0,L('Se problematiza «necesaria» y se propone hacer visibles las premisas.','Es problematitza «necessària» i es proposa fer visibles les premisses.','The author questions “necessary” and calls for explicit premises.')),V7('classify',L('Distingue las funciones de estos enunciados.','Distingix les funcions d’estos enunciats.','Distinguish the function of each statement.'),{categories:[L('Tesis','Tesi','Thesis'),L('Justificación','Justificació','Reason')],items:[L('Conviene explicitar las premisas','Convé explicitar les premisses','Premises should be made explicit'),L('La necesidad depende de fines','La necessitat depén de fins','Necessity depends on goals'),L('Se eligen ciertas restricciones','Es trien certes restriccions','Certain constraints are selected')],answer:[0,1,1]},L('La propuesta constituye la tesis; las dependencias aportan el fundamento.','La proposta és la tesi; les dependències aporten el fonament.','The recommendation is the thesis; the dependencies support it.')));
// 2. MAIN IDEAS
V7A('v7_es_i','init','essential','science',L('Las abejas del patio','Les abelles del pati','Bees in the yard'),L('Las abejas visitan flores para recoger néctar. Al moverse de una flor a otra transportan polen. Esto ayuda a muchas plantas a producir semillas.','Les abelles visiten flors per a arreplegar nèctar. Quan passen d’una flor a una altra transporten pol·len. Això ajuda moltes plantes a produir llavors.','Bees visit flowers to collect nectar. As they move between flowers, they carry pollen. This helps many plants produce seeds.'),Q(L('¿Qué resume mejor el texto?','Què resumix millor el text?','Which best summarises the passage?'),O(['Las abejas ayudan a las plantas','Las flores viven en patios','Las semillas producen néctar','El polen impide las visitas'],['Les abelles ajuden les plantes','Les flors viuen als patis','Les llavors produïxen nèctar','El pol·len impedix les visites'],['Bees help plants reproduce','Flowers live in schoolyards','Seeds make nectar','Pollen prevents visits']),0,L('El traslado de polen favorece la reproducción vegetal.','El transport de pol·len afavorix la reproducció vegetal.','Pollen transfer supports plant reproduction.')),V7('order',L('Ordena los hechos desde el inicio hasta el resultado.','Ordena els fets des de l’inici fins al resultat.','Order the events from first to last.'),{items:[L('Se transporta polen','Es transporta pol·len','Pollen is carried'),L('La abeja visita flores','L’abella visita flors','The bee visits flowers'),L('La planta produce semillas','La planta produïx llavors','The plant produces seeds')],answer:[1,0,2]},L('Visita, transporte y producción forman la secuencia explicada.','Visita, transport i producció formen la seqüència explicada.','Visit, pollen transfer, then seed production follow in order.')));
V7A('v7_es_1','eso1','essential','history',L('Un puente renovado','Un pont renovat','A renovated bridge'),L('El puente del río había perdido varias piezas de piedra. Primero se cerró el paso para evitar accidentes. Los técnicos revisaron la estructura y después sustituyeron las piezas dañadas. Tras una inspección final, el puente volvió a abrirse.','El pont del riu havia perdut diverses peces de pedra. Primer es va tancar el pas per a evitar accidents. Els tècnics revisaren l’estructura i després substituïren les peces danyades. Després d’una inspecció final, el pont tornà a obrir-se.','Several stones had come loose from the river bridge. The crossing was closed first to prevent accidents. Engineers inspected the structure and then replaced damaged stones. Following a final inspection, the bridge reopened.'),Q(L('¿Qué idea organiza el relato?','Quina idea organitza el relat?','What is the organising idea?'),O(['El proceso de reparación','La historia del río','La profesión de arquitecto','El turismo de la comarca'],['El procés de reparació','La història del riu','La professió d’arquitecte','El turisme de la comarca'],['The process of repair','The river’s history','The job of an architect','Tourism in the region']),0,L('El texto explica las fases de una misma reparación.','El text explica les fases d’una mateixa reparació.','It describes stages in a single repair.')),V7('order',L('Reconstruye las fases del proyecto.','Reconstruïx les fases del projecte.','Rebuild the project sequence.'),{items:[L('Reapertura','Reobertura','Reopening'),L('Revisión técnica','Revisió tècnica','Technical inspection'),L('Cierre preventivo','Tancament preventiu','Safety closure')],answer:[2,1,0]},L('Se cerró, se inspeccionó y finalmente se reabrió.','Es tancà, s’inspeccionà i finalment es reobrí.','Closure came before inspection and reopening.')));
V7A('v7_es_2','eso2','essential','science',L('El agua bajo nuestros pies','L’aigua sota els peus','Water beneath our feet'),L('Una parte de la lluvia se infiltra y alimenta los acuíferos. Estos depósitos subterráneos pueden abastecer pozos durante períodos secos, pero su recarga suele ser lenta. Extraer agua a mayor ritmo del que se repone puede agotar la reserva, incluso si una estación ha sido especialmente lluviosa.','Una part de la pluja s’infiltra i alimenta els aqüífers. Estos dipòsits subterranis poden abastir pous durant períodes secs, però la seua recàrrega sol ser lenta. Extraure aigua a més ritme del que es reposa pot esgotar la reserva, fins i tot si una estació ha sigut especialment plujosa.','Some rainwater seeps underground and recharges aquifers. These underground reservoirs can supply wells in dry periods, but recharge is often slow. Withdrawing water faster than it is replaced can deplete the reserve even after an unusually wet season.'),Q(L('¿Cuál es el mensaje central?','Quin és el missatge central?','What is the central message?'),O(['La extracción debe considerar la recarga','Toda lluvia llega a los acuíferos','Los pozos funcionan sin reservas','Una estación húmeda evita toda sequía'],['L’extracció ha de considerar la recàrrega','Tota pluja arriba als aqüífers','Els pous funcionen sense reserves','Una estació humida evita tota sequera'],['Withdrawals must reflect recharge','All rainwater reaches aquifers','Wells work without groundwater','One wet season prevents all drought']),0,L('La sostenibilidad depende del equilibrio entre extracción y recarga.','La sostenibilitat depén de l’equilibri entre extracció i recàrrega.','Sustainability depends on the balance between withdrawals and recharge.')),V7('classify',L('Distingue proceso, utilidad y riesgo.','Distingix procés, utilitat i risc.','Identify process, use and risk.'),{categories:[L('Proceso','Procés','Process'),L('Utilidad','Utilitat','Use'),L('Riesgo','Risc','Risk')],items:[L('La lluvia se infiltra','La pluja s’infiltra','Rainwater seeps down'),L('El agua abastece pozos','L’aigua abastix pous','Water supplies wells'),L('La reserva se agota','La reserva s’esgota','The reserve runs out')],answer:[0,1,2]},L('La infiltración recarga, el abastecimiento aprovecha y el agotamiento amenaza.','La infiltració recarrega, l’abastiment aprofita i l’esgotament amenaça.','Seepage recharges, wells provide water, and depletion is the risk.')));
V7A('v7_es_b','bach','essential','economy',L('Productividad y bienestar','Productivitat i benestar','Productivity and wellbeing'),L('El aumento de productividad permite producir más con recursos semejantes, pero no determina por sí mismo cómo se distribuye el beneficio. Para evaluar su efecto social resulta necesario examinar salarios, horas de trabajo y acceso a los servicios. Un mismo crecimiento agregado puede acompañarse de mejoras generalizadas o de diferencias más acusadas entre grupos.','L’augment de productivitat permet produir més amb recursos semblants, però no determina per si mateix com es distribuïx el benefici. Per a avaluar-ne l’efecte social cal examinar salaris, hores de treball i accés als servicis. Un mateix creixement agregat pot anar acompanyat de millores generals o de diferències més marcades entre grups.','Higher productivity enables greater output with comparable resources but does not determine how benefits are distributed. To assess social effects, we must examine wages, working hours and access to services. Similar aggregate growth can coincide with broad improvements or with widening differences between groups.'),Q(L('¿Qué distinción vertebra el texto?','Quina distinció vertebra el text?','Which distinction structures the passage?'),O(['Producción y reparto del beneficio','Salarios y tipos de contrato','Recursos naturales y tecnología','Crecimiento anual y población'],['Producció i repartiment del benefici','Salaris i tipus de contracte','Recursos naturals i tecnologia','Creixement anual i població'],['Output and distribution of gains','Wages and types of contract','Natural resources and technology','Annual growth and population']),0,L('Se diferencia producir más de mejorar las condiciones de distintos grupos.','Es diferencia produir més de millorar les condicions dels grups.','It distinguishes producing more from who benefits.')),V7('classify',L('Señala la función de cada afirmación.','Indica la funció de cada afirmació.','Classify each statement’s role.'),{categories:[L('Dato que habría que medir','Dada que caldria mesurar','Indicator to measure'),L('Conclusión no justificada','Conclusió no justificada','Unsupported conclusion')],items:[L('Evolución de los salarios','Evolució dels salaris','Changes in wages'),L('Todo crecimiento mejora a todos','Tot creixement beneficia tots','All growth benefits everyone'),L('Horas de trabajo anuales','Hores de treball anuals','Annual working hours')],answer:[0,1,0]},L('Los indicadores permiten evaluar el reparto; la afirmación universal no se deduce.','Els indicadors permeten avaluar el repartiment; l’afirmació universal no es deduïx.','Indicators can assess distribution; the universal claim does not follow.')));
