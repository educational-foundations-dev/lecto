CC('c8_e1_read','eso1','read','history',L('El puente del valle','El pont de la vall','The valley bridge'),L(
'Durante décadas, los habitantes de dos aldeas cruzaban el río por un camino que solo era seguro en verano. El ayuntamiento propuso construir un puente. Algunos vecinos defendieron la obra porque permitiría acudir al mercado y al centro de salud incluso después de las lluvias. Otros solicitaron estudiar el impacto sobre una zona donde anidaban aves. En una reunión se presentaron dos proyectos: uno era más barato, pero atravesaba la ribera; el otro era más largo y evitaba la zona de nidos. El consejo eligió el segundo proyecto y explicó públicamente que había valorado tanto el coste como la protección del entorno. La decisión no eliminó todos los problemas, pero permitió comparar alternativas.',
'Durant dècades, els habitants de dos pobles travessaven el riu per un camí que només era segur a l’estiu. L’ajuntament va proposar construir un pont. Alguns veïns defensaren l’obra perquè permetria anar al mercat i al centre de salut fins i tot després de les pluges. Altres demanaren estudiar l’impacte sobre una zona on nidificaven aus. En una reunió es presentaren dos projectes: un era més barat, però travessava la ribera; l’altre era més llarg i evitava la zona dels nius. El consell va triar el segon projecte i explicà públicament que havia valorat tant el cost com la protecció de l’entorn. La decisió no eliminà tots els problemes, però permeté comparar alternatives.',
'For decades, people in two villages crossed the river using a path that was safe only in summer. The council proposed building a bridge. Some residents supported it because they could reach the market and health centre even after heavy rain. Others asked for a study of the impact on a nesting area used by birds. At a meeting, two designs were presented: one was cheaper but crossed the riverbank habitat; the other was longer and avoided the nests. The council chose the second design and publicly explained that it had considered both cost and environmental protection. Its decision did not solve every problem, but it showed how alternatives could be compared.'),[
CQ('types',L('¿Qué forma textual predomina?','Quina forma textual predomina?','Which type of writing dominates?'),O(['Una receta con instrucciones precisas.','Un poema con imágenes simbólicas.','Un relato informativo de una decisión.','Una publicidad que vende un producto.'],['Una recepta amb instruccions precises.','Un poema amb imatges simbòliques.','Un relat informatiu d’una decisió.','Un anunci que ven un producte.'],['A recipe with detailed instructions.','A poem using symbolic images.','An informative account of a decision.','An advert trying to sell a product.']),2,L('Se explica y narra una decisión pública con distintas posturas.','S’explica i narra una decisió pública amb diverses postures.','The passage reports a civic decision and the views behind it.')),
CQ('essential',L('¿Qué problema originó la propuesta?','Quin problema originà la proposta?','What problem prompted the proposal?'),O(['El mercado había cambiado de lugar.','Las aves impedían comprar alimentos.','Los dos pueblos habían perdido población.','El camino era inseguro tras las lluvias.'],['El mercat havia canviat de lloc.','Les aus impedien comprar aliments.','Els dos pobles havien perdut població.','El camí era insegur després de les pluges.'],['The market had moved to another place.','The birds prevented people from shopping.','Both villages had lost their population.','The path was unsafe after heavy rain.']),3,L('Se necesitaba un paso fiable cuando el río subía.','Feia falta un pas fiable quan pujava el riu.','The unsafe seasonal crossing motivated the bridge project.')),
CQ('vocab',L('¿Qué significa «ribera» aquí?','Què significa «ribera» ací?','What does “riverbank” mean here?'),O(['La franja de terreno junto al río.','El mercado principal de la aldea.','La cubierta superior del puente.','El edificio donde se reúne el consejo.'],['La franja de terreny al costat del riu.','El mercat principal del poble.','La coberta superior del pont.','L’edifici on es reunix el consell.'],['The land alongside the river.','The main market in the village.','The roof over the new bridge.','The building where the council meets.']),0,L('La zona ribereña es el terreno próximo al curso de agua.','La zona de ribera és el terreny pròxim al curs de l’aigua.','The riverbank is the land bordering the watercourse.')),
CQ('logic',L('¿Por qué se eligió el proyecto más largo?','Per què es va triar el projecte més llarg?','Why was the longer design selected?'),O(['Porque se había construido antes.','Porque evitaba la zona de nidos.','Porque exigía cerrar el mercado.','Porque eliminaba todo mantenimiento.'],['Perquè s’havia construït abans.','Perquè evitava la zona dels nius.','Perquè exigia tancar el mercat.','Perquè eliminava tot el manteniment.'],['Because it had already been built.','Because it avoided the nesting area.','Because it required closing the market.','Because it removed all future upkeep.']),1,L('La elección tenía en cuenta reducir el impacto sobre las aves.','L’elecció tenia en compte reduir l’impacte sobre les aus.','Avoiding the nesting habitat was a stated advantage.')),
CQ('critical',L('¿Qué conclusión es más prudente?','Quina conclusió és més prudent?','Which conclusion is most justified?'),O(['El puente acabará con todos los riesgos.','La obra será gratis para los vecinos.','Se valoraron costes y efectos ambientales.','La ribera dejará de necesitar protección.'],['El pont acabarà amb tots els riscos.','L’obra serà gratuïta per als veïns.','Es valoraren costos i efectes ambientals.','La ribera deixarà de necessitar protecció.'],['The bridge will remove every future risk.','The project will be free for residents.','Costs and environmental effects were weighed.','The riverbank will need no protection.']),2,L('La decisión explicita una comparación de factores, sin prometer resultados absolutos.','La decisió explicita una comparació de factors, sense prometre resultats absoluts.','The council compared trade-offs without guaranteeing perfection.'))
]);
// ESO 1º ciclo — audio
CC('c8_e1_audio','eso1','audio','science',L('Un experimento con dos vasos','Un experiment amb dos gots','An experiment with two cups'),L(
'En un taller de ciencias, Julia quería saber si la temperatura influía en la velocidad a la que se disuelve el azúcar. Preparó dos vasos con la misma cantidad de agua y añadió una cucharadita de azúcar a cada uno. El primer vaso tenía agua fría y el segundo, agua tibia. Removió ambos durante el mismo tiempo y observó que en el agua tibia quedaban menos cristales visibles. El profesor le recordó que debía repetir la prueba varias veces antes de sacar conclusiones generales. También le sugirió anotar la temperatura exacta y usar siempre cucharas de la misma medida. Julia escribió que su primera observación era una pista, no una demostración definitiva.',
'En un taller de ciències, Júlia volia saber si la temperatura influïa en la velocitat amb què es dissol el sucre. Preparà dos gots amb la mateixa quantitat d’aigua i afegí una culleradeta de sucre a cadascun. El primer got tenia aigua freda i el segon, aigua tèbia. Remenà els dos durant el mateix temps i observà que en l’aigua tèbia quedaven menys cristalls visibles. El professor li recordà que havia de repetir la prova unes quantes vegades abans de traure conclusions generals. També li suggerí anotar la temperatura exacta i utilitzar sempre culleres de la mateixa mesura. Júlia va escriure que la primera observació era una pista, no una demostració definitiva.',
'During a science workshop, Julia wanted to know whether temperature affected how quickly sugar dissolved. She prepared two cups containing the same amount of water and added one teaspoon of sugar to each. The first cup held cold water and the second held warm water. She stirred them for the same length of time and noticed fewer visible sugar crystals in the warm water. Her teacher reminded her to repeat the trial several times before drawing general conclusions. He also advised her to record the exact temperature and to use equally sized spoons every time. Julia wrote that her first observation was a clue, not definitive proof.'),[
CQ('essential',L('¿Qué investigaba Julia?','Què investigava Júlia?','What was Julia investigating?'),O(['El peso que tienen diferentes clases de azúcar.','La densidad de dos recipientes llenos de agua.','El color del agua después de remover azúcar.','El efecto de la temperatura al disolver azúcar.'],['El pes que tenen les diferents classes de sucre.','La densitat de dos recipients plens d’aigua.','El color de l’aigua després de remenar sucre.','L’efecte de la temperatura en dissoldre sucre.'],['The weight of different sugar types.','The density of two kinds of cup.','The colour of cold drinking water.','How temperature affects sugar dissolving.']),3,L('Comparó la disolución del azúcar en agua fría y tibia.','Va comparar la dissolució del sucre en aigua freda i tèbia.','She compared sugar dissolving in cold and warm water.')),
CQ('logic',L('¿Por qué usó la misma cantidad de azúcar?','Per què va usar la mateixa quantitat de sucre?','Why did she use the same amount of sugar?'),O(['Para comparar los vasos con más justicia.','Para terminar de remover mucho más rápido.','Para cambiar el material de los recipientes.','Para evitar medir la temperatura del agua.'],['Per a comparar els gots amb més justícia.','Per a acabar de remenar molt més ràpid.','Per a canviar el material dels recipients.','Per a evitar mesurar la temperatura de l’aigua.'],['To make the comparison more reliable.','To finish stirring much more quickly.','To change the material of the cups.','To avoid measuring water temperature.']),0,L('Igualar cantidades ayuda a aislar la variable estudiada.','Igualar quantitats ajuda a aïllar la variable estudiada.','Keeping amounts constant helps isolate temperature as a variable.')),
CQ('infer',L('¿Por qué pidió repetir el ensayo?','Per què va demanar repetir l’assaig?','Why did the teacher ask for repeated trials?'),O(['Porque siempre cambia el tipo de azúcar.','Porque una única observación puede fallar.','Porque el agua tibia nunca se puede medir.','Porque los dos vasos tenían colores distintos.'],['Perquè sempre canvia el tipus de sucre.','Perquè una única observació pot fallar.','Perquè l’aigua tèbia mai es pot mesurar.','Perquè els dos gots tenien colors distints.'],['Because the sugar always changes type.','Because one observation may be unreliable.','Because warm water cannot be measured.','Because the cups had different colours.']),1,L('La repetición ayuda a comprobar si el patrón se mantiene.','La repetició ajuda a comprovar si el patró es manté.','Repeating helps determine whether the observation is consistent.')),
CQ('vocab',L('¿Qué significa «definitiva» en la conclusión?','Què significa «definitiva» en la conclusió?','What does “definitive” mean in this context?'),O(['Que se puede cambiar sin razones.','Que únicamente describe un vaso.','Que pretende cerrar la cuestión por completo.','Que depende del color del instrumento.'],['Que es pot canviar sense raons.','Que només descriu un got.','Que pretén tancar la qüestió del tot.','Que depén del color de l’instrument.'],['Something that changes for no reason.','Something describing only one cup.','Something meant to settle the issue fully.','Something depending on an instrument’s colour.']),2,L('El profesor distingue una observación inicial de una conclusión ya consolidada.','El professor distingix una observació inicial d’una conclusió ja consolidada.','The teacher contrasts an initial clue with a settled conclusion.')),
CQ('critical',L('¿Qué conclusión está mejor respaldada?','Quina conclusió està millor justificada?','Which conclusion is best supported?'),O(['El agua tibia disuelve toda cantidad de azúcar.','Los dos vasos demostraron una ley para cualquier mezcla.','El ensayo produjo el mismo resultado en ambos vasos.','En esa prueba quedó menos azúcar visible en agua tibia.'],['L’aigua tèbia dissol qualsevol quantitat de sucre.','Els dos gots demostraren una llei per a qualsevol mescla.','L’assaig va produir el mateix resultat en els dos gots.','En eixa prova quedà menys sucre visible en aigua tèbia.'],['Warm water can dissolve every possible amount of sugar.','Two cups were enough to prove a universal law of dissolving.','The experiment showed the same result in both cups.','In that trial less sugar remained visible in warm water.']),3,L('El resultado observado se refiere a esa prueba, no a todos los casos.','El resultat observat es referix a eixa prova, no a tots els casos.','The observation describes this trial, not all possible experiments.'))
]);
// ESO 2º ciclo — lectura: includes a data table for multimodal interpretation.
CC('c8_e2_read','eso2','read','science',L('La sombra de los árboles','L’ombra dels arbres','The shade of the trees'),L(
'El consejo escolar quería mejorar el patio durante los meses de calor. Antes de decidir, un grupo de estudiantes midió la temperatura del suelo al mediodía en dos zonas: junto al muro, bajo un árbol, y en un espacio descubierto. La toma de datos se hizo durante tres días consecutivos a la misma hora. En las tres observaciones, la superficie a la sombra registró valores inferiores a los de la zona soleada. Sin embargo, el informe advertía que la comparación era limitada: solo incluía un punto de cada zona y no distinguía entre tipos de pavimento. Un representante concluyó que plantar árboles reduciría exactamente cinco grados la temperatura de cualquier patio. Otros estudiantes propusieron ampliar las mediciones antes de hacer una promesa tan precisa. También recordaron que, además del suelo, convendría valorar el espacio de juego, el riego y el mantenimiento.',
'El consell escolar volia millorar el pati durant els mesos de calor. Abans de decidir, un grup d’estudiants va mesurar la temperatura del sòl al migdia en dues zones: al costat del mur, davall d’un arbre, i en un espai descobert. Les dades es prengueren durant tres dies consecutius a la mateixa hora. En les tres observacions, la superfície a l’ombra registrà valors inferiors als de la zona assolellada. No obstant això, l’informe advertia que la comparació era limitada: només incloïa un punt de cada zona i no distingia entre tipus de paviment. Un representant conclogué que plantar arbres reduiria exactament cinc graus la temperatura de qualsevol pati. Altres estudiants proposaren ampliar les mesures abans de fer una promesa tan precisa. També recordaren que, a més del sòl, convenia valorar l’espai de joc, el reg i el manteniment.',
'The school council wanted to improve the playground during hot months. Before making a decision, students measured ground temperature at midday in two places: under a tree beside a wall and in an exposed area. Readings were taken at the same time on three consecutive days. On all three days, the shaded surface was cooler than the sunny one. However, the report acknowledged limitations: it sampled just one point in each area and did not account for different paving materials. A representative claimed that planting trees would lower ground temperature by exactly five degrees in any playground. Other students recommended more measurements before making such a precise promise. They also noted that a decision should consider play space, irrigation and upkeep, not temperature alone.'),[
CQ('essential',L('¿Cuál era la finalidad del estudio?','Quina era la finalitat de l’estudi?','What was the purpose of the study?'),O(['Contar los árboles de un bosque cercano.','Comparar varios modelos de regaderas.','Estudiar el calor en dos zonas del patio.','Medir la lluvia acumulada durante un mes.'],['Comptar els arbres d’un bosc pròxim.','Comparar diversos models de regadores.','Estudiar la calor en dues zones del pati.','Mesurar la pluja acumulada durant un mes.'],['Count the trees in a nearby forest.','Compare several watering systems.','Study heat in two playground areas.','Measure rainfall over a whole month.']),2,L('Los alumnos contrastaron las temperaturas de dos zonas del patio.','L’alumnat comparà les temperatures de dues zones del pati.','Students compared temperatures in shaded and sunny areas.')),
CQ('multimodal',L('¿Qué diferencia hubo el segundo día?','Quina diferència hi hagué el segon dia?','What was the difference on day two?'),O(['Dos grados entre ambas zonas.','Tres grados entre ambas zonas.','Cuatro grados entre ambas zonas.','Cinco grados entre ambas zonas.'],['Dos graus entre les dues zones.','Tres graus entre les dues zones.','Quatre graus entre les dues zones.','Cinc graus entre les dues zones.'],['Two degrees between the areas.','Three degrees between the areas.','Four degrees between the areas.','Five degrees between the areas.']),3,L('El segundo día se midieron 34 °C y 29 °C: la diferencia es 5 °C.','El segon dia es mesuraren 34 °C i 29 °C: la diferència és 5 °C.','On day two the readings were 34°C and 29°C, a difference of 5°C.')),
CQ('vocab',L('¿Qué significa «limitada» referido a la comparación?','Què significa «limitada» referit a la comparació?','What does “limited” mean about the comparison?'),O(['Que sus datos no cubren todas las situaciones.','Que los valores son imposibles de calcular.','Que el estudio carece de cualquier observación.','Que todas las mediciones son necesariamente falsas.'],['Que les dades no cobrixen totes les situacions.','Que els valors són impossibles de calcular.','Que l’estudi no té cap observació.','Que totes les mesures són necessàriament falses.'],['Its data do not cover every possible case.','Its figures are impossible to calculate.','The study contains no observations at all.','All the measurements must be incorrect.']),0,L('Se reconocen condiciones que no se analizaron y que pueden afectar los resultados.','Es reconeixen condicions que no s’analitzaren i que poden afectar els resultats.','The study leaves relevant conditions unexamined.')),
CQ('infer',L('¿Por qué proponen medir más puntos del patio?','Per què proposen mesurar més punts del pati?','Why do they propose sampling more locations?'),O(['Para repetir siempre el mismo dato.','Para comprobar si el patrón es general.','Para cambiar el horario de las clases.','Para ocultar las diferencias observadas.'],['Per a repetir sempre la mateixa dada.','Per a comprovar si el patró és general.','Per a canviar l’horari de les classes.','Per a ocultar les diferències observades.'],['To keep recording identical figures.','To test whether the pattern is wider.','To change the school timetable.','To conceal the recorded differences.']),1,L('Con más puntos podrían valorar si el resultado se reproduce en distintas zonas.','Amb més punts podrien valorar si el resultat es reproduïx en zones distintes.','More sampling locations would test whether the pattern holds elsewhere.')),
CQ('critical',L('¿Qué falla en la promesa del representante?','Què falla en la promesa del representant?','What is wrong with the representative’s promise?'),O(['Niega que existan zonas soleadas en el patio.','Supone que todas las plantas requieren mucha agua.','Generaliza un resultado local a todos los patios.','Confunde la hora del día con el día de la semana.'],['Nega que hi haja zones assolellades al pati.','Suposa que totes les plantes necessiten molta aigua.','Generalitza un resultat local a tots els patis.','Confon l’hora del dia amb el dia de la setmana.'],['It denies the existence of sunny playgrounds.','It assumes all plants need lots of water.','It generalises local findings to all playgrounds.','It confuses times of day with days of the week.']),2,L('Tres mediciones en dos puntos no garantizan una reducción exacta universal.','Tres mesures en dos punts no garantixen una reducció exacta universal.','A few readings at two locations cannot establish an exact universal effect.'))
],{title:L('Temperatura del suelo al mediodía','Temperatura del sòl al migdia','Midday ground temperature'),columns:[L('Día','Dia','Day'),L('Zona soleada (°C)','Zona assolellada (°C)','Sunny area (°C)'),L('Zona sombreada (°C)','Zona ombrejada (°C)','Shaded area (°C)')],rows:[[L('1','1','1'),32,28],[L('2','2','2'),34,29],[L('3','3','3'),33,29]]});
// ESO 2º ciclo — audio
CC('c8_e2_audio','eso2','audio','society',L('El aviso que se hizo viral','L’avís que es va fer viral','The message that went viral'),L(
'El lunes por la tarde, numerosos vecinos recibieron un mensaje que aseguraba que el agua del pueblo no era potable. La nota incluía una fotografía borrosa de una tubería y pedía reenviarla urgentemente. No indicaba fecha, autor ni ningún informe. Un grupo de estudiantes decidió contrastarla: consultó la web municipal y comprobó que no aparecía ningún aviso reciente. Después telefoneó al servicio de atención ciudadana, donde les explicaron que una avería antigua ya se había reparado. Los jóvenes publicaron un mensaje aclaratorio con la fecha y las fuentes utilizadas, aunque dejaron escrito que cualquier problema nuevo debería confirmarse mediante los canales oficiales. Al día siguiente, algunas personas continuaban compartiendo la imagen inicial. La profesora aprovechó la situación para recordar que una noticia muy repetida no se convierte en verdadera por su popularidad.',
'Dilluns de vesprada, molts veïns reberen un missatge que assegurava que l’aigua del poble no era potable. La nota incloïa una fotografia borrosa d’una canonada i demanava reenviar-la urgentment. No indicava data, autor ni cap informe. Un grup d’estudiants va decidir contrastar-la: consultà el web municipal i comprovà que no hi apareixia cap avís recent. Després telefonà al servei d’atenció ciutadana, on els explicaren que una avaria antiga ja s’havia reparat. Els joves publicaren un missatge aclaridor amb la data i les fonts utilitzades, encara que deixaren escrit que qualsevol problema nou s’hauria de confirmar pels canals oficials. L’endemà, algunes persones continuaven compartint la imatge inicial. La professora aprofità la situació per a recordar que una notícia molt repetida no es fa verdadera per la seua popularitat.',
'On Monday afternoon, many residents received a message claiming that the town’s tap water was unsafe to drink. It included a blurry photograph of a pipe and urged readers to forward it immediately. No date, author or report was given. A group of students decided to check it. They visited the council website and found no recent warning. They then called the citizen information service, which explained that an old pipe fault had already been repaired. The students published a clarification with the date and sources they had used, while noting that any new problem should still be checked through official channels. The next day, some people continued to share the original image. Their teacher used the incident to explain that repetition alone does not make a story true.'),[
CQ('essential',L('¿Qué investigaron los estudiantes?','Què investigaren els estudiants?','What did the students investigate?'),O(['La causa de todas las roturas de tuberías.','El coste del servicio telefónico municipal.','El consumo de agua en cada vivienda.','La veracidad de una alerta sobre el agua.'],['La causa de tots els trencaments de canonades.','El cost del servei telefònic municipal.','El consum d’aigua en cada vivenda.','La veracitat d’una alerta sobre l’aigua.'],['The cause of every broken water pipe.','The price of the council phone service.','The amount of water used in each home.','Whether a tap-water warning was genuine.']),3,L('Comprobaron el origen y la actualidad de un supuesto aviso sobre el agua.','Comprovaren l’origen i l’actualitat d’un suposat avís sobre l’aigua.','They checked a warning about the safety of tap water.')),
CQ('critical',L('¿Qué elemento debilitaba inicialmente el mensaje?','Quin element debilitava inicialment el missatge?','What made the original message less credible?'),O(['La ausencia de fecha y fuente identificable.','El hecho de referirse a un servicio público.','La presencia de una fotografía cualquiera.','El uso de un teléfono para consultarlo.'],['L’absència de data i font identificable.','El fet de parlar d’un servici públic.','La presència d’una fotografia qualsevol.','L’ús d’un telèfon per a consultar-lo.'],['No date or identifiable source was given.','It concerned an essential public service.','It contained a photograph of a pipe.','It could be viewed on a mobile phone.']),0,L('Sin fecha ni fuente no se puede situar ni verificar la alerta.','Sense data ni font no es pot situar ni verificar l’alerta.','Lack of a date and source makes the claim hard to verify.')),
CQ('logic',L('¿Qué función cumple «aunque» en el relato?','Quina funció té «encara que» en el relat?','What is the role of “while” in that sentence?'),O(['Expresar una causa única y definitiva.','Introducir una precaución pese a la aclaración.','Establecer un horario para las llamadas.','Enumerar una segunda fotografía del mensaje.'],['Expressar una causa única i definitiva.','Introduir una precaució malgrat l’aclariment.','Establir un horari per a les telefonades.','Enumerar una segona fotografia del missatge.'],['Give a single definitive cause.','Add caution despite the clarification.','Set a timetable for phone calls.','List a second photo in the message.']),1,L('Aclarar la información no elimina la necesidad de comprobar avisos posteriores.','Aclarir la informació no elimina la necessitat de comprovar avisos posteriors.','The correction still leaves room for a genuinely new warning.')),
CQ('infer',L('¿Por qué algunos vecinos siguieron difundiendo la imagen?','Per què alguns veïns continuaren difonent la imatge?','Why did some residents keep sharing the image?'),O(['Porque el ayuntamiento confirmó la alerta.','Porque la avería era del día siguiente.','No se ofrece una explicación suficiente.','Porque los alumnos les pidieron hacerlo.'],['Perquè l’ajuntament confirmà l’alerta.','Perquè l’avaria era de l’endemà.','No s’oferix una explicació suficient.','Perquè l’alumnat els ho va demanar.'],['Because the council confirmed the alert.','Because the pipe fault occurred later.','The recording does not explain why.','Because students told them to share it.']),2,L('Se indica que siguieron compartiéndola, no sus motivos.','S’indica que continuaren compartint-la, no els motius.','The story describes continued sharing but does not explain motives.')),
CQ('vocab',L('¿Qué significa «contrastar» información aquí?','Què significa «contrastar» informació ací?','What does “check” information mean here?'),O(['Difundirla para conseguir más visitas.','Reducirla a una imagen llamativa.','Memorizarla sin modificar ninguna frase.','Compararla con otras fuentes comprobables.'],['Difondre-la per a aconseguir més visites.','Reduir-la a una imatge cridanera.','Memoritzar-la sense canviar cap frase.','Comparar-la amb altres fonts comprovables.'],['Spread it to gain more attention.','Reduce it to a striking image.','Memorise it without changing anything.','Compare it with verifiable sources.']),3,L('Los alumnos comprobaron la afirmación en fuentes distintas.','L’alumnat comprovà l’afirmació en fonts diferents.','They cross-checked the claim against other sources.'))
]);
// BACHILLERATO — reading
CC('c8_b_read','bach','read','society',L('Una encuesta y sus límites','Una enquesta i els seus límits','A survey and its limits'),L(
'Una asociación cultural encuestó a personas que acudieron voluntariamente a un festival. De 400 participantes, 280 afirmaron leer al menos un libro al mes. El informe difundido por la asociación titulaba: «El 70 % de la ciudad lee cada mes». En una nota metodológica, sin embargo, se reconocía que la muestra no era aleatoria y que no se había preguntado a quienes no asistieron al festival. Además, el cuestionario no verificaba si las respuestas correspondían con hábitos reales. Un concejal citó la cifra para defender que no hacía falta ampliar el presupuesto de bibliotecas. Una investigadora replicó que el porcentaje describía a los encuestados, pero que para inferir hábitos de toda la población se requeriría un diseño muestral apropiado. Añadió que la suficiencia del presupuesto era otra cuestión: incluso una ciudad con lectores habituales podría tener necesidades de acceso desiguales. El debate acabó distinguiendo tres planos: lo que se contó, a quiénes se contó y qué decisiones políticas podían apoyarse en ello.',
'Una associació cultural va enquestar persones que assistiren voluntàriament a un festival. De 400 participants, 280 afirmaren llegir almenys un llibre al mes. L’informe difós per l’associació es titulava: «El 70 % de la ciutat llig cada mes». En una nota metodològica, però, es reconeixia que la mostra no era aleatòria i que no s’havia preguntat a qui no assistí al festival. A més, el qüestionari no verificava si les respostes corresponien a hàbits reals. Un regidor cità la xifra per a defensar que no calia ampliar el pressupost de biblioteques. Una investigadora replicà que el percentatge descrivia les persones enquestades, però que per a inferir hàbits de tota la població calia un disseny mostral adequat. Afegí que la suficiència del pressupost era una altra qüestió: fins i tot una ciutat amb lectors habituals podria tindre necessitats d’accés desiguals. El debat acabà distingint tres plans: què es va comptar, a qui es va comptar i quines decisions polítiques s’hi podien recolzar.',
'A cultural association surveyed volunteers attending a festival. Of 400 respondents, 280 said they read at least one book a month. The association released a report headed “70% of our city reads every month”. A methodological note, however, acknowledged that the sample was not random and excluded everyone who had not attended the festival. The questionnaire also did not verify whether stated habits matched actual behaviour. A councillor used the figure to argue against increasing library funding. A researcher replied that the percentage described the respondents, but that population-wide conclusions required a suitable sampling method. She added that adequacy of library funding was a separate issue: even a city with regular readers could have unequal access to reading facilities. The discussion thus distinguished three questions: what had been counted, whom the survey represented and which policy decisions the data could legitimately support.'),[
CQ('multimodal',L('¿Cuál es el porcentaje exacto entre los encuestados?','Quin és el percentatge exacte entre els enquestats?','What percentage of respondents reported monthly reading?'),O(['60 % de las personas encuestadas.','65 % de las personas encuestadas.','70 % de las personas encuestadas.','75 % de las personas encuestadas.'],['60 % de les persones enquestades.','65 % de les persones enquestades.','70 % de les persones enquestades.','75 % de les persones enquestades.'],['60% of the surveyed participants.','65% of the surveyed participants.','70% of the surveyed participants.','75% of the surveyed participants.']),2,L('280 dividido entre 400 es 0,70, es decir, 70 %.','280 dividit entre 400 és 0,70, és a dir, 70 %.','280 divided by 400 equals 0.70, or 70%.')),
CQ('critical',L('¿Cuál es el problema del titular difundido?','Quin és el problema del titular difós?','What is the problem with the published headline?'),O(['Presenta un porcentaje incompatible con los datos recogidos.','Omite la postura del concejal sobre bibliotecas.','Confunde los hábitos reales con los declarados.','Extrapola una muestra voluntaria a toda la ciudad.'],['Presenta un percentatge incompatible amb les dades recollides.','Omet la postura del regidor sobre biblioteques.','Confon els hàbits reals amb els declarats.','Extrapola una mostra voluntària a tota la ciutat.'],['It reports a percentage inconsistent with the responses collected.','It omits the councillor’s view about library funding.','It confuses reported with observed habits.','It extends a voluntary sample to the whole city.']),3,L('El 70 % es válido para la muestra, no necesariamente para toda la población.','El 70 % és vàlid per a la mostra, no necessàriament per a tota la població.','A convenience sample cannot simply be treated as the whole city.')),
CQ('vocab',L('¿Qué significa «inferencia» en este contexto?','Què significa «inferència» en este context?','What does “inference” mean in this context?'),O(['Una conclusión obtenida a partir de datos.','Una opinión ajena a toda información.','Un error aritmético en una tabla.','Una instrucción concreta dirigida al encuestador.'],['Una conclusió obtinguda a partir de dades.','Una opinió aliena a tota informació.','Un error aritmètic en una taula.','Una instrucció concreta dirigida a l’enquestador.'],['A conclusion drawn from available evidence.','An opinion unrelated to any information.','An arithmetic error in a table.','A specific instruction given to a survey interviewer.']),0,L('Inferir implica pasar de información observada a una conclusión justificada.','Inferir implica passar d’informació observada a una conclusió justificada.','Inference means reasoning from evidence towards a conclusion.')),
CQ('logic',L('¿Qué objeción formula la investigadora al concejal?','Quina objecció formula la investigadora al regidor?','What objection does the researcher raise to the councillor?'),O(['Los festivales nunca incluyen personas lectoras.','El dato de lectura no resuelve por sí solo el presupuesto.','El número de encuestados es inferior al que afirma la asociación.','El presupuesto determina quién acudió al festival.'],['Els festivals mai inclouen persones lectores.','La dada de lectura no resol per si sola el pressupost.','El nombre de persones enquestades és inferior al que s’indica.','El pressupost determina qui acudí al festival.'],['Festivals never attract people who read books.','The reading figure alone does not settle funding.','The number of participants is lower than the association claims.','Library funding determined festival attendance.']),1,L('Para decidir presupuestos se necesita valorar necesidades y acceso, no solo una proporción.','Per a decidir pressupostos cal valorar necessitats i accés, no sols una proporció.','Funding decisions need evidence about provision and access, not just a reading rate.')),
CQ('infer',L('¿Qué dato adicional sería más útil para estudiar desigualdades?','Quina dada addicional seria més útil per a estudiar desigualtats?','What further information would help assess unequal access?'),O(['La distribución de edades de las personas encuestadas.','La asistencia total a festivales culturales.','El acceso a bibliotecas por barrios y horarios.','Las ventas de novelas en librerías locales.'],['La distribució d’edats de les persones participants a l’enquesta.','L’assistència total a festivals culturals.','L’accés a biblioteques per barris i horaris.','Les vendes de novel·les en llibreries locals.'],['The age distribution among all the festival respondents.','The attendance at other cultural festivals.','Library access across areas and opening hours.','The sales of novels in local bookshops.']),2,L('El texto destaca posibles desigualdades en el acceso al servicio.','El text destaca possibles desigualtats en l’accés al servici.','The passage raises unequal access as a separate question.'))
]);
// BACHILLERATO — audio
CC('c8_b_audio','bach','audio','science',L('La certeza y la revisión científica','La certesa i la revisió científica','Certainty and scientific revision'),L(
'En una conferencia sobre ciencia, una investigadora explicó que la confianza en una teoría no equivale a considerarla infalible. Una explicación científica gana respaldo cuando predice fenómenos y supera pruebas reproducibles. Pero sus conclusiones se expresan siempre bajo determinadas condiciones y con un margen de incertidumbre. Para ilustrarlo, recordó que un instrumento puede registrar medidas sistemáticamente desplazadas si no se calibra, aunque cada lectura parezca muy precisa. También advirtió que dos variables pueden cambiar juntas sin que una sea la causa de la otra. Alguien del público preguntó si admitir incertidumbre significaba que todas las opiniones tenían el mismo valor. La ponente respondió que no: las hipótesis respaldadas por datos rigurosos merecen más confianza que las afirmaciones que evitan someterse a prueba. Reconocer límites no destruye el conocimiento; permite delimitarlo, mejorarlo y corregir errores. Concluyó que una comunidad científica sólida no necesita ocultar las discrepancias: necesita métodos públicos para evaluarlas.',
'En una conferència sobre ciència, una investigadora explicà que confiar en una teoria no equival a considerar-la infal·lible. Una explicació científica guanya suport quan prediu fenòmens i supera proves reproduïbles. Però les conclusions s’expressen sempre sota determinades condicions i amb un marge d’incertesa. Per a il·lustrar-ho, recordà que un instrument pot registrar mesures sistemàticament desplaçades si no es calibra, encara que cada lectura semble molt precisa. També advertí que dues variables poden canviar juntes sense que una cause l’altra. Algú del públic preguntà si admetre incertesa significava que totes les opinions tenien el mateix valor. La ponent respongué que no: les hipòtesis avalades per dades rigoroses mereixen més confiança que les afirmacions que eviten sotmetre’s a prova. Reconéixer límits no destruïx el coneixement; permet delimitar-lo, millorar-lo i corregir errors. Conclogué que una comunitat científica sòlida no necessita ocultar les discrepàncies: necessita mètodes públics per a avaluar-les.',
'At a science conference, a researcher explained that trusting a theory does not mean considering it infallible. Scientific explanations gain support when they predict events and survive reproducible tests. Their conclusions, however, apply under specified conditions and carry some uncertainty. To illustrate this, she noted that an instrument can produce consistently biased readings if it is not calibrated, even when its displayed figures seem highly precise. She also warned that two variables may change together without one causing the other. A member of the audience asked whether admitting uncertainty meant that all opinions deserved equal weight. The speaker said no: hypotheses supported by rigorous evidence merit more confidence than claims that avoid testing. Acknowledging limits does not destroy knowledge; it helps define its scope, improve it and correct mistakes. She concluded that a strong scientific community does not need to conceal disagreements. It needs public methods for evaluating them.'),[
CQ('essential',L('¿Qué tesis expresa la ponente?','Quina tesi expressa la ponent?','What is the speaker’s main thesis?'),O(['La incertidumbre invalida cualquier investigación.','Toda medición precisa demuestra una teoría.','Las discrepancias impiden alcanzar acuerdos.','El conocimiento fiable admite revisión y límites.'],['La incertesa invalida qualsevol investigació.','Tota mesura precisa demostra una teoria.','Les discrepàncies impedixen arribar a acords.','El coneixement fiable admet revisió i límits.'],['Uncertainty invalidates every scientific study.','Every precise reading proves a whole theory.','Disagreement makes agreement impossible.','Reliable knowledge allows limits and revision.']),3,L('La revisión fortalece el conocimiento al hacer explícitos sus límites y pruebas.','La revisió reforça el coneixement en fer explícits els límits i les proves.','Revisability is presented as a strength, not a defect, of science.')),
CQ('vocab',L('¿Qué significa «infalible» en el discurso?','Què significa «infal·lible» en el discurs?','What does “infallible” mean in the talk?'),O(['Que no puede equivocarse nunca.','Que se entiende sin formación previa.','Que nunca necesita instrumentos.','Que siempre se presenta por escrito.'],['Que no pot equivocar-se mai.','Que s’entén sense formació prèvia.','Que mai necessita instruments.','Que sempre es presenta per escrit.'],['Incapable of ever being mistaken.','Understandable without prior study.','Independent of all instruments.','Always presented in written form.']),0,L('Se contrapone la confianza razonada a la creencia en la ausencia total de errores.','Es contraposa la confiança raonada a creure en l’absència total d’errors.','It contrasts warranted confidence with a claim of never being wrong.')),
CQ('logic',L('¿Por qué una lectura precisa puede ser errónea?','Per què una lectura precisa pot ser errònia?','Why can a precise reading still be inaccurate?'),O(['Porque las magnitudes no se pueden expresar con cifras.','Porque una mala calibración introduce un sesgo estable.','Porque toda observación elimina la incertidumbre.','Porque medir varias veces cambia una ley natural.'],['Perquè les magnituds no es poden expressar amb xifres.','Perquè una mala calibració introduïx un biaix estable.','Perquè tota observació elimina la incertesa.','Perquè mesurar diverses vegades canvia una llei natural.'],['Because quantities cannot be expressed as numbers.','Because poor calibration introduces a steady bias.','Because every reading removes uncertainty.','Because repeated measures change natural laws.']),1,L('La precisión aparente no garantiza ausencia de error sistemático.','La precisió aparent no garantix l’absència d’error sistemàtic.','Consistent measurements can still be shifted by calibration bias.')),
CQ('critical',L('¿Qué error critica cuando habla de dos variables?','Quin error critica quan parla de dues variables?','What reasoning error does she criticise about two variables?'),O(['Suponer que un dato nunca cambia.','Confundir una definición con un ejemplo.','Dar por cierta la causalidad solo por correlación.','Considerar todas las mediciones irrepetibles.'],['Suposar que dues variables sempre són independents.','Confondre la tendència temporal amb una definició.','Donar per certa la causalitat només per correlació.','Considerar que totes les mesures són irrepetibles.'],['Assuming that no measurement ever changes.','Confusing a definition with an example.','Claiming causation from correlation alone.','Treating all measurements as unrepeatable.']),2,L('Que dos fenómenos varíen juntos no prueba que uno produzca el otro.','Que dos fenòmens varien junts no prova que l’un produïsca l’altre.','Co-variation does not establish a cause-and-effect relationship.')),

 }catch(err){alert(tr('v10InvalidBackup'));}

}
function getOral(){
 if(!state.exercise || !BANK.some(x=>x.id===state.exercise.id&&x.level===state.level&&x.skill==='listen'))freshExercise();
 if(!state.exercise)return null;
 if(!state.oral||state.oral.id!==state.exercise.id||state.oral.lang!==state.lang){

function oralMax(){return state.level==='init'||state.level==='eso1'?3:2;}
function splitForSpeech(s){
 // Sentences preserve natural prosody. For long ones, break at punctuation or whitespace.
 const sentences=s.match(/[^.!?]+[.!?]+(?:[»”’"']*)|[^.!?]+$/g)||[s];
 const chunks=[];
 for(const sentence of sentences){let remaining=sentence.trim();
  while(remaining.length>245){let cut=Math.max(remaining.lastIndexOf(';',245),remaining.lastIndexOf(':',245),remaining.lastIndexOf(',',245));
   if(cut<110)cut=remaining.lastIndexOf(' ',245);
   if(cut<80)cut=245;
   chunks.push(remaining.slice(0,cut+1).trim());remaining=remaining.slice(cut+1).trim();
  }

}
function startAudio(){

 const item=BANK.find(x=>x.id===o.id);
 const parts=splitForSpeech(l(item.passage));

 const lang=voice?.lang||VOICE_LOCALES[state.lang];
 let i=0;
 const rate=voicePrefs[state.lang].rate;
 function nextPart(){
  if(token!==speechRun || state.oral!==o)return;
  if(i>=parts.length){o.playing=false;o.heard=true;o.plays++;o.error='';renderMain();return;}
  let utterance;
  try{utterance=new SpeechSynthesisUtterance(parts[i++]);}catch(e){fail();return;}
  utterance.lang=lang;
  if(voice)utterance.voice=voice;
  utterance.rate=rate;utterance.pitch=1;
  utterance.onend=()=>{if(token===speechRun)nextPart();};
  utterance.onerror=ev=>{if(token===speechRun){if(ev.error==='canceled'||ev.error==='interrupted')return;fail();}};

}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,val=el.dataset.value;
 if(action==='practice-menu'){state.menuOpen=!state.menuOpen;render();if(state.menuOpen)document.querySelector('#practiceMenu button')?.focus();return;}

 else if(action==='task-undo'){const ex=state.exercise;if(ex?.draft?.length&&ex.answers[ex.index]===undefined){ex.draft.pop();renderMain();}}
 else if(action==='task-evidence'){const ex=state.exercise;if(!ex||ex.answers[ex.index]!==undefined)return;if(state.section==='listen'&&!state.oral?.heard)return;const item=BANK.find(x=>x.id===ex.id),q=item.questions[ex.index];if(q.kind!=='evidence')return;const response=Number(val);if(response<0||response>=q.task.fragments[state.lang].length)return;ex.answers[ex.index]=response;progress.records.push({lang:state.lang,level:item.level,skill:item.skill,ok:response===q.answer,date:new Date().toISOString(),textId:item.id});progress.records=progress.records.slice(-1000);save();render();}
 else if(action==='task-submit'){const ex=state.exercise;if(!ex||ex.answers[ex.index]!==undefined)return;if(state.section==='listen'&&!state.oral?.heard)return;const item=BANK.find(x=>x.id===ex.id),q=item.questions[ex.index];if(!q.kind||q.kind==='evidence')return;const draft=ex.draft||[],need=q.kind==='cloze'?1:q.kind==='order'?q.task.items.length:q.kind==='match'?q.task.left.length:q.task.items.length;if(draft.length!==need||!draft.every(Number.isInteger))return;const response=q.kind==='cloze'?draft[0]:draft.join(',');ex.answers[ex.index]=response;progress.records.push({lang:state.lang,level:item.level,skill:item.skill,ok:response===q.answer,date:new Date().toISOString(),textId:item.id});progress.records=progress.records.slice(-1000);save();render();}
 else if(action==='answer'){if(state.section==='listen'&&!state.oral?.heard)return;const ex=state.exercise;if(!ex||ex.complete||ex.answers[ex.index]!==undefined)return;const item=BANK.find(x=>x.id===ex.id);const i=Number(val);if(i<0||i>=item.questions[ex.index].choices[state.lang].length)return;ex.answers[ex.index]=i;progress.records.push({lang:state.lang,level:item.level,skill:item.skill,ok:i===item.questions[ex.index].answer,date:new Date().toISOString(),textId:item.id});progress.records=progress.records.slice(-1000);save();render();}
 else if(action==='next-question'){const ex=state.exercise;if(!ex||ex.answers[ex.index]===undefined)return;const item=BANK.find(x=>x.id===ex.id);if(ex.index>=item.questions.length-1)ex.complete=true;else {ex.index++;ex.hint=false;ex.draft=[];}render();}
 else if(action==='next-text'){freshExercise();render();}
 else if(action==='browse'){state.browseId=val;render();document.querySelector('#catalogPreview')?.scrollIntoView({block:'nearest',behavior:'instant'});}
 else if(action==='browse-close'){state.browseId=null;render();}
 else if(action==='browse-reset'){Object.assign(state,{exploreLevel:'all',exploreSkill:'all',exploreArea:'all',exploreMode:'all',exploreSort:'level',exploreTask:'all',browseId:null,search:''});render();}
 else if(action==='practice-item'){const entry=BANK.find(x=>x.id===val);if(!entry)return;state.section=entry.skill;state.level=entry.level;freshExercise(entry.id);render();}
 else if(action==='reset'){if(confirm(tr('confirmReset'))){progress={records:[],challengeAttempts:[],challengeDraft:null};state.challenge=null;state.challengeScreen='catalog';save();render();}}
});

// Interacciones v1.0: ordenación, relacionar, clasificar, completar y evidencia en el propio pasaje.
function taskCorrect(q,response){return response===q.answer;}
function taskAnswerText(q){if(!q.kind)return l(q.choices[state.lang][q.answer]);const t=q.task;
 if(q.kind==='evidence')return t.fragments[state.lang][t.answer];
 if(q.kind==='cloze')return t.options[state.lang][t.answer];
 if(q.kind==='order')return t.answer.map(i=>l(t.items[i])).join(' → ');
 if(q.kind==='match')return t.left.map((it,i)=>l(it)+' → '+l(t.right[t.answer[i]])).join(' · ');
 if(q.kind==='classify')return t.items.map((it,i)=>l(it)+' → '+l(t.categories[t.answer[i]])).join(' · ');
 return '';
}
function highlightEvidence(txt,q,sel,answered){const fragments=q.task.fragments[state.lang];const matches=fragments.map((s,i)=>({s,i,at:txt.indexOf(s)})).sort((a,b)=>a.at-b.at);let out='',pos=0;
 for(const x of matches){if(x.at<pos)continue;out+=h(txt.slice(pos,x.at));const cls=answered?(x.i===q.answer?' correct':x.i===sel?' wrong':''):'';
 out+=`<button type="button" class="evidence-token${cls}" data-action="task-evidence" data-value="${x.i}" ${answered?'disabled':''} aria-label="${h(l(x.s))}">${h(x.s)}</button>`;pos=x.at+x.s.length;}return out+h(txt.slice(pos));
}
function taskMarkup(q,ex){const answered=ex.answers[ex.index]!==undefined,selected=ex.answers[ex.index],t=q.task,kind=q.kind;if(!kind){return `<div class="options-grid">${q.choices[state.lang].map((op,i)=>`<button class="option ${answered?(i===q.answer?'correct':selected===i?'wrong':''):''}" data-action="answer" data-value="${i}" ${answered?'disabled':''}><span class="choiceletter">${String.fromCharCode(65+i)}</span><span>${h(op)}</span></button>`).join('')}</div>`;}
 if(kind==='evidence'){return `<div class="task-instruction">✎ ${h(tr('v7EvidenceHelp'))}</div>`;}
 const draft=ex.draft||[];let core='';
 if(kind==='order'){
  const picked=draft.filter(x=>Number.isInteger(x));const order=Array.from({length:t.items.length},(_,i)=>i).sort((a,b)=>((a*7+3)%t.items.length)-((b*7+3)%t.items.length));
  core=`<div class="task-slots">${Array.from({length:t.items.length},(_,i)=>`<div class="task-slot ${picked[i]!==undefined?'filled':''}"><span>${i+1}</span>${picked[i]===undefined?'…':h(l(t.items[picked[i]]))}</div>`).join('')}</div><div class="task-bank">${order.map(i=>`<button type="button" class="task-chip" data-action="task-pick" data-value="${i}" ${answered||picked.includes(i)?'disabled':''}>${h(l(t.items[i]))}</button>`).join('')}</div><div class="actions"><button class="btn secondary small" data-action="task-undo" ${!picked.length||answered?'disabled':''}>↶ ${h(tr('v7Undo'))}</button></div>`;
 }else if(kind==='cloze'){
  const sentence=l(t.before).split('___');core=`<div class="task-cloze">${h(sentence[0])}<select aria-label="${h(tr('v7Choose'))}" data-task-index="0" ${answered?'disabled':''}><option value="">${h(tr('v7Choose'))}</option>${t.options[state.lang].map((s,i)=>`<option value="${i}" ${draft[0]===i?'selected':''}>${h(s)}</option>`).join('')}</select>${h(sentence.slice(1).join('___'))}</div>`;
 }else{
  const left=kind==='match'?t.left:t.items, right=kind==='match'?t.right:t.categories;
  core=`<div class="task-matrix">${left.map((s,i)=>`<div class="task-pair"><strong>${h(l(s))}</strong><select data-task-index="${i}" aria-label="${h(l(s))}" ${answered?'disabled':''}><option value="">${h(tr('v7Choose'))}</option>${right.map((label,j)=>`<option value="${j}" ${draft[i]===j?'selected':''}>${h(l(label))}</option>`).join('')}</select></div>`).join('')}</div>`;
 }
 const need=kind==='order'?t.items.length:kind==='cloze'?1:(kind==='match'?t.left.length:t.items.length);
 const ready=draft.length===need&&draft.every(x=>Number.isInteger(x));
 return `<div class="task-wrap"><span class="pill blue">${h(tr('v7Kind'+kind[0].toUpperCase()+kind.slice(1)))}</span>${core}<div class="actions"><button class="btn primary" data-action="task-submit" ${answered||!ready?'disabled':''}>✓ ${h(tr('v7Check'))}</button></div></div>`;
}
function answerFooter(q,ex,isOral){const sel=ex.answers[ex.index],answered=sel!==undefined,correct=answered&&taskCorrect(q,sel);return `<div class="actions" style="margin-top:15px">${!isOral&&q.kind!=='evidence'?`<button class="btn secondary" data-action="hint" ${answered?'disabled':''}>💡 ${h(ex.hint?tr('hideHint'):tr('showHint'))}</button>`:''}${!isOral?`<button class="btn secondary" data-action="next-text">↻ ${h(tr('newText'))}</button>`:''}</div>${ex.hint&&!answered&&!isOral?`<div class="tip">💡 ${h(tr('hint'+state.section.charAt(0).toUpperCase()+state.section.slice(1)))}</div>`:''}${answered?`<div role="status" class="feedback ${correct?'ok':'bad'}"><strong>${correct?'✅ '+h(tr('good')):'🔍 '+h(tr('needsWork'))}</strong><p>${h(l(q.reason))}</p>${!correct?`<div class="answer-reveal"><strong>${h(tr('correctAnswer'))}:</strong> ${h(taskAnswerText(q))}</div>`:''}</div><div class="actions next-actions"><button class="btn primary" data-action="next-question">${h(tr(ex.index===state.exerciseTotal-1?'finish':'nextQuestion'))} →</button></div>`:''}`;}

function challengeAudioStart(){let a=state.challenge,item=activeChallenge();if(!a||!item||item.mode!=='audio'||a.playing||a.plays>=oralMax())return;if(!hasSpeech()){a.error=tr('noVoiceSupport');renderMain();return;}stopAudio();const token=speechRun;let parts=splitForSpeech(l(item.passage)),i=0,voice=findSuitableVoice(),lang=state.lang==='va'?'ca-ES':state.lang==='es'?'es-ES':'en-GB';a.playing=true;a.error='';renderMain();function fail(){if(token!==speechRun)return;stopAudio();a.error=tr('speechError');renderMain();}function part(){if(token!==speechRun||state.challenge!==a)return;if(i>=parts.length){a.playing=false;a.plays++;a.heard=true;persistChallenge();renderMain();return;}let utt;try{utt=new SpeechSynthesisUtterance(parts[i++]);}catch(e){fail();return;}utt.lang=lang;if(voice)utt.voice=voice;utt.rate=voicePrefs[state.lang].rate;utt.onend=()=>{if(token===speechRun)part()};utt.onerror=e=>{if(token===speechRun&&e.error!=='canceled'&&e.error!=='interrupted')fail()};try{speechSynthesis.speak(utt)}catch(e){fail();}}part();}
function challengeExam(el,item,a){const q=item.questions[a.index],selected=a.answers[a.index],have=selected!==null&&selected!==undefined,oral=item.mode==='audio',locked=oral&&!a.heard,alreadyAnswered=a.answers.filter(v=>v!==null&&v!==undefined).length;const missingVoice=oral&&hasSpeech()&&speechSynthesis.getVoices().length>0&&!findSuitableVoice();el.innerHTML=`<section class="paper"><div class="eyebrow">🏆 ${h(tr('challenge'))}<span class="pill mint">${h(tr(item.level))}</span><span class="pill ${oral?'amber':'blue'}">${oral?'🎧':'📄'} ${h(tr(oral?'challengeAudio':'challengeRead'))}</span></div><h2 class="h2">${h(l(item.title))}</h2><p class="lead">${h(tr('challengeLead'))}</p><div class="challenge-meter"><div class="progressbar"><span style="width:${pct(alreadyAnswered,item.questions.length)}%"></span></div><strong>${alreadyAnswered}/${item.questions.length}</strong></div>${oral?`<div class="audio-panel"><div class="audio-icon">🎧</div><div class="audio-copy"><div class="audio-label">${h(a.playing?tr('speaking'):a.heard?tr('listened'):tr('readyListen'))}</div><div class="audio-sub">${h(tr('playCount'))}: ${a.plays}/${oralMax()} · ${h(tr('listenOnly'))}</div></div><div class="audio-waves ${a.playing?'playing':''}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="actions">${a.playing?`<button class="btn secondary" data-action="challenge-audio-stop">■ ${h(tr('stopListen'))}</button>`:`<button class="btn primary" data-action="challenge-audio-play" ${a.plays>=oralMax()?'disabled':''}>▶ ${h(a.plays?tr('listenAgain'):tr('playListen'))}</button>`}</div>${a.error?`<div class="tip" role="alert">⚠️ ${h(a.error)}</div>`:''}${missingVoice?`<div class="tip">${h(tr('v9MissingVoice'))}</div>`:''}${voiceSettingsMarkup()}${locked?`<div class="oral-lock"><div class="oral-lock-icon">🔒</div><strong>${h(tr('challengeLimit'))}</strong><p>${h(tr('challengeNoHints'))}</p></div>`:''}`:`<div class="reading-card"><div class="reading-top"><strong>📄 ${h(tr('text'))}</strong><span>${h(tr('readText'))}</span></div><div class="passage" lang="${state.lang==='va'?'ca-valencia':state.lang}">${h(l(item.passage))}</div></div>${challengeTable(item)}`}${!locked?`<div class="exercise-header"><div><span class="section-kicker">${h(tr('question'))} ${a.index+1} ${h(tr('of'))} ${item.questions.length} · ${h(tr(q.skill))}</span><h3>${h(l(q.stem))}</h3></div><span class="count-bubble">${a.index+1}/${item.questions.length}</span></div><div class="options-grid">${q.choices[state.lang].map((s,i)=>`<button type="button" class="option ${selected===i?'challenge-selected':''}" data-action="challenge-answer" data-value="${i}" aria-pressed="${selected===i}"><span class="choiceletter">${String.fromCharCode(65+i)}</span><span>${h(s)}</span></button>`).join('')}</div>${have?`<div class="challenge-confirm">✓ ${h(tr('challengeRecorded'))}</div>`:''}<div class="actions" style="margin-top:16px"><button class="btn primary" data-action="challenge-next" ${have?'':'disabled'}>${h(tr(a.index===item.questions.length-1?'challengeFinish':'challengeNext'))} →</button><button class="btn secondary" data-action="challenge-back">← ${h(tr('challengeAbandon'))}</button></div>`:`<div class="actions" style="margin-top:15px"><button class="btn secondary" data-action="challenge-back">← ${h(tr('challengeAbandon'))}</button></div>`}</section>`;}
function finishChallenge(){let a=state.challenge,item=activeChallenge();if(!a||!item||a.done||a.answers.some(v=>v===null||v===undefined))return;stopAudio();a.done=true;let correct=a.answers.filter((v,i)=>v===item.questions[i].answer).length;const att={id:item.id,lang:state.lang,level:item.level,mode:item.mode,area:item.area,date:new Date().toISOString(),correct,total:item.questions.length,answers:[...a.answers]};progress.challengeAttempts=(progress.challengeAttempts||[]).concat(att).slice(-80);for(let i=0;i<item.questions.length;i++){const q=item.questions[i];progress.records.push({lang:state.lang,level:item.level,skill:q.skill,ok:q.answer===a.answers[i],date:att.date,textId:item.id,source:'challenge',modality:item.mode});}progress.records=progress.records.slice(-1500);progress.challengeDraft=null;save();state.challengeScreen='report';render();}
function challengeReport(el,item,a){const n=item.questions.length,score=a.answers.filter((v,i)=>v===item.questions[i].answer).length;const skills=[...new Set(item.questions.map(q=>q.skill))];el.innerHTML=`<section class="paper"><div class="eyebrow">🏆 ${h(tr('challengeReport'))}</div><h2 class="h2">${h(l(item.title))}</h2><div class="finish-block"><strong>${score} / ${n}</strong><span>${pct(score,n)}% · ${h(tr('challengeRight'))}</span></div><h3 class="section-title" style="margin-top:22px">${h(tr('challengeSkills'))}</h3><div class="challenge-skill-list">${skills.map(sk=>{let qs=item.questions.map((q,i)=>({q,i})).filter(x=>x.q.skill===sk),c=qs.filter(x=>x.q.answer===a.answers[x.i]).length;return `<div class="challenge-skill-row"><strong>${h(tr(sk))}</strong><div class="progressbar"><span style="width:${pct(c,qs.length)}%"></span></div><span>${c}/${qs.length}</span></div>`}).join('')}</div><h3 class="section-title" style="margin-top:24px">${h(tr('challengeReview'))}</h3><div class="challenge-review">${item.questions.map((q,i)=>{let ok=a.answers[i]===q.answer;return `<div class="challenge-review-item"><span class="pill ${ok?'mint':'amber'}">${i+1} · ${h(tr(q.skill))} ${ok?'✓':'✕'}</span><strong>${h(l(q.stem))}</strong><p>${h(tr('challengeYourAnswer'))}: ${h(q.choices[state.lang][a.answers[i]]??tr('challengeWrong'))}</p><p><b>${h(tr('challengeExpected'))}:</b> ${h(q.choices[state.lang][q.answer])}</p><small>${h(l(q.reason))}</small></div>`}).join('')}</div>${item.mode==='audio'?`<details class="oral-transcript"><summary>📜 ${h(tr('showTranscript'))}</summary><p>${h(l(item.passage))}</p></details>`:''}${item.visual?challengeTable(item):''}<div class="actions" style="margin-top:22px"><button class="btn primary" data-action="challenge-back">← ${h(tr('challengeSelect'))}</button><button class="btn secondary" data-action="section" data-value="progress">📊 ${h(tr('progress'))}</button></div></section>`;}
function challengeView(el){let item=activeChallenge();if(!item||state.challengeScreen==='catalog')challengeList(el);else if(state.challenge.done)challengeReport(el,item,state.challenge);else challengeExam(el,item,state.challenge);}
function progressViewV8(el){const s=stats({lang:state.lang});const entries=progress.records.filter(x=>x.lang===state.lang);const results=(progress.challengeAttempts||[]).filter(x=>x.lang===state.lang).slice(-12).reverse();const levels=LEVELS;const perSkill=SKILLS.map(sk=>({sk,...stats({lang:state.lang,level:state.level,skill:sk})}));const weak=perSkill.filter(x=>x.total>=3&&x.percent<60).sort((a,b)=>a.percent-b.percent);const oral=entries.filter(x=>x.modality==='audio'||x.skill==='listen'),written=entries.filter(x=>x.modality!=='audio'&&x.skill!=='listen');const rate=(a)=>a.length?pct(a.filter(x=>x.ok).length,a.length)+'%':'—';el.innerHTML=`<section class="paper"><div class="eyebrow">📊 ${h(tr('progress'))}</div><h2 class="h2">${h(tr('yourProgress'))}</h2><p class="lead">${h(tr('saveNote'))}</p><div class="stats-grid progress-major"><div class="stat"><strong>${s.right}</strong><small>${h(tr('correct'))}</small></div><div class="stat"><strong>${s.wrong}</strong><small>${h(tr('wrong'))}</small></div><div class="stat"><strong>${s.percent}%</strong><small>${h(tr('accuracy'))}</small></div></div><div class="line"></div><h3 class="section-title">${h(tr('challengeSource'))}</h3><div class="challenge-modes"><div><strong>📄 ${rate(written)}</strong><small>${h(tr('challengeReadRate'))} · ${written.length} ${h(tr('challengeTotal'))}</small></div><div><strong>🎧 ${rate(oral)}</strong><small>${h(tr('challengeAudioRate'))} · ${oral.length} ${h(tr('challengeTotal'))}</small></div></div><div class="line"></div><h3 class="section-title">${h(tr('challengeSkills'))} · ${h(tr(state.level))}</h3><div class="progress-table">${perSkill.map(f=>`<div class="progress-row"><span>${h(tr(f.sk))}</span><div class="progressbar"><span style="width:${f.percent}%"></span></div><strong>${f.total?f.percent+'%':'—'}</strong><small>${f.total} ${h(tr('count'))}</small></div>`).join('')}</div><div class="challenge-advice"><strong>🔎 ${h(tr('challengeTarget'))}</strong>${weak.length?weak.slice(0,3).map(x=>`<p>${h(tr(x.sk))} · ${x.right}/${x.total}. ${h(tr('challengePracticeAdvice'))}</p>`).join(''):`<p>${h(tr('challengeNoSamples'))}</p>`}</div><div class="line"></div><h3 class="section-title">🏆 ${h(tr('challengeAttempts'))}</h3>${results.length?`<div class="challenge-history">${results.map(a=>{const c=CHALLENGES.find(c=>c.id===a.id);return `<div class="challenge-history-row"><span>${a.mode==='audio'?'🎧':'📄'} ${h(c?l(c.title):a.id)} <small>· ${h(tr(a.level))}</small></span><strong>${a.correct}/${a.total}</strong></div>`}).join('')}</div>`:`<p class="aside-note">${h(tr('challengeNoAttempts'))}</p>`}<div class="line"></div><h3 class="section-title">${h(tr('activitySummary'))}</h3><div class="progress-table">${SKILLS.map(skill=>levels.map(level=>{let f=stats({lang:state.lang,level,skill});return `<div class="progress-row"><span>${h(tr(skill))} · ${h(tr(level))}</span><div class="progressbar"><span style="width:${f.percent}%"></span></div><strong>${f.total?f.percent+'%':'—'}</strong><small>${f.total} ${h(tr('count'))}</small></div>`}).join('')).join('')}</div><div class="line"></div>${readingSettingsMarkup()}${s.total?`<div class="actions" style="margin-top:23px"><button class="btn danger" data-action="reset">${h(tr('reset'))}</button></div>`:`<p class="tip blue">${h(tr('noProgress'))}</p>`}</section>`;}
// Recover an interrupted attempt if the source and level are still valid.
if(progress.challengeDraft){let a=progress.challengeDraft,c=CHALLENGES.find(x=>x.id===a.id);if(c&&a.lang&&LANGS.some(l=>l[0]===a.lang)&&Array.isArray(a.answers)&&a.answers.length===c.questions.length&&!a.done){state.challenge={...a,playing:false};state.challengeScreen='catalog';}else progress.challengeDraft=null;}

render();

</script>
