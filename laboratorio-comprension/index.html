E('a_e2_article','eso2','listen','literature',
 L('La reseña de una novela','La ressenya d’una novel·la','A novel review'),
 L('Una revista juvenil publicó una reseña de una novela ambientada en una ciudad donde estaba prohibido hacer preguntas. La persona que escribió la crítica elogiaba la imaginación de la autora, pero discutía el final de la historia. A su juicio, el protagonista había cambiado demasiado rápido de opinión después de escuchar un único discurso. La reseña no decía que una transformación personal fuera imposible, sino que la novela no mostraba las experiencias necesarias para hacerla convincente. En respuesta, algunos lectores defendieron que el cambio repentino tenía un valor simbólico: la decisión de preguntar representaba el despertar de la curiosidad. Otros señalaron que esa interpretación era interesante, pero que el simbolismo no resolvía por completo la falta de desarrollo del personaje. La revista publicó las distintas opiniones junto a fragmentos concretos de la novela. El debate acabó centrándose en una cuestión: ¿debe una obra explicar paso a paso cada decisión de sus personajes o puede dejar espacios para que los interprete quien lee? Nadie aportó una regla universal. Lo que sí compartían todos era la necesidad de justificar su lectura mediante elementos de la obra. De este modo, discrepar sobre una novela no significaba que cualquier interpretación fuera igualmente válida.',
 'Una revista juvenil va publicar una ressenya d’una novel·la ambientada en una ciutat on estava prohibit fer preguntes. La persona que va escriure la crítica elogiava la imaginació de l’autora, però qüestionava el final de la història. Al seu parer, el protagonista havia canviat d’opinió massa ràpid després d’escoltar un únic discurs. La ressenya no deia que una transformació personal fora impossible, sinó que la novel·la no mostrava les experiències necessàries per a fer-la convincent. Com a resposta, alguns lectors van defensar que el canvi sobtat tenia un valor simbòlic: la decisió de preguntar representava el despertar de la curiositat. Uns altres van assenyalar que eixa interpretació era interessant, però que el simbolisme no resolia del tot la falta de desenvolupament del personatge. La revista va publicar les diferents opinions juntament amb fragments concrets de la novel·la. El debat va acabar centrant-se en una qüestió: una obra ha d’explicar pas a pas cada decisió dels personatges o pot deixar espais perquè els interprete qui llig? Ningú no va aportar una regla universal. El que sí que compartien tots era la necessitat de justificar-ne la lectura amb elements de l’obra. Així, discrepar sobre una novel·la no significava que qualsevol interpretació fora igualment vàlida.',
 'A youth magazine published a review of a novel set in a city where asking questions was forbidden. The reviewer praised the author’s imagination but questioned the ending. In the reviewer’s opinion, the main character changed his mind too quickly after hearing a single speech. The criticism was not that personal change was impossible, but that the story failed to show enough experiences to make the change convincing. Some readers replied that the sudden change had symbolic value: choosing to ask questions represented the awakening of curiosity. Others thought that interpretation was interesting but argued that symbolism did not fully solve the problem of character development. The magazine published these different views alongside specific extracts from the novel. The discussion eventually centred on a broader question: should a story explain each character’s decisions step by step, or may it leave gaps for readers to interpret? Nobody offered a universal rule. What they all agreed on was the need to support an interpretation with details from the work. Disagreeing about a novel, therefore, did not mean that every interpretation was equally well supported.'),
 Q(L('¿Qué criticaba principalmente la reseña?','Què criticava principalment la ressenya?','What was the review’s main criticism?'),O(['La falta de imaginación','El cambio poco desarrollado del protagonista','La ausencia de una ciudad','La prohibición de preguntar'],['La falta d’imaginació','El canvi poc desenvolupat del protagonista','L’absència d’una ciutat','La prohibició de preguntar'],['Lack of imagination','An insufficiently developed character change','The absence of a city','The ban on questions']),1,L('La reseña cuestionaba la rapidez del cambio y su escasa preparación narrativa.','La ressenya qüestionava la rapidesa del canvi i la poca preparació narrativa.','The review questioned how quickly the character changed without enough development.')),
 Q(L('¿Qué interpretación simbólica propusieron algunos lectores?','Quina interpretació simbòlica van proposar alguns lectors?','What symbolic interpretation did some readers suggest?'),O(['La ciudad era un sueño','La revista controlaba la sociedad','Preguntar representaba despertar la curiosidad','El discurso era un diálogo inventado'],['La ciutat era un somni','La revista controlava la societat','Preguntar representava despertar la curiositat','El discurs era un diàleg inventat'],['The city was a dream','The magazine controlled society','Asking questions represented awakening curiosity','The speech was an invented dialogue']),2,L('Interpretaron la decisión de preguntar como un símbolo de curiosidad.','Van interpretar la decisió de preguntar com un símbol de curiositat.','They interpreted the decision to ask as a symbol of curiosity.')),
 Q(L('¿Qué requisito compartían las diferentes opiniones?','Quin requisit compartien les diferents opinions?','What requirement did the different views share?'),O(['Apoyarse en detalles de la obra','Llegar a la misma conclusión','Rechazar cualquier símbolo','Aceptar el final sin discutirlo'],['Basar-se en detalls de l’obra','Arribar a la mateixa conclusió','Rebutjar qualsevol símbol','Acceptar el final sense discutir-lo'],['Be supported by details from the novel','Reach the same conclusion','Reject all symbols','Accept the ending without criticism']),0,L('Una interpretación necesita evidencias textuales aunque existan lecturas distintas.','Una interpretació necessita evidències textuals encara que hi haja lectures diferents.','Interpretations should be supported by textual evidence even when readers disagree.'))),
E('a_b_ethics','bach','listen','philosophy',
 L('El dilema de la biblioteca digital','El dilema de la biblioteca digital','The digital library dilemma'),
 L('Una universidad anunció que convertiría en digitales todos sus materiales de consulta. La decisión se presentó como una medida de igualdad: cualquier estudiante podría acceder al mismo catálogo desde su ordenador. El argumento era atractivo porque relacionaba una herramienta técnica con un principio ampliamente compartido. Sin embargo, una profesora de filosofía propuso examinar las condiciones de esa afirmación. Señaló que la igualdad de acceso al catálogo no garantizaba por sí sola la igualdad en la posibilidad de utilizarlo. Algunos estudiantes disponían de conexión estable y habitaciones silenciosas; otros compartían dispositivos o dependían de redes públicas. Un representante del alumnado respondió que esas diferencias no invalidaban las ventajas del proyecto, pero sí obligaban a acompañarlo de medidas complementarias. Sugirió mantener puestos de consulta presencial, prestar equipos y permitir que determinados materiales pudieran descargarse para trabajar sin conexión. La discusión también abordó otro problema: que una plataforma recopile datos de lectura no significa necesariamente que los utilice de manera abusiva, aunque sí plantea preguntas sobre privacidad que requieren respuestas concretas. La profesora añadió que, para comprobar si la medida funcionaba, debían definir indicadores distintos del número de documentos descargados. Por ejemplo, sería útil estudiar si el alumnado podía completar las actividades, si recurría a espacios públicos por falta de conexión y si las ayudas llegaban realmente a quienes las necesitaban. También recordó que un promedio favorable puede ocultar situaciones minoritarias importantes. Un representante propuso realizar entrevistas voluntarias y comparar los resultados entre cursos, procurando no publicar datos personales. Esa información permitiría ajustar las medidas sin confundir la satisfacción general con la ausencia de dificultades concretas. Al finalizar, el consejo universitario descartó tanto la defensa incondicional del proyecto como su rechazo absoluto. Acordó impulsar la digitalización con garantías de acceso y revisar después sus efectos. El caso ilustraba una distinción fundamental: que una medida persiga un fin justo no demuestra automáticamente que todos sus efectos sean justos. A su vez, descubrir riesgos no convierte una propuesta en necesariamente perjudicial. El juicio razonado exige comparar objetivos, condiciones y consecuencias.',
 'Una universitat va anunciar que convertiria en digitals tots els materials de consulta. La decisió es va presentar com una mesura d’igualtat: qualsevol estudiant podria accedir al mateix catàleg des de l’ordinador. L’argument era atractiu perquè relacionava una ferramenta tècnica amb un principi àmpliament compartit. Tanmateix, una professora de filosofia va proposar examinar les condicions d’aquella afirmació. Va assenyalar que la igualtat d’accés al catàleg no garantia per si sola la igualtat en la possibilitat d’utilitzar-lo. Alguns estudiants disposaven de connexió estable i habitacions silencioses; uns altres compartien dispositius o depenien de xarxes públiques. Un representant de l’alumnat va respondre que eixes diferències no anul·laven els avantatges del projecte, però sí que obligaven a acompanyar-lo de mesures complementàries. Va suggerir mantindre llocs de consulta presencial, prestar equips i permetre descarregar determinats materials per a treballar sense connexió. La discussió també va tractar un altre problema: que una plataforma recopile dades de lectura no significa necessàriament que les utilitze de manera abusiva, encara que sí que planteja preguntes sobre privacitat que exigixen respostes concretes. La professora va afegir que, per a comprovar si la mesura funcionava, calia definir indicadors diferents del nombre de documents descarregats. Per exemple, seria útil estudiar si l’alumnat podia completar les activitats, si acudia a espais públics per falta de connexió i si les ajudes arribaven realment a qui les necessitava. També va recordar que una mitjana favorable pot ocultar situacions minoritàries importants. Un representant va proposar fer entrevistes voluntàries i comparar els resultats entre cursos, procurant no publicar dades personals. Eixa informació permetria ajustar les mesures sense confondre la satisfacció general amb l’absència de dificultats concretes. En acabar, el consell universitari va descartar tant la defensa incondicional del projecte com el rebuig absolut. Va acordar impulsar la digitalització amb garanties d’accés i revisar després els efectes. El cas il·lustrava una distinció fonamental: que una mesura perseguisca un objectiu just no demostra automàticament que tots els efectes siguen justos. Alhora, descobrir riscos no convertix una proposta en necessàriament perjudicial. El juí raonat exigix comparar objectius, condicions i conseqüències.',
 'A university announced that it would digitise all its reference materials. The decision was presented as a measure of equality: every student would have access to the same catalogue from a computer. This argument was appealing because it linked a technical tool with a widely accepted principle. However, a philosophy lecturer suggested examining the conditions behind the claim. She noted that equal access to a catalogue did not automatically create equal opportunities to use it. Some students had reliable connections and quiet rooms, while others shared devices or depended on public networks. A student representative replied that these inequalities did not cancel out the advantages of the project, but did require additional measures. The representative proposed keeping on-campus consultation spaces, lending equipment and allowing some materials to be downloaded for offline use. The discussion also raised another question: a platform’s collection of reading data does not necessarily mean it will misuse that information, although it does create privacy questions that deserve clear answers. The lecturer added that the university would need ways to evaluate whether the policy actually worked. The number of documents downloaded would not be sufficient. Researchers could examine whether students completed assignments, whether they had to use public spaces because they lacked reliable connections, and whether support reached those who needed it. She also warned that a positive average could conceal serious problems affecting smaller groups. A representative suggested voluntary interviews and comparisons across different courses, while protecting personal data. This information would help the university improve the policy rather than confusing overall satisfaction with the absence of specific barriers. By the end of the meeting, the university council had rejected both unqualified support for the project and its outright dismissal. It agreed to introduce digitisation alongside access guarantees and to evaluate the results afterwards. The case illustrated an important distinction: a policy designed to achieve a fair goal does not automatically produce fair outcomes for everyone. Equally, identifying risks does not prove that a proposal must be harmful. Careful judgement requires comparing purposes, conditions and consequences.'),
 Q(L('¿Qué distinción considera esencial la profesora?','Quina distinció considera essencial la professora?','Which distinction does the lecturer emphasise?'),O(['Tener acceso al catálogo y poder aprovecharlo','Usar ordenadores y leer libros','Los materiales físicos y las fotografías','La universidad y la biblioteca municipal'],['Tindre accés al catàleg i poder aprofitar-lo','Usar ordinadors i llegir llibres','Els materials físics i les fotografies','La universitat i la biblioteca municipal'],['Accessing a catalogue and being able to use it effectively','Using computers and reading books','Physical materials and photographs','A university and a town library']),0,L('El acceso formal no garantiza condiciones materiales iguales para estudiar.','L’accés formal no garantix condicions materials iguals per a estudiar.','Formal access does not guarantee equal practical conditions for studying.')),
 Q(L('¿Cuál fue la posición final del consejo?','Quina va ser la posició final del consell?','What was the council’s final position?'),O(['Prohibir toda digitalización','Digitalizar sin evaluar consecuencias','Digitalizar con garantías y revisar resultados','Dejar que cada asignatura decida sin criterios'],['Prohibir tota digitalització','Digitalitzar sense avaluar conseqüències','Digitalitzar amb garanties i revisar resultats','Deixar que cada assignatura decidisca sense criteris'],['Prohibit all digitisation','Digitise without reviewing outcomes','Digitise with safeguards and evaluate results','Let each course decide without criteria']),2,L('Optaron por una implementación condicionada y evaluable, no por los extremos.','Van optar per una aplicació condicionada i avaluable, no pels extrems.','They chose an approach with safeguards and subsequent evaluation.')),
 Q(L('¿Qué conclusión NO autoriza el texto?','Quina conclusió NO permet el text?','Which conclusion is NOT supported by the passage?'),O(['La igualdad formal puede ser insuficiente','Una política bienintencionada siempre produce resultados justos','Es razonable estudiar riesgos de privacidad','Las medidas adicionales pueden favorecer la inclusión'],['La igualtat formal pot ser insuficient','Una política benintencionada sempre té resultats justos','És raonable estudiar riscos de privacitat','Les mesures complementàries poden afavorir la inclusió'],['Formal equality can be insufficient','A well-intended policy always has fair results','Privacy risks deserve examination','Additional support can improve inclusion']),1,L('El cierre del texto rechaza precisamente que un objetivo justo garantice efectos justos.','El final del text rebutja precisament que un objectiu just garantisca efectes justos.','The final point explicitly rejects the assumption that good intentions guarantee fair outcomes.'))),
E('a_b_science','bach','listen','science',
 L('El resultado que nadie esperaba','El resultat que ningú esperava','The unexpected result'),
 L('Un equipo de investigación estudió si una nueva forma de organizar los descansos mejoraba la atención durante las clases. Reunió a dos grupos de participantes. Uno mantuvo sus pausas habituales; el otro hizo descansos breves y frecuentes. Al finalizar la semana, el segundo grupo obtuvo una puntuación media superior en una prueba de atención. El resultado parecía favorecer la nueva organización. No obstante, la investigadora responsable explicó que los participantes habían elegido voluntariamente su grupo. Era posible que quienes optaron por los descansos frecuentes estuvieran también más motivados, durmieran mejor o tuvieran otros hábitos relacionados con la atención. Por tanto, los datos mostraban una asociación, pero no demostraban por sí solos que el cambio de pausas hubiera causado la mejora. Para avanzar, el equipo diseñó una segunda fase con asignación aleatoria de participantes y condiciones de evaluación más uniformes. También decidió registrar la duración del sueño y otras variables relevantes, aunque advirtió que ningún diseño puede controlar absolutamente todos los factores. La investigadora añadió que una mejora en la puntuación media no indicaba necesariamente que todas las personas hubieran mejorado. Un pequeño número de participantes podía influir en el promedio, por lo que convenía examinar también la dispersión de los resultados y comunicar cuántas personas formaban cada grupo. Explicó además que una prueba de atención realizada una sola vez podía verse afectada por el cansancio o por la familiaridad con el procedimiento. Por ese motivo, la siguiente fase incluiría mediciones repetidas. El equipo se comprometió a publicar el procedimiento y los criterios de análisis para que otras personas pudieran valorar la investigación y, si fuera posible, reproducirla. Durante la discusión pública, un periódico resumió el estudio con el titular «Los descansos frecuentes multiplican la concentración». La investigadora pidió corregirlo: la prueba medía puntuaciones de atención y el informe no había hablado de multiplicar ninguna capacidad. El periódico rectificó y publicó los datos de forma más precisa. Un lector interpretó la rectificación como una prueba de que el estudio era inútil. Otro replicó que reconocer los límites de un resultado no equivale a descartarlo: permite formular hipótesis y diseñar nuevas comprobaciones. En ciencia, una conclusión sólida no nace de afirmar más de lo que los datos permiten, sino de hacer explícitas las incertidumbres y reducirlas mediante investigaciones reproducibles.',
 'Un equip d’investigació va estudiar si una nova manera d’organitzar els descansos millorava l’atenció durant les classes. Va reunir dos grups de participants. Un va mantindre les pauses habituals; l’altre va fer descansos breus i freqüents. En acabar la setmana, el segon grup va obtindre una puntuació mitjana superior en una prova d’atenció. El resultat semblava afavorir la nova organització. Tanmateix, la investigadora responsable va explicar que els participants havien triat voluntàriament el grup. Era possible que qui havia optat pels descansos freqüents també estiguera més motivat, dormira millor o tinguera altres hàbits relacionats amb l’atenció. Per tant, les dades mostraven una associació, però no demostraven per si soles que el canvi de pauses haguera causat la millora. Per a avançar, l’equip va dissenyar una segona fase amb assignació aleatòria de participants i condicions d’avaluació més uniformes. També va decidir registrar la duració del son i altres variables rellevants, encara que va advertir que cap disseny pot controlar absolutament tots els factors. La investigadora va afegir que una millora en la puntuació mitjana no indicava necessàriament que totes les persones hagueren millorat. Un nombre reduït de participants podia influir en la mitjana, per la qual cosa convenia examinar també la dispersió dels resultats i comunicar quantes persones formaven cada grup. Va explicar, a més, que una prova d’atenció realitzada una sola vegada podia veure’s afectada pel cansament o per la familiaritat amb el procediment. Per això, la fase següent inclouria mesures repetides. L’equip es va comprometre a publicar el procediment i els criteris d’anàlisi perquè altres persones pogueren valorar la investigació i, si fora possible, reproduir-la. Durant la discussió pública, un periòdic va resumir l’estudi amb el titular «Els descansos freqüents multipliquen la concentració». La investigadora va demanar que el corregiren: la prova mesurava puntuacions d’atenció i l’informe no havia parlat de multiplicar cap capacitat. El periòdic va rectificar i va publicar les dades de manera més precisa. Un lector va interpretar la rectificació com una prova que l’estudi era inútil. Un altre va respondre que reconéixer els límits d’un resultat no equival a descartar-lo: permet formular hipòtesis i dissenyar noves comprovacions. En ciència, una conclusió sòlida no naix d’afirmar més del que les dades permeten, sinó de fer explícites les incerteses i reduir-les mitjançant investigacions reproduïbles.',
 'A research team investigated whether a different arrangement of breaks could improve attention in class. They recruited two groups of participants. One followed their usual breaks, while the other took shorter, more frequent ones. At the end of the week, the second group achieved a higher average score on an attention test. At first glance, this seemed to favour the new arrangement. However, the lead researcher explained that participants had chosen which group to join. People who preferred frequent breaks might also have been more motivated, slept better or had other habits related to attention. The findings therefore showed an association, but did not establish that the breaks themselves caused the improvement. To investigate further, the team planned a second phase in which participants would be assigned to groups at random and assessment conditions would be more uniform. Researchers also planned to record sleep duration and other potentially relevant factors, while recognising that no study can control absolutely every influence. The researcher added that a higher average score did not necessarily mean that every participant had improved. A small number of people could influence the average, so the team needed to inspect the spread of the results and disclose the number of participants in each group. She also explained that an attention test administered only once could be affected by fatigue or familiarity with the testing method. The next phase would therefore include repeated measurements. The team committed to publishing its procedures and analysis criteria so other researchers could assess the work and, where possible, reproduce the investigation. During the public discussion, a newspaper ran the headline “Frequent breaks multiply concentration”. The researcher requested a correction: the study had measured attention scores and had not claimed any multiplication of a human ability. The newspaper revised its headline and reported the findings more precisely. One reader interpreted this correction as proof that the investigation was worthless. Another argued that recognising a result’s limits is not the same as rejecting it: preliminary evidence can inspire hypotheses and guide more rigorous testing. In science, reliable conclusions do not come from claiming more than the data allow. They emerge from making uncertainties clear and reducing them through reproducible investigations.'),
 Q(L('¿Cuál era la principal limitación del primer estudio?','Quina era la principal limitació del primer estudi?','What was the main limitation of the first study?'),O(['No se midió la atención','Los participantes eligieron su grupo','Todos tenían el mismo horario','No existía una hipótesis'],['No es va mesurar l’atenció','Els participants van triar el grup','Tots tenien el mateix horari','No hi havia una hipòtesi'],['Attention was not measured','Participants selected their own groups','Everyone had the same schedule','The study had no hypothesis']),1,L('La autoselección puede introducir diferencias entre grupos ajenas a los descansos.','L’autoselecció pot introduir diferències entre grups alienes als descansos.','Self-selection may introduce differences unrelated to the break schedules.')),
 Q(L('¿Por qué se pidió corregir el titular?','Per què es va demanar corregir el titular?','Why did the researcher ask to correct the headline?'),O(['Porque no se hizo ninguna prueba','Porque los grupos eran idénticos','Porque exageraba lo que los datos demostraban','Porque el periódico no podía publicar ciencia'],['Perquè no es va fer cap prova','Perquè els grups eren idèntics','Perquè exagerava el que demostraven les dades','Perquè el periòdic no podia publicar ciència'],['Because no test was carried out','Because the groups were identical','Because it exaggerated what the evidence supported','Because newspapers cannot report science']),2,L('Las puntuaciones no permitían concluir que la capacidad se multiplicase.','Les puntuacions no permetien concloure que la capacitat es multiplicara.','The results did not support the claim that concentration was multiplied.')),
 Q(L('¿Qué interpretación expresa mejor el cierre?','Quina interpretació expressa millor el final?','Which interpretation best reflects the conclusion?'),O(['Reconocer límites permite mejorar la investigación','La primera fase demuestra una relación causal','La rectificación invalida cualquier estudio','La ciencia debe evitar los resultados provisionales'],['Reconéixer límits permet millorar la investigació','La primera fase demostra una relació causal','La rectificació invalida qualsevol estudi','La ciència ha d’evitar els resultats provisionals'],['Recognising limits helps improve research','The first phase proves causation','A correction invalidates all studies','Science must avoid provisional results']),0,L('Hacer explícitas las incertidumbres permite diseñar pruebas mejores.','Fer explícites les incerteses permet dissenyar proves millors.','Identifying uncertainty can guide better research and replication.')))
);

E('f_e1_wind','eso1','figure','literature',

 L('El colegio había cerrado por vacaciones. Las hojas rodaban sobre las baldosas y el viento parecía susurrar entre las ventanas. «El patio nos echa de menos», escribió Paula en su diario. No pensaba que el edificio sintiera tristeza: buscaba una forma de expresar lo extraño que le resultaba verlo sin niños.',

E('f_e1_bridge','eso1','figure','history',
 L('Palabras que construyen','Paraules que construïxen','Words that build bridges'),
 L('Dos grupos de vecinos discutían sobre cómo utilizar una plaza antigua. Unos querían más árboles y otros, espacio para actividades culturales. En la reunión, la mediadora comentó: «Las palabras pueden ser puentes o muros». Después pidió a cada grupo que explicara las necesidades del otro antes de defender su propuesta. Poco a poco llegaron a un acuerdo que reservaba espacio para ambas actividades.',
 'Dos grups de veïns discutien sobre com utilitzar una plaça antiga. Uns volien més arbres i altres, espai per a activitats culturals. En la reunió, la mediadora va comentar: «Les paraules poden ser ponts o murs». Després va demanar a cada grup que explicara les necessitats de l’altre abans de defensar la seua proposta. A poc a poc van arribar a un acord que reservava espai per a les dos activitats.',
 'Two groups of neighbours disagreed about an old square. Some wanted more trees; others wanted space for cultural events. At a meeting, the mediator said, “Words can be bridges or walls.” She then asked each group to explain the other side’s needs before defending its own plan. Gradually they agreed on a design that made room for both activities.'),
 Q(L('¿Qué significan «puentes» y «muros»?','Què signifiquen «ponts» i «murs»?','What do “bridges” and “walls” represent?'),

 L('Las metáforas representan la capacidad del lenguaje para acercar o enfrentar posiciones.','Les metàfores representen la capacitat del llenguatge per a acostar o enfrontar posicions.','The metaphors contrast communication that brings people together with communication that divides them.')),
 Q(L('¿Qué acción responde mejor a la imagen del «puente»?','Quina acció respon millor a la imatge del «pont»?','Which action best fits the “bridge” image?'),

E('f_e2_irony','eso2','figure','daily',
 L('El reloj de la reunión','El rellotge de la reunió','The meeting clock'),
 L('La reunión estaba fijada a las cinco. A las cinco y cuarenta apareció por fin quien debía presentar el proyecto. Nadie había avisado del retraso y varias personas habían tenido que marcharse. Al verlo entrar, una compañera señaló el reloj y comentó: «¡Qué ejemplo de puntualidad!». Su tono era seco; no estaba felicitándolo, sino recriminándole que hubiera hecho perder el tiempo a los demás. La persona que llegaba tarde respondió que el autobús se había averiado.',
 'La reunió estava fixada a les cinc. A les cinc i quaranta va aparéixer finalment qui havia de presentar el projecte. Ningú havia avisat del retard i diverses persones havien hagut d’anar-se’n. En vore’l entrar, una companya va assenyalar el rellotge i va comentar: «Quin exemple de puntualitat!». El to era sec; no el felicitava, sinó que li retreia que haguera fet perdre el temps als altres. La persona que arribava tard va respondre que l’autobús s’havia avariat.',
 'The meeting was scheduled for five o’clock. At twenty to six, the person due to present the project finally arrived. No one had been warned, and several participants had already left. Pointing at the clock, a colleague remarked, “What an excellent example of punctuality!” Her voice was dry: she was not praising him but criticising the time everyone had lost. The late arrival explained that his bus had broken down.'),
 Q(L('¿Qué intención tiene «¡Qué ejemplo de puntualidad!»?','Quina intenció té «Quin exemple de puntualitat!»?','What is the intention behind “What an excellent example of punctuality”?'),

 L('El contexto contradice el elogio literal: la frase expresa una crítica irónica.','El context contradiu l’elogi literal: la frase expressa una crítica irònica.','The context contradicts the literal praise: the statement is ironic criticism.')),
 Q(L('¿Qué dato resulta decisivo para interpretar la frase?','Quina dada és decisiva per a interpretar la frase?','Which detail is essential to understanding the remark?'),
 O(['La avería del autobús por sí sola','Que la persona llegó cuarenta minutos tarde','Que la reunión era sobre un proyecto','Que varias personas tenían reloj'],['L’avaria de l’autobús per si sola','Que la persona va arribar quaranta minuts tard','Que la reunió tractava d’un projecte','Que diverses persones duien rellotge'],['The bus breakdown alone','The person arrived forty minutes late','The meeting involved a project','Several people had watches']),1,
 L('El retraso, unido al comentario elogioso, permite reconocer la contradicción irónica.','El retard, unit al comentari elogiós, permet reconéixer la contradicció irònica.','The long delay conflicts with the apparent praise, revealing the irony.'))),
E('f_e2_anaphora','eso2','figure','science',
 L('Un discurso sobre el agua','Un discurs sobre l’aigua','A speech about water'),
 L('En una asamblea juvenil, una estudiante defendió la necesidad de conservar los humedales. Su intervención comenzó así: «Sin agua no hay anfibios. Sin agua no hay cosechas. Sin agua no hay comunidad que pueda sostenerse». Después explicó que la pérdida de estos espacios afectaba tanto a la biodiversidad como a determinados usos agrícolas, aunque no todos los problemas ambientales tenían la misma causa. Cerró su discurso proponiendo estudiar las necesidades del entorno antes de aprobar nuevas obras. Varios oyentes recordaron especialmente las tres frases iniciales.',
 'En una assemblea juvenil, una estudiant va defensar la necessitat de conservar les zones humides. La intervenció va començar així: «Sense aigua no hi ha amfibis. Sense aigua no hi ha collites. Sense aigua no hi ha comunitat que puga mantindre’s». Després va explicar que la pèrdua d’estos espais afectava tant la biodiversitat com alguns usos agrícoles, encara que no tots els problemes ambientals tenien la mateixa causa. Va acabar proposant estudiar les necessitats de l’entorn abans d’aprovar noves obres. Diverses persones van recordar sobretot les tres frases inicials.',
 'At a youth assembly, a student argued for the protection of wetlands. She began: “Without water, there are no amphibians. Without water, there are no crops. Without water, there is no community that can endure.” She went on to explain that the loss of wetlands affects biodiversity and some forms of farming, while acknowledging that environmental problems can have different causes. She ended by suggesting that local needs be studied before new construction projects are approved. Several listeners particularly remembered her opening sentences.'),
 Q(L('¿Qué efecto produce repetir «Sin agua» al principio?','Quin efecte produïx repetir «Sense aigua» al principi?','What is the effect of repeating “Without water” at the start?'),
 O(['Destacar una idea común mediante ritmo y énfasis','Expresar dudas sobre la existencia del agua','Indicar que todas las frases son preguntas','Cambiar el significado científico del agua'],['Destacar una idea comuna amb ritme i èmfasi','Expressar dubtes sobre l’existència de l’aigua','Indicar que totes les frases són preguntes','Canviar el significat científic de l’aigua'],['To emphasise a shared idea through rhythm','To question whether water exists','To turn the statements into questions','To change the scientific meaning of water']),0,
 L('La anáfora refuerza y hace memorable la dependencia del agua.','L’anàfora reforça i fa memorable la dependència de l’aigua.','Anaphora makes the dependence on water more emphatic and memorable.')),
 Q(L('¿Qué opción describe mejor el funcionamiento de este recurso?','Quina opció descriu millor com funciona este recurs?','Which statement best describes the device?'),
 O(['Una palabra inventada al final de cada frase','Un inicio repetido que articula ejemplos diferentes','Una contradicción entre datos científicos','Una comparación explícita entre dos animales'],['Una paraula inventada al final de cada frase','Un inici repetit que articula exemples diferents','Una contradicció entre dades científiques','Una comparació explícita entre dos animals'],['An invented word at the end of each sentence','A repeated opening that links different examples','A contradiction between scientific figures','An explicit comparison between two animals']),1,
 L('Se repite una misma secuencia inicial, pero cada frase añade una consecuencia distinta.','Es repetix una mateixa seqüència inicial, però cada frase afig una conseqüència diferent.','The same opening is repeated while each sentence introduces a different consequence.'))),
E('f_b_archive','bach','figure','history',
 L('El mapa incompleto de la memoria','El mapa incomplet de la memòria','The incomplete map of memory'),
 L('El archivo municipal conservaba actas, fotografías y cartas de generaciones anteriores. Durante una exposición, la historiadora afirmó: «El archivo es un mapa incompleto del pasado». No quería desacreditar los documentos: sin ellos, investigar sería caminar a ciegas. Pero advirtió que los registros no representan con la misma intensidad todas las vidas. Quien podía escribir, pagar una fotografía o participar en las instituciones tenía más posibilidades de dejar huellas. Otros grupos apenas aparecían en los fondos. La metáfora del mapa invitaba a orientarse con las fuentes sin confundir el trazado disponible con todo el territorio histórico. Por eso la exposición combinaba documentos oficiales con testimonios orales y objetos cotidianos, indicando los límites de cada evidencia.',
 'L’arxiu municipal conservava actes, fotografies i cartes de generacions anteriors. Durant una exposició, la historiadora va afirmar: «L’arxiu és un mapa incomplet del passat». No volia desacreditar els documents: sense ells, investigar seria caminar a cegues. Però advertia que els registres no representen amb la mateixa intensitat totes les vides. Qui podia escriure, pagar una fotografia o participar en les institucions tenia més possibilitats de deixar rastre. Altres grups a penes apareixien en els fons. La metàfora del mapa convidava a orientar-se amb les fonts sense confondre el traçat disponible amb tot el territori històric. Per això l’exposició combinava documents oficials amb testimonis orals i objectes quotidians, i indicava els límits de cada evidència.',
 'The municipal archive held minutes, photographs and letters from previous generations. At an exhibition, a historian said, “An archive is an incomplete map of the past.” She was not dismissing the documents: without them, research would be like walking blindfolded. Yet records do not represent every life equally. People able to write, pay for photographs or participate in institutions were more likely to leave traces. Other groups barely appeared in the collection. The map metaphor invited visitors to find their way using sources without confusing the available representation with the whole historical territory. The exhibition therefore combined official documents with oral testimonies and everyday objects, noting the limits of each kind of evidence.'),
 Q(L('¿Qué relación establece la metáfora entre el mapa y el archivo?','Quina relació establix la metàfora entre el mapa i l’arxiu?','What relationship does the map metaphor establish?'),
 O(['Los documentos son siempre ficticios','Un registro permite orientarse sin contener la totalidad de lo real','Los mapas antiguos sustituyen a los testimonios','Todos los grupos están representados por igual'],['Els documents són sempre ficticis','Un registre permet orientar-se sense contindre tota la realitat','Els mapes antics substituïxen els testimonis','Tots els grups estan representats igual'],['Documents are always fictional','A record guides inquiry without containing the whole reality','Old maps replace oral testimonies','All groups are represented equally']),1,
 L('Un mapa selecciona información útil, igual que el archivo conserva huellas parciales del pasado.','Un mapa selecciona informació útil, igual que l’arxiu conserva rastres parcials del passat.','A map selects useful features; an archive preserves only partial traces of history.')),
 Q(L('¿Qué interpretación del texto sería menos defendible?','Quina interpretació del text seria menys defensable?','Which interpretation is least defensible?'),
 O(['Hay desigualdades en la conservación de testimonios','Conviene reconocer los límites de las fuentes','La ausencia de registros demuestra que ciertas personas no existieron','Combinar evidencias puede enriquecer la reconstrucción'],['Hi ha desigualtats en la conservació de testimonis','Convé reconéixer els límits de les fonts','L’absència de registres demostra que algunes persones no existiren','Combinar evidències pot enriquir la reconstrucció'],['There are inequalities in surviving records','Source limitations should be recognised','Missing records prove that some people never existed','Combining sources can enrich historical inquiry']),2,
 L('El texto afirma precisamente que la ausencia documental no equivale a ausencia histórica.','El text diu precisament que l’absència documental no equival a absència històrica.','Lack of surviving evidence does not prove that those people never existed.'))),
E('f_b_paradox','bach','figure','philosophy',
 L('El ruido de estar conectados','El soroll d’estar connectats','The noise of constant connection'),
 L('En su ensayo sobre la atención, la autora escribió: «Nunca hubo tanto ruido en nuestro silencio». La frase parece contradictoria: silencio y ruido designan experiencias opuestas. Sin embargo, el fragmento describía a personas que, aun sentadas solas en una habitación tranquila, consultaban mensajes, noticias y recomendaciones de manera casi continua. El ruido al que aludía no era necesariamente acústico, sino la sucesión de estímulos que impedía sostener una reflexión. La autora evitaba idealizar el pasado: reconocía que las tecnologías pueden ampliar el conocimiento y facilitar la comunicación. Su crítica se dirigía a un uso automático que transforma cualquier pausa en una oportunidad para consumir información. La tensión entre las dos palabras obligaba a revisar el significado habitual de «silencio»: la ausencia de sonidos no garantiza por sí sola el reposo mental.',
 'En el seu assaig sobre l’atenció, l’autora va escriure: «Mai no hi havia hagut tant de soroll en el nostre silenci». La frase sembla contradictòria: silenci i soroll designen experiències oposades. Tanmateix, el fragment descrivia persones que, encara que estaven soles en una habitació tranquil·la, consultaven missatges, notícies i recomanacions quasi contínuament. El soroll a què es referia no era necessàriament acústic, sinó la successió d’estímuls que impedia mantindre una reflexió. L’autora no idealitzava el passat: reconeixia que les tecnologies poden ampliar el coneixement i facilitar la comunicació. La crítica es dirigia a un ús automàtic que convertix cada pausa en una ocasió per a consumir informació. La tensió entre les dos paraules obligava a revisar el sentit habitual de «silenci»: l’absència de sons no garantix per si sola el descans mental.',
 'In her essay on attention, the author wrote, “There has never been so much noise in our silence.” The sentence appears contradictory: noise and silence ordinarily refer to opposite experiences. Yet the passage described people sitting alone in quiet rooms, continually checking messages, news and recommendations. The “noise” was not necessarily audible; it was the succession of stimuli that prevented sustained reflection. The author did not idealise the past: she acknowledged that technology can widen access to knowledge and enable communication. Her criticism was aimed at automatic habits that turn every pause into another opportunity to consume information. The tension between the two words forces readers to reconsider “silence”: the absence of sound does not, by itself, ensure mental rest.'),
 Q(L('¿Cómo se resuelve la aparente contradicción?','Com es resol la contradicció aparent?','How is the apparent contradiction resolved?'),
 O(['El silencio elimina cualquier pensamiento','El ruido se interpreta como sobrecarga de estímulos, no solo como sonido','La autora demuestra que los mensajes siempre hacen ruido físico','Las tecnologías impiden toda comunicación'],['El silenci elimina qualsevol pensament','El soroll s’interpreta com a sobrecàrrega d’estímuls, no només com a so','L’autora demostra que els missatges sempre fan soroll físic','Les tecnologies impedixen tota comunicació'],['Silence removes all thoughts','Noise means excessive stimulation, not merely sound','Messages always produce audible noise','Technology prevents all communication']),1,
 L('El contraste funciona al trasladar «ruido» al terreno de la atención y la experiencia mental.','El contrast funciona en traslladar «soroll» al terreny de l’atenció i l’experiència mental.','The contrast shifts “noise” into the realm of attention and mental experience.')),
 Q(L('¿Qué matiz evita una lectura simplista del ensayo?','Quin matís evita una lectura simplista de l’assaig?','Which detail prevents a simplistic reading of the essay?'),
 O(['Que toda información digital carece de utilidad','Que el pasado estaba libre de distracciones','Que la tecnología también ofrece beneficios y se critica un uso concreto','Que el texto es una descripción acústica'],['Que tota informació digital no té utilitat','Que el passat no tenia distraccions','Que la tecnologia també té beneficis i es critica un ús concret','Que el text és una descripció acústica'],['All digital information is useless','The past had no distractions','Technology has benefits and a particular use is criticised','The passage is about acoustics']),2,
 L('La autora reconoce las ventajas tecnológicas y limita su crítica a hábitos automáticos.','L’autora reconeix els avantatges tecnològics i limita la crítica a hàbits automàtics.','The author accepts technology’s benefits and criticises particular habits.')))
);

E('g_e1_library','eso1','logic','daily',
 L('Una decisión en la biblioteca','Una decisió a la biblioteca','A decision at the library'),
 L('La biblioteca municipal quería ampliar su horario durante los exámenes. Algunos estudiantes lo pedían porque necesitaban un lugar tranquilo por la tarde. Sin embargo, el personal explicó que abrir más horas supondría un gasto adicional. Por tanto, el ayuntamiento decidió probar durante un mes dos tardes extra y analizar después cuántas personas utilizaban el servicio. La medida no era definitiva: dependía de los resultados y del presupuesto.',
 'La biblioteca municipal volia ampliar l’horari durant els exàmens. Alguns estudiants ho demanaven perquè necessitaven un lloc tranquil a la vesprada. Tanmateix, el personal va explicar que obrir més hores suposaria una despesa addicional. Per tant, l’ajuntament va decidir provar durant un mes dos vesprades extra i analitzar després quantes persones utilitzaven el servici. La mesura no era definitiva: depenia dels resultats i del pressupost.',
 'The town library was considering longer opening hours during exams. Some students requested this because they needed a quiet place in the afternoon. However, the staff explained that longer hours would involve extra costs. The council therefore decided to trial two extra afternoons for a month and then measure how many people used the service. The change was not permanent: it depended on the results and available funding.'),
 Q(L('¿Qué relación introduce «Sin embargo»?','Quina relació introduïx «Tanmateix»?','What relationship does “However” introduce?'),
 O(['Una enumeración de libros','Un contraste entre una necesidad y un coste','Una explicación de los exámenes','Una consecuencia que siempre ocurre'],['Una enumeració de llibres','Un contrast entre una necessitat i una despesa','Una explicació dels exàmens','Una conseqüència que sempre ocorre'],['A list of books','A contrast between a need and a cost','An explanation of exams','An inevitable consequence']),1,
 L('El conector contrapone la petición del alumnado a la limitación presupuestaria.','El connector contraposa la petició de l’alumnat a la limitació pressupostària.','It contrasts students’ needs with the financial constraint.')),
 Q(L('¿Por qué decidieron hacer una prueba de un mes?','Per què van decidir fer una prova d’un mes?','Why did they choose a one-month trial?'),
 O(['Para evitar contar usuarios','Para comprobar la utilidad antes de decidir','Para cerrar la biblioteca definitivamente','Para garantizar que nunca habrá gastos'],['Per a evitar comptar usuaris','Per a comprovar-ne la utilitat abans de decidir','Per a tancar la biblioteca definitivament','Per a garantir que mai hi haurà despeses'],['To avoid counting users','To assess use before making a final decision','To close the library permanently','To guarantee there will be no costs']),1,
 L('La decisión provisional permite reunir datos y valorar el gasto antes de mantener el cambio.','La decisió provisional permet reunir dades i valorar la despesa abans de mantindre el canvi.','A trial gathers evidence about use and cost before a permanent decision.'))),
E('g_e1_garden','eso1','logic','science',
 L('El experimento de las semillas','L’experiment de les llavors','The seed experiment'),
 L('Dos clases cultivaron semillas de la misma especie. Una clase regaba cada día y la otra, cada tres días. Al cabo de dos semanas, las plantas del primer grupo eran más altas. Algunos alumnos concluyeron que regar a diario siempre produce mejores resultados. La profesora recordó que las macetas también estaban en ventanas distintas y recibían diferente cantidad de luz. Por ello, los datos indicaban una diferencia entre grupos, pero aún no permitían atribuirla únicamente al riego.',
 'Dos classes van cultivar llavors de la mateixa espècie. Una classe regava cada dia i l’altra, cada tres dies. Al cap de dos setmanes, les plantes del primer grup eren més altes. Alguns alumnes van concloure que regar diàriament sempre dona millors resultats. La professora va recordar que els tests també estaven en finestres diferents i rebien quantitats de llum distintes. Per això, les dades indicaven una diferència entre grups, però encara no permetien atribuir-la només al reg.',
 'Two classes grew seeds of the same species. One class watered its pots daily; the other watered every third day. Two weeks later, the first group’s plants were taller. Some students concluded that daily watering always produces better results. Their teacher pointed out that the pots were also placed by different windows and received different amounts of light. The results showed a difference between the groups but did not yet establish that watering alone explained it.'),
 Q(L('¿Qué impide atribuir la diferencia solo al riego?','Què impedix atribuir la diferència només al reg?','What prevents the difference being attributed only to watering?'),
 O(['Las plantas pertenecen a especies distintas','La luz también cambió entre los grupos','El experimento duró dos años','No se observó ninguna diferencia'],['Les plantes eren d’espècies diferents','La llum també va variar entre els grups','L’experiment va durar dos anys','No es va observar cap diferència'],['The plants were of different species','The amount of light also differed','The experiment lasted two years','No difference was observed']),1,
 L('Al cambiar más de una condición, no se puede aislar con seguridad el efecto del riego.','En canviar més d’una condició, no es pot aïllar amb seguretat l’efecte del reg.','More than one condition varied, so watering’s separate effect is uncertain.')),
 Q(L('¿Cuál es la conclusión más prudente?','Quina conclusió és més prudent?','What is the most cautious conclusion?'),
 O(['Regar cada día mejora siempre el crecimiento','La luz nunca influye en las plantas','Se observó una diferencia cuya causa no está aislada','Regar cada tres días impide toda germinación'],['Regar cada dia millora sempre el creixement','La llum no influïx mai en les plantes','Es va observar una diferència sense aïllar-ne la causa','Regar cada tres dies impedix tota germinació'],['Daily watering always improves growth','Light never affects plants','A difference was observed but its cause was not isolated','Watering every three days prevents germination']),2,
 L('La diferencia es un resultado; su interpretación causal exige controlar mejor las condiciones.','La diferència és un resultat; la interpretació causal exigix controlar millor les condicions.','The difference is observed, but a causal explanation needs better controls.'))),
E('g_e2_conditional','eso2','logic','technology',
 L('Una alarma que no demuestra nada','Una alarma que no demostra res','An alarm that proves nothing'),
 L('El responsable del aula de informática explicó: «Si el servidor se calienta demasiado, se activa una alarma sonora». Durante una práctica, el alumnado escuchó la alarma y aseguró que el servidor tenía que haberse sobrecalentado. Pero el manual indicaba que la misma señal también se activaba cuando fallaba uno de los ventiladores. El técnico propuso consultar los sensores antes de atribuir el aviso a una causa concreta. Una condición suficiente para activar la alarma no equivalía a la única explicación posible de que sonara.',
 'El responsable de l’aula d’informàtica va explicar: «Si el servidor s’escalfa massa, s’activa una alarma sonora». Durant una pràctica, l’alumnat va sentir l’alarma i va assegurar que el servidor s’havia hagut de sobrecalfar. Però el manual indicava que el mateix senyal també s’activava quan fallava un dels ventiladors. El tècnic va proposar consultar els sensors abans d’atribuir l’avís a una causa concreta. Una condició suficient per a activar l’alarma no equivalia a l’única explicació possible que sonara.',
 'The technician in the computer room explained, “If the server overheats, an audible alarm sounds.” During a lesson, students heard the alarm and concluded that the server must have overheated. But the manual stated that the same alarm also sounds when a fan fails. The technician suggested checking sensor readings before assigning a single cause to the warning. A condition that is sufficient to trigger an alarm need not be the only possible cause of that alarm.'),
 Q(L('¿Qué error comete el alumnado al escuchar la alarma?','Quin error comet l’alumnat en sentir l’alarma?','What reasoning error do the students make?'),
 O(['Confunde una causa posible con la única causa','Niega que exista una señal sonora','Comprueba los sensores antes de hablar','Separa dos condiciones alternativas'],['Confón una causa possible amb l’única causa','Nega que hi haja un senyal sonor','Comprova els sensors abans de parlar','Separa dos condicions alternatives'],['It treats one possible cause as the only cause','It denies any alarm sounded','It checks sensors before concluding','It separates alternative conditions']),0,
 L('Del hecho de oír la alarma no se deduce qué condición la activó: hay varias posibles.','Del fet de sentir l’alarma no es deduïx quina condició la va activar: n’hi ha diverses.','Hearing the alarm does not uniquely identify which trigger was responsible.')),
 Q(L('¿Qué afirmación sí se desprende de la información?','Quina afirmació sí que es deduïx de la informació?','Which claim is supported by the information?'),
 O(['Un ventilador averiado siempre sobrecalienta el servidor','La alarma puede sonar por al menos dos motivos','La alarma nunca falla','Los sensores demostrarán necesariamente un sobrecalentamiento'],['Un ventilador avariat sempre sobrecalfa el servidor','L’alarma pot sonar almenys per dos motius','L’alarma no falla mai','Els sensors demostraran necessàriament un sobrecalfament'],['A failed fan always overheats the server','The alarm can sound for at least two reasons','The alarm never fails','The sensors must show overheating']),1,
 L('El texto explicita dos activadores: temperatura elevada y fallo de un ventilador.','El text explicita dos causes d’activació: temperatura elevada i fallada d’un ventilador.','The passage identifies two triggers: overheating and fan failure.'))),
E('g_e2_claim','eso2','logic','history',
 L('Un debate sobre el patrimonio','Un debat sobre el patrimoni','A debate about heritage'),
 L('En el pleno municipal se debatió si restaurar una antigua fábrica para convertirla en centro cultural. Una asociación defendió el proyecto porque conservaría parte de la memoria industrial. Otra recordó que el edificio necesitaba una rehabilitación costosa y propuso estudiar usos alternativos. La concejala resumió el conflicto: «Conservar el patrimonio tiene valor, pero ese valor no nos permite ignorar el presupuesto». Solicitó dos informes: uno sobre el interés histórico del inmueble y otro sobre el coste y la seguridad de las obras. Insistió en que una decisión razonada debía considerar ambos tipos de evidencia.',
 'En el ple municipal es va debatre si restaurar una fàbrica antiga per a convertir-la en centre cultural. Una associació va defensar el projecte perquè conservaria part de la memòria industrial. Una altra va recordar que l’edifici necessitava una rehabilitació costosa i va proposar estudiar altres usos. La regidora va resumir el conflicte: «Conservar el patrimoni té valor, però això no ens permet ignorar el pressupost». Va demanar dos informes: un sobre l’interés històric de l’immoble i un altre sobre el cost i la seguretat de les obres. Va insistir que una decisió raonada havia de considerar els dos tipus d’evidències.',
 'The town council debated whether to restore an old factory as a cultural centre. One group argued that this would preserve part of the town’s industrial memory. Another noted that the building needed costly renovation and suggested examining alternative uses. A councillor summarised the dilemma: “Preserving heritage matters, but that value does not allow us to ignore the budget.” She requested one report on the building’s historical significance and another on the cost and safety of the work. She argued that a reasoned decision needed both types of evidence.'),
 Q(L('¿Cuál es la tesis principal de la concejala?','Quina és la tesi principal de la regidora?','What is the councillor’s main claim?'),
 O(['Todo edificio antiguo debe derribarse','Solo importa la rentabilidad económica','Hay que considerar valor patrimonial, costes y seguridad','La cultura no debe financiarse públicamente'],['Tot edifici antic s’ha d’enderrocar','Només importa la rendibilitat econòmica','Cal considerar valor patrimonial, costos i seguretat','La cultura no s’ha de finançar públicament'],['All old buildings should be demolished','Only financial returns matter','Heritage value, cost and safety should all be considered','Culture should never receive public funding']),2,
 L('La concejala no rechaza el patrimonio: propone decidir integrando varios criterios.','La regidora no rebutja el patrimoni: proposa decidir integrant diversos criteris.','She does not reject heritage but argues for weighing different considerations.')),
 Q(L('¿Qué función tiene el conector «pero» en la cita?','Quina funció té el connector «però» en la cita?','What does “but” do in the quotation?'),
 O(['Introduce un límite a un argumento válido','Anuncia la lista de asistentes','Añade una causa idéntica a la anterior','Expresa que se ignora el valor histórico'],['Introduïx un límit a un argument vàlid','Anuncia la llista d’assistents','Afig una causa idèntica a l’anterior','Expressa que s’ignora el valor històric'],['It introduces a limit to a valid consideration','It introduces the attendance list','It repeats the same cause','It shows that historical value is ignored']),0,
 L('Reconoce el valor cultural, pero lo contrapone a otros factores que no pueden descartarse.','Reconeix el valor cultural, però el contraposa a altres factors que no es poden descartar.','It acknowledges cultural value while setting it alongside other constraints.'))),
E('g_b_cycle','bach','logic','math',
 L('El éxito aparente del carril bici','L’èxit aparent del carril bici','The apparent success of the cycle lane'),
 L('Después de construir un carril bici, el ayuntamiento registró un aumento del 30 % en el número de personas que acudían al centro urbano en bicicleta. El informe municipal atribuyó el incremento a la nueva infraestructura. Sin embargo, durante el mismo periodo se encareció el aparcamiento de coches, comenzó una campaña de movilidad en los institutos y se contabilizaron jornadas con temperaturas especialmente suaves. Además, el recuento se había realizado en dos semanas concretas, sin una serie comparable de otros años. Una investigadora señaló que la coincidencia temporal era compatible con un efecto positivo del carril, pero no bastaba para determinar su magnitud. Propuso comparar periodos equivalentes, controlar otros cambios y, si resultaba posible, observar una zona semejante sin intervención. Su objeción no desmentía la utilidad del carril: cuestionaba la fuerza de la atribución causal.',
 'Després de construir un carril bici, l’ajuntament va registrar un augment del 30 % de les persones que arribaven al centre urbà amb bicicleta. L’informe municipal va atribuir l’increment a la infraestructura nova. Tanmateix, durant el mateix període es va encarir l’aparcament de cotxes, va començar una campanya de mobilitat als instituts i es van comptabilitzar jornades amb temperatures especialment suaus. A més, el recompte s’havia fet en dos setmanes concretes, sense una sèrie comparable d’altres anys. Una investigadora va assenyalar que la coincidència temporal era compatible amb un efecte positiu del carril, però no bastava per a determinar-ne la magnitud. Va proposar comparar períodes equivalents, controlar altres canvis i, si era possible, observar una zona semblant sense intervenció. L’objecció no desmentia la utilitat del carril: qüestionava la solidesa de l’atribució causal.',
 'After a new cycle lane was built, the council recorded a 30% increase in people cycling into the town centre. Its report attributed the rise to the new infrastructure. However, parking fees also increased during that period, a school mobility campaign began, and several unusually mild days were included in the counts. Moreover, the observation covered only two selected weeks, with no comparable series from previous years. A researcher noted that the timing was compatible with a positive effect of the cycle lane but could not establish the size of that effect. She suggested comparing equivalent periods, accounting for other changes and, if possible, examining a similar area without the new infrastructure. Her objection did not establish that the cycle lane was useless; it challenged the strength of the causal attribution.'),
 Q(L('¿Qué presuposición cuestiona principalmente la investigadora?','Quina pressuposició qüestiona principalment la investigadora?','Which assumption does the researcher primarily challenge?'),
 O(['Que circular en bicicleta sea legal','Que todo el aumento observado se deba al carril','Que los datos de dos semanas puedan contarse','Que las temperaturas puedan medirse'],['Que circular amb bicicleta siga legal','Que tot l’augment observat es dega al carril','Que es puguen comptar dades de dos setmanes','Que es puguen mesurar les temperatures'],['That cycling is legal','That the entire observed increase was caused by the lane','That two weeks of data can be counted','That temperature can be measured']),1,
 L('Existen varios factores alternativos y el diseño no aísla el efecto del carril.','Hi ha diversos factors alternatius i el disseny no aïlla l’efecte del carril.','Several other factors changed, so the lane’s individual effect is not isolated.')),
 Q(L('¿Qué resultado sería compatible con las objeciones del texto?','Quin resultat seria compatible amb les objeccions del text?','Which outcome is consistent with the objections?'),
 O(['El carril contribuyó parcialmente al incremento','El carril no pudo influir en absoluto','La cifra del 30 % prueba por sí sola causalidad completa','El aparcamiento no influyó porque no se estudió'],['El carril va contribuir parcialment a l’augment','El carril no va poder influir de cap manera','La xifra del 30 % prova per si sola una causalitat completa','L’aparcament no va influir perquè no es va estudiar'],['The lane contributed to part of the increase','The lane could not have any effect','The 30% figure proves complete causation','Parking had no effect because it was not studied']),0,
 L('La crítica no niega la influencia del carril: sostiene que no conocemos su contribución concreta.','La crítica no nega la influència del carril: sosté que no coneixem la contribució concreta.','The objection allows a partial effect while questioning how much was due to the lane.'))),
E('g_b_medical','bach','logic','science',
 L('De una muestra a una conclusión','D’una mostra a una conclusió','From a sample to a conclusion'),
 L('Una revista escolar publicó un artículo sobre una nueva técnica de estudio. En una encuesta voluntaria participaron treinta estudiantes de Bachillerato que habían elegido utilizarla durante un mes. Veinticuatro declararon sentirse mejor preparados para los exámenes. El titular anunciaba: «El método mejora el rendimiento del 80 % del alumnado». Una profesora de matemáticas advirtió que la encuesta medía una percepción subjetiva, no una mejora objetiva de las calificaciones. Además, quienes aceptaron participar quizá tenían una motivación especial y no se incluyó un grupo de comparación. El equipo de redacción modificó el titular: «Ocho de cada diez participantes afirman sentirse más preparados». Este segundo enunciado no prueba que el método sea ineficaz; delimita lo que realmente se observó. Para evaluar una mejora del rendimiento habría que comparar resultados pertinentes y un diseño que permitiera separar el efecto del método de otras variables.',
 'Una revista escolar va publicar un article sobre una nova tècnica d’estudi. En una enquesta voluntària van participar trenta estudiants de Batxillerat que havien triat utilitzar-la durant un mes. Vint-i-quatre van declarar que se sentien més preparats per als exàmens. El titular anunciava: «El mètode millora el rendiment del 80 % de l’alumnat». Una professora de matemàtiques va advertir que l’enquesta mesurava una percepció subjectiva, no una millora objectiva de les qualificacions. A més, qui va acceptar participar potser tenia una motivació especial i no hi havia cap grup de comparació. L’equip de redacció va modificar el titular: «Huit de cada deu participants afirmen sentir-se més preparats». El segon enunciat no prova que el mètode siga ineficaç; delimita allò que realment es va observar. Per a avaluar una millora del rendiment caldria comparar resultats pertinents i tindre un disseny que permetera separar l’efecte del mètode d’altres variables.',
 'A school magazine reported on a new study method. Thirty sixth-form students who had chosen to use it for a month completed a voluntary survey. Twenty-four said they felt better prepared for exams. The headline declared, “The method improves performance for 80% of students.” A mathematics teacher pointed out that the survey measured a subjective feeling, not an objective improvement in grades. Volunteers might also have been unusually motivated, and there was no comparison group. The editorial team changed the headline to “Eight in ten participants say they feel better prepared.” The new statement does not prove that the method is ineffective; it describes what was actually observed. Assessing improved performance would require suitable outcome measures and a design that separates the method’s effect from other influences.'),
 Q(L('¿Por qué es inválida la inferencia del primer titular?','Per què és invàlida la inferència del primer titular?','Why does the original headline make an invalid inference?'),
 O(['Porque veinticuatro no es el 80 % de treinta','Porque confunde sentirse preparado con haber mejorado el rendimiento','Porque todas las encuestas son necesariamente falsas','Porque el alumnado no puede valorar sus sensaciones'],['Perquè vint-i-quatre no és el 80 % de trenta','Perquè confon sentir-se preparat amb haver millorat el rendiment','Perquè totes les enquestes són necessàriament falses','Perquè l’alumnat no pot valorar les sensacions'],['Because 24 is not 80% of 30','Because feeling prepared is confused with improved performance','Because all surveys must be false','Because students cannot report their feelings']),1,
 L('El indicador recogido es una percepción, no una medida objetiva de rendimiento.','L’indicador recollit és una percepció, no una mesura objectiva del rendiment.','The survey measures perceived readiness, not demonstrated performance.')),
 Q(L('¿Qué conclusión recoge fielmente los datos sin excederlos?','Quina conclusió arreplega fidelment les dades sense excedir-les?','Which conclusion stays within the evidence?'),
 O(['La técnica ha mejorado las notas de toda la promoción','La técnica no sirve para preparar exámenes','Veinticuatro de los treinta participantes manifestaron mayor preparación subjetiva','El 80 % de todos los estudiantes obtendrá mejores notas'],['La tècnica ha millorat les notes de tota la promoció','La tècnica no servix per a preparar exàmens','Vint-i-quatre dels trenta participants van manifestar més preparació subjectiva','El 80 % de tot l’alumnat obtindrà millors notes'],['The method improved everyone’s grades','The method cannot help exam preparation','Twenty-four of the thirty participants reported feeling more prepared','Eighty per cent of all students will improve their grades']),2,
 L('Expresa el dato observado y su población, sin extrapolar resultados ni confundir percepción con mejora.','Expressa la dada observada i la població, sense extrapolar ni confondre percepció amb millora.','It states the observed response and group without claiming an objective improvement.')))
);
